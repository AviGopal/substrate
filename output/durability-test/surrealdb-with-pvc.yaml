apiVersion: apps/v1
kind: Deployment
metadata:
  name: surrealdb
  namespace: metabob
spec:
  replicas: 1
  selector:
    matchLabels:
      app: surrealdb
  template:
    metadata:
      labels:
        app: surrealdb
    spec:
      containers:
      - name: surrealdb
        image: surrealdb/surrealdb:v2.6.0
        args:
          - "start"
          - "--user"
          - "root"
          - "--pass"
          - "changeme"
          - "file:/data/database"
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: surrealdb-data
