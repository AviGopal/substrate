version: '3.8'

# Contract Enforcement Testing Environment
#
# Purpose: Rapid iteration on contract validation activities
# Backend: Uses production activity.metabob.com (no local SurrealDB)
# Approach: Mount test fixtures, run contract activities, collect traces
#
# Usage:
#   docker-compose -f docker-compose.contract-testing.yml up --build
#   docker-compose -f docker-compose.contract-testing.yml run contract-runner --single "validate spec compliance for auth feature"

services:
  # MiniBob configured for contract testing
  contract-runner:
    build:
      context: ./repos/minibob
      dockerfile: Dockerfile
    environment:
      # Production backend (not local)
      - METABOB_ENDPOINT=https://activity.metabob.com
      - METABOB_API_KEY=${METABOB_API_KEY}

      # LLM provider
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - MINIBOB_PROVIDER=anthropic
      - MINIBOB_MODEL=claude-sonnet-4-20250514

      # Contract testing mode
      - MINIBOB_WORKDIR=/workspace
      - MINIBOB_PROJECT=contract-testing

      # Logging
      - LOG_LEVEL=debug

      # Discovery disabled (not needed for contract testing)
      - DISCOVERY_ENABLED=false

    volumes:
      # Mount test fixtures (read-only)
      - ./test-fixtures:/test-fixtures:ro

      # Mount workspace for contract execution
      - ./workspace:/workspace

      # Mount contract activities (read-only)
      - ./repos/metabob-proto/activities/validation:/activities/validation:ro
      - ./repos/metabob-proto/activities/meta:/activities/meta:ro

      # Shared output for traces and reports
      - ./contract-output:/output

    # Default command: Interactive REPL
    command: ["bun", "run", "index.ts"]

    # Override with specific goals:
    # docker-compose run contract-runner --single "validate spec compliance"

    profiles:
      - manual  # Only start when explicitly requested

  # Trace collector/analyzer
  trace-analyzer:
    build:
      context: ./repos/metabob-activity-api
      dockerfile: Dockerfile
    environment:
      # Connect to production backend
      - METABOB_ENDPOINT=https://activity.metabob.com
      - METABOB_API_KEY=${METABOB_API_KEY}

      # Output directory
      - OUTPUT_DIR=/output

    volumes:
      - ./contract-output:/output

    # Run analysis scripts on collected traces
    command: ["bun", "run", "scripts/analyze-contract-traces.ts"]

    profiles:
      - analysis  # Only run when analyzing traces

# Volumes for persistent data
volumes:
  contract-output:
    driver: local

# Networks (optional - for isolation)
networks:
  default:
    name: contract-testing
    driver: bridge
