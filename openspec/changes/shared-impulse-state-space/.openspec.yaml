name: shared-impulse-state-space
status: proposed
created: 2026-03-27
updated: 2026-03-27

summary: |
  Wire existing vessel infrastructure to share state through impulse events.
  Focus on connecting ActivityExecutor callbacks → WebSocket broadcast → TUI regions.

problem: |
  minibob-tui displays minimal "Hello / Completed" boxes because:
  - ActivityExecutor has no lifecycle callbacks
  - WebSocket broadcast functions not implemented
  - TUI not subscribed to impulse events from WebSocket/EmbeddedMiniBob

solution: |
  Wire existing infrastructure together (not create new packages):
  - Add lifecycle callbacks to ActivityExecutor
  - Implement WebSocket broadcast functions
  - Subscribe TUI to impulse events for region creation
  - Extract shape constants to shared module

artifacts:
  - proposal.md
  - design.md
  - tasks.md

milestones:
  - id: M1
    name: Activity executor callbacks
    commit: "feat(minibob): add activity executor impulse callbacks"
    focus: Add lifecycle callbacks to ActivityExecutor

  - id: M2
    name: WebSocket broadcast
    commit: "feat(minibob): implement websocket broadcast"
    focus: Implement broadcast functions, wire to executor

  - id: M3
    name: TUI WebSocket wiring
    commit: "feat(tui): wire websocket events to regions"
    focus: Remote mode - WebSocket events create regions

  - id: M4
    name: TUI embedded wiring
    commit: "feat(tui): wire embedded-minibob to regions"
    focus: Embedded mode - EmbeddedMiniBob events create regions

  - id: M5
    name: Shape constants
    commit: "feat(impulse): add shape constants module"
    focus: Type-safe shapes, shared registry

  - id: M6
    name: Streaming support
    commit: "feat(tui): add streaming impulse support"
    focus: Real-time LLM streaming display

dependencies:
  M2: [M1]
  M3: [M2]
  M4: [M1]
  M5: [M3, M4]
  M6: [M5]

tags:
  - architecture
  - impulse
  - tui
  - minibob
  - vessel-communication
  - wiring
