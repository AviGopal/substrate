name: graph-dashboard-convergence-explainability
status: proposed
created: 2026-03-27
description: Transform activity-dashboard into a learning graph visualizer with convergence detection and outcome explainability

artifacts:
  - proposal.md
  - design.md
  - tasks.md

domains:
  - activity-dashboard (graph.metabob.local)
  - metabob-activity-api
  - SurrealDB schemas

milestones:
  - id: M1
    name: Schema Foundation
    status: complete
    commit: "feat(schema): add convergence and explainability views"

  - id: M2
    name: Shared UI Components
    status: complete
    commit: "feat(dashboard): add shared components for convergence views"
    depends_on: [M1]

  - id: M3
    name: Convergence Overview View
    status: complete
    commit: "feat(dashboard): add convergence overview view"
    depends_on: [M2]

  - id: M4
    name: Explainability Enhancements
    status: pending
    commit: "feat(dashboard): add execution explainability features"
    depends_on: [M2]

  - id: M5
    name: Analytics Dashboards
    status: pending
    commit: "feat(dashboard): add impulse and tool analytics views"
    depends_on: [M1]
    parallel_with: [M3, M4]

  - id: M6
    name: Enhanced Composition Graph
    status: pending
    commit: "feat(dashboard): enhance composition graph with edge weights"
    depends_on: [M2]
    parallel_with: [M3, M4, M5]

  - id: M7
    name: Existing Component Polish
    status: pending
    commit: "feat(dashboard): add convergence indicators to existing views"
    depends_on: [M3, M4, M5, M6]
