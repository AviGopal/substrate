name: conversational-vessel
title: Lightweight Conversational Vessel
status: proposed
created: 2026-03-26
author: minibob

description: |
  A minimal vessel for ordinary LLM conversations that follows the
  impulse-activity foundation. Uses ai-sdk for provider abstraction,
  records traces for learning, and resolves local impulses only.

goal: |
  Create a lightweight conversational vessel (~2,500 LOC) that can:
  - Conduct multi-turn conversations with any LLM via ai-sdk
  - Execute tools during conversation
  - Inject context via impulses (lazy-loaded)
  - Record execution traces for learning
  - Serve as a template for teaching MiniBob to create vessels

principles:
  - Resolvers live where data lives (local: file, memo)
  - Everything recorded for learning (every turn is a trace)
  - No framework bloat (Bun.serve, no express/fastify)
  - Minimal dependencies (ai, zod, bun)
  - Composable with other vessels via ACP

artifacts:
  - design.md
  - tasks.md
