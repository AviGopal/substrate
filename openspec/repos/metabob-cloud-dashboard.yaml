# metabob-cloud-dashboard Repository Spec (Orchestration)
# Source of truth: metabob-devbob/openspec/
# This file coordinates cloud-dashboard development from metabob-devbob

name: metabob-cloud-dashboard
version: 1.0.0
status: draft
owner: cloud-dashboard-agent

# Repository location
repository:
  path: repos/metabob-cloud-dashboard
  git_remote: none (separate git repo without remote yet, likely to be created during implementation, potentially git@github.com:MetabobProject/metabob-cloud-dashboard.git)
  branch: main
  language: typescript
  runtime: bun
  framework: react-19
  size_estimate: 2000-3000 LOC

# What this repo provides
provides:
  - id: web-ui
    version: 1.0.0
    contract: openspec/contracts/ui-routes.md
    stability: beta
    description: Unified web dashboard for analysis and activity data

# What this repo depends on
depends_on:
  - id: http-api-v2-analysis
    version: ^1.0.0
    contract: openspec/contracts/http-api-v2-analysis.md
    critical: true
    endpoints:
      - GET /v2/analysis/priority
      - POST /v2/analysis/annotate
      - POST /v2/analysis/suggest-changes
    description: Analysis API for code analysis data

  - id: http-api-v2-activity
    version: ^1.0.0
    contract: openspec/contracts/http-api-v2-activity.md
    critical: true
    endpoints:
      - GET /v2/activities/templates
      - GET /v2/activities/execution-traces
      - POST /v2/activities/recommend
    description: Activity API for execution data

  - id: mcp-analysis-tools
    version: ^1.0.0
    contract: openspec/contracts/mcp-analysis-tools.md
    critical: false
    description: Optional MCP client integration

# Deployment configuration
deployment:
  helm_chart: helm/charts/metabob-cloud-dashboard
  namespace: activity-system
  service_name: metabob-cloud-dashboard
  replicas: 2
  port: 3000
  health_check:
    path: /
    interval: 10s
    timeout: 5s
  ingress:
    enabled: true
    host: dashboard.minibob.local
    paths:
      - /
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  environment:
    ACTIVITY_API_URL: http://metabob-activity-api.activity-system.svc.cluster.local:8080
    ANALYSIS_API_URL: http://metabob-analysis-api.activity-system.svc.cluster.local:8080
    NODE_ENV: production

# Validation configuration
validation:
  unit_tests:
    command: bun test
    required_coverage: 70%
  integration_tests:
    command: bun run test-integration.ts
    dependencies:
      - analysis-api running
      - activity-api running
  e2e_tests:
    - openspec/contracts/e2e-tests.md#e2e-1-full-analysis-flow
    - openspec/contracts/e2e-tests.md#e2e-2-co-change-prediction
    - openspec/contracts/e2e-tests.md#e2e-3-dashboard-integration
    - openspec/contracts/e2e-tests.md#e2e-4-developer-journey
  playwright_tests:
    browser: chromium
    test_cases:
      - All tabs render without errors
      - Live data displays correctly
      - API integration matches contracts
      - Responsive design works
      - User workflows complete
  ui_validation:
    - Dashboard loads in < 2s
    - All 6 tabs functional (Overview, Library, Composition, Executions, Learning, Reporting)
    - Live data updates every 5s
    - Error states handled gracefully
    - Shadcn components render correctly

# Commit traceability
commit_convention:
  format: "type: description (refs: change-id#task-id spec: contract@version)"
  types: [feat, fix, refactor, docs, test, style, chore]
  examples:
    - "feat: add analysis view tab (refs: analysis-api-extraction#DASH-2 spec: http-api-v2-analysis@1.0.0)"
    - "fix: live data polling (refs: analysis-api-extraction#DASH-5 spec: http-api-v2-activity@1.0.0)"

# Delegation prerequisites
delegation:
  can_delegate: true
  agent_type: repo-agent
  prerequisites:
    - Understand React 19 + Bun pattern
    - Review shadcn UI components
    - Read openspec/contracts/http-api-v2-analysis.md
    - Read openspec/contracts/http-api-v2-activity.md
    - Understand Playwright for E2E tests

# Ripple configuration
ripple:
  notify_on_change: []
  check_before_complete:
    - Verify all tabs render without errors
    - Run E2E tests with Playwright using LIVE data
    - Verify API integration matches contracts
    - Test responsive design
    - Validate live data displays correctly
    - Ensure system remains operational (helm deployment healthy)

metadata:
  created: 2026-03-23
  last_updated: 2026-03-23
  change_id: analysis-api-extraction
  tasks_file: repos/metabob-cloud-dashboard/openspec/tasks.md
