# metabob-activity-api Repository Spec (Orchestration)
# Source of truth: metabob-devbob/openspec/
# This file coordinates activity-api development from metabob-devbob

name: metabob-activity-api
version: 1.0.0
status: operational
owner: activity-api-agent

# Repository location
repository:
  path: repos/metabob-activity-api
  git_remote: git@github.com:MetabobProject/metabob-activity-api.git
  branch: main
  language: typescript
  runtime: bun
  framework: hono
  size_estimate: 2000-3000 LOC

# What this repo provides
provides:
  - id: http-api-v2-activity
    version: 1.0.0
    contract: openspec/contracts/http-api-v2-activity.md
    stability: beta
    description: Activity API for execution traces, Thompson Sampling, and impulse resolution

# What this repo depends on
depends_on:
  - id: surrealdb-schema
    version: ^1.0.0
    contract: openspec/contracts/surrealdb-schema.md
    critical: true
    tables:
      - activity_execution_traces
      - activity_templates
      - activity_variants
      - impulse_data
      - thompson_sampling_stats
    description: Database schema for activity execution data

# Deployment configuration
deployment:
  helm_chart: helm/charts/metabob-activity-api
  namespace: activity-system
  service_name: metabob-activity-api
  replicas: 2
  port: 8080
  health_check:
    path: /health
    interval: 10s
    timeout: 5s
  ingress:
    enabled: true
    host: api.minibob.local
    paths:
      - /v2/activities
      - /v2/impulses
  resources:
    requests:
      memory: "512Mi"
      cpu: "200m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  environment:
    SURREALDB_URL: http://surrealdb.activity-system.svc.cluster.local:8000
    SURREALDB_NAMESPACE: activity-system
    SURREALDB_DATABASE: learning_loop
    REDIS_URL: redis://redis-valkey.activity-system.svc.cluster.local:6379
    LOG_LEVEL: INFO

# Validation configuration
validation:
  unit_tests:
    command: bun test
    required_coverage: 75%
  integration_tests:
    command: bun run test-integration.ts
    dependencies:
      - surrealdb available
      - redis available
  e2e_tests:
    - openspec/contracts/e2e-tests.md#e2e-1-full-analysis-flow
    - openspec/contracts/e2e-tests.md#e2e-4-developer-journey
  api_validation:
    - POST /v2/impulses/resolve returns resolved content
    - POST /v2/activities/execution-traces stores trace
    - POST /v2/activities/recommend uses Thompson Sampling
    - GET /v2/activities/templates returns all templates
  health_validation:
    - GET /health returns 200
    - Database connection healthy
    - Redis connection healthy

# Commit traceability
commit_convention:
  format: "type: description (refs: change-id#task-id spec: contract@version)"
  types: [feat, fix, refactor, docs, test, chore]
  examples:
    - "feat: add Thompson Sampling (refs: analysis-api-extraction#API-5 spec: http-api-v2-activity@1.0.0)"
    - "fix: impulse resolution timeout (refs: analysis-api-extraction#API-12 spec: http-api-v2-activity@1.0.0)"

# Delegation prerequisites
delegation:
  can_delegate: true
  agent_type: repo-agent
  prerequisites:
    - Understand Thompson Sampling algorithm
    - Review activity execution trace structure
    - Read openspec/contracts/surrealdb-schema.md
    - Understand impulse resolution patterns
    - Review MCP protocol for tool integration

# Ripple configuration
ripple:
  notify_on_change:
    - openspec/repos/minibob.yaml
    - openspec/repos/metabob-cloud-dashboard.yaml
  check_before_complete:
    - Verify contract openspec/contracts/http-api-v2-activity.md matches implementation
    - Test Thompson Sampling algorithm with real execution data
    - Verify all impulse types resolve correctly
    - Test execution trace storage and retrieval
    - Run E2E tests with live data
    - Ensure system remains operational (helm deployment healthy)

metadata:
  created: 2026-03-23
  last_updated: 2026-03-23
  change_id: analysis-api-extraction
