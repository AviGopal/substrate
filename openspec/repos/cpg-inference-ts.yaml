# cpg-inference-ts Repository Spec (Orchestration)
# Source of truth: metabob-devbob/openspec/
# This file coordinates cpg-inference-ts development from metabob-devbob

name: cpg-inference-ts
version: 1.0.0
status: draft
owner: cpg-library-agent

# Repository location
repository:
  path: repos/cpg-inference-ts
  git_remote: TBD (will be created during implementation, likely git@github.com:MetabobProject/metabob-cpg-inference-ts.git)
  branch: main
  language: typescript
  runtime: bun
  framework: none (library)
  size_estimate: 4000-6000 LOC
  translation_from: repos/cpg-inference (Python)

# What this repo provides
provides:
  - id: cpg-library
    version: 1.0.0
    contract: openspec/contracts/cpg-library-api.md
    stability: stable
    description: Code Property Graph library with tree-sitter parsing and ONNX embeddings

# What this repo depends on
depends_on:
  # External dependencies only (npm packages)
  # - tree-sitter (parsing)
  # - onnxruntime-node (embeddings)
  # - faiss-node (similarity search)

# Deployment configuration
deployment:
  type: library
  published_to: npm
  package_name: "@metabob/cpg-inference"
  consumers:
    - metabob-analysis-api

# Validation configuration
validation:
  unit_tests:
    command: bun test
    required_coverage: 80%
  integration_tests:
    command: bun run test-integration.ts
    test_cases:
      - Parse TypeScript file
      - Build CPG from repo
      - Query component relationships
      - Generate embeddings
      - Similarity search
  benchmark_tests:
    command: bun run benchmark.ts
    baseline: repos/cpg-inference (Python)
    targets:
      - Parse performance within 2x of Python
      - Query performance within 1.5x of Python
      - Memory usage < Python baseline

# Commit traceability
commit_convention:
  format: "type: description (refs: change-id#task-id spec: contract@version)"
  types: [feat, fix, refactor, docs, test, chore, perf]
  examples:
    - "feat: add tree-sitter parser (refs: analysis-api-extraction#CPG-3 spec: cpg-library-api@1.0.0)"
    - "perf: optimize graph queries (refs: analysis-api-extraction#CPG-11 spec: cpg-library-api@1.0.0)"

# Delegation prerequisites
delegation:
  can_delegate: true
  agent_type: repo-agent
  prerequisites:
    - Understand tree-sitter parsing
    - Review Python source in repos/cpg-inference
    - Read openspec/contracts/cpg-library-api.md for target interface
    - Understand ONNX model loading
    - Review FAISS similarity search

# Ripple configuration
ripple:
  notify_on_change:
    - openspec/repos/metabob-analysis-api.yaml
  check_before_complete:
    - Verify contract openspec/contracts/cpg-library-api.md matches implementation
    - Run performance benchmarks against Python baseline
    - Update metabob-analysis-api integration if breaking changes
    - Update documentation with examples
    - Publish to npm registry

metadata:
  created: 2026-03-23
  last_updated: 2026-03-23
  change_id: analysis-api-extraction
  tasks_file: repos/cpg-inference-ts/openspec/tasks.md
