# =============================================================================
# Devbob Multi-Agent Development Environment + Backend Services
# =============================================================================
# Complete self-healing development environment with:
#   1. Metabob RPC API backend (server + redis + surreal + worker)
#   2. Devbob agents for each codebase
#   3. Self-healing monitoring infrastructure
#
# Architecture:
#   - metabob-rpc-api-server: FastAPI backend (port 8080)
#   - redis: Task queue and cache (port 6379)
#   - surreal: SurrealDB database (port 8000)
#   - metabob-rpc-api-worker: Celery analysis worker
#   - devbob-rpc-api: Agent managing RPC API service (ACP: 3001)
#   - devbob-dashboard: Agent for dashboard (ACP: 3002)
#   - devbob-cli: Agent for CLI (ACP: 3003)
#   - devbob-opencode: Agent for OpenCode (ACP: 3004)
#   - devbob: Agent for DevBob project itself (ACP: 3005)
#
# Self-Healing Pattern:
#   - Each service has health endpoints (/health, /status)
#   - Devbob agents monitor their services
#   - Self-healing coordinator detects issues
#   - Fix directives routed to appropriate agent
#   - Cross-container coordination via MESSAGE_FOR annotations
#
# Ports:
#   Backend:
#   - metabob-rpc-api-server: 8080 (HTTP API)
#   - redis:                  6379 (Redis)
#   - surreal:                8000 (SurrealDB)
#
#   Agents:
#   - devbob-rpc-api:    3001 (ACP), 8081 (MCP)
#   - devbob-dashboard:  3002 (ACP), 8082 (MCP)
#   - devbob-cli:        3003 (ACP), 8083 (MCP)
#   - devbob-opencode:   3004 (ACP), 8084 (MCP)
#   - devbob:            3005 (ACP), 8085 (MCP)
#
# Usage:
#   # Start everything (backend + agents)
#   ./devbob start
#
#   # Start just backend
#   ./devbob start redis surreal metabob-rpc-api-server
#
#   # Start just agents
#   ./devbob start devbob-rpc-api devbob-opencode devbob
#
#   # View logs
#   ./devbob logs devbob
#
#   # Test connectivity
#   curl http://localhost:8080/status
#   curl http://localhost:3005/config
#
# =============================================================================

services:

# =============================================================================
# Metabob Backend Services
# =============================================================================
# The metabob-rpc-api backend that agents connect to for code analysis
# =============================================================================

  # ---------------------------------------------------------------------------
  # Redis - Task queue and cache
  # ---------------------------------------------------------------------------
  redis:
    container_name: metabob-redis
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - metabob_redis_data:/data
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - metabob-network

  # ---------------------------------------------------------------------------
  # SurrealDB - Document/Graph database
  # ---------------------------------------------------------------------------
  surreal:
    container_name: metabob-surreal
    image: surrealdb/surrealdb:latest
    ports:
      - "${SURREAL_PORT:-8000}:8000"
    volumes:
      - metabob_surreal_data:/data
    command: >
      start
      --bind 0.0.0.0:8000
      --user ${SURREAL_USER:-root}
      --pass ${SURREAL_PASS:-root}
      --log ${SURREAL_LOG_LEVEL:-info}
      memory
    healthcheck:
      test: ["CMD", "/surreal", "isready", "--conn", "http://localhost:8000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - metabob-network

  # ---------------------------------------------------------------------------
  # Surrealist - SurrealDB Web UI for database visualization
  # Access at http://localhost:8001
  # ---------------------------------------------------------------------------
  surrealist:
    container_name: metabob-surrealist
    image: surrealdb/surrealist:latest
    ports:
      - "${SURREALIST_PORT:-8001}:8080"
    environment:
      # Pre-configure connection to local SurrealDB
      SURREAL_HOST: surreal
      SURREAL_PORT: 8000
    depends_on:
      surreal:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - metabob-network

  # ---------------------------------------------------------------------------
  # Database Initializer - Seeds schema and bootstrap data
  # Runs once on startup to ensure database is properly configured
  # ---------------------------------------------------------------------------
  db-init:
    container_name: metabob-db-init
    image: python:3.12-slim
    volumes:
      - ../repos/metabob-proto:/proto:ro
      - ../scripts/init-db.py:/init-db.py:ro
    environment:
      SURREAL_URL: http://surreal:8000
      SURREAL_USER: ${SURREAL_USER:-root}
      SURREAL_PASS: ${SURREAL_PASS:-root}
      SURREAL_NAMESPACE: ${SURREAL_NAMESPACE:-metabob}
      SURREAL_DATABASE: ${SURREAL_DATABASE:-devbob}
    command: >
      sh -c "pip install httpx --quiet && python /init-db.py"
    depends_on:
      surreal:
        condition: service_healthy
    networks:
      - metabob-network
    restart: "no"

  # ---------------------------------------------------------------------------
  # Metabob RPC API Server - FastAPI backend
  # ---------------------------------------------------------------------------
  metabob-rpc-api-server:
    container_name: api-server-dev
    image: metabobapp/metabob-rpc-api:0.16.12
    build:
      context: ../repos/metabob-rpc-api
      dockerfile: ./docker/Dockerfile.server
    command: ["start", "--host", "0.0.0.0", "--port", "8080", "--workers", "${API_WORKERS:-4}"]
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ../repos/metabob-rpc-api/.env.docker:/opt/app/.env
      - ../repos/metabob-rpc-api/metrics:/opt/app/metrics
      - metabob_api_logs:/opt/app/logs
    environment:
      CONFIG_PATH: /opt/app/.env
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      WORKERS: ${API_WORKERS:-4}
      # Redis connection
      REDIS_URI: redis://redis:6379
      # SurrealDB connection
      SURREAL_URL: ws://surreal:8000
      SURREAL_USER: ${SURREAL_USER:-root}
      SURREAL_PASS: ${SURREAL_PASS:-root}
      SURREAL_NAMESPACE: ${SURREAL_NAMESPACE:-metabob}
      SURREAL_DATABASE: ${SURREAL_DATABASE:-devbob}
      # Analysis limits
      MAX_DOWNSTREAM_EFFECTS: ${MAX_DOWNSTREAM_EFFECTS:-50}
      MAX_SIMILAR_CHUNKS: ${MAX_SIMILAR_CHUNKS:-20}
      MAX_TRANSITIVE_DEPTH: ${MAX_TRANSITIVE_DEPTH:-2}
    depends_on:
      redis:
        condition: service_healthy
      surreal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - metabob-network
      - devbob

  # ---------------------------------------------------------------------------
  # Metabob Analysis Worker - Celery worker
  # ---------------------------------------------------------------------------
  metabob-rpc-api-worker:
    container_name: metabob-worker
    image: metabobapp/metabob-rpc-api:0.16.12
    volumes:
      - ../repos/metabob-rpc-api/.env.docker:/opt/app/.env
      - ../repos/metabob-rpc-api/models:/src/app/models
      - ../repos/metabob-rpc-api/contribution_analysis:/opt/app/contribution_analysis
      - metabob_worker_logs:/opt/app/logs
    environment:
      CONFIG_PATH: /opt/app/.env
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-4}
      MODEL_TYPE: ${MODEL_TYPE:-openai}
      MODEL_API_BASE_URL: ${MODEL_API_BASE_URL:-https://api.openai.com/v1}
      # Analysis limits
      MAX_DOWNSTREAM_EFFECTS: ${MAX_DOWNSTREAM_EFFECTS:-50}
      MAX_SIMILAR_CHUNKS: ${MAX_SIMILAR_CHUNKS:-20}
      MAX_TRANSITIVE_DEPTH: ${MAX_TRANSITIVE_DEPTH:-2}
    entrypoint:
      ["celery", "-A", "tasks.jobs", "worker", "-l", "INFO", "-c", "${CELERY_CONCURRENCY:-4}", "-E", "-P", "solo"]
    healthcheck:
      test: ["CMD", "celery", "-A", "tasks.jobs", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - metabob-network
    # Uncomment if GPU is available
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           capabilities: [gpu]
    #           count: 1

# =============================================================================
# Devbob Agent Containers
# =============================================================================
# Each container runs opencode in ACP mode, which automatically starts
# metabob-cli as an MCP server for code analysis and activity tracking.
# The devbob-rpc-api agent can also manage the backend services above.
# =============================================================================

  # ---------------------------------------------------------------------------
  # Devbob Agent: metabob-rpc-api codebase
  # This agent manages BOTH the codebase AND the backend service
  # ---------------------------------------------------------------------------
  devbob-rpc-api:
    container_name: devbob-rpc-api
    image: devbob:latest
    build:
      context: ..
      dockerfile: configs/Dockerfile.devbob
      target: devbob-base
    ports:
      - "3001:3001"   # OpenCode ACP
      - "8081:8082"   # MCP Server
      - "8091:8080"   # HTTP Bridge for RPC API Agent
      - "3010:3000"   # Metabob CLI Dashboard UI
      - "3020:8088"   # Metabob CLI Dashboard API
    volumes:
      # Workspace - will be cloned from REPO_URL if not mounted
      - devbob_rpc_api_workspace:/workspace
      # Shared config and auth
      - devbob_config:/config
      - devbob_auth:/auth
      # SSH keys for git operations (copy from ~/.ssh to configs/.ssh/)
      - ${SSH_KEY_DIR:-~/.ssh}:/root/.ssh:ro
      # Mount docker socket to allow service management (read-only for safety)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Agent identification
      CODEBASE_NAME: rpc-api
      HOSTNAME: devbob-rpc-api
      
      # Git repository configuration
      REPO_URL: ${DEVBOB_RPC_API_REPO:-}
      REPO_BRANCH: ${DEVBOB_RPC_API_BRANCH:-main}
      REPO_CHECKOUT_MODE: ${DEVBOB_CHECKOUT_MODE:-shallow}
      REPO_DEPTH: ${DEVBOB_REPO_DEPTH:-1}
      
      # Git push behavior
      GIT_AUTO_PUSH: ${DEVBOB_AUTO_PUSH:-false}
      GIT_PUSH_ON_EXIT: ${DEVBOB_PUSH_ON_EXIT:-true}
      
      # OpenCode ACP Configuration
      ACP_PORT: "3001"
      ACP_HOSTNAME: "0.0.0.0"
      
      # Metabob backend connection - points to service above
      METABOB_API_URL: http://api-server-dev:8080
      METABOB_PROJECT_ID: ${METABOB_PROJECT_ID:-devbob-multi-agent}
      METABOB_API_KEY: ${METABOB_API_KEY:-}
      
      # Metabob CLI Dashboard (local dashboard showing agent activity)
      METABOB_ENABLE_DASHBOARD: ${METABOB_ENABLE_DASHBOARD:-true}
      METABOB_DASHBOARD_HOST: "0.0.0.0"
      METABOB_DASHBOARD_UI_PORT: "3000"
      METABOB_DASHBOARD_API_PORT: "8088"
      
      # LLM Provider
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      
      # Agent role and capabilities
      AGENT_ROLE: backend-manager
      MANAGED_SERVICES: "api-server-dev,metabob-redis,metabob-worker"
      SERVICE_HEALTH_URL: "http://api-server-dev:8080/status"
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      
      # Wait for backend before starting  
      WAIT_FOR_BACKEND: ${WAIT_FOR_BACKEND:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      metabob-rpc-api-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf http://localhost:3001/config"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    networks:
      - devbob
      - metabob-network

  # ---------------------------------------------------------------------------
  # Devbob Agent: metabob dashboard (web/frontend)
  # ---------------------------------------------------------------------------
  devbob-dashboard:
    container_name: devbob-dashboard
    image: devbob:latest
    ports:
      - "3002:3002"   # OpenCode ACP
      - "8082:8082"   # MCP Server
      - "8092:8080"   # HTTP Bridge
      - "3011:3000"   # Metabob CLI Dashboard UI
      - "3021:8088"   # Metabob CLI Dashboard API
      - "3030:3010"   # Local Dev Server (for working on web repo)
      - "3040:3020"   # Cloud Dev Server (for working on web repo)
    volumes:
      - devbob_web_workspace:/workspace
      - devbob_config:/config
      - devbob_auth:/auth
      - ${SSH_KEY_DIR:-~/.ssh}:/root/.ssh:ro
    environment:
      CODEBASE_NAME: dashboard
      HOSTNAME: devbob-dashboard
      
      # Git repository configuration
      REPO_URL: ${DEVBOB_WEB_REPO:-git@github.com:metabobproject/web.git}
      REPO_BRANCH: ${DEVBOB_WEB_BRANCH:-main}
      REPO_CHECKOUT_MODE: ${DEVBOB_CHECKOUT_MODE:-shallow}
      REPO_DEPTH: ${DEVBOB_REPO_DEPTH:-1}
      
      # Git push behavior
      GIT_AUTO_PUSH: ${DEVBOB_AUTO_PUSH:-false}
      GIT_PUSH_ON_EXIT: ${DEVBOB_PUSH_ON_EXIT:-true}
      
      ACP_PORT: "3002"
      ACP_HOSTNAME: "0.0.0.0"
      METABOB_API_URL: http://api-server-dev:8080
      METABOB_PROJECT_ID: ${METABOB_PROJECT_ID:-devbob-multi-agent}
      METABOB_API_KEY: ${METABOB_API_KEY:-}
      
      # Metabob CLI Dashboard
      METABOB_ENABLE_DASHBOARD: ${METABOB_ENABLE_DASHBOARD:-true}
      METABOB_DASHBOARD_HOST: "0.0.0.0"
      METABOB_DASHBOARD_UI_PORT: "3000"
      METABOB_DASHBOARD_API_PORT: "8088"
      
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WAIT_FOR_BACKEND: ${WAIT_FOR_BACKEND:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      metabob-rpc-api-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf http://localhost:3002/config"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    networks:
      - devbob
      - metabob-network

  # ---------------------------------------------------------------------------
  # Devbob Agent: metabob-cli codebase
  # ---------------------------------------------------------------------------
  devbob-cli:
    container_name: devbob-cli
    image: devbob:latest
    ports:
      - "3003:3003"   # OpenCode ACP
      - "8083:8082"   # MCP Server
      - "8093:8080"   # HTTP Bridge for CLI Agent
      - "3012:3000"   # Metabob CLI Dashboard UI
      - "3022:8088"   # Metabob CLI Dashboard API
    volumes:
      - devbob_cli_workspace:/workspace
      - devbob_config:/config
      - devbob_auth:/auth
      - ${SSH_KEY_DIR:-~/.ssh}:/root/.ssh:ro
    environment:
      CODEBASE_NAME: cli
      HOSTNAME: devbob-cli
      
      # Git repository configuration
      REPO_URL: ${DEVBOB_CLI_REPO:-}
      REPO_BRANCH: ${DEVBOB_CLI_BRANCH:-main}
      REPO_CHECKOUT_MODE: ${DEVBOB_CHECKOUT_MODE:-shallow}
      REPO_DEPTH: ${DEVBOB_REPO_DEPTH:-1}
      
      # Git push behavior
      GIT_AUTO_PUSH: ${DEVBOB_AUTO_PUSH:-false}
      GIT_PUSH_ON_EXIT: ${DEVBOB_PUSH_ON_EXIT:-true}
      
      ACP_PORT: "3003"
      ACP_HOSTNAME: "0.0.0.0"
      METABOB_API_URL: http://api-server-dev:8080
      METABOB_PROJECT_ID: ${METABOB_PROJECT_ID:-devbob-multi-agent}
      METABOB_API_KEY: ${METABOB_API_KEY:-}
      
      # Metabob CLI Dashboard
      METABOB_ENABLE_DASHBOARD: ${METABOB_ENABLE_DASHBOARD:-true}
      METABOB_DASHBOARD_HOST: "0.0.0.0"
      METABOB_DASHBOARD_UI_PORT: "3000"
      METABOB_DASHBOARD_API_PORT: "8088"
      
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WAIT_FOR_BACKEND: ${WAIT_FOR_BACKEND:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      metabob-rpc-api-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf http://localhost:3003/config"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    networks:
      - devbob
      - metabob-network

  # ---------------------------------------------------------------------------
  # Devbob Agent: metabob-opencode codebase
  # ---------------------------------------------------------------------------
  devbob-opencode:
    container_name: devbob-opencode
    image: devbob:latest
    ports:
      - "3004:3004"   # OpenCode ACP
      - "8084:8082"   # MCP Server
      - "8094:8080"   # HTTP Bridge for OpenCode Agent
      - "3013:3000"   # Metabob CLI Dashboard UI
      - "3023:8088"   # Metabob CLI Dashboard API
    volumes:
      - devbob_opencode_workspace:/workspace
      - devbob_config:/config
      - devbob_auth:/auth
      - ${SSH_KEY_DIR:-~/.ssh}:/root/.ssh:ro
    environment:
      CODEBASE_NAME: opencode
      HOSTNAME: devbob-opencode
      
      # Git repository configuration
      REPO_URL: ${DEVBOB_OPENCODE_REPO:-}
      REPO_BRANCH: ${DEVBOB_OPENCODE_BRANCH:-feat/activity-execution-fixes}
      REPO_CHECKOUT_MODE: ${DEVBOB_CHECKOUT_MODE:-shallow}
      REPO_DEPTH: ${DEVBOB_REPO_DEPTH:-1}
      
      # Git push behavior
      GIT_AUTO_PUSH: ${DEVBOB_AUTO_PUSH:-false}
      GIT_PUSH_ON_EXIT: ${DEVBOB_PUSH_ON_EXIT:-true}
      
      ACP_PORT: "3004"
      ACP_HOSTNAME: "0.0.0.0"
      METABOB_API_URL: http://api-server-dev:8080
      METABOB_PROJECT_ID: ${METABOB_PROJECT_ID:-devbob-multi-agent}
      METABOB_API_KEY: ${METABOB_API_KEY:-}
      
      # Metabob CLI Dashboard
      METABOB_ENABLE_DASHBOARD: ${METABOB_ENABLE_DASHBOARD:-true}
      METABOB_DASHBOARD_HOST: "0.0.0.0"
      METABOB_DASHBOARD_UI_PORT: "3000"
      METABOB_DASHBOARD_API_PORT: "8088"
      
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WAIT_FOR_BACKEND: ${WAIT_FOR_BACKEND:-true}
      
      # Use container-specific config (metabob-rpc-api-server:8080)
      OPENCODE_CONFIG: /workspace/configs/opencode.devbob.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      metabob-rpc-api-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf http://localhost:3004/config"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    networks:
      - devbob
      - metabob-network

  # ---------------------------------------------------------------------------
  # Devbob Agent: metabob-devbob project itself
  # This agent works on the DevBob orchestration project
  # ---------------------------------------------------------------------------
  devbob:
    container_name: devbob
    image: devbob:latest
    ports:
      - "3005:3005"   # OpenCode ACP
      - "8085:8082"   # MCP Server
      - "8095:8080"   # HTTP Bridge
      - "3014:3000"   # Metabob CLI Dashboard UI
      - "3024:8088"   # Metabob CLI Dashboard API
    volumes:
      # Mount local workspace directly (not cloned from git)
      - ..:/workspace
      - devbob_config:/config
      - devbob_auth:/auth
      - ${SSH_KEY_DIR:-~/.ssh}:/root/.ssh:ro
    environment:
      CODEBASE_NAME: devbob
      HOSTNAME: devbob
      
      # No repo clone - workspace is mounted directly from host
      REPO_URL: ""
      REPO_CHECKOUT_MODE: skip
      
      # Git push behavior
      GIT_AUTO_PUSH: ${DEVBOB_AUTO_PUSH:-false}
      GIT_PUSH_ON_EXIT: ${DEVBOB_PUSH_ON_EXIT:-true}
      
      ACP_PORT: "3005"
      ACP_HOSTNAME: "0.0.0.0"
      METABOB_API_URL: http://api-server-dev:8080
      METABOB_PROJECT_ID: ${METABOB_PROJECT_ID:-devbob-multi-agent}
      METABOB_API_KEY: ${METABOB_API_KEY:-}
      # KNOWN ISSUE: auto_inject hangs due to MCP IPC issues - see repos/metabob-cli/.cursor/rules/ipc-improvements-plan.mdc
      METABOB_DISABLE_AUTO_INJECT: "true"
      
      # Metabob CLI Dashboard
      METABOB_ENABLE_DASHBOARD: ${METABOB_ENABLE_DASHBOARD:-true}
      METABOB_DASHBOARD_HOST: "0.0.0.0"
      METABOB_DASHBOARD_UI_PORT: "3000"
      METABOB_DASHBOARD_API_PORT: "8088"
      
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WAIT_FOR_BACKEND: ${WAIT_FOR_BACKEND:-false}
      NODE_OPTIONS: "--max-old-space-size=4096"
    mem_limit: 6g
    mem_reservation: 2g
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf http://localhost:3005/config"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    networks:
      - devbob
      - metabob-network

# =============================================================================
# Volumes
# =============================================================================

volumes:
  # Backend service volumes
  metabob_redis_data:
    driver: local
  metabob_surreal_data:
    driver: local
  metabob_api_logs:
    driver: local
  metabob_worker_logs:
    driver: local
  
  # Shared config and auth across all agents
  devbob_config:
    driver: local
  devbob_auth:
    driver: local
  
  # Per-agent workspace (includes git repo and .opencode state)
  devbob_rpc_api_workspace:
    driver: local
  devbob_web_workspace:
    driver: local
  devbob_cli_workspace:
    driver: local
  devbob_opencode_workspace:
    driver: local

# =============================================================================
# Networks
# =============================================================================

networks:
  devbob:
    driver: bridge
    name: devbob-network
  metabob-network:
    driver: bridge
    name: metabob-network
