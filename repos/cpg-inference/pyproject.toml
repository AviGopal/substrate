[project]
name = "cpg-inference"
version = "0.5.2"
description = "Lightweight CPG-based code co-change prediction inference library"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["code-analysis", "cpg", "co-change", "inference", "faiss", "onnx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "tree-sitter>=0.25.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-java>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-c>=0.21.0",
    "tree-sitter-cpp>=0.21.0",
    "tree-sitter-ruby>=0.21.0",
    "tree-sitter-php>=0.21.0",
    "onnxruntime>=1.23.2",
    "numpy>=2.1.0",
    "faiss-cpu>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]
redis = [
    "redis>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/metabobproject/cpg-inference"
Documentation = "https://github.com/metabobproject/cpg-inference/blob/main/README.md"
Repository = "https://github.com/metabobproject/cpg-inference"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cpg_inference"]
artifacts = [
    "cpg_inference/bundled_models/*.onnx",
    "cpg_inference/bundled_models/*.onnx.data",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short -m 'not benchmark'"
markers = [
    "benchmark: Performance benchmarks (run with pytest -m benchmark)",
]

[tool.coverage.run]
source = ["cpg_inference"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

