<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metabob Internal Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            metabob: {
              bg: '#0a0a0f',
              surface: '#12121a',
              border: '#1e1e2e',
              primary: '#6366f1',
              secondary: '#8b5cf6',
              accent: '#22d3ee',
              success: '#22c55e',
              warning: '#f59e0b',
              error: '#ef4444',
              text: '#e2e8f0',
              muted: '#64748b',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background: #0a0a0f;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    /* Glassmorphism effect for input */
    .glass {
      background: rgba(18, 18, 26, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(99, 102, 241, 0.2);
    }
    /* Animation keyframes */
    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slide-up {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @keyframes scale-in {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
    /* Animation classes */
    .animate-fade-in {
      animation: fade-in 0.3s ease-out;
    }
    .animate-slide-up {
      animation: slide-up 0.3s ease-out;
    }
    .animate-scale-in {
      animation: scale-in 0.3s ease-out;
    }
    /* Component enter animation */
    .component-enter {
      animation: slide-up 0.3s ease-out;
    }
  </style>
</head>
<body class="min-h-screen bg-metabob-bg">
  <div id="root"></div>
  <script type="module" src="/assets/frontend.js"></script>
</body>
</html>
