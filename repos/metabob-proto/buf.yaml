version: v2
# Buf workspace configuration for metabob-proto
# This file defines the protobuf module and dependencies

modules:
  - path: proto
    name: buf.build/metabob/proto
    
# Linting rules
lint:
  use:
    - STANDARD
  except:
    # Allow TODO comments in proto files
    - COMMENT_FIELD
  
# Breaking change detection rules  
breaking:
  use:
    - FILE
  except:
    # Allow adding new fields (backwards compatible)
    - FIELD_SAME_LABEL
