version: v2
# Code generation configuration for metabob-proto
# Generates TypeScript and Python code from proto definitions

# Managed mode - buf manages dependencies
managed:
  enabled: true

plugins:
  # Python generation using standard protoc
  - local: python
    out: gen/python
      
  # TypeScript generation using ts-proto (local)
  - local: protoc-gen-ts_proto
    out: gen/typescript
    opt:
      # Generate optimized code for modern TypeScript
      - esModuleInterop=true
      - forceLong=long
      - useOptionals=messages
      # Use Date objects for timestamps
      - useDate=true
      # Generate JSON encode/decode methods
      - stringEnums=true
      # Output single file per proto file
      - outputClientImpl=false
      - outputServices=false

inputs:
  - directory: proto

plugins:
  # TypeScript generation using local ts-proto
  - local: protoc-gen-ts_proto
    out: gen/typescript
    opt:
      - esModuleInterop=true
      - forceLong=long
      - useOptionals=messages
      - useDate=true
      - stringEnums=true
      - outputClientImpl=false
      - outputServices=false
    
  # Python generation using standard protoc
  - local: python
    out: gen/python
    opt:
      - pyi_out=gen/python
