[project]
name = "metabob-proto"
version = "0.1.0"
description = "Canonical data model definitions for the Metabob ecosystem"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "betterproto[compiler]>=2.0.0b6",
]

[project.scripts]
generate-surreal-schema = "scripts.generate_surreal_schema:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["proto", "activities", "scripts"]
