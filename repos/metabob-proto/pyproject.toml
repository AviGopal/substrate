[project]
name = "metabob-proto"
version = "0.1.0"
description = "Canonical data model definitions for the Metabob ecosystem"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "betterproto[compiler]>=2.0.0b6",
]

[project.scripts]
generate-surreal-schema = "scripts.generate_surreal_schema:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Include both source proto files and generated Python code
packages = ["proto", "activities", "scripts"]

# Map gen/python/metabob to metabob in the wheel
# This ensures the generated Python protobuf code is included
[tool.hatch.build.targets.wheel.force-include]
"gen/python/metabob" = "metabob"
