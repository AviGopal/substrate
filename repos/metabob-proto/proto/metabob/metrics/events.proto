syntax = "proto3";

package metabob.metrics;

option go_package = "github.com/metabobproject/metabob-proto/gen/go/metabob/metrics";

import "google/protobuf/timestamp.proto";

// =============================================================================
// MetricEvent - Raw event data for analytics
// =============================================================================
//
// SurrealDB Table: metric_events
// Indexes: org_id, timestamp, event_type
//
// =============================================================================

message MetricEvent {
  string event_id = 1;
  string event_type = 2;  // scan, fix, interaction, session_start, etc.
  google.protobuf.Timestamp timestamp = 3;
  
  // Scope
  optional string org_id = 4;
  optional string project_id = 5;
  optional string user_id = 6;
  optional string session_id = 7;
  
  // Problem metrics
  int32 problem_count = 8;
  repeated string problem_types = 9;
  repeated string problem_severities = 10;
  
  // Context
  optional string file_path = 11;
  optional string interaction_type = 12;  // endorse, discard, fix
  optional string problem_id = 13;
}

// =============================================================================
// DailyMetrics - Aggregated daily metrics (SCHEMALESS due to nested objects)
// =============================================================================
//
// SurrealDB Table: daily_metrics
// Indexes: org_id + date, project_id + date
//
// Note: Using SCHEMALESS because SurrealDB has issues with array<object> in SCHEMAFULL
//
// =============================================================================

message DailyMetrics {
  string org_id = 1;
  string project_id = 2;
  string date = 3;  // YYYY-MM-DD format
  
  // Problem counts
  int32 total_problems = 4;
  repeated CategoryCount problems_by_severity = 5;
  repeated CategoryCount problems_by_type = 6;
  
  // Interaction counts
  int32 problems_endorsed = 7;
  int32 problems_discarded = 8;
  int32 problems_fixed = 9;
  
  // Activity metrics
  int32 total_sessions = 10;
  int32 total_files = 11;
  int32 total_fix_generations = 12;
}

message CategoryCount {
  string category = 1;
  int32 count = 2;
}

// =============================================================================
// SchemaVersion - Database schema version tracking
// =============================================================================
//
// SurrealDB Table: schema_versions
// Indexes: version (unique)
//
// =============================================================================

message SchemaVersion {
  int32 version = 1;
  string description = 2;
  string migration_script = 3;
  google.protobuf.Timestamp applied_at = 4;
  string applied_by = 5;
  map<string, string> metadata = 6;
}
