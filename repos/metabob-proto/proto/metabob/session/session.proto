syntax = "proto3";

package metabob.session;

option go_package = "github.com/metabobproject/metabob-proto/gen/go/metabob/session";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// =============================================================================
// Session - Anonymous session for API access
// =============================================================================
//
// SurrealDB Table: sessions
// Indexes: session_id (unique)
//
// =============================================================================

enum SessionType {
  SESSION_TYPE_UNSPECIFIED = 0;
  SESSION_TYPE_ANONYMOUS = 1;     // Anonymous/guest session
  SESSION_TYPE_AUTHENTICATED = 2; // User-authenticated session
  SESSION_TYPE_SERVICE = 3;       // Service-to-service session
}

message Session {
  // ==========================================================================
  // Identity
  // ==========================================================================
  
  string session_id = 1;
  SessionType session_type = 2;
  
  // ==========================================================================
  // Scope (optional - for authenticated sessions)
  // ==========================================================================
  
  string consumer_id = 3;
  string org_id = 4;
  string project_id = 5;
  
  // ==========================================================================
  // Metadata
  // ==========================================================================
  
  // Arbitrary metadata (e.g., user agent, client info)
  map<string, string> metadata = 6;
  
  // ==========================================================================
  // Lifecycle
  // ==========================================================================
  
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp expires_at = 8;
  google.protobuf.Timestamp last_activity = 9;
}
