syntax = "proto3";

package metabob.learning;

option go_package = "github.com/metabobproject/metabob-proto/gen/go/metabob/learning";

import "google/protobuf/timestamp.proto";

// =============================================================================
// Consumer Profile - Agent behavior and preference tracking
// =============================================================================
//
// SurrealDB Table: consumer_profiles
// Indexes: consumer_id (unique)
//
// =============================================================================

message ConsumerProfile {
  // ==========================================================================
  // Identity
  // ==========================================================================
  
  // Anonymous consumer hash (SHA-256 of identifying info)
  string consumer_id = 1;
  
  // Organization and project scope
  string org_id = 2;
  string project_id = 3;
  
  // ==========================================================================
  // Technical Context
  // ==========================================================================
  
  // Most common language used
  string primary_language = 4;
  
  // Most common framework
  optional string primary_framework = 5;
  
  // Technologies in use
  repeated string tech_stack = 6;
  
  // ==========================================================================
  // Behavioral Patterns
  // ==========================================================================
  
  // Activity category preferences {category: selection_count}
  map<string, int32> selection_history = 7;
  
  // Success rates by category {category: rate}
  map<string, double> success_rate_by_category = 8;
  
  // ==========================================================================
  // Preferences (0.0-1.0 scale)
  // ==========================================================================
  
  double prefers_speed = 9;    // 1.0 = strongly prefers fast execution
  double prefers_cost = 10;    // 1.0 = strongly prefers low cost
  double prefers_quality = 11; // 1.0 = strongly prefers high quality
  
  // ==========================================================================
  // Engagement Metrics
  // ==========================================================================
  
  int32 total_impressions = 12;  // Activities shown
  int32 total_selections = 13;   // Activities selected
  int32 total_successes = 14;    // Successful executions
  
  // ==========================================================================
  // Derived Metrics
  // ==========================================================================
  
  double overall_ctr = 15;             // selections / impressions
  double overall_conversion_rate = 16; // successes / selections
  
  // ==========================================================================
  // Timestamps
  // ==========================================================================
  
  google.protobuf.Timestamp created_at = 17;
  google.protobuf.Timestamp updated_at = 18;
}

// =============================================================================
// Activity Impression - Record of activity shown to consumer
// =============================================================================
//
// SurrealDB Table: activity_impressions
// Indexes: impression_id (unique), consumer_id + variant_id
//
// =============================================================================

message ActivityImpression {
  // ==========================================================================
  // Identity
  // ==========================================================================
  
  string impression_id = 1;
  
  // ==========================================================================
  // Context
  // ==========================================================================
  
  string consumer_id = 2;
  string session_id = 3;
  
  // ==========================================================================
  // What Was Shown
  // ==========================================================================
  
  string variant_id = 4;
  string activity_id = 5;
  string intent = 6;  // Agent's stated intent/query
  
  // ==========================================================================
  // Ranking Context
  // ==========================================================================
  
  int32 rank = 7;         // Position in recommendation list (1-indexed)
  int32 total_shown = 8;  // Total recommendations shown
  
  // ==========================================================================
  // Prediction Scores
  // ==========================================================================
  
  double predicted_ctr = 9;
  double predicted_conversion = 10;
  double expected_value = 11;
  
  // ==========================================================================
  // A/B Testing
  // ==========================================================================
  
  optional string experiment_id = 12;
  optional string treatment_group = 13;
  
  // ==========================================================================
  // Outcome (filled in later)
  // ==========================================================================
  
  bool was_selected = 14;
  optional int32 selection_time_ms = 15;
  
  // ==========================================================================
  // Timestamps
  // ==========================================================================
  
  google.protobuf.Timestamp shown_at = 16;
  optional google.protobuf.Timestamp selected_at = 17;
}
