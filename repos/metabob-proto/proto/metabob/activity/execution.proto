syntax = "proto3";

package metabob.activity;

option go_package = "github.com/metabobproject/metabob-proto/gen/go/metabob/activity";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/any.proto";
import "metabob/common/types.proto";

// =============================================================================
// EXECUTION CONFIGURATION - OpenCode-specific activity execution extensions
// =============================================================================
//
// This file defines execution-level configuration for activities. These are
// OpenCode-specific runtime settings that control HOW an activity executes,
// including context requirements, integration checks, code quality gates,
// lifecycle hooks, and cross-repository execution topology.
//
// Architecture Decision:
// - Proto defines the EXECUTION CONTRACT (what backend needs to track)
// - OpenCode extends with RUNTIME EXECUTION LOGIC (how to execute locally)
//
// Reference: repos/metabob-proto/OPENCODE_FIELD_AUDIT.md
// =============================================================================

// ExecutionConfig defines activity-level execution configuration.
// This contains OpenCode-specific execution settings that control
// how an activity runs, including context requirements, integration
// checks, code quality gates, lifecycle hooks, and cross-repository
// execution topology.
message ExecutionConfig {
  // Context requirements that must be satisfied before activity execution.
  // The session memory agent uses these to prepare relevant impulses.
  repeated ContextRequirement context_requirements = 1;

  // Pre/post shell commands and quality gates for validation.
  IntegrationConfig integration = 2;

  // Metabob code quality integration configuration.
  MetabobIntegrationConfig metabob = 3;

  // Lifecycle hooks for workspace setup, impulse management, and cleanup.
  HooksConfig hooks = 4;

  // Repository mappings for cross-repository execution via ACP delegation.
  // Maps repository identifiers to connection strings.
  map<string, RepositoryMapping> repositories = 5;

  // Context negotiation configuration for gathering missing context.
  ContextNegotiation context_negotiation = 6;

  // Discovery phase configuration for pre-execution similarity checks.
  DiscoveryPhase discovery_phase = 7;

  // Memory management strategy for impulse loading/unloading.
  MemoryManagement memory_management = 8;
}

// =============================================================================
// CONTEXT REQUIREMENTS
// =============================================================================

// ContextRequirement declares what context impulses an activity needs
// before execution. The session memory agent uses these hints to prepare
// relevant impulses from the conversation history.
//
// Example:
// {
//   "key": "errorContext",
//   "hint": "Error messages and stack traces from recent failures",
//   "impulseTypes": ["memo", "error"],
//   "required": true,
//   "budgetRange": { "minTokens": 500, "maxTokens": 2000 }
// }
message ContextRequirement {
  // Unique key identifying this requirement (used as impulse ID hint).
  string key = 1;

  // Human-readable description of what context is needed.
  string hint = 2;

  // Accepted impulse types (e.g., "memo", "file", "component", "error").
  repeated string impulse_types = 3;

  // Whether this requirement must be fulfilled before execution.
  bool required = 4;

  // Token budget range for this context (min/max tokens).
  TokenBudgetRange budget_range = 5;
}

// TokenBudgetRange defines minimum and maximum token allocation.
message TokenBudgetRange {
  // Minimum tokens allocated for this context.
  int32 min_tokens = 1;

  // Maximum tokens allocated for this context.
  int32 max_tokens = 2;
}

// ContextNegotiation configures context gathering protocol when
// context requirements aren't met initially.
//
// Example:
// {
//   "prompt": "Please provide error context from recent failures",
//   "maxRounds": 3
// }
message ContextNegotiation {
  // Initial prompt to calling agent for context gathering.
  string prompt = 1;

  // Maximum negotiation rounds before giving up.
  int32 max_rounds = 2;
}

// =============================================================================
// INTEGRATION & QUALITY GATES
// =============================================================================

// IntegrationConfig defines pre/post shell commands and quality gates
// for validation during activity execution.
//
// Example:
// {
//   "preChecks": ["git status", "npm test"],
//   "postChecks": ["ls -la dist/"],
//   "qualityGates": [
//     {
//       "name": "build-success",
//       "command": "npm run build",
//       "required": true
//     }
//   ]
// }
message IntegrationConfig {
  // Shell commands to execute before activity starts (validation).
  repeated string pre_checks = 1;

  // Shell commands to execute after activity completes (verification).
  repeated string post_checks = 2;

  // Quality gates that must pass for activity to be considered successful.
  repeated QualityGate quality_gates = 3;
}

// QualityGate is a validation command that must pass.
message QualityGate {
  // Human-readable name for this quality gate.
  string name = 1;

  // Shell command to execute (exit code 0 = pass).
  string command = 2;

  // Whether this gate must pass for activity success.
  bool required = 3;
}

// =============================================================================
// METABOB INTEGRATION
// =============================================================================

// MetabobIntegrationConfig controls Metabob code quality integration
// during activity execution.
//
// Example:
// {
//   "enabled": true,
//   "learningMode": true,
//   "targetContextTokens": 4000,
//   "annotationStrategy": "KEY_COMPONENTS"
// }
message MetabobIntegrationConfig {
  // Whether Metabob integration is enabled for this activity.
  bool enabled = 1;

  // Whether to capture Metabob feedback for learning system.
  bool learning_mode = 2;

  // Target token budget for Metabob context injection.
  int32 target_context_tokens = 3;

  // Strategy for automatic code annotation during execution.
  AnnotationStrategy annotation_strategy = 4;

  // Annotation strategy determines when components are annotated.
  enum AnnotationStrategy {
    ANNOTATION_STRATEGY_UNSPECIFIED = 0;
    ANNOTATION_STRATEGY_ALL = 1;              // Annotate all modified components
    ANNOTATION_STRATEGY_KEY_COMPONENTS = 2;   // Annotate only key components
    ANNOTATION_STRATEGY_FAILURES_ONLY = 3;    // Annotate only on failures
  }
}

// =============================================================================
// LIFECYCLE HOOKS
// =============================================================================

// HooksConfig defines lifecycle hooks for workspace setup, impulse
// management, and cleanup during activity execution.
//
// Example:
// {
//   "preActivity": {
//     "workingDirectory": { "current": {} },
//     "loadImpulses": ["errorContext", "repoStructure"],
//     "environment": { "NODE_ENV": "test" }
//   },
//   "postActivity": {
//     "cleanup": false,
//     "createSummary": true
//   }
// }
message HooksConfig {
  // Hook executed before activity starts.
  PreActivityHook pre_activity = 1;

  // Hook executed before each task.
  PreTaskHook pre_task = 2;

  // Hook executed after each task.
  PostTaskHook post_task = 3;

  // Hook executed after activity completes.
  PostActivityHook post_activity = 4;

  // Hook executed on activity error/failure.
  ErrorHook on_error = 5;
}

// PreActivityHook configures workspace setup and context loading
// before activity execution starts.
message PreActivityHook {
  // Working directory configuration for activity execution.
  WorkingDirectoryConfig working_directory = 1;

  // Impulse IDs to load into session memory before execution.
  repeated string load_impulses = 2;

  // Environment variables to set for activity execution.
  map<string, string> environment = 3;

  // Validation commands to run before starting.
  repeated ValidationCommand commands = 4;
}

// WorkingDirectoryConfig specifies where the activity should execute.
message WorkingDirectoryConfig {
  // Type of working directory configuration.
  oneof config {
    // Use current working directory.
    CurrentDirectory current = 1;

    // Create temporary directory.
    TemporaryDirectory temporary = 2;

    // Use custom directory path.
    CustomDirectory custom = 3;
  }
}

// CurrentDirectory uses the current working directory.
message CurrentDirectory {
  // Optional subdirectory path (relative to cwd).
  optional string path = 1;
}

// TemporaryDirectory creates a temporary directory for execution.
message TemporaryDirectory {
  // Prefix for temporary directory name.
  string prefix = 1;

  // Cleanup policy for temporary directory.
  CleanupPolicy cleanup = 2;

  // Cleanup policy determines when temporary directories are removed.
  enum CleanupPolicy {
    CLEANUP_POLICY_UNSPECIFIED = 0;
    CLEANUP_POLICY_ALWAYS = 1;       // Always cleanup
    CLEANUP_POLICY_ON_SUCCESS = 2;   // Cleanup only if activity succeeds
    CLEANUP_POLICY_ON_ERROR = 3;     // Cleanup only if activity fails
    CLEANUP_POLICY_NEVER = 4;        // Never cleanup (for debugging)
  }
}

// CustomDirectory uses a specific directory path.
message CustomDirectory {
  // Absolute or relative path to directory.
  string path = 1;

  // Whether to create directory if it doesn't exist.
  bool create_if_missing = 2;
}

// PreTaskHook configures task-specific context loading before
// each task executes.
message PreTaskHook {
  // Impulse IDs to load for this specific task.
  repeated string load_task_impulses = 1;

  // Whether to validate tool availability before task.
  bool validate_tools = 2;

  // Commands to run before task execution.
  repeated ValidationCommand commands = 3;
}

// PostTaskHook configures cleanup and output capture after
// each task completes.
message PostTaskHook {
  // Whether to unload low-priority impulses after task.
  bool unload_low_priority_impulses = 1;

  // Output patterns to capture from task execution.
  repeated OutputCapture capture_outputs = 2;

  // Commands to run after task execution.
  repeated ValidationCommand commands = 3;
}

// OutputCapture specifies patterns for capturing task outputs.
message OutputCapture {
  // Name for this output capture.
  string name = 1;

  // Glob pattern for files to capture.
  string pattern = 2;

  // Whether to create impulse from captured output.
  bool create_impulse = 3;

  // Token budget for impulse created from output.
  int32 impulse_budget = 4;
}

// PostActivityHook configures cleanup and artifact collection
// after activity completes successfully.
message PostActivityHook {
  // Whether to cleanup temporary files/directories.
  bool cleanup = 1;

  // File patterns to extract as activity artifacts.
  repeated string extract_files = 2;

  // Whether to persist impulses created during execution.
  bool persist_impulses = 3;

  // Whether to create activity summary impulse.
  bool create_summary = 4;

  // Commands to run after activity completion.
  repeated ValidationCommand commands = 5;
}

// ErrorHook configures diagnostic capture and cleanup when
// activity execution fails.
message ErrorHook {
  // Whether to capture environment variables on error.
  bool capture_environment = 1;

  // Log capture configuration for error diagnostics.
  LogCapture capture_logs = 2;

  // Whether to create diagnostic impulse from error context.
  bool create_diagnostic_impulse = 3;

  // Whether to cleanup on error (false = preserve for debugging).
  bool cleanup = 4;

  // Commands to run on error (e.g., debug dumps).
  repeated ValidationCommand commands = 5;
}

// LogCapture specifies how to capture logs for diagnostics.
message LogCapture {
  // Number of lines to capture from tail of logs.
  int32 tail = 1;

  // Whether to include full session transcript.
  bool include_transcript = 2;

  // File patterns for log files to capture.
  repeated string log_files = 3;
}

// ValidationCommand is a command used for validation in hooks.
message ValidationCommand {
  // Command to execute.
  string command = 1;

  // Expected exit code (default: 0).
  int32 expected_exit_code = 2;

  // Timeout in seconds for command execution.
  int32 timeout_seconds = 3;

  // Whether this validation is required.
  bool required = 4;

  // Description of what this validation checks.
  string description = 5;
}

// =============================================================================
// CROSS-REPOSITORY EXECUTION
// =============================================================================

// RepositoryMapping defines connection to a remote repository
// for cross-repository execution via ACP delegation.
//
// Example:
// {
//   "name": "frontend",
//   "connection": "docker://devbob-dashboard",
//   "workingDirectory": "/workspace",
//   "description": "Frontend dashboard repository"
// }
message RepositoryMapping {
  // Human-readable name for this repository.
  string name = 1;

  // ACP connection string (e.g., "docker://container" or "ssh://host/path").
  string connection = 2;

  // Working directory in remote repository.
  optional string working_directory = 3;

  // Description of this repository's purpose.
  optional string description = 4;
}

// =============================================================================
// DISCOVERY PHASE
// =============================================================================

// DiscoveryPhase configures pre-execution similarity checks to
// find existing implementations before creating new code.
//
// Example:
// {
//   "required": true,
//   "searchTemplates": true,
//   "searchCodebase": true,
//   "minSimilarityChecks": 3,
//   "similarityThreshold": 80
// }
message DiscoveryPhase {
  // Whether discovery phase is required before execution.
  bool required = 1;

  // Whether to search existing activity templates.
  bool search_templates = 2;

  // Whether to search codebase for similar implementations.
  bool search_codebase = 3;

  // Minimum number of similarity checks to perform.
  int32 min_similarity_checks = 4;

  // Similarity threshold percentage (0-100) for matches.
  int32 similarity_threshold = 5;

  // Maximum time to spend on discovery (seconds).
  int32 max_discovery_time_seconds = 6;
}

// =============================================================================
// MEMORY MANAGEMENT
// =============================================================================

// MemoryManagement configures impulse loading/unloading strategy
// for managing session memory during execution.
//
// Example:
// {
//   "strategy": "BALANCED",
//   "unloadLowPriority": true,
//   "keepHighPriority": true,
//   "optimizationThreshold": 0.8
// }
message MemoryManagement {
  // Memory management strategy.
  Strategy strategy = 1;

  // Whether to unload low-priority impulses when memory tight.
  bool unload_low_priority = 2;

  // Whether to always keep high-priority impulses loaded.
  bool keep_high_priority = 3;

  // Threshold (0.0-1.0) for triggering optimization.
  double optimization_threshold = 4;

  // Maximum token budget for session memory.
  int32 max_token_budget = 5;

  // Memory management strategy options.
  enum Strategy {
    STRATEGY_UNSPECIFIED = 0;
    STRATEGY_CONSERVATIVE = 1;  // Keep everything loaded
    STRATEGY_BALANCED = 2;      // Unload when needed
    STRATEGY_AGGRESSIVE = 3;    // Aggressively unload
  }
}

// =============================================================================
// TASK-LEVEL EXECUTION CONFIGURATION
// =============================================================================

// TaskExecutionConfig defines task-level execution configuration.
// This extends TaskStep with execution-specific settings.
message TaskExecutionConfig {
  // Where this task should execute (local or remote).
  TaskExecutionTarget execution_target = 1;

  // Impulse adjustment configuration for context refinement.
  ImpulseAdjustment impulse_adjustment = 2;

  // Tools configuration for this task.
  TaskTools tools = 3;

  // Impulse references for this task (context dependencies).
  repeated ImpulseReference impulse_references = 4;
}

// TaskExecutionTarget specifies where a task should execute.
//
// Example (local):
// { "local": {} }
//
// Example (remote):
// {
//   "remote": {
//     "connection": "docker://devbob-frontend",
//     "repository": "frontend",
//     "shareImpulses": true
//   }
// }
message TaskExecutionTarget {
  // Type of execution target.
  oneof target {
    // Execute locally in current session.
    LocalExecution local = 1;

    // Execute remotely via ACP delegation.
    RemoteExecution remote = 2;
  }
}

// LocalExecution indicates task runs in current session.
message LocalExecution {
  // No additional configuration needed.
}

// RemoteExecution configures ACP delegation to remote agent.
message RemoteExecution {
  // ACP connection string (e.g., "docker://container").
  string connection = 1;

  // Repository identifier from activity's repositories map.
  optional string repository = 2;

  // Working directory override for remote execution.
  optional string working_directory = 3;

  // Whether to share impulses with remote agent.
  bool share_impulses = 4;

  // Whether to sync session state to remote agent.
  bool sync_session_state = 5;

  // Whether to sync activity state to remote agent.
  bool sync_activity_state = 6;

  // Timeout for remote execution (seconds).
  int32 timeout_seconds = 7;
}

// ImpulseAdjustment configures context refinement before task execution.
//
// Example:
// {
//   "prompt": "Focus on error handling code",
//   "beforeExecution": true
// }
message ImpulseAdjustment {
  // Prompt for adjusting impulses (context refinement).
  string prompt = 1;

  // Whether to run adjustment before task execution.
  bool before_execution = 2;

  // Target token budget after adjustment.
  int32 target_token_budget = 3;
}

// TaskTools configures tool availability for task execution.
//
// Example:
// {
//   "required": ["read", "write", "bash"],
//   "optional": ["grep", "glob"],
//   "disabled": ["remote_bash"]
// }
message TaskTools {
  // Tools that must be available for task.
  repeated string required = 1;

  // Tools that are nice-to-have but optional.
  repeated string optional = 2;

  // Tools that should be disabled for this task.
  repeated string disabled = 3;
}

// ImpulseReference links a task to impulses it requires.
// This is used in TaskStep to declare context dependencies.
//
// Example:
// {
//   "impulseId": "errorContext",
//   "priority": "HIGH",
//   "required": true
// }
message ImpulseReference {
  // Impulse ID (key from contextRequirements or runtime ID).
  string impulse_id = 1;

  // Priority of this impulse for task execution.
  ImpulsePriority priority = 2;

  // Whether this impulse is required for task.
  bool required = 3;

  // Minimum token budget for this impulse.
  int32 min_tokens = 4;

  // Maximum token budget for this impulse.
  int32 max_tokens = 5;

  // Priority levels for impulse loading.
  enum ImpulsePriority {
    IMPULSE_PRIORITY_UNSPECIFIED = 0;
    IMPULSE_PRIORITY_LOW = 1;
    IMPULSE_PRIORITY_MEDIUM = 2;
    IMPULSE_PRIORITY_HIGH = 3;
    IMPULSE_PRIORITY_CRITICAL = 4;
  }
}
