syntax = "proto3";

package metabob.activity;

option go_package = "github.com/metabobproject/metabob-proto/gen/go/metabob/activity";

import "google/protobuf/timestamp.proto";
import "metabob/common/types.proto";
import "metabob/activity/execution.proto";
import "metabob/activity/optimization.proto";
import "metabob/activity/admin.proto";

// =============================================================================
// Activity Variant - A/B testable implementation of an activity
// =============================================================================

// =============================================================================
// TaskStep - Individual step within an activity (embedded, no table)
// =============================================================================
//
// This schema is the canonical task definition used by both the backend
// (storage/serving) and OpenCode (execution).
//
// =============================================================================

message TaskStep {
  // ==========================================================================
  // Identity & Structure
  // ==========================================================================
  
  // Unique step identifier within the activity (required)
  string id = 1;
  
  // Agent to execute this task: "general", "tool", "config", "session" (required)
  string subagent = 2;
  
  // Human-readable task description (required)
  string description = 3;
  
  // Task IDs this depends on (required, can be empty [])
  repeated string dependencies = 4;
  
  // ==========================================================================
  // Prompt Configuration (required for execution)
  // ==========================================================================
  
  TaskPrompt prompt = 5;
  
  // ==========================================================================
  // Validation Configuration (required)
  // ==========================================================================
  
  TaskValidation validation = 6;
  
  // ==========================================================================
  // Retry Configuration (required)
  // ==========================================================================
  
  TaskRetry retry = 7;
  
  // ==========================================================================
  // Metrics (required, initialized with defaults)
  // ==========================================================================
  
  TaskMetrics metrics = 8;
  
  // ==========================================================================
  // Optional Fields
  // ==========================================================================
  
  // Guidance hints for the agent
  repeated string guidance = 9;
  
  // Expected actions the task should perform
  repeated string expected_actions = 10;
  
  // Tool configuration
  TaskTools tools = 11;
  
  // Complexity tier for model selection
  TaskComplexity complexity = 12;
  
  // ==========================================================================
  // Execution Configuration (Task-level)
  // ==========================================================================
  
  // Task-level execution config (where to run, tool requirements, etc.)
  TaskExecutionConfig execution_config = 20;
  
  // Impulse references (data flow tracking for context dependencies)
  repeated ImpulseReference impulse_refs = 21;
}

// TaskPrompt - Prompt configuration for task execution
message TaskPrompt {
  // The actual prompt template with {{variable}} interpolation (required)
  string template = 1;
  
  // Maximum tokens for response (default: 8000)
  int32 max_tokens = 2;
  
  // Context compression strategy: "filter", "summarize", "truncate"
  string compression_strategy = 3;
  
  // Variables referenced in the template
  repeated string variables = 4;
}

// TaskValidation - Validation rules for task completion
message TaskValidation {
  // Files that must exist after task completion
  repeated string required_files = 1;
  
  // Patterns that must be present in output
  repeated string required_patterns = 2;
  
  // Patterns that must NOT be present
  repeated string forbidden_patterns = 3;
  
  // Shell commands to run for validation (exit 0 = pass)
  repeated ValidationCommand commands = 4;
}

// TaskRetry - Retry configuration for failed tasks
message TaskRetry {
  // Maximum retry attempts (default: 3)
  int32 max_attempts = 1;
  
  // Retry strategy: "simple", "exponential", "adaptive"
  string strategy = 2;
  
  // Alternative prompt to use on retry
  string fallback_prompt = 3;
}

// TaskMetrics - Runtime metrics for task execution
message TaskMetrics {
  // Historical success rate (0.0-1.0)
  double success_rate = 1;
  
  // Average tokens used
  int32 avg_tokens = 2;
  
  // Average duration in milliseconds
  int32 avg_duration = 3;
  
  // Common failure reasons
  repeated string common_failures = 4;
}

// TaskComplexity - Complexity tier for model selection
message TaskComplexity {
  // Complexity tier: "simple", "moderate", "complex", "expert"
  string tier = 1;
  
  // Estimated token usage
  int32 estimated_tokens = 2;
  
  // Whether task requires multi-step reasoning
  bool requires_reasoning = 3;
  
  // Minimum model capability required
  string min_model_capability = 4;
}

// =============================================================================
// ActivityVariant - A/B testable implementation stored in database
// =============================================================================
//
// SurrealDB Table: activity
// Indexes: id (unique), name, category, org_id, scope
//
// =============================================================================

message ActivityVariant {
  // ==========================================================================
  // Identity
  // ==========================================================================
  
  // Unique variant identifier (format: {activity_id}-{content_hash_prefix})
  string variant_id = 1;
  
  // Parent activity category (e.g., "bug-fix", "feature-impl")
  string activity_id = 2;
  
  // Human-readable variant name
  string variant_name = 3;
  
  // What makes this variant different
  string description = 4;
  
  // Version number (incremented on refinements)
  int32 version = 5;
  
  // ==========================================================================
  // Genealogy - Content-addressable lineage tracking
  // ==========================================================================
  
  metabob.common.Genealogy genealogy = 6;
  
  // ==========================================================================
  // Implementation
  // ==========================================================================
  
  // Ordered task steps for this variant
  repeated TaskStep task_steps = 7;
  
  // Variables that can be interpolated into prompts
  map<string, string> variables = 8;
  
  // Prompting approach: "guided", "minimal", "detailed"
  string prompt_strategy = 9;
  
  // Token budget for context window
  int32 context_budget_tokens = 10;
  
  // ==========================================================================
  // Performance Expectations
  // ==========================================================================
  
  // Expected execution time (milliseconds)
  int32 expected_duration_ms = 11;
  
  // Expected cost in USD
  double expected_cost = 12;
  
  // Expected quality score (0.0-1.0)
  double expected_quality_score = 13;
  
  // ==========================================================================
  // Status & Metadata
  // ==========================================================================
  
  metabob.common.EntityStatus status = 14;
  
  google.protobuf.Timestamp created_at = 15;
  
  // ==========================================================================
  // Application-Specific Extensions
  // ==========================================================================
  
  // OpenCode execution configuration
  ExecutionConfig execution_config = 20;
  
  // A/B testing and optimization configuration
  OptimizationConfig optimization_config = 21;
  
  // Administrative configuration (authoring, validation, deployment)
  AdminConfig admin_config = 22;
  
  // ==========================================================================
  // Additional Fields from Audit
  // ==========================================================================
  
  // Composition configuration (how this activity relates to others)
  CompositionConfig composition = 23;
  
  // Learning system configuration
  LearningConfig learning = 24;
  
  // Expected outcomes for validation
  repeated ExpectedOutcome expected_outcomes = 25;
}

// =============================================================================
// Variant Performance Metrics - Thompson Sampling optimization
// =============================================================================
//
// SurrealDB: Metrics are now stored in the activity table itself
// Fields: executions_total, executions_success, executions_failed,
//         avg_duration_ms, avg_cost_usd, thompson_alpha, thompson_beta
//
// =============================================================================

message VariantPerformanceMetrics {
  // Variant being tracked
  string variant_id = 1;
  string activity_id = 2;
  
  // ==========================================================================
  // Funnel Metrics
  // ==========================================================================
  
  int32 total_impressions = 3;
  int32 total_selections = 4;
  int32 total_conversions = 5;
  int32 total_successes = 6;
  int32 total_failures = 7;
  
  // ==========================================================================
  // Performance Averages
  // ==========================================================================
  
  double avg_duration_ms = 8;
  double avg_cost = 9;
  double avg_quality_score = 10;
  
  // ==========================================================================
  // Derived Rates
  // ==========================================================================
  
  double conversion_rate = 11;  // conversions / selections
  double expected_value = 12;   // CTR × Conversion × Quality
  
  // ==========================================================================
  // Thompson Sampling Parameters
  // ==========================================================================
  
  double thompson_alpha = 13;  // Successes + 1 (Beta distribution)
  double thompson_beta = 14;   // Failures + 1 (Beta distribution)
  
  // ==========================================================================
  // Timestamps
  // ==========================================================================
  
  google.protobuf.Timestamp last_updated = 15;
}

// =============================================================================
// Composition Configuration - Activity relationships and reusability
// =============================================================================
//
// Defines how this activity can be composed with others and provides
// usage examples for discoverability.
//
// Example:
// {
//   "standalone": true,
//   "composedWith": ["test-implementation", "commit-changes"],
//   "examples": [
//     "Fix authentication bug",
//     "Implement user login feature",
//     "Refactor API endpoints"
//   ]
// }
//
// =============================================================================

message CompositionConfig {
  // Whether this activity can run standalone (default: true)
  bool standalone = 1;
  
  // Activity IDs this activity commonly composes with
  // Example: ["run-tests", "create-commit", "update-docs"]
  repeated string composes_with = 2;
  
  // Concrete usage examples for discoverability
  // Example: ["Fix authentication timeout", "Add user profile endpoint"]
  repeated string examples = 3;
  
  // Whether this activity is designed as a sub-activity (default: false)
  bool is_subactivity = 4;
  
  // Parent activity IDs (if this is typically used as a sub-activity)
  repeated string parent_activities = 5;
}

// =============================================================================
// Learning Configuration - Feedback and pattern learning
// =============================================================================
//
// Configures the learning system for capturing feedback and improving
// activity performance over time.
//
// Example:
// {
//   "enabled": true,
//   "feedbackPoints": ["after-validation", "on-failure", "on-completion"],
//   "successPatterns": ["all tests pass", "no linting errors"],
//   "failurePatterns": ["compilation error", "timeout"]
// }
//
// =============================================================================

message LearningConfig {
  // Whether learning is enabled for this activity (default: false)
  bool enabled = 1;
  
  // Points in execution where feedback should be captured
  // Examples: "before-task", "after-task", "on-validation", "on-completion"
  repeated string feedback_points = 2;
  
  // Patterns that indicate success (for learning system)
  // Example: ["tests pass", "build succeeds", "no errors"]
  repeated string success_patterns = 3;
  
  // Patterns that indicate failure (for learning system)
  // Example: ["compilation error", "test timeout", "missing file"]
  repeated string failure_patterns = 4;
  
  // Whether to capture full session transcript for learning
  bool capture_transcript = 5;
  
  // Whether to capture tool usage patterns for learning
  bool capture_tool_usage = 6;
  
  // Minimum confidence threshold for applying learned improvements (0.0-1.0)
  double min_confidence_threshold = 7;
}

// =============================================================================
// Expected Outcome - Validation criteria for activity success
// =============================================================================
//
// Defines expected outcomes that should result from activity execution,
// along with verification methods and success criteria.
//
// Example:
// {
//   "description": "Bug is fixed and tests pass",
//   "verificationMethod": "run-tests",
//   "successCriteria": [
//     "All unit tests pass",
//     "Integration tests pass",
//     "No new errors introduced"
//   ]
// }
//
// =============================================================================

message ExpectedOutcome {
  // Human-readable description of expected outcome
  string description = 1;
  
  // Verification method: "manual", "automated", "run-command", "check-files"
  string verification_method = 2;
  
  // Success criteria (conditions that must be met)
  repeated string success_criteria = 3;
  
  // Verification command (if verification_method = "run-command")
  optional string verification_command = 4;
  
  // Files that should exist or change (if verification_method = "check-files")
  repeated string expected_files = 5;
  
  // Whether this outcome is required for activity success (default: true)
  bool required = 6;
  
  // Weight of this outcome in overall success score (0.0-1.0)
  double weight = 7;
}
