syntax = "proto3";

package metabob.activity;

option go_package = "github.com/metabobproject/metabob-proto/gen/go/metabob/activity";

import "google/protobuf/timestamp.proto";

// =============================================================================
// ADMIN CONFIGURATION - CLI Administration and Template Management
// =============================================================================
//
// This file defines administrative configuration for metabob-cli activity
// template management, including:
//
// 1. Template authoring metadata (author, contributors, tags, license)
// 2. Validation rules for template quality and correctness
// 3. Documentation requirements (examples, failure modes, best practices)
// 4. Deployment strategies (immediate, gradual, canary, manual approval)
// 5. Lifecycle management (versioning, rollback, notifications)
//
// These administrative features support the CLI tooling for:
// - Template creation and registration
// - Quality gates before deployment
// - Safe rollout of new templates
// - Rollback on failures
// - Team collaboration and notifications
//
// =============================================================================

// =============================================================================
// AdminConfig - Top-level administrative configuration container
// =============================================================================
//
// Attached to activity templates to control authoring, validation, and
// deployment lifecycle. Used by metabob-cli for template management.
//
// Usage:
// - Set during template creation/registration
// - Consulted by CLI validation commands
// - Used by deployment pipeline for rollout strategy
// - Referenced for audit trails and governance
//
// Example:
// {
//   "authoring": {
//     "author": "jane@example.com",
//     "contributors": ["john@example.com"],
//     "tags": ["bug-fix", "production-ready"],
//     "license": "MIT"
//   },
//   "validation": {
//     "requiredFields": ["description", "task_steps", "validation"],
//     "customCommands": [
//       {
//         "name": "lint-template",
//         "command": "metabob template lint {{template_file}}",
//         "required": true
//       }
//     ]
//   },
//   "deployment": {
//     "strategy": "GRADUAL",
//     "notifications": {
//       "channels": ["#devbob-alerts"],
//       "events": ["DEPLOYED", "FAILED", "ROLLED_BACK"]
//     }
//   }
// }
//
// =============================================================================

message AdminConfig {
  // ==========================================================================
  // Authoring & Attribution
  // ==========================================================================
  
  // Template authorship and collaboration metadata
  AuthoringMetadata authoring = 1;
  
  // ==========================================================================
  // Quality Gates
  // ==========================================================================
  
  // Validation rules enforced before template registration
  ValidationRules validation = 2;
  
  // ==========================================================================
  // Documentation Requirements
  // ==========================================================================
  
  // Documentation metadata for template users
  DocumentationMetadata documentation = 3;
  
  // ==========================================================================
  // Deployment & Lifecycle
  // ==========================================================================
  
  // Deployment strategy and rollout configuration
  DeploymentConfig deployment = 4;
  
  // ==========================================================================
  // Audit Trail
  // ==========================================================================
  
  // When this admin config was created
  google.protobuf.Timestamp created_at = 5;
  
  // When this admin config was last modified
  google.protobuf.Timestamp updated_at = 6;
  
  // Who last modified this config
  string updated_by = 7;
}

// =============================================================================
// AuthoringMetadata - Template authorship and attribution
// =============================================================================
//
// Tracks who created and maintains a template, licensing information,
// and organizational tags for discovery and governance.
//
// Example:
// {
//   "author": "jane@example.com",
//   "contributors": ["john@example.com", "alice@example.com"],
//   "organization": "Engineering Platform Team",
//   "tags": ["bug-fix", "production-ready", "high-priority"],
//   "license": "MIT",
//   "repository": "https://github.com/org/metabob-templates",
//   "issueTracker": "https://github.com/org/metabob-templates/issues"
// }
//
// =============================================================================

message AuthoringMetadata {
  // ==========================================================================
  // Primary Attribution
  // ==========================================================================
  
  // Primary author/creator of this template (email or username)
  // Required for all templates in shared repositories
  string author = 1;
  
  // Additional contributors who have modified the template
  repeated string contributors = 2;
  
  // Organization or team that maintains this template
  optional string organization = 3;
  
  // ==========================================================================
  // Classification & Discovery
  // ==========================================================================
  
  // Tags for template discovery and categorization
  // Examples: "bug-fix", "feature", "refactoring", "production-ready"
  repeated string tags = 4;
  
  // Category for grouping related templates
  // Examples: "debugging", "api-development", "testing"
  optional string category = 5;
  
  // Maturity level: "experimental", "beta", "stable", "deprecated"
  string maturity = 6;
  
  // ==========================================================================
  // Legal & Compliance
  // ==========================================================================
  
  // License identifier (SPDX format preferred)
  // Examples: "MIT", "Apache-2.0", "GPL-3.0", "proprietary"
  string license = 7;
  
  // Copyright holder (if different from author)
  optional string copyright_holder = 8;
  
  // Year template was created
  int32 copyright_year = 9;
  
  // ==========================================================================
  // External References
  // ==========================================================================
  
  // Source repository URL for template development
  optional string repository = 10;
  
  // Issue tracker URL for bug reports and feature requests
  optional string issue_tracker = 11;
  
  // Documentation website or wiki
  optional string documentation_url = 12;
  
  // ==========================================================================
  // Contact & Support
  // ==========================================================================
  
  // Primary contact for questions/issues
  optional string contact_email = 13;
  
  // Slack channel for support
  optional string slack_channel = 14;
}

// =============================================================================
// ValidationRules - Quality gates for template registration
// =============================================================================
//
// Defines validation rules enforced by metabob-cli before a template
// can be registered or deployed. Ensures templates meet quality standards.
//
// Example:
// {
//   "requiredFields": [
//     "description",
//     "task_steps",
//     "validation",
//     "documentation.examples"
//   ],
//   "minTaskSteps": 1,
//   "maxTaskSteps": 20,
//   "requireValidation": true,
//   "requireDocumentation": true,
//   "customCommands": [
//     {
//       "name": "schema-validation",
//       "command": "metabob template validate-schema {{template_file}}",
//       "required": true,
//       "timeoutSeconds": 30,
//       "description": "Validate template against protobuf schema"
//     },
//     {
//       "name": "security-scan",
//       "command": "metabob template security-scan {{template_file}}",
//       "required": true,
//       "timeoutSeconds": 60,
//       "description": "Scan for security vulnerabilities in template"
//     }
//   ],
//   "forbiddenPatterns": [
//     "rm -rf /",
//     "eval",
//     "exec"
//   ]
// }
//
// =============================================================================

message ValidationRules {
  // ==========================================================================
  // Field Requirements
  // ==========================================================================
  
  // Field paths that must be present (dot notation)
  // Examples: "description", "task_steps[0].prompt", "documentation.examples"
  repeated string required_fields = 1;
  
  // Minimum number of task steps required
  int32 min_task_steps = 2;
  
  // Maximum number of task steps allowed
  int32 max_task_steps = 3;
  
  // Whether validation config must be present
  bool require_validation = 4;
  
  // Whether documentation must be present
  bool require_documentation = 5;
  
  // Whether examples must be provided
  bool require_examples = 6;
  
  // ==========================================================================
  // Content Validation
  // ==========================================================================
  
  // Patterns that must NOT appear in template
  // Examples: dangerous shell commands, hardcoded credentials
  repeated string forbidden_patterns = 7;
  
  // Patterns that MUST appear in template
  // Examples: license headers, required documentation sections
  repeated string required_patterns = 8;
  
  // Minimum description length (characters)
  int32 min_description_length = 9;
  
  // Minimum prompt length per task (characters)
  int32 min_prompt_length = 10;
  
  // ==========================================================================
  // Custom Validation Commands
  // ==========================================================================
  
  // Custom shell commands for validation
  // These are executed by metabob-cli before registration
  repeated TemplateValidationCommand custom_commands = 11;
  
  // ==========================================================================
  // Complexity Limits
  // ==========================================================================
  
  // Maximum nesting depth for task dependencies
  int32 max_dependency_depth = 12;
  
  // Maximum template file size (bytes)
  int32 max_file_size_bytes = 13;
  
  // Maximum combined prompt length across all tasks (characters)
  int32 max_total_prompt_length = 14;
}

// =============================================================================
// TemplateValidationCommand - Custom validation command for CLI
// =============================================================================
//
// Defines a shell command executed during template validation.
// Exit code 0 = pass, non-zero = fail.
//
// Example:
// {
//   "name": "lint-prompts",
//   "command": "metabob template lint-prompts {{template_file}}",
//   "required": true,
//   "timeoutSeconds": 30,
//   "description": "Check prompt quality and consistency"
// }
//
// =============================================================================

message TemplateValidationCommand {
  // Human-readable name for this validation
  string name = 1;
  
  // Shell command to execute (supports {{variable}} interpolation)
  // Variables available: template_file, template_dir, template_id
  string command = 2;
  
  // Whether this validation must pass for registration to succeed
  bool required = 3;
  
  // Timeout for command execution (seconds, default: 60)
  int32 timeout_seconds = 4;
  
  // Description of what this validation checks
  string description = 5;
  
  // Expected exit code for success (default: 0)
  int32 expected_exit_code = 6;
  
  // Working directory for command execution
  // If empty, uses template directory
  optional string working_directory = 7;
}

// =============================================================================
// DocumentationMetadata - Template documentation requirements
// =============================================================================
//
// Defines documentation that must be provided with a template to
// help users understand usage, limitations, and best practices.
//
// Example:
// {
//   "examples": [
//     {
//       "name": "Fix authentication bug",
//       "description": "Debug and fix JWT token expiration issue",
//       "variables": {
//         "bugDescription": "Users are logged out after 5 minutes",
//         "affectedFile": "src/auth/jwt.ts"
//       },
//       "expectedOutcome": "JWT token expiration extended to 24 hours"
//     }
//   ],
//   "failureModes": [
//     {
//       "scenario": "Missing test file",
//       "symptom": "Task fails with 'test file not found' error",
//       "resolution": "Ensure test file exists before running activity",
//       "preventionGuide": "Check for test file in pre-activity hook"
//     }
//   ],
//   "bestPractices": [
//     "Always commit changes after task completion",
//     "Run tests before marking activity as complete",
//     "Use specific file paths rather than glob patterns"
//   ],
//   "limitations": [
//     "Only works with TypeScript projects",
//     "Requires Jest testing framework",
//     "Not compatible with Windows paths"
//   ],
//   "prerequisites": [
//     "Git repository must be initialized",
//     "Node.js 18+ must be installed",
//     "npm dependencies must be installed"
//   ]
// }
//
// =============================================================================

message DocumentationMetadata {
  // ==========================================================================
  // Usage Examples
  // ==========================================================================
  
  // Concrete usage examples showing typical use cases
  repeated UsageExample examples = 1;
  
  // ==========================================================================
  // Failure Scenarios
  // ==========================================================================
  
  // Known failure modes and how to resolve them
  repeated FailureMode failure_modes = 2;
  
  // ==========================================================================
  // Guidance
  // ==========================================================================
  
  // Best practices for using this template
  repeated string best_practices = 3;
  
  // Known limitations or constraints
  repeated string limitations = 4;
  
  // Prerequisites that must be met before usage
  repeated string prerequisites = 5;
  
  // ==========================================================================
  // References
  // ==========================================================================
  
  // Related templates that users might find useful
  repeated string related_templates = 6;
  
  // External documentation references (URLs)
  repeated string external_references = 7;
  
  // Changelog or version history notes
  repeated string changelog = 8;
}

// =============================================================================
// UsageExample - Concrete example of template usage
// =============================================================================
//
// Shows how to use the template with specific input variables and
// expected outcomes. Helps users understand template capabilities.
//
// Example:
// {
//   "name": "Fix API timeout bug",
//   "description": "Debug and fix timeout in user profile API endpoint",
//   "variables": {
//     "bugDescription": "API times out when loading user with many posts",
//     "affectedEndpoint": "/api/users/:id/profile",
//     "errorMessage": "Request timeout after 30 seconds"
//   },
//   "expectedOutcome": "API response time reduced to <2 seconds with pagination",
//   "difficulty": "moderate",
//   "estimatedDuration": "15-30 minutes"
// }
//
// =============================================================================

message UsageExample {
  // Human-readable example name
  string name = 1;
  
  // Detailed description of the scenario
  string description = 2;
  
  // Input variables for this example
  map<string, string> variables = 3;
  
  // What the user should expect as outcome
  string expected_outcome = 4;
  
  // Difficulty level: "simple", "moderate", "complex"
  optional string difficulty = 5;
  
  // Estimated time to complete (human-readable)
  optional string estimated_duration = 6;
  
  // Additional notes or tips for this example
  optional string notes = 7;
}

// =============================================================================
// FailureMode - Known failure scenario and resolution
// =============================================================================
//
// Documents a known way the template can fail, along with diagnostic
// information and resolution steps. Helps users troubleshoot issues.
//
// Example:
// {
//   "scenario": "Missing configuration file",
//   "symptom": "Activity fails at task 2 with 'config.json not found'",
//   "resolution": "Create config.json in project root with default settings",
//   "preventionGuide": "Add pre-activity validation to check for config.json",
//   "frequency": "common",
//   "severity": "low"
// }
//
// =============================================================================

message FailureMode {
  // What situation causes this failure
  string scenario = 1;
  
  // Observable symptoms of this failure
  string symptom = 2;
  
  // How to fix this failure when it occurs
  string resolution = 3;
  
  // How to prevent this failure from occurring
  optional string prevention_guide = 4;
  
  // How often this occurs: "rare", "occasional", "common"
  optional string frequency = 5;
  
  // Impact severity: "low", "medium", "high", "critical"
  optional string severity = 6;
  
  // Error messages associated with this failure
  repeated string error_patterns = 7;
}

// =============================================================================
// DeploymentConfig - Deployment strategy and rollout configuration
// =============================================================================
//
// Controls how new templates (or template updates) are rolled out to
// production environments. Supports gradual rollouts, canary deployments,
// and rollback procedures.
//
// Example:
// {
//   "strategy": "GRADUAL",
//   "rollback": {
//     "enabled": true,
//     "triggerOnFailureRate": 0.5,
//     "minExecutionsBeforeRollback": 10,
//     "automaticRollback": true,
//     "notifyOnRollback": true
//   },
//   "notifications": {
//     "enabled": true,
//     "channels": ["#devbob-deployments", "platform-team@example.com"],
//     "events": ["DEPLOYED", "FAILED", "ROLLED_BACK"],
//     "includeMetrics": true
//   },
//   "approvalRequired": true,
//   "approvers": ["jane@example.com", "john@example.com"],
//   "deploymentWindow": {
//     "allowedDays": ["monday", "tuesday", "wednesday", "thursday"],
//     "allowedHoursUtc": {"start": 10, "end": 16}
//   }
// }
//
// =============================================================================

message DeploymentConfig {
  // ==========================================================================
  // Deployment Strategy
  // ==========================================================================
  
  // Rollout strategy for new template versions
  DeploymentStrategy strategy = 1;
  
  // Percentage of traffic for gradual rollout (0.0-1.0)
  // Only used when strategy = GRADUAL
  // Example: 0.1 = start with 10% traffic
  double initial_traffic_percentage = 2;
  
  // Traffic increase per stage for gradual rollout
  // Example: 0.2 = increase by 20% each stage
  double traffic_increment = 3;
  
  // Time to wait between rollout stages (hours)
  int32 stage_duration_hours = 4;
  
  // ==========================================================================
  // Rollback Configuration
  // ==========================================================================
  
  // Rollback settings for failed deployments
  RollbackConfig rollback = 5;
  
  // ==========================================================================
  // Notifications
  // ==========================================================================
  
  // Notification settings for deployment events
  NotificationConfig notifications = 6;
  
  // ==========================================================================
  // Approval & Governance
  // ==========================================================================
  
  // Whether manual approval is required before deployment
  bool approval_required = 7;
  
  // Email addresses or usernames of approved deployers
  repeated string approvers = 8;
  
  // Minimum number of approvals required (default: 1)
  int32 min_approvals = 9;
  
  // ==========================================================================
  // Deployment Windows
  // ==========================================================================
  
  // Days of week when deployment is allowed
  // Examples: "monday", "tuesday", "wednesday", "thursday", "friday"
  repeated string allowed_days = 10;
  
  // UTC hours when deployment is allowed (24-hour format)
  // Example: {"start": 10, "end": 16} = 10am-4pm UTC
  DeploymentWindow allowed_hours_utc = 11;
  
  // ==========================================================================
  // Metadata
  // ==========================================================================
  
  // Last deployment timestamp
  google.protobuf.Timestamp last_deployed_at = 12;
  
  // Who performed the last deployment
  string last_deployed_by = 13;
}

// =============================================================================
// DeploymentStrategy - Rollout strategy options
// =============================================================================
//
// Defines how new template versions are rolled out to users.
//
// IMMEDIATE:
//   - Deploy to 100% of traffic immediately
//   - Use for bug fixes and low-risk changes
//
// GRADUAL:
//   - Start with small percentage (e.g., 10%)
//   - Gradually increase over time (e.g., 10% → 25% → 50% → 100%)
//   - Monitor metrics at each stage
//   - Use for medium-risk changes
//
// CANARY:
//   - Deploy to small test group first (e.g., 5%)
//   - Monitor extensively before wider rollout
//   - Use for high-risk or experimental changes
//
// MANUAL_APPROVAL:
//   - Hold at each stage until manually approved
//   - Use for critical templates or compliance requirements
//
// =============================================================================

enum DeploymentStrategy {
  DEPLOYMENT_STRATEGY_UNSPECIFIED = 0;
  
  // Deploy immediately to all users
  DEPLOYMENT_STRATEGY_IMMEDIATE = 1;
  
  // Gradual rollout with automatic progression
  DEPLOYMENT_STRATEGY_GRADUAL = 2;
  
  // Canary deployment with extensive monitoring
  DEPLOYMENT_STRATEGY_CANARY = 3;
  
  // Manual approval required at each stage
  DEPLOYMENT_STRATEGY_MANUAL_APPROVAL = 4;
}

// =============================================================================
// DeploymentWindow - Time window for allowed deployments
// =============================================================================

message DeploymentWindow {
  // Start hour (0-23, UTC)
  int32 start_hour = 1;
  
  // End hour (0-23, UTC)
  int32 end_hour = 2;
}

// =============================================================================
// RollbackConfig - Automatic rollback configuration
// =============================================================================
//
// Defines when and how to automatically rollback a failed deployment.
//
// Example:
// {
//   "enabled": true,
//   "triggerOnFailureRate": 0.5,
//   "minExecutionsBeforeRollback": 10,
//   "automaticRollback": true,
//   "notifyOnRollback": true,
//   "rollbackToVersion": "previous",
//   "preserveMetrics": true
// }
//
// =============================================================================

message RollbackConfig {
  // Whether automatic rollback is enabled
  bool enabled = 1;
  
  // Failure rate threshold for triggering rollback (0.0-1.0)
  // Example: 0.5 = rollback if >50% of executions fail
  double trigger_on_failure_rate = 2;
  
  // Minimum executions before considering rollback
  // Prevents rollback based on insufficient data
  int32 min_executions_before_rollback = 3;
  
  // Whether to rollback automatically or require manual confirmation
  bool automatic_rollback = 4;
  
  // Whether to send notifications when rollback occurs
  bool notify_on_rollback = 5;
  
  // Target version for rollback: "previous", "stable", "specific"
  string rollback_to_version = 6;
  
  // Specific version to rollback to (if rollback_to_version = "specific")
  optional string target_version_id = 7;
  
  // Whether to preserve metrics from failed version
  bool preserve_metrics = 8;
  
  // Maximum time to wait before automatic rollback (seconds)
  int32 max_wait_seconds = 9;
}

// =============================================================================
// NotificationConfig - Notification settings for deployment events
// =============================================================================
//
// Configures how and where to send notifications about template
// deployment lifecycle events.
//
// Example:
// {
//   "enabled": true,
//   "channels": [
//     "#devbob-deployments",
//     "platform-team@example.com",
//     "slack://webhook-url"
//   ],
//   "events": [
//     "DEPLOYED",
//     "FAILED",
//     "ROLLED_BACK",
//     "PROMOTED"
//   ],
//   "includeMetrics": true,
//   "includeErrorDetails": true,
//   "notifyOnSuccess": true,
//   "notifyOnFailure": true
// }
//
// =============================================================================

message NotificationConfig {
  // Whether notifications are enabled
  bool enabled = 1;
  
  // Notification channels (Slack, email, webhook URLs)
  // Examples:
  //   - "#devbob-alerts" (Slack channel)
  //   - "team@example.com" (email)
  //   - "https://hooks.slack.com/..." (webhook)
  repeated string channels = 2;
  
  // Events to notify about
  // Valid events: "DEPLOYED", "FAILED", "ROLLED_BACK", "PROMOTED",
  //               "DEPRECATED", "ARCHIVED", "APPROVED", "REJECTED"
  repeated string events = 3;
  
  // Whether to include performance metrics in notifications
  bool include_metrics = 4;
  
  // Whether to include error details in failure notifications
  bool include_error_details = 5;
  
  // Whether to notify on successful deployments
  bool notify_on_success = 6;
  
  // Whether to notify on failed deployments
  bool notify_on_failure = 7;
  
  // Minimum severity level for notifications: "info", "warning", "error", "critical"
  string min_severity = 8;
  
  // Custom message template for notifications (supports variables)
  optional string message_template = 9;
}
