syntax = "proto3";

package metabob.common;

option go_package = "github.com/metabobproject/metabob-proto/gen/go/metabob/common";

import "google/protobuf/timestamp.proto";

// =============================================================================
// Common Types
// =============================================================================

// Status for entities that go through a lifecycle
enum EntityStatus {
  ENTITY_STATUS_UNSPECIFIED = 0;
  ENTITY_STATUS_DRAFT = 1;
  ENTITY_STATUS_TESTING = 2;
  ENTITY_STATUS_ACTIVE = 3;
  ENTITY_STATUS_DEPRECATED = 4;
}

// Evolution type for genealogy tracking
enum EvolutionType {
  EVOLUTION_TYPE_UNSPECIFIED = 0;
  EVOLUTION_TYPE_ROOT = 1;       // Original/seed entity
  EVOLUTION_TYPE_DERIVED = 2;    // Single parent evolution
  EVOLUTION_TYPE_MERGED = 3;     // Multiple parent merge
  EVOLUTION_TYPE_REFINED = 4;    // Same structure, improved content
  EVOLUTION_TYPE_SPLIT = 5;      // Split from parent into focused variant
}

// Category for activities
enum ActivityCategory {
  ACTIVITY_CATEGORY_UNSPECIFIED = 0;
  ACTIVITY_CATEGORY_FEATURE = 1;
  ACTIVITY_CATEGORY_BUGFIX = 2;
  ACTIVITY_CATEGORY_REFACTOR = 3;
  ACTIVITY_CATEGORY_TOOL = 4;
  ACTIVITY_CATEGORY_META = 5;       // Meta-activities (create/evolve activities)
}

// Genealogy tracking for content-addressable entities
message Genealogy {
  // SHA-256 hash of entity content (first 16 hex chars)
  string content_hash = 1;
  
  // Parent's content hash (null for root entities)
  optional string parent_hash = 2;
  
  // Chain of ancestor hashes from root to parent
  repeated string lineage = 3;
  
  // How this entity was created
  EvolutionType evolution_type = 4;
  
  // Human-readable note about the evolution
  string evolution_note = 5;
}

// Timestamps for entity lifecycle
message Timestamps {
  google.protobuf.Timestamp created_at = 1;
  google.protobuf.Timestamp updated_at = 2;
}

// Token usage breakdown
message TokenUsage {
  int32 input_tokens = 1;
  int32 output_tokens = 2;
  int32 cache_tokens = 3;
  int32 total_tokens = 4;
}

// Cost breakdown in USD
message Cost {
  double input_cost = 1;
  double output_cost = 2;
  double cache_cost = 3;
  double total_cost = 4;
}
