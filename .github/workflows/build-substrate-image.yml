name: Build & publish substrate image

# Publishes ghcr.io/<owner>/substrate:dev so a human/hub can `docker pull` instead of a
# 20-30 min clone+build. Requires a repo secret SUBSTRATE_GIT_PAT (repo:read) to fetch the
# private submodules; ghcr push uses the built-in GITHUB_TOKEN (packages: write).
#
# ghcr images are PRIVATE (anonymous pull -> 401). To keep the PUBLIC Docker Hub tag
# avigopal/substrate:dev current on every dev push, set two OPTIONAL repo secrets:
#   DOCKERHUB_USERNAME  - Docker Hub account with push access to avigopal/substrate
#   DOCKERHUB_TOKEN     - a Docker Hub access token (used as the login password)
# When both are absent (e.g. external forks) the Docker Hub login + tags are skipped and
# only ghcr is published, so the job never fails for lack of Docker Hub credentials.
on:
  push:
    branches: [dev]
    paths:
      - 'Dockerfile.substrate'
      - 'repos/**'
      - 'scripts/substrate/**'
      - '.github/workflows/build-substrate-image.yml'
  workflow_dispatch: {}

concurrency:
  group: substrate-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # GitHub forbids secrets directly in step-level `if`, so mirror the presence of the
      # Docker Hub token into a non-secret env flag and gate the DH steps on it.
      HAS_DH: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Checkout super-repo (no submodules yet)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init submodules (minus metabob-mcp — different org, not baked)
        env:
          PAT: ${{ secrets.SUBSTRATE_GIT_PAT }}
        run: |
          git config --global "url.https://x-access-token:${PAT}@github.com/.insteadOf" "git@github.com:"
          git config --global --add "url.https://x-access-token:${PAT}@github.com/.insteadOf" "https://github.com/"
          paths=$(git config -f .gitmodules --get-regexp '\.path$' | awk '{print $2}' | grep -v 'metabob-mcp')
          git submodule update --init $paths
          git submodule foreach 'git reset --hard HEAD >/dev/null 2>&1 || true' || true

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        # Skipped when DOCKERHUB_TOKEN is unset (external forks) — keeps ghcr-only publish working.
        if: env.HAS_DH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute lowercase image owner
        id: img
        # ghcr rejects mixed-case repository names ("AviGopal" -> "avigopal").
        # github.repository_owner preserves the account's original casing, so
        # lowercase it here rather than in the tag interpolation (which can't).
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Compute image tags (ghcr always; Docker Hub only when creds present)
        id: tags
        env:
          OWNER: ${{ steps.img.outputs.owner }}
          SHA: ${{ github.sha }}
        run: |
          {
            echo 'tags<<EOF'
            echo "ghcr.io/${OWNER}/substrate:dev"
            echo "ghcr.io/${OWNER}/substrate:${SHA}"
            if [ "${HAS_DH}" = "true" ]; then
              echo "avigopal/substrate:dev"
              echo "avigopal/substrate:${SHA}"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.substrate
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
