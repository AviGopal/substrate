name: Build & publish substrate image

# Publishes ghcr.io/<owner>/substrate:dev so a human/hub can `docker pull` instead of a
# 20-30 min clone+build. Requires a repo secret SUBSTRATE_GIT_PAT (repo:read) to fetch the
# private submodules; ghcr push uses the built-in GITHUB_TOKEN (packages: write).
#
# The ghcr package is PUBLIC — `docker pull ghcr.io/<owner>/substrate:dev` needs no
# credentials (verified with an empty docker config: the manifest and layer blobs both
# fetch anonymously). It was private once, and this comment said so long after it
# stopped being true. To keep the PUBLIC Docker Hub tag
# avigopal/substrate:dev current on every dev push, set two OPTIONAL repo secrets:
#   DOCKERHUB_USERNAME  - Docker Hub account with push access to avigopal/substrate
#   DOCKERHUB_TOKEN     - a Docker Hub access token (used as the login password)
# When both are absent (e.g. external forks) the Docker Hub login + tags are skipped and
# only ghcr is published, so the job never fails for lack of Docker Hub credentials.
on:
  push:
    branches: [dev]
    # The image bakes the launch manifest (docker-compose.yml, printed by
    # `substrate-manifest`), so a manifest edit must publish or the baked copy goes
    # stale. README.md is the install page: install-acceptance.yml judges each published
    # digest against the page at the commit it was built from, so an install page edit
    # publishes too, and the edited page is judged with no later push needed.
    paths:
      - 'Dockerfile.substrate'
      - 'docker-compose.yml'
      - 'README.md'
      - 'repos/**'
      - 'scripts/substrate/**'
      - '.github/workflows/build-substrate-image.yml'
  workflow_dispatch: {}
  # A scheduled submodule bump pushes its gitlink commit with the default GITHUB_TOKEN,
  # and GitHub never fires `push:` for a GITHUB_TOKEN push, so a bump that moved pointers
  # used to publish nothing until the next unrelated push or the nightly. Its completion
  # is an ordinary event, though, so the build follows it here. The `gate` job below
  # builds only when dev moved during that run; a bump called from the nightly is not a
  # separate run and does not fire this (the nightly builds for itself).
  workflow_run:
    workflows: ["Bump submodule pointers"]
    types: [completed]
  # Callable so the nightly build can reconcile branch heads first and then
  # build the reconciled commit in the same run. `ref` is required because a
  # bump pushed during that run is NEWER than the caller's github.sha; building
  # the caller's SHA would rebuild the pre-bump tree.
  workflow_call:
    inputs:
      ref:
        description: 'Commit-ish to build. Defaults to the caller ref.'
        type: string
        required: false
      extra_tag:
        description: 'Additional tag to publish alongside :dev and :<sha> (e.g. "nightly").'
        type: string
        required: false

concurrency:
  # A nightly run reconciles then builds, so it must not be cancelled by the
  # push event its own bump commit generates. Keyed on the run, not the ref,
  # when called — `cancel-in-progress` on a shared ref group would let the
  # push-triggered build kill the nightly mid-build.
  #
  # A run that follows a bump shares the dev group but never cancels: it arrives
  # whether or not the bump moved anything, and a no-op bump must not kill a push
  # build in flight. It waits its turn instead, and a later push still cancels it,
  # so the newest dev head is the one that ends up as :dev.
  group: substrate-image-${{ github.workflow }}-${{ github.event_name == 'workflow_call' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' && github.event_name != 'workflow_run' }}

jobs:
  # Decide whether there is anything to build. Every trigger builds, except a completed
  # bump that pushed nothing: dev still sits where that run started, so the tree is one
  # :dev was already built from. The commit is pinned here so the build publishes the
  # tree this decision was made about, not whatever lands on dev in between.
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
      ref: ${{ steps.decide.outputs.ref }}
    steps:
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          RUN_HEAD: ${{ github.event.workflow_run.head_sha || '' }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "workflow_run" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "ref=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$RUN_CONCLUSION" != "success" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"; echo "ref=" >> "$GITHUB_OUTPUT"
            echo "The bump run did not succeed (${RUN_CONCLUSION}); nothing to build." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/dev" --jq .sha)"
          if [ "$head" = "$RUN_HEAD" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"; echo "ref=" >> "$GITHUB_OUTPUT"
            echo "The bump moved no pointer (dev is still ${head:0:10}); nothing to build." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "ref=${head}" >> "$GITHUB_OUTPUT"
            echo "dev moved ${RUN_HEAD:0:10} -> ${head:0:10} during the bump; building ${head:0:10}." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      built_sha: ${{ steps.tags.outputs.built_sha }}
    env:
      # GitHub forbids secrets directly in step-level `if`, so mirror the presence of the
      # Docker Hub token into a non-secret env flag and gate the DH steps on it.
      HAS_DH: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Checkout super-repo (no submodules yet)
        uses: actions/checkout@v4
        with:
          submodules: false
          # Empty string is falsy in this expression, so an uncalled run keeps
          # checkout's default (the triggering ref) exactly as before. A build that
          # follows a bump builds the commit the gate saw.
          ref: ${{ inputs.ref || needs.gate.outputs.ref || '' }}

      - name: Init submodules (minus metabob-mcp — different org, not baked)
        env:
          PAT: ${{ secrets.SUBSTRATE_GIT_PAT }}
        run: |
          git config --global "url.https://x-access-token:${PAT}@github.com/.insteadOf" "git@github.com:"
          git config --global --add "url.https://x-access-token:${PAT}@github.com/.insteadOf" "https://github.com/"
          set -uo pipefail
          paths=$(git config -f .gitmodules --get-regexp '\.path$' | awk '{print $2}' | grep -v 'metabob-mcp')

          # ★ AN UNPUSHED GITLINK MUST NAME ITSELF, not fail as "exit code 128".
          #
          # A super-repo commit can point a submodule at a commit that exists
          # only on someone's laptop. `git submodule update --init` then dies
          # with "not our ref <sha>" partway through the list, and the job
          # reports a bare exit 128 — the reader cannot tell which submodule,
          # which commit, or that the cause is unpushed work rather than a
          # credential or network fault.
          #
          # Observed 2026-08-19: repos/identity-vessel pinned to 318a9b22,
          # never pushed to its remote. EVERY image build failed here for days
          # while the error said nothing about which repo or why.
          #
          # Init one at a time so a failure is attributable, and report all of
          # them rather than stopping at the first.
          failed=""
          for p in $paths; do
            if ! out=$(git submodule update --init "$p" 2>&1); then
              want=$(git ls-tree HEAD "$p" | awk '{print $3}')
              echo "::error::submodule ${p}: cannot fetch pinned commit ${want}. It is almost certainly UNPUSHED — the super-repo references a commit that exists on no remote. Push it from the clone that has it, or move the gitlink to a commit that is on the remote."
              echo "$out" | sed 's/^/    /'
              failed="${failed}${p} (${want:0:10})\n"
            fi
          done
          if [ -n "$failed" ]; then
            {
              echo "### Submodule init failed"
              echo ""
              echo "These gitlinks point at commits no remote has:"
              echo ""
              printf '%b' "$failed"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          git submodule foreach 'git reset --hard HEAD >/dev/null 2>&1 || true' || true

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        # Skipped when DOCKERHUB_TOKEN is unset (external forks) — keeps ghcr-only publish working.
        if: env.HAS_DH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute lowercase image owner
        id: img
        # ghcr rejects mixed-case repository names ("AviGopal" -> "avigopal").
        # github.repository_owner preserves the account's original casing, so
        # lowercase it here rather than in the tag interpolation (which can't).
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Compute image tags (ghcr always; Docker Hub only when creds present)
        id: tags
        env:
          OWNER: ${{ steps.img.outputs.owner }}
          EXTRA_TAG: ${{ inputs.extra_tag || '' }}
          GATES_DEV: ${{ vars.INSTALL_ACCEPTANCE_GATES_DEV || '' }}
          HAS_ACCEPTANCE_KEY: ${{ secrets.ACCEPTANCE_PROVIDER_KEY != '' }}
        run: |
          set -euo pipefail
          # Tag with the CHECKED-OUT commit, not github.sha. On a workflow_call
          # github.sha is the CALLER's commit, which on a nightly run predates
          # the bump this build exists to publish — so :<sha> would name a tree
          # that was never built. Ask git what is actually in the working
          # directory instead of trusting the event context.
          SHA=$(git rev-parse HEAD)
          {
            echo "built_sha=${SHA}"
            # The image's own record of what it was built from (OCI labels and
            # /etc/substrate/image-revision, declared in Dockerfile.substrate). The
            # date is the commit time, not the wall clock: the same commit yields the
            # same value, so the build-arg does not defeat the layer cache on a rebuild.
            echo "created=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ HEAD)"
            # The commit each vessel was baked from, as "name=sha" pairs, so the
            # verdict can say which vessels pull-sync has since moved. Read from the
            # gitlinks of the built commit, not from the checkouts.
            echo "vessel_revisions=$(git ls-tree HEAD repos/ | awk '$2 == "commit" { sub(/^repos\//, "", $4); printf "%s=%s ", $4, $3 }')"
          } >> "$GITHUB_OUTPUT"
          # The publishing switch (install-acceptance.yml). When the acceptance run
          # gates :dev, this build publishes only :<sha> and the acceptance workflow
          # moves :dev to the digest it judged. Unset, :dev publishes here as always.
          # The switch holds only while the acceptance run has its provider key: with
          # no key no run can pass in gating mode, and :dev would never move again.
          PUBLISH_DEV=true
          if [ "${GATES_DEV}" = "true" ]; then
            if [ "${HAS_ACCEPTANCE_KEY}" = "true" ]; then
              PUBLISH_DEV=false
              echo "::notice::dev is gated by install acceptance; this build publishes :${SHA} only."
            else
              echo "::warning::INSTALL_ACCEPTANCE_GATES_DEV is set but ACCEPTANCE_PROVIDER_KEY is not; publishing :dev ungated."
            fi
          fi
          {
            echo "promote_dev=${PUBLISH_DEV}"
            # Only immutable tags are pushed by the build. :dev moves to the digest
            # in a later step, after that digest has been run and checked, so a
            # build that cannot start never becomes :dev.
            echo 'tags<<EOF'
            echo "ghcr.io/${OWNER}/substrate:${SHA}"
            if [ -n "${EXTRA_TAG}" ]; then
              echo "ghcr.io/${OWNER}/substrate:${EXTRA_TAG}"
            fi
            if [ "${HAS_DH}" = "true" ]; then
              echo "avigopal/substrate:${SHA}"
              if [ -n "${EXTRA_TAG}" ]; then
                echo "avigopal/substrate:${EXTRA_TAG}"
              fi
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.substrate
          # ★ `target` IS LOAD-BEARING. Dockerfile.substrate ends with
          # `FROM base AS substrate-obsidian` (the noVNC/Xvfb desktop flavour),
          # and buildkit builds the LAST stage when no target is named. This
          # step carried no target, so EVERY image ever published as :dev was
          # the obsidian build — shipping Xvfb, x11vnc, fluxbox, novnc and
          # websockify in the tag documented as "fleet only". Verified on the
          # published image: /usr/share/novnc exists in ghcr :dev.
          #
          # The Makefile's local build has always passed `--target base` and
          # says why in a comment; CI and the Makefile disagreed, and CI is the
          # one that publishes. Naming the stage explicitly also stops a future
          # stage appended to the Dockerfile from silently becoming :dev.
          target: base
          # ★ DOCKER-FORMAT MANIFESTS, SO THE HEALTHCHECK SURVIVES PODMAN.
          # build-push-action attaches a provenance attestation by default, and an
          # attestation forces an OCI image index with OCI manifests. Podman reads an
          # OCI image's config through the OCI schema, which has no healthcheck field,
          # so HEALTHCHECK is silently dropped: the config blob of the published :dev
          # carries it, and `podman image inspect` of the same pull reports it null.
          # Every Podman fleet has run with no healthcheck for that reason. So: no
          # attestations, and the registry exporter with Docker media types. Docker
          # reads both formats; only Podman needed the change.
          provenance: false
          sbom: false
          outputs: type=registry,oci-mediatypes=false
          build-args: |
            IMAGE_REVISION=${{ steps.tags.outputs.built_sha }}
            IMAGE_CREATED=${{ steps.tags.outputs.created }}
            IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}
            VESSEL_REVISIONS=${{ steps.tags.outputs.vessel_revisions }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The obsidian flavour, published as a SEPARATE tag rather than as a
      # side effect of stage ordering. docs/SUBSTRATE.md has always described
      # `:obsidian` as a published tag; until now it 404'd, because the stage
      # it names was being published as `:dev` instead.
      #
      # Same cache, so this reuses every layer the base build just produced —
      # substrate-obsidian is `FROM base`, so only its own layers are new.
      - name: Build & push the obsidian flavour
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.substrate
          target: substrate-obsidian
          # Same format and revision record as the base image, for the same reasons.
          provenance: false
          sbom: false
          outputs: type=registry,oci-mediatypes=false
          build-args: |
            IMAGE_REVISION=${{ steps.tags.outputs.built_sha }}
            IMAGE_CREATED=${{ steps.tags.outputs.created }}
            IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}
            VESSEL_REVISIONS=${{ steps.tags.outputs.vessel_revisions }}
          tags: ghcr.io/${{ steps.img.outputs.owner }}/substrate:obsidian
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # THE BAKED MANIFEST IS THE TRACKED MANIFEST. The Dockerfile's own check only
      # proves the printing path prints what was copied in; this one runs the
      # published digest's `substrate-manifest` and compares it byte for byte with
      # the docker-compose.yml of the commit it was built from. A difference fails
      # the job before the digest is handed to the acceptance run. The printed
      # manifest is attached to the run, so each digest's manifest can be fetched
      # without pulling the image.
      - name: Attach and check the baked launch manifest
        env:
          OWNER: ${{ steps.img.outputs.owner }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p manifest
          IMG="ghcr.io/${OWNER}/substrate@${DIGEST}"
          docker pull -q "$IMG" >/dev/null
          # Docker refuses images deeper than about 125 layers; stay far below it.
          LAYERS=$(docker image inspect --format '{{len .RootFS.Layers}}' "$IMG")
          if [ "$LAYERS" -gt 100 ]; then
            echo "::error::${IMG} has ${LAYERS} layers; Docker cannot run images deeper than about 125. Flatten the published stage."
            exit 1
          fi
          echo "Layers: ${LAYERS}." >> "$GITHUB_STEP_SUMMARY"
          docker run --rm --entrypoint substrate-manifest "$IMG" > manifest/docker-compose.yml
          if ! cmp -s manifest/docker-compose.yml docker-compose.yml; then
            echo "::error::substrate-manifest in ghcr.io/${OWNER}/substrate@${DIGEST} differs from the tracked docker-compose.yml"
            diff -u docker-compose.yml manifest/docker-compose.yml || true
            exit 1
          fi
          echo "The launch manifest baked into \`${DIGEST}\` is byte-identical to the tracked docker-compose.yml." >> "$GITHUB_STEP_SUMMARY"
      - name: Promote the checked digest to :dev
        if: steps.tags.outputs.promote_dev == 'true'
        env:
          OWNER: ${{ steps.img.outputs.owner }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "ghcr.io/${OWNER}/substrate:dev" "ghcr.io/${OWNER}/substrate@${DIGEST}"
          if [ "${HAS_DH}" = "true" ]; then
            docker buildx imagetools create -t "avigopal/substrate:dev" "ghcr.io/${OWNER}/substrate@${DIGEST}"
          fi
          echo "Promoted \`${DIGEST}\` to :dev after it ran." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: launch-manifest
          path: manifest/docker-compose.yml
          retention-days: 90

      # Hand the judged artifact to install-acceptance.yml, which follows this run
      # (workflow_run) and needs the exact digest, not a tag that may have moved.
      - name: Record the published digest
        env:
          OWNER: ${{ steps.img.outputs.owner }}
          DIGEST: ${{ steps.push.outputs.digest }}
          SHA: ${{ steps.tags.outputs.built_sha }}
        run: |
          set -euo pipefail
          mkdir -p published
          jq -n --arg repo "ghcr.io/${OWNER}/substrate" --arg digest "$DIGEST" --arg sha "$SHA" \
            '{repository: $repo, digest: $digest, revision: $sha}' > published/published-image.json
          cat published/published-image.json
          echo "Published \`ghcr.io/${OWNER}/substrate@${DIGEST}\` from \`${SHA}\`." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: published-image
          path: published/published-image.json
          retention-days: 30
