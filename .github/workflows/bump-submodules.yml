name: Bump submodule pointers

# Cheap currentness mechanism for this repo's submodule pointers. Each submodule
# tracks a `branch` in .gitmodules (almost always `dev`); this job asks each
# submodule's remote for the latest commit on that branch via `git ls-remote`
# (no submodule checkout, no clone) and fast-forwards the gitlink if it moved.
# Runs on a schedule so pointer staleness is bounded by the cron cadence, not by
# an operator remembering to run `git submodule update --remote` on a laptop —
# this workflow is the mechanism, not a doc describing one a human should run.
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}
  # Callable so the nightly dev build can reconcile branch heads and then build
  # the result IN ONE RUN. Chaining is not optional: this job pushes with the
  # default GITHUB_TOKEN, and GitHub's recursion guard means a GITHUB_TOKEN push
  # never triggers another workflow's `push:` trigger. Without an explicit call,
  # a bump that moves pointers produces no image.
  workflow_call: {}

concurrency:
  group: bump-submodules
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      # Did any gitlink actually move? The nightly build reads this to decide
      # whether there is anything new to build.
      changed: ${{ steps.bump.outputs.changed }}
      # The commit a caller should build. When this job pushes a bump, it is the
      # bump commit — NOT the SHA the caller started from, which is already
      # stale by then. Empty when nothing moved.
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - name: Checkout super-repo (no submodules)
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Authenticate git for submodule remotes
        env:
          PAT: ${{ secrets.SUBSTRATE_GIT_PAT }}
        run: |
          git config --global "url.https://x-access-token:${PAT}@github.com/.insteadOf" "git@github.com:"
          git config --global --add "url.https://x-access-token:${PAT}@github.com/.insteadOf" "https://github.com/"

      - name: Resolve latest dev commit per submodule and update gitlinks
        id: bump
        run: |
          set -euo pipefail
          changed=0
          summary=""
          resolved=0
          skipped=0
          skiplist=""
          # One line per submodule: "<path> <url> <branch>"
          paths=$(git config -f .gitmodules --get-regexp '\.path$' | awk '{print $2}')
          for path in $paths; do
            # Section names in .gitmodules are the submodule name, which is not
            # always the trailing path segment; look it up properly instead.
            name=$(git config -f .gitmodules --get-regexp "^submodule\..*\.path$" \
              | awk -v p="$path" '$2==p {print $1}' | sed -E 's/^submodule\.(.*)\.path$/\1/')
            url=$(git config -f .gitmodules --get "submodule.${name}.url")
            branch=$(git config -f .gitmodules --get "submodule.${name}.branch" || echo "dev")

            # RESOLVE RELATIVE URLS. Every submodule here is declared relative
            # ("../concept-db.git") — the portable form, which git resolves
            # against the SUPERPROJECT'S REMOTE during a clone. `git ls-remote`
            # has no superproject context, so it resolved them against the
            # working directory, failed with "does not appear to be a git
            # repository", and `|| true` swallowed it. Every submodule then
            # "skipped", the resolved==0 guard fired, and the job reported a
            # CREDENTIAL failure for what was a URL-resolution bug — sending
            # anyone who read it to check PAT grants that were never the cause.
            #
            # Measured 2026-08-19: 0 of 18 resolved on every scheduled run,
            # while `git ls-remote https://github.com/AviGopal/concept-db.git`
            # answered instantly and unauthenticated.
            case "$url" in
              ../*|./*)
                # Resolve against this repo's own origin, which is what git
                # itself would have done at clone time.
                base=$(git config --get remote.origin.url)
                base=${base%.git}
                rel=$url
                # Each leading "../" climbs one path segment off the base.
                while :; do
                  case "$rel" in
                    ../*) base=${base%/*}; rel=${rel#../} ;;
                    ./*)  rel=${rel#./} ;;
                    *)    break ;;
                  esac
                done
                url="${base}/${rel}"
                ;;
            esac

            # Do NOT swallow the error: a failed lookup must be distinguishable
            # from a repo that has no such branch. Capture stderr for the log.
            if ! ls_out=$(git ls-remote "$url" "refs/heads/${branch}" 2>&1); then
              echo "::warning::skip ${path}: ls-remote failed on ${url} — ${ls_out}"
              remote_sha=""
            else
              remote_sha=$(printf '%s' "$ls_out" | cut -f1)
            fi
            if [ -z "$remote_sha" ]; then
              echo "::warning::skip ${path}: could not resolve ${branch} on ${url} (cross-org PAT scope or transient network failure)"
              skipped=$((skipped + 1))
              skiplist="${skiplist}- ${path} (${branch} on ${url})\n"
              continue
            fi
            resolved=$((resolved + 1))

            local_sha=$(git ls-tree HEAD "$path" | awk '{print $3}')
            if [ "$local_sha" != "$remote_sha" ]; then
              git update-index --cacheinfo 160000,"$remote_sha","$path"
              echo "  ${path}: ${local_sha:0:7} -> ${remote_sha:0:7} (${branch})"
              summary="${summary}- ${path}: ${local_sha:0:7} -> ${remote_sha:0:7}\n"
              changed=1
            fi
          done
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
          printf '%b' "$summary" > /tmp/bump-summary.txt

          # A green run that resolved NOTHING is the worst outcome this workflow
          # has: it is the only thing that moves submodule gitlinks, so when it
          # no-ops the hub's submodule-deployed vessels freeze at whatever commit
          # they were on — and the 6-hourly schedule keeps reporting success.
          # Observed 2026-08-08: every submodule skipped on "could not resolve
          # dev" for the PAT, the job went green, and the repo's history contains
          # ZERO pointer-bump commits. development-vessel — which runs from the
          # super-repo tree, not the image copy — had been frozen behind it.
          #
          # Skipping is legitimate per-repo (a cross-org submodule the PAT was
          # never meant to reach). Skipping EVERYTHING is not a skip, it is an
          # outage, and it must not be able to hide behind a warning.
          {
            echo "### Submodule bump"
            echo ""
            echo "- resolved: **${resolved}**"
            echo "- skipped: **${skipped}**"
            echo "- gitlinks changed: **${changed}**"
            if [ "$skipped" -gt 0 ]; then
              echo ""
              echo "Unresolvable (check SUBSTRATE_GIT_PAT repo grants — fine-grained PATs need each repo added with Contents: Read):"
              printf '%b' "$skiplist"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$resolved" -eq 0 ]; then
            # Do NOT name a cause here. The previous version of this line
            # asserted "This is a credential failure" and was wrong for eleven
            # days: the real fault was that relative submodule URLs were never
            # resolved, so ls-remote failed on every repo — all of them public
            # and reachable with no credential at all. An error message that
            # names the wrong cause is worse than one that names none, because
            # it redirects the reader away from the evidence. The per-repo
            # warnings above carry the actual ls-remote stderr; point at those.
            echo "::error::bump-submodules resolved 0 of $((resolved + skipped)) submodules — every gitlink is frozen. Read the per-repo ls-remote warnings above for the cause (URL resolution, branch missing, or credential scope)."
            exit 1
          fi

      - name: Commit and push
        id: push
        if: steps.bump.outputs.changed == '1'
        run: |
          set -euo pipefail
          git config user.name "substrate-bot"
          git config user.email "substrate-bot@users.noreply.github.com"
          n=$(grep -c '^-' /tmp/bump-summary.txt || true)
          {
            echo "chore(submodules): bump ${n} pointer(s) to latest dev"
            echo
            cat /tmp/bump-summary.txt
          } > /tmp/bump-commit-msg.txt
          git commit -F /tmp/bump-commit-msg.txt
          git push origin HEAD:dev
          # Publish the commit a caller should build. The caller's own
          # github.sha predates this push and would build the PRE-bump tree —
          # the exact staleness this workflow exists to remove.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
