name: Terminal Vessel - Observe and Learn

on:
  push:
    branches: [dev, main]
    paths:
      - 'repos/terminal/**'
  pull_request:
    paths:
      - 'repos/terminal/**'
  schedule:
    # Analyze traces every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  # ============================================================
  # JOB 1: Observe Test Execution
  # ============================================================
  observe-tests:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    outputs:
      trace_id: ${{ steps.observe.outputs.trace_id }}
      test_passed: ${{ steps.check.outputs.passed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install MiniBob
        run: |
          curl -fsSL https://minibob.dev/install.sh | sh
          minibob configure \
            --endpoint https://activity.metabob.com \
            --api-key ${{ secrets.METABOB_API_KEY }}

      - name: Register Observation Activity
        run: |
          curl -X POST https://activity.metabob.com/v2/activities/templates \
            -H "Authorization: ApiKey ${{ secrets.METABOB_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d @repos/terminal/activities/observe-test-run.json

      - name: Execute Test Observation
        id: observe
        run: |
          # Execute observation activity
          minibob --single "execute activity: terminal-observe-test-run"

          # Get trace ID
          TRACE_ID=$(minibob get-last-trace-id)
          echo "trace_id=$TRACE_ID" >> $GITHUB_OUTPUT
          echo "📝 Trace ID: $TRACE_ID"

      - name: Check Test Result
        id: check
        run: |
          # Query trace to get test result
          TRACE=$(curl -s "https://activity.metabob.com/v2/activities/execution-traces/${{ steps.observe.outputs.trace_id }}" \
            -H "Authorization: ApiKey ${{ secrets.METABOB_API_KEY }}")

          STATUS=$(echo "$TRACE" | jq -r '.status')
          echo "passed=$([[ $STATUS == 'completed' ]] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

          if [ "$STATUS" != "completed" ]; then
            echo "❌ Tests failed"
            exit 1
          fi

          echo "✅ Tests passed"

      - name: Post CI Result to Activity API
        if: always()
        run: |
          curl -X POST https://activity.metabob.com/v2/activities/ci-result \
            -H "Authorization: ApiKey ${{ secrets.METABOB_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"execution_id\": \"${{ steps.observe.outputs.trace_id }}\",
              \"ci_passed\": ${{ steps.check.outputs.passed }},
              \"validation_layer\": \"ci_tests\",
              \"github_run_id\": \"${{ github.run_id }}\",
              \"github_sha\": \"${{ github.sha }}\",
              \"repository\": \"terminal-vessel\"
            }"

  # ============================================================
  # JOB 2: Check Historical Success Rate
  # ============================================================
  check-patterns:
    runs-on: ubuntu-latest
    needs: observe-tests
    if: github.event_name != 'schedule'
    steps:
      - name: Query Thompson Sampling Score
        id: thompson
        run: |
          SCORE=$(curl -s "https://activity.metabob.com/v2/activities/thompson-sampling/score?activity_id=terminal-observe-test-run" \
            -H "Authorization: ApiKey ${{ secrets.METABOB_API_KEY }}")

          ALPHA=$(echo "$SCORE" | jq -r '.alpha // 1')
          BETA=$(echo "$SCORE" | jq -r '.beta // 1')
          SUCCESS_RATE=$(echo "scale=3; $ALPHA / ($ALPHA + $BETA)" | bc)

          echo "success_rate=$SUCCESS_RATE" >> $GITHUB_OUTPUT
          echo "📊 Test success rate: $SUCCESS_RATE (α=$ALPHA, β=$BETA)"

      - name: Threshold Decision
        run: |
          SUCCESS_RATE=${{ steps.thompson.outputs.success_rate }}

          if (( $(echo "$SUCCESS_RATE < 0.5" | bc -l) )); then
            echo "❌ BLOCK: Success rate too low ($SUCCESS_RATE)"
            gh issue create \
              --repo ${{ github.repository }} \
              --title "🚨 Terminal vessel tests: success rate $SUCCESS_RATE" \
              --body "Thompson Sampling shows consistently failing tests. Investigate immediately." \
              --label "urgent,terminal-vessel,automated-detection"
            exit 1
          elif (( $(echo "$SUCCESS_RATE < 0.7" | bc -l) )); then
            echo "⚠️ WARNING: Success rate degraded ($SUCCESS_RATE)"
            gh issue create \
              --repo ${{ github.repository }} \
              --title "⚠️ Terminal vessel tests: success rate degraded to $SUCCESS_RATE" \
              --body "Consider investigating test stability." \
              --label "terminal-vessel,automated-detection"
          else
            echo "✅ Success rate healthy: $SUCCESS_RATE"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  # ============================================================
  # JOB 3: Periodic Trace Analysis
  # ============================================================
  analyze-traces:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MiniBob
        run: |
          curl -fsSL https://minibob.dev/install.sh | sh
          minibob configure \
            --endpoint https://activity.metabob.com \
            --api-key ${{ secrets.METABOB_API_KEY }}

      - name: Register Analysis Activity
        run: |
          curl -X POST https://activity.metabob.com/v2/activities/templates \
            -H "Authorization: ApiKey ${{ secrets.METABOB_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d @repos/terminal/activities/analyze-development-traces.json

      - name: Execute Trace Analysis
        run: |
          minibob --single "execute activity: terminal-analyze-development-traces"

      - name: Check for Variant Suggestions
        run: |
          # Query for activities that should have variants created
          SUGGESTIONS=$(curl -s "https://activity.metabob.com/v2/activities/variant-suggestions?repository=terminal-vessel" \
            -H "Authorization: ApiKey ${{ secrets.METABOB_API_KEY }}")

          VARIANT_COUNT=$(echo "$SUGGESTIONS" | jq '.suggestions | length')

          if [ "$VARIANT_COUNT" -gt 0 ]; then
            echo "🔄 $VARIANT_COUNT variant suggestions found"

            echo "$SUGGESTIONS" | jq -r '.suggestions[] |
              "## Variant Suggestion: \(.activity_id)\n" +
              "- Current Success Rate: \(.current_success_rate)\n" +
              "- Reason: \(.reason)\n" +
              "- Suggested Changes: \(.suggested_changes)\n"
            ' > /tmp/variant-suggestions.md

            gh issue create \
              --repo ${{ github.repository }} \
              --title "Terminal vessel: $VARIANT_COUNT activity variant suggestions" \
              --body-file /tmp/variant-suggestions.md \
              --label "terminal-vessel,variants,automated-suggestion"
          else
            echo "✅ No variant suggestions"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Update Impulse Relevance
        run: |
          # Trigger impulse relevance recalculation for terminal activities
          curl -X POST https://activity.metabob.com/v2/activities/recalculate-impulse-relevance \
            -H "Authorization: ApiKey ${{ secrets.METABOB_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"repository": "terminal-vessel"}'
