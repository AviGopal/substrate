name: Deploy Activity API

# RETIRED as an automatic trigger. This workflow deploys activity-api on push to
# `main`, but the project develops on `dev` and the live fleet self-deploys from
# origin/dev via substrate-pull-sync (source convergence + health-gated restart),
# not a main-push image deploy. Nothing has pushed `main` since 2026-04, so the
# only effect of the push trigger was a stale red history on a deploy model no
# longer in use. Left as workflow_dispatch-only so it remains available for a
# deliberate manual production deploy without producing dead scheduled/push runs.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to production'
        required: true
        type: boolean
        default: false

env:
  REGISTRY: docker.io
  IMAGE_NAME: metabobapp/metabob-activity-api
  GKE_CLUSTER: metabob-production
  GKE_REGION: us-central1  # Update to your region

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix={{branch}}-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: repos
          file: repos/activity-api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify Slack - Build
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            MESSAGE="✅ Activity API build successful: ${{ steps.meta.outputs.version }}"
          else
            MESSAGE="❌ Activity API build failed"
          fi

          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -X POST "$SLACK_WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -d "{\"text\":\"$MESSAGE\"}"
          fi

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GKE
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GKE_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials ${{ env.GKE_CLUSTER }} \
            --region ${{ env.GKE_REGION }}

      - name: Deploy Green Variant
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          # Update green deployment with new image
          kubectl set image deployment/metabob-activity-api-green \
            -n activity-system \
            metabob-activity-api=${{ env.IMAGE_NAME }}:$IMAGE_TAG

          # Wait for rollout
          kubectl rollout status deployment/metabob-activity-api-green \
            -n activity-system \
            --timeout=300s

      - name: Monitor Green Variant
        run: |
          echo "Monitoring green variant for 5 minutes..."

          # Check for crashes/restarts
          sleep 60

          RESTARTS=$(kubectl get pods -n activity-system \
            -l app=metabob-activity-api,variant=green \
            -o jsonpath='{.items[0].status.containerStatuses[0].restartCount}')

          if [ "$RESTARTS" -gt 0 ]; then
            echo "❌ Green variant has restarted $RESTARTS times"
            exit 1
          fi

          # Check for errors in logs
          ERROR_COUNT=$(kubectl logs -n activity-system \
            -l app=metabob-activity-api,variant=green \
            --tail=100 | grep -i "error\|fatal" | wc -l)

          if [ "$ERROR_COUNT" -gt 5 ]; then
            echo "❌ Green variant has $ERROR_COUNT errors in logs"
            exit 1
          fi

          echo "✅ Green variant appears stable"

      - name: Switch to Green Variant
        run: |
          # Update service selector to point to green
          kubectl patch service metabob-activity-api \
            -n activity-system \
            -p '{"spec":{"selector":{"variant":"green"}}}'

          # Scale green to full capacity
          kubectl scale deployment/metabob-activity-api-green \
            -n activity-system \
            --replicas=3

          # Wait for scale up
          kubectl rollout status deployment/metabob-activity-api-green \
            -n activity-system

      - name: Clean Up Blue Variant
        run: |
          # Scale down blue (keep it for quick rollback)
          kubectl scale deployment/metabob-activity-api-blue \
            -n activity-system \
            --replicas=1

      - name: Notify Slack - Deploy
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            MESSAGE="✅ Activity API deployed to production: ${{ needs.build.outputs.image_tag }}"
          else
            MESSAGE="❌ Activity API deployment failed. Blue variant still active."
          fi

          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -X POST "$SLACK_WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -d "{\"text\":\"$MESSAGE\"}"
          fi
