                      - paragraph [ref=e256]: "Sibling #2 of the registry-quality-pass per OpenSpec change 2026-04-27-activity-registry-quality-pass. Consumes coreActivitySet (from core-activity-audit) plus the existing templateAuditReport shape (per-template deficiency reports) and produces structured activityReview impulses for the load-bearing core. Four tasks: (1) acquire_targets — resolve coreActivitySet, slice top-K (reviewSize, default 10); (2) iterate_review — iteration over the K templates, body=llm; per-template the LLM produces an activityReview body covering idiom alignment (compliance rules), missing inputShapes/outputShapes, hard-coded paths, all-LLM task chains, redundancy with siblings; aggregateAs=list; (3) score_severity — llm pass that scores each review by severity (1=cosmetic, 5=should-deprecate); emits activityReview[] impulses with severity attached; (4) emit_review_summary — llm summarizes; emits auditReport (NOT templateAuditReport — see openQuestions[0] on shape-collision avoidance) + goalEnd. CONTEXT-BUDGET: per-template LLM body call is bounded at maxTokens=600 over a per-template summary fed by templateAuditReport rather than full template bodies — review never echoes full task graphs. Sandbox: read-only — no file writes, no workingDirectory."
