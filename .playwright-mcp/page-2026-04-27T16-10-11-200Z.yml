                        - generic [ref=e227]: 4t
                      - paragraph [ref=e228]: "Sibling #4 of the registry-quality-pass per OpenSpec change 2026-04-27-activity-registry-quality-pass. Mines successful execution traces from the load-bearing core for recurring task graphs, resolver-tier mixes, and output-shape sequences. Four tasks: (1) acquire_top_set — impulse-resolve coreActivitySet (read from impulse pool by id, same pattern as review-activity); (2) fetch_success_signatures — iteration over the set; body=impulse-resolve `executionTraceWithSignatures` filtered to success_only=true (the existing context-budget-conscious shape — per-impulse pointer/shape signatures, NOT full trace bodies); aggregateAs=list; (3) cluster_signatures — llm task; clusters traces by structural similarity (task graph shape, resolver tier mix, output shape sequence); emits traceCluster[] (new shape declared in proposal); (4) extract_patterns — iteration over clusters; body=llm extracts a reusable pattern impulse per cluster (description, applicability, success rate, exemplar template ids); aggregateAs=list. Emits pattern[] + goalEnd. CONTEXT-BUDGET: relies entirely on signature shape — never raw trace bodies. Per-template signature cap: maxTracesPerTemplate signature rows × top-N templates ≈ ~30 rows for N=10, lookbackDays=14. Cluster_signatures LLM bounded at maxTokens=2500; per-pattern extraction bounded at maxTokens=500."
