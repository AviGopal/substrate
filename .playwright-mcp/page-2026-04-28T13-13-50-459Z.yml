                  - generic [ref=e324]:
                    - img [ref=e325]
                    - generic [ref=e332]:
                      - generic [ref=e333]: Replace Activity (registry-quality)
                      - generic [ref=e334]:
                        - generic [ref=e335]: "[meta]"
                        - generic [ref=e336]: 5t
                      - paragraph [ref=e337]: "Sibling #6 of the registry-quality-pass per OpenSpec change 2026-04-27-activity-registry-quality-pass. Consumes activityReview[] (severity 2-3 — idiom-aligned but improvable) plus pattern[] (from extract-pattern) and synthesizes activityTemplateProposal entries. Five tasks: (1) acquire_targets_and_patterns — impulse-resolve both shapes from the pool; (2) match_patterns_to_reviews — llm; for each review, picks the best pattern as a replacement template's basis; emits matchedReview[] (review + matched pattern); (3) synthesize_replacements — iteration; body=llm generates new template JSON proposals (NOT a write — emits activityTemplateProposal shape; never directly writes; the user/operator decides); aggregateAs=list; (4) validate_proposals — iteration; body=llm validates each proposal against compliance rules; tags valid: true|false; (5) emit_proposals — emits activityTemplateProposal[] + auditReport + goalEnd. CONTEXT-BUDGET: each per-review LLM body is bounded at maxTokens=900 (template proposals are larger than reviews/concepts but still bounded); per-validation pass at maxTokens=400. PROPOSAL-NOT-WRITE posture: this activity NEVER calls activityTemplate_write — it surfaces proposals for an operator (or a downstream activity invoking make-activity) to decide."
                  - generic [ref=e338]:
                    - img [ref=e339]
                    - generic [ref=e346]:
                      - generic [ref=e347]: Concept From Pattern (registry-quality)
                      - generic [ref=e348]:
                        - generic [ref=e349]: "[meta]"
                        - generic [ref=e350]: 3t
                      - paragraph [ref=e351]: "Sibling #5 of the registry-quality-pass per OpenSpec change 2026-04-27-activity-registry-quality-pass. Promotes pattern[] (from extract-pattern) into concept-db via concept synthesis. Three tasks: (1) acquire_patterns — impulse-resolve pattern[] from the pool; (2) synthesize_concepts — iteration over patterns; body=llm produces concept impulses (name, definition, exemplar templates, applicability rules) — these are the concept-db ingestion shape; aggregateAs=list; (3) emit_concept_writes — iteration over concepts; body=impulse-resolve with pointer.type=`concept_write` (when registered) OR emits `concept[]` impulses for the consumer to write (fallback when concept_write is not yet a registered resolver). Emit goalEnd. CONTEXT-BUDGET: per-pattern LLM body bounded at maxTokens=600. concept-db ingestion happens through impulse-resolve to keep this template free of concept-db endpoint knowledge — discovery routes the call. Per-pattern concept count capped at maxConceptsPerPattern (default 2) to bound cost when the LLM is tempted to over-decompose a pattern."
                  - generic [ref=e352]:
                    - img [ref=e353]
                    - generic [ref=e360]:
                      - generic [ref=e361]: Extract Pattern (registry-quality)
                      - generic [ref=e362]:
                        - generic [ref=e363]: "[meta]"
                        - generic [ref=e364]: 4t
                      - paragraph [ref=e365]: "Sibling #4 of the registry-quality-pass per OpenSpec change 2026-04-27-activity-registry-quality-pass. Mines successful execution traces from the load-bearing core for recurring task graphs, resolver-tier mixes, and output-shape sequences. Four tasks: (1) acquire_top_set — impulse-resolve coreActivitySet (read from impulse pool by id, same pattern as review-activity); (2) fetch_success_signatures — iteration over the set; body=impulse-resolve `executionTraceWithSignatures` filtered to success_only=true (the existing context-budget-conscious shape — per-impulse pointer/shape signatures, NOT full trace bodies); aggregateAs=list; (3) cluster_signatures — llm task; clusters traces by structural similarity (task graph shape, resolver tier mix, output shape sequence); emits traceCluster[] (new shape declared in proposal); (4) extract_patterns — iteration over clusters; body=llm extracts a reusable pattern impulse per cluster (description, applicability, success rate, exemplar template ids); aggregateAs=list. Emits pattern[] + goalEnd. CONTEXT-BUDGET: relies entirely on signature shape — never raw trace bodies. Per-template signature cap: maxTracesPerTemplate signature rows × top-N templates ≈ ~30 rows for N=10, lookbackDays=14. Cluster_signatures LLM bounded at maxTokens=2500; per-pattern extraction bounded at maxTokens=500."
                  - generic [ref=e366]:
                    - img [ref=e367]
                    - generic [ref=e374]:
                      - generic [ref=e375]: Prune By Manifest (registry-quality, deterministic)
                      - generic [ref=e376]:
                        - generic [ref=e377]: "[meta]"
                        - generic [ref=e378]: 4t
                      - paragraph [ref=e379]: "Operator-dispatched registry cleanup activity. Sibling of prune-activity; differs in that it consumes a deterministic prune-candidate manifest (produced offline by registry-audit tooling — e.g. openspec/changes/2026-04-27-activity-registry-quality-pass/artifacts/canary-prune-manifest.json) rather than activityReview[] severity scores. NO LLM judgment on which templates to prune — the manifest is the source of truth; this activity just iterates and dispatches activityTemplate_deprecate writes. Designed for the post-B-2-admin-scope unblock: when the operator gets admin scope, they can drain the 794 R1/R6/R7/R8 high-confidence candidates without re-running review-activity. Four tasks: (1) acquire_manifest — impulse-resolve with pointer.type=file reading manifestPath (the JSON manifest with shape {candidates: {R1: [...], R6: [...], ...}, highConfidenceIds: [...], summary: {...}}); (2) filter_candidates — LLM extracts the relevant id list per confidenceLevel (HIGH=R1+R6+R7+R8, MEDIUM=R2+R4+R5+R9, ALL=union) and caps at maxDeprecates; emits pruneCandidate[] regardless of dryRun (audit signal); (3) dispatch_deprecate — iteration over pruneCandidates, body=impulse-resolve with pointer.type=activityTemplate_deprecate; CONDITIONAL on dryRun=false; aggregateAs=list captures per-iteration success/error so the audit signal is per-template; (4) emit_summary — small-budget LLM stratifies success vs 401/403/404 and emits pruneReport + goalEnd. SAFETY: dryRun defaults to true; maxDeprecates caps per-invocation deprecates at 50; large manifests require multi-invocation drainage. CONTEXT-BUDGET: per-template deprecate dispatch carries only templateId + reason in the pointer; no template bodies echoed. Manifest format may evolve as new audit rules are added — the filter_candidates task is instructed to tolerate extra rule sections (R10+) gracefully and surface them as a warning rather than crash."
                  - generic [ref=e380]:
                    - img [ref=e381]
                    - generic [ref=e388]:
                      - generic [ref=e389]: Prune Activity (registry-quality)
                      - generic [ref=e390]:
                        - generic [ref=e391]: "[meta]"
                        - generic [ref=e392]: 3t
                      - paragraph [ref=e393]: "Sibling #3 of the registry-quality-pass per OpenSpec change 2026-04-27-activity-registry-quality-pass. Consumes activityReview[] (from review-activity) and dispatches `activityTemplate_deprecate` write resolver calls for templates with severity >= minSeverity (default 4) that are NOT in coreActivitySet. Three tasks: (1) filter_deprecation_candidates — iteration over reviews; condition: severity >= minSeverity AND NOT in coreActivitySet; aggregateAs=list; emits pruneCandidate[]; (2) dispatch_deprecate_impulses — iteration over pruneCandidates; body=impulse-resolve with pointer.type=`activityTemplate_deprecate` (write resolver); aggregateAs=list. GATE on B-2 admin scope (the deprecate handler is admin-only via SurrealDB PERMISSIONS); 401 responses are expected when the calling identity lacks admin scope. dryRun=true (default) skips this task entirely; emit_prune_report still runs and surfaces the pruneCandidates as an audit signal; (3) emit_prune_report — llm summarizes the deprecation attempts (success vs 401-blocked vs dry-run-skipped); emits auditReport + goalEnd. CONTEXT-BUDGET: per-template deprecate dispatch carries only the templateId in the pointer; no template bodies echoed. dryRun guard makes the chain observable-without-mutation by default."
                  - generic [ref=e394]:
                    - img [ref=e395]
                    - generic [ref=e402]:
                      - generic [ref=e403]: Review Activity (registry-quality)
                      - generic [ref=e404]:
                        - generic [ref=e405]: "[meta]"
                        - generic [ref=e406]: 4t
                      - paragraph [ref=e407]: "Sibling #2 of the registry-quality-pass per OpenSpec change 2026-04-27-activity-registry-quality-pass. Consumes coreActivitySet (from core-activity-audit) plus the existing templateAuditReport shape (per-template deficiency reports) and produces structured activityReview impulses for the load-bearing core. Four tasks: (1) acquire_targets — resolve coreActivitySet, slice top-K (reviewSize, default 10); (2) iterate_review — iteration over the K templates, body=llm; per-template the LLM produces an activityReview body covering idiom alignment (compliance rules), missing inputShapes/outputShapes, hard-coded paths, all-LLM task chains, redundancy with siblings; aggregateAs=list; (3) score_severity — llm pass that scores each review by severity (1=cosmetic, 5=should-deprecate); emits activityReview[] impulses with severity attached; (4) emit_review_summary — llm summarizes; emits auditReport (NOT templateAuditReport — see openQuestions[0] on shape-collision avoidance) + goalEnd. CONTEXT-BUDGET: per-template LLM body call is bounded at maxTokens=600 over a per-template summary fed by templateAuditReport rather than full template bodies — review never echoes full task graphs. Sandbox: read-only — no file writes, no workingDirectory."
                  - generic [ref=e408]:
                    - img [ref=e409]
                    - generic [ref=e416]:
                      - generic [ref=e417]: Core Activity Audit
                      - generic [ref=e418]:
                        - generic [ref=e419]: "[meta]"
                        - generic [ref=e420]: 4t
                      - paragraph [ref=e421]: "Read-only audit activity that catalogues and ranks the load-bearing core of the activity registry. First concrete deliverable of OpenSpec change 2026-04-27-activity-registry-quality-pass. Five tasks: (1) fetch_templates — pull activityTemplate list (limit=500) via impulse-resolve; (2) fetch_metrics — pull activityTemplatesByMetrics for Thompson α/β + recent execution count; (3) fetch_recent_traces — pull executionTraceWithSignatures (NOT full bodies) for the last lookbackDays days, capped per template at maxTracesPerTemplate; (4) compute_load_bearing — LLM-renders a ranked array of {templateId, rank, evidence} from the three signal sources, emitting a coreActivitySet impulse with the top-N templates; (5) emit_audit_report — LLM summarizes the audit into a human-readable auditReport impulse and calls markGoalComplete (matching make-activity's emission contract). Sandbox: read-only — no file writes, no workingDirectory. Sibling activities (review-activity, prune-activity, replace-activity, extract-pattern, concept-from-pattern) consume coreActivitySet downstream; this activity is the FIRST of six per the proposal — the remaining five are designed against the real coreActivitySet output rather than speculative shapes. Context-budget: trace SIGNATURES not full traces (the existing executionTraceWithSignatures shape was built precisely for this case at activity-api/config.ts:223), capped at maxTracesPerTemplate*coreSetSize ~= 100 signature rows per invocation."
                  - generic [ref=e422]:
                    - img [ref=e423]
                    - generic [ref=e430]:
                      - generic [ref=e431]: Fix Activity Template Schema
                      - generic [ref=e432]:
                        - generic [ref=e433]: "[meta]"
                        - generic [ref=e434]: 4t
                      - paragraph [ref=e435]: Reads an invalid activity template and rewrites it to match the correct schema (tasks must have prompt or resolver). This is a meta-activity that fixes other activities.
                  - generic [ref=e436]:
                    - img [ref=e437]
                    - generic [ref=e444]:
                      - generic [ref=e445]: Audit and Backfill Template Semantic Markers
                      - generic [ref=e446]:
                        - generic [ref=e447]: "[meta]"
                        - generic [ref=e448]: 4t
                      - paragraph [ref=e449]: "Single-candidate-per-invocation upkeep activity that drains the queue of template-metadata deficiencies one at a time. Two-phase: Phase 1 fetches the single worst-scored template from the templateAuditReport resolver (read-only); Phase 2 (gated by applyChanges, default false) uses an LLM with strict safety rules to decide whether a backfill is safe, then applies it via the activityTemplate_update write resolver. Safety defaults: applyChanges=false, never auto-backfill descriptions, never auto-backfill shapes that are alias-warned, skip templates with hardcoded URLs (flagged for human review). Re-run repeatedly until the deficient set converges; each invocation produces one execution trace for Thompson Sampling."
                  - generic [ref=e450]:
                    - img [ref=e451]
                    - generic [ref=e458]:
                      - generic [ref=e459]: Verify Goal Satisfaction
                      - generic [ref=e460]:
                        - generic [ref=e461]: "[infrastructure]"
                        - generic [ref=e462]: 3t
                      - paragraph [ref=e463]: Post-execution goal completion verifier. Evidence-based verification checks whether execution outputs satisfy the goal. If the goal is partially or fully unmet, goal_decomposition identifies the remaining subgoals. Synthesizes both into a goal_satisfaction_result that includes completion fraction, evidence, and (if incomplete) prioritized subgoals with suggested next activities.
                  - generic [ref=e464]:
                    - img [ref=e465]
                    - generic [ref=e472]:
                      - generic [ref=e473]: Explore Goal Trajectories
                      - generic [ref=e474]:
                        - generic [ref=e475]: "[meta]"
                        - generic [ref=e476]: 5t
                      - paragraph [ref=e477]: Maps possible activity trajectories toward a stated goal. Uses goal_enrichment to infer required output shapes, backward chaining (activity_recommendation) to find activities that produce those shapes, forward chaining to find what is reachable from present state, and historical goal execution paths to surface high-confidence sequences with estimated completion probabilities. Produces a ranked goal_trajectory_map for downstream planning.
                  - generic [ref=e478]:
                    - img [ref=e479]
                    - generic [ref=e486]:
                      - generic [ref=e487]: Validate Template Compliance
                      - generic [ref=e488]:
                        - generic [ref=e489]: "[infrastructure]"
                        - generic [ref=e490]: 3t
                      - paragraph [ref=e491]: "Validates an activity template against post-2026-04-26 canonical criteria: resolver on every task, inputShapes/outputShapes/outputImpulses declared, no invented fields (subagent, tools object, impulseReferences, contextRequirements, top-level impulses array), activity-level inputSchema/outputSchema, no filesystem-based inter-task coordination, no stale endpoints, valid retry strategies, and proper requiredPatterns format. Emits validation_result for validator-dispatch."
