                      - paragraph [ref=e547]: "Activity-driven implementation of post-task validator dispatch per OpenSpec change 2026-04-26-validators-and-failure-modes (§7). Subscribes to lifecycle:task:completed and chains five tasks: (1) discover_validators — find activities consuming the parent task's outputShapes AND producing validation_result via the canonical `discoverByShapesQuery` impulse-resolve shape (mode=backward + output_shapes=[validation_result]); (2) select_validator_per_shape — pick a validator from the activity envelope using composition_score and Thompson α/β; (3) dispatch_validators — execute the chosen validator with the parent task's outputs as inputs; (4) propagate_failure_mode — when validation_result.passed === false, emit a failure_mode_propagation impulse carrying the structured verifier_negative failure_mode for the dispatcher to stamp on the parent trace; (5) learning_signal_write — record impulse_relevance + tool_argument_pattern signals for the parent task, gating executionSucceeded on validator outcome. As of 2026-04-26 the template uses dotted-path interpolation (e.g. {{lifecycle.taskId}}, {{lifecycle.executionId}}) — the interpolate regex was extended to /\\{\\{([\\w]+(?:\\.[\\w]+)*)\\}\\}/g in iter 7 (activity.ts:6952). F-6 corrected (2026-04-26): task 1 uses the canonical `impulse-resolve` + `discoverByShapesQuery` pattern advertised by activity-api — zero minibob source changes (vessel-integration constraint)."
