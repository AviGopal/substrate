                      - paragraph [ref=e533]: "Activity-driven implementation of shape-provider goal creation per OpenSpec change 2026-04-26-shape-provider-goal-creation §3. When a missing input shape cannot be bound by pool selection or in-scope producer selection, this activity composes a NEW goal-shaped impulse whose `endpoint_output_shapes: [target_shape]` constraint will route the dispatched activity to a producer of that shape via the existing variant-selection pipe (goal-processing-activity-driven). Five signal-gathering tasks (forward-chain producers, prior paths with terminal-shape match, concept-db related concepts, impulse co-occurrence ranking, cost/risk priors) accumulate evidence; the parent-chain lookup task surfaces the parent execution's composition_chain for cycle detection; a final LLM compose_goal task ingests all signals and emits a single goal-shaped impulse. Three recursion-safety guards (depth, cycle, budget) are embedded in the compose_goal LLM prompt and surface as `human_in_the_loop_required: true` plus a `failure_mode` per the validators-and-failure-modes taxonomy. The activity itself records traces for Thompson Sampling — variants (cost-optimized, concept-omitted, etc.) emerge from the learning loop via save-as-variant."
