                      - paragraph [ref=e505]: "Centerpiece meta-activity per OpenSpec change 2026-04-27-meta-activity-builder. Creates new activities from a goal + activityRecommendations input. Six tasks: (1) acquire_context — read goal + relevant existing templates via impulse-resolve; (2) identify_candidates — iterate over activityRecommendations via the new `iteration` resolver, scoring each candidate against the goal; (3) execute_plan — dispatch the highest-scored candidate as a child activity via the `activity` resolver; (4) handle_errors — iterate over alternate candidates on plan failure (first-success-wins); (5) declare_complete — explicit LLM tool call that emits a `goalEnd` impulse with the structured summary, INDEPENDENT of the validator-dispatch verdict; (6) extract_template — write a new activityTemplate via the `activityTemplate_write` write resolver, gated on the applyTemplateExtraction variable (default false). Sandbox: all dispatched sub-activities receive workingDirectory (default /tmp/<goal-slug>/) via forwarded variables; bash/file resolvers in dispatched children must reference {{variables.workingDirectory}}. PATH-SANDBOX ENFORCEMENT — see openQuestions[0]: pre-validation resolver does not currently support a forbiddenPathPatterns option; sandbox enforcement is documentary/contractual at this template level. Co-developed with the iteration resolver (sibling work in repos/minibob/src/resolvers/iteration-resolver.ts); when iteration is not registered, tasks 2 and 4 will report `resolver not found` and the template's success path is reduced to the LLM-orchestrated subset."
