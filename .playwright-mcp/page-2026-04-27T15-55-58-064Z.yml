                      - paragraph [ref=e397]: "Sibling #5 of the registry-quality-pass per OpenSpec change 2026-04-27-activity-registry-quality-pass. Promotes pattern[] (from extract-pattern) into concept-db via concept synthesis. Three tasks: (1) acquire_patterns — impulse-resolve pattern[] from the pool; (2) synthesize_concepts — iteration over patterns; body=llm produces concept impulses (name, definition, exemplar templates, applicability rules) — these are the concept-db ingestion shape; aggregateAs=list; (3) emit_concept_writes — iteration over concepts; body=impulse-resolve with pointer.type=`concept_write` (when registered) OR emits `concept[]` impulses for the consumer to write (fallback when concept_write is not yet a registered resolver). Emit goalEnd. CONTEXT-BUDGET: per-pattern LLM body bounded at maxTokens=600. concept-db ingestion happens through impulse-resolve to keep this template free of concept-db endpoint knowledge — discovery routes the call. Per-pattern concept count capped at maxConceptsPerPattern (default 2) to bound cost when the LLM is tempted to over-decompose a pattern."
