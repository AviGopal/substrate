                      - paragraph [ref=e411]: "Read-only audit activity that catalogues and ranks the load-bearing core of the activity registry. First concrete deliverable of OpenSpec change 2026-04-27-activity-registry-quality-pass. Five tasks: (1) fetch_templates — pull activityTemplate list (limit=500) via impulse-resolve; (2) fetch_metrics — pull activityTemplatesByMetrics for Thompson α/β + recent execution count; (3) fetch_recent_traces — pull executionTraceWithSignatures (NOT full bodies) for the last lookbackDays days, capped per template at maxTracesPerTemplate; (4) compute_load_bearing — LLM-renders a ranked array of {templateId, rank, evidence} from the three signal sources, emitting a coreActivitySet impulse with the top-N templates; (5) emit_audit_report — LLM summarizes the audit into a human-readable auditReport impulse and calls markGoalComplete (matching make-activity's emission contract). Sandbox: read-only — no file writes, no workingDirectory. Sibling activities (review-activity, prune-activity, replace-activity, extract-pattern, concept-from-pattern) consume coreActivitySet downstream; this activity is the FIRST of six per the proposal — the remaining five are designed against the real coreActivitySet output rather than speculative shapes. Context-budget: trace SIGNATURES not full traces (the existing executionTraceWithSignatures shape was built precisely for this case at activity-api/config.ts:223), capped at maxTracesPerTemplate*coreSetSize ~= 100 signature rows per invocation."
