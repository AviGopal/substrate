                            - paragraph [ref=e1328]: "Activity-driven implementation of the ribosome pattern. Subscribes to lifecycle:activity:postExecution and treats template extraction as a shape-identifying counterpart to goal/activity — input shape lifecycle:activity:postExecution, output shapes extractedTemplate / learningSummary / goalEnd. Replaces the imperative ribosome calls that previously fired inline from activity.ts (recordExecutionTrace path), goal-processor.ts (4 sites: success extraction, cost-limit attempt, LLM-verified attempt, max-turns attempt), and improviser-resolver.ts (success + cost-limit paths). The chain has six tasks: (1) acquire_trace_signature — impulse-resolve `executionTraceWithSignatures` keyed by the just-completed executionId; (2) assess_quality — llm computes a quality score from the lifecycle payload + trace signature (success rate, task count, resolver tier mix, cost-per-output ratio, depth=0 check, author-skip check); (3) gate_extraction — conditional branch on qualityScore >= qualityThreshold; (4) synthesize_template — llm renders an extractedTemplate JSON proposal from the trace signature + lifecycle payload; (5) validate_proposal — llm validates the proposal against compliance rules (similar to replace-activity::validate_proposals); (6) dispatch_write — impulse-resolve with pointer.type=`activityTemplate_write` operation=`create`, GATED on the applyExtraction variable (default false). The applyExtraction default of false makes first-canary-deploy observe-only: the chain emits an extractedTemplate proposal impulse for downstream consumers (workbench, replace-activity, operator) without actually persisting the new template. Once enough proposal traces accumulate and the quality threshold is calibrated, applyExtraction can be flipped to true (per-template variable override) for autonomous registration. RECURSION SAFETY: this template's templateAuthor on the lifecycle payload is `ribosome-pattern`, so when the meta-activity itself emits postExecution at completion, the gate_extraction conditional skips because templateAuthor is matched against a documented skip list (the meta-activity sets `templateAuthor != ribosome-pattern && templateAuthor != ribosome && templateAuthor != ribosome-sequence` as the recursion-safety filter). MIGRATION TARGET: the imperative ribosome calls reach for mcp.registerTemplate(); the meta-activity uses the activityTemplate_write resolver advertised by activity-api per docs/impulse-types/LEARNING_LOOP_WRITE_RESOLVERS.md (post L-3 auth fix). Per the system's foundational model: ribosome is the shape-identifying counterpart to goal/activity — runs after execution, registered to the lifecycle hook, declarative quality gates expressed in template variables not buried in code."
