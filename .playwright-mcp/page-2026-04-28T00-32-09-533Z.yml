                    - generic [ref=e229]:
                      - generic [ref=e230]: Audit and Backfill Template Semantic Markers
                      - generic [ref=e231]:
                        - generic [ref=e232]: "[meta]"
                        - generic [ref=e233]: 4t
                      - paragraph [ref=e234]: "Single-candidate-per-invocation upkeep activity that drains the queue of template-metadata deficiencies one at a time. Two-phase: Phase 1 fetches the single worst-scored template from the templateAuditReport resolver (read-only); Phase 2 (gated by applyChanges, default false) uses an LLM with strict safety rules to decide whether a backfill is safe, then applies it via the activityTemplate_update write resolver. Safety defaults: applyChanges=false, never auto-backfill descriptions, never auto-backfill shapes that are alias-warned, skip templates with hardcoded URLs (flagged for human review). Re-run repeatedly until the deficient set converges; each invocation produces one execution trace for Thompson Sampling."
                  - generic [ref=e235]:
                    - img [ref=e236]
                    - generic [ref=e243]:
                      - generic [ref=e244]: Verify Goal Satisfaction
                      - generic [ref=e245]:
                        - generic [ref=e246]: "[infrastructure]"
                        - generic [ref=e247]: 3t
                      - paragraph [ref=e248]: Post-execution goal completion verifier. Evidence-based verification checks whether execution outputs satisfy the goal. If the goal is partially or fully unmet, goal_decomposition identifies the remaining subgoals. Synthesizes both into a goal_satisfaction_result that includes completion fraction, evidence, and (if incomplete) prioritized subgoals with suggested next activities.
                  - generic [ref=e249]:
                    - img [ref=e250]
                    - generic [ref=e257]:
                      - generic [ref=e258]: Explore Goal Trajectories
                      - generic [ref=e259]:
                        - generic [ref=e260]: "[meta]"
                        - generic [ref=e261]: 5t
                      - paragraph [ref=e262]: Maps possible activity trajectories toward a stated goal. Uses goal_enrichment to infer required output shapes, backward chaining (activity_recommendation) to find activities that produce those shapes, forward chaining to find what is reachable from present state, and historical goal execution paths to surface high-confidence sequences with estimated completion probabilities. Produces a ranked goal_trajectory_map for downstream planning.
                  - generic [ref=e263]:
                    - img [ref=e264]
                    - generic [ref=e271]:
                      - generic [ref=e272]: Validate Template Compliance
                      - generic [ref=e273]:
                        - generic [ref=e274]: "[infrastructure]"
                        - generic [ref=e275]: 3t
                      - paragraph [ref=e276]: "Validates an activity template against post-2026-04-26 canonical criteria: resolver on every task, inputShapes/outputShapes/outputImpulses declared, no invented fields (subagent, tools object, impulseReferences, contextRequirements, top-level impulses array), activity-level inputSchema/outputSchema, no filesystem-based inter-task coordination, no stale endpoints, valid retry strategies, and proper requiredPatterns format. Emits validation_result for validator-dispatch."
                  - generic [ref=e277]:
                    - img [ref=e278]
                    - generic [ref=e285]:
                      - generic [ref=e286]: Make Activity (meta-activity-builder)
                      - generic [ref=e287]:
                        - generic [ref=e288]: "[meta]"
                        - generic [ref=e289]: 6t
                      - paragraph [ref=e290]: "Centerpiece meta-activity per OpenSpec change 2026-04-27-meta-activity-builder. Creates new activities from a goal + activityRecommendations input. Six tasks: (1) acquire_context — read goal + relevant existing templates via impulse-resolve; (2) identify_candidates — iterate over activityRecommendations via the new `iteration` resolver, scoring each candidate against the goal; (3) execute_plan — dispatch the highest-scored candidate as a child activity via the `activity` resolver; (4) handle_errors — iterate over alternate candidates on plan failure (first-success-wins); (5) declare_complete — explicit LLM tool call that emits a `goalEnd` impulse with the structured summary, INDEPENDENT of the validator-dispatch verdict; (6) extract_template — write a new activityTemplate via the `activityTemplate_write` write resolver, gated on the applyTemplateExtraction variable (default false). Sandbox: all dispatched sub-activities receive workingDirectory (default /tmp/<goal-slug>/) via forwarded variables; bash/file resolvers in dispatched children must reference {{variables.workingDirectory}}. PATH-SANDBOX ENFORCEMENT — see openQuestions[0]: pre-validation resolver does not currently support a forbiddenPathPatterns option; sandbox enforcement is documentary/contractual at this template level. Co-developed with the iteration resolver (sibling work in repos/minibob/src/resolvers/iteration-resolver.ts); when iteration is not registered, tasks 2 and 4 will report `resolver not found` and the template's success path is reduced to the LLM-orchestrated subset."
                  - generic [ref=e291]:
                    - img [ref=e292]
                    - generic [ref=e299]:
                      - generic [ref=e300]: Ribosome Extract (lifecycle-driven template extraction)
                      - generic [ref=e301]:
                        - generic [ref=e302]: "[meta]"
                        - generic [ref=e303]: 7t
                      - paragraph [ref=e304]: "Activity-driven implementation of the ribosome pattern. Subscribes to lifecycle:activity:postExecution and treats template extraction as a shape-identifying counterpart to goal/activity — input shape lifecycle:activity:postExecution, output shapes extractedTemplate / learningSummary / goalEnd. Replaces the imperative ribosome calls that previously fired inline from activity.ts (recordExecutionTrace path), goal-processor.ts (4 sites: success extraction, cost-limit attempt, LLM-verified attempt, max-turns attempt), and improviser-resolver.ts (success + cost-limit paths). The chain has six tasks: (1) acquire_trace_signature — impulse-resolve `executionTraceWithSignatures` keyed by the just-completed executionId; (2) assess_quality — llm computes a quality score from the lifecycle payload + trace signature (success rate, task count, resolver tier mix, cost-per-output ratio, depth=0 check, author-skip check); (3) gate_extraction — conditional branch on qualityScore >= qualityThreshold; (4) synthesize_template — llm renders an extractedTemplate JSON proposal from the trace signature + lifecycle payload; (5) validate_proposal — llm validates the proposal against compliance rules (similar to replace-activity::validate_proposals); (6) dispatch_write — impulse-resolve with pointer.type=`activityTemplate_write` operation=`create`, GATED on the applyExtraction variable (default false). The applyExtraction default of false makes first-canary-deploy observe-only: the chain emits an extractedTemplate proposal impulse for downstream consumers (workbench, replace-activity, operator) without actually persisting the new template. Once enough proposal traces accumulate and the quality threshold is calibrated, applyExtraction can be flipped to true (per-template variable override) for autonomous registration. RECURSION SAFETY: this template's templateAuthor on the lifecycle payload is `ribosome-pattern`, so when the meta-activity itself emits postExecution at completion, the gate_extraction conditional skips because templateAuthor is matched against a documented skip list (the meta-activity sets `templateAuthor != ribosome-pattern && templateAuthor != ribosome && templateAuthor != ribosome-sequence` as the recursion-safety filter). MIGRATION TARGET: the imperative ribosome calls reach for mcp.registerTemplate(); the meta-activity uses the activityTemplate_write resolver advertised by activity-api per docs/impulse-types/LEARNING_LOOP_WRITE_RESOLVERS.md (post L-3 auth fix). Per the system's foundational model: ribosome is the shape-identifying counterpart to goal/activity — runs after execution, registered to the lifecycle hook, declarative quality gates expressed in template variables not buried in code."
                  - generic [ref=e305]:
                    - img [ref=e306]
                    - generic [ref=e313]:
                      - generic [ref=e314]: Create Shape-Provider Goal (shape-provider-goal-creation)
                      - generic [ref=e315]:
                        - generic [ref=e316]: "[meta]"
                        - generic [ref=e317]: 8t
                      - paragraph [ref=e318]: "Activity-driven implementation of shape-provider goal creation per OpenSpec change 2026-04-26-shape-provider-goal-creation §3. When a missing input shape cannot be bound by pool selection or in-scope producer selection, this activity composes a NEW goal-shaped impulse whose `endpoint_output_shapes: [target_shape]` constraint will route the dispatched activity to a producer of that shape via the existing variant-selection pipe (goal-processing-activity-driven). Five signal-gathering tasks (forward-chain producers, prior paths with terminal-shape match, concept-db related concepts, impulse co-occurrence ranking, cost/risk priors) accumulate evidence; the parent-chain lookup task surfaces the parent execution's composition_chain for cycle detection; a final LLM compose_goal task ingests all signals and emits a single goal-shaped impulse. Three recursion-safety guards (depth, cycle, budget) are embedded in the compose_goal LLM prompt and surface as `human_in_the_loop_required: true` plus a `failure_mode` per the validators-and-failure-modes taxonomy. The activity itself records traces for Thompson Sampling — variants (cost-optimized, concept-omitted, etc.) emerge from the learning loop via save-as-variant."
                  - generic [ref=e319]:
                    - img [ref=e320]
                    - generic [ref=e327]:
                      - generic [ref=e328]: Validator Dispatch (validators-and-failure-modes)
                      - generic [ref=e329]:
                        - generic [ref=e330]: "[meta]"
                        - generic [ref=e331]: 5t
                      - paragraph [ref=e332]: "Activity-driven implementation of post-task validator dispatch per OpenSpec change 2026-04-26-validators-and-failure-modes (§7). Subscribes to lifecycle:task:completed and chains five tasks: (1) discover_validators — find activities consuming the parent task's outputShapes AND producing validation_result via the canonical `discoverByShapesQuery` impulse-resolve shape (mode=backward + output_shapes=[validation_result]); (2) select_validator_per_shape — pick a validator from the activity envelope using composition_score and Thompson α/β; (3) dispatch_validators — execute the chosen validator with the parent task's outputs as inputs; (4) propagate_failure_mode — when validation_result.passed === false, emit a failure_mode_propagation impulse carrying the structured verifier_negative failure_mode for the dispatcher to stamp on the parent trace; (5) learning_signal_write — record impulse_relevance + tool_argument_pattern signals for the parent task, gating executionSucceeded on validator outcome. As of 2026-04-26 the template uses dotted-path interpolation (e.g. {{lifecycle.taskId}}, {{lifecycle.executionId}}) — the interpolate regex was extended to /\\{\\{([\\w]+(?:\\.[\\w]+)*)\\}\\}/g in iter 7 (activity.ts:6952). F-6 corrected (2026-04-26): task 1 uses the canonical `impulse-resolve` + `discoverByShapesQuery` pattern advertised by activity-api — zero minibob source changes (vessel-integration constraint)."
                  - generic [ref=e333]:
                    - img [ref=e334]
                    - generic [ref=e341]:
                      - generic [ref=e342]: Slot Binding (impulse-binding-selection-layer)
                      - generic [ref=e343]:
                        - generic [ref=e344]: "[meta]"
                        - generic [ref=e345]: 4t
                      - paragraph [ref=e346]: "Activity-driven implementation of pool selection and producer selection per OpenSpec change 2026-04-26-impulse-binding-selection-layer (D5). Subscribes to lifecycle:task:preBinding and chains three tasks: (1) prepare_pool — synthesise impulses from same-named template variables (cheap, deterministic, runs unconditionally); (2) select_or_produce — branches between impulse_pool_selection (when candidates already exist for a missing shape) and producer_selection (when no candidate exists); (3) agent_fill_fallback — LLM-of-last-resort that runs only when steps 1-2 leave shapes unbound and producer_selection returned no producer. As of 2026-04-26 the template uses dotted-path interpolation (e.g. {{lifecycle.taskId}}, {{lifecycle.missingShapes}}) — the interpolate regex was extended to /\\{\\{([\\w]+(?:\\.[\\w]+)*)\\}\\}/g in iter 7 (activity.ts:6952). Array/object subtrees still serialise to JSON-stringified form per existing semantics (resolvers JSON.parse where needed)."
