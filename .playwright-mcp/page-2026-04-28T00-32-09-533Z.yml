                    - generic [ref=e131]:
                      - generic [ref=e132]: Replace Activity (registry-quality)
                      - generic [ref=e133]:
                        - generic [ref=e134]: "[meta]"
                        - generic [ref=e135]: 5t
                      - paragraph [ref=e136]: "Sibling #6 of the registry-quality-pass per OpenSpec change 2026-04-27-activity-registry-quality-pass. Consumes activityReview[] (severity 2-3 — idiom-aligned but improvable) plus pattern[] (from extract-pattern) and synthesizes activityTemplateProposal entries. Five tasks: (1) acquire_targets_and_patterns — impulse-resolve both shapes from the pool; (2) match_patterns_to_reviews — llm; for each review, picks the best pattern as a replacement template's basis; emits matchedReview[] (review + matched pattern); (3) synthesize_replacements — iteration; body=llm generates new template JSON proposals (NOT a write — emits activityTemplateProposal shape; never directly writes; the user/operator decides); aggregateAs=list; (4) validate_proposals — iteration; body=llm validates each proposal against compliance rules; tags valid: true|false; (5) emit_proposals — emits activityTemplateProposal[] + auditReport + goalEnd. CONTEXT-BUDGET: each per-review LLM body is bounded at maxTokens=900 (template proposals are larger than reviews/concepts but still bounded); per-validation pass at maxTokens=400. PROPOSAL-NOT-WRITE posture: this activity NEVER calls activityTemplate_write — it surfaces proposals for an operator (or a downstream activity invoking make-activity) to decide."
                  - generic [ref=e137]:
                    - img [ref=e138]
                    - generic [ref=e145]:
                      - generic [ref=e146]: Concept From Pattern (registry-quality)
                      - generic [ref=e147]:
                        - generic [ref=e148]: "[meta]"
                        - generic [ref=e149]: 3t
                      - paragraph [ref=e150]: "Sibling #5 of the registry-quality-pass per OpenSpec change 2026-04-27-activity-registry-quality-pass. Promotes pattern[] (from extract-pattern) into concept-db via concept synthesis. Three tasks: (1) acquire_patterns — impulse-resolve pattern[] from the pool; (2) synthesize_concepts — iteration over patterns; body=llm produces concept impulses (name, definition, exemplar templates, applicability rules) — these are the concept-db ingestion shape; aggregateAs=list; (3) emit_concept_writes — iteration over concepts; body=impulse-resolve with pointer.type=`concept_write` (when registered) OR emits `concept[]` impulses for the consumer to write (fallback when concept_write is not yet a registered resolver). Emit goalEnd. CONTEXT-BUDGET: per-pattern LLM body bounded at maxTokens=600. concept-db ingestion happens through impulse-resolve to keep this template free of concept-db endpoint knowledge — discovery routes the call. Per-pattern concept count capped at maxConceptsPerPattern (default 2) to bound cost when the LLM is tempted to over-decompose a pattern."
                  - generic [ref=e151]:
                    - img [ref=e152]
                    - generic [ref=e159]:
                      - generic [ref=e160]: Extract Pattern (registry-quality)
                      - generic [ref=e161]:
                        - generic [ref=e162]: "[meta]"
                        - generic [ref=e163]: 4t
                      - paragraph [ref=e164]: "Sibling #4 of the registry-quality-pass per OpenSpec change 2026-04-27-activity-registry-quality-pass. Mines successful execution traces from the load-bearing core for recurring task graphs, resolver-tier mixes, and output-shape sequences. Four tasks: (1) acquire_top_set — impulse-resolve coreActivitySet (read from impulse pool by id, same pattern as review-activity); (2) fetch_success_signatures — iteration over the set; body=impulse-resolve `executionTraceWithSignatures` filtered to success_only=true (the existing context-budget-conscious shape — per-impulse pointer/shape signatures, NOT full trace bodies); aggregateAs=list; (3) cluster_signatures — llm task; clusters traces by structural similarity (task graph shape, resolver tier mix, output shape sequence); emits traceCluster[] (new shape declared in proposal); (4) extract_patterns — iteration over clusters; body=llm extracts a reusable pattern impulse per cluster (description, applicability, success rate, exemplar template ids); aggregateAs=list. Emits pattern[] + goalEnd. CONTEXT-BUDGET: relies entirely on signature shape — never raw trace bodies. Per-template signature cap: maxTracesPerTemplate signature rows × top-N templates ≈ ~30 rows for N=10, lookbackDays=14. Cluster_signatures LLM bounded at maxTokens=2500; per-pattern extraction bounded at maxTokens=500."
                  - generic [ref=e165]:
                    - img [ref=e166]
                    - generic [ref=e173]:
                      - generic [ref=e174]: Prune Activity (registry-quality)
                      - generic [ref=e175]:
                        - generic [ref=e176]: "[meta]"
                        - generic [ref=e177]: 3t
                      - paragraph [ref=e178]: "Sibling #3 of the registry-quality-pass per OpenSpec change 2026-04-27-activity-registry-quality-pass. Consumes activityReview[] (from review-activity) and dispatches `activityTemplate_deprecate` write resolver calls for templates with severity >= minSeverity (default 4) that are NOT in coreActivitySet. Three tasks: (1) filter_deprecation_candidates — iteration over reviews; condition: severity >= minSeverity AND NOT in coreActivitySet; aggregateAs=list; emits pruneCandidate[]; (2) dispatch_deprecate_impulses — iteration over pruneCandidates; body=impulse-resolve with pointer.type=`activityTemplate_deprecate` (write resolver); aggregateAs=list. GATE on B-2 admin scope (the deprecate handler is admin-only via SurrealDB PERMISSIONS); 401 responses are expected when the calling identity lacks admin scope. dryRun=true (default) skips this task entirely; emit_prune_report still runs and surfaces the pruneCandidates as an audit signal; (3) emit_prune_report — llm summarizes the deprecation attempts (success vs 401-blocked vs dry-run-skipped); emits auditReport + goalEnd. CONTEXT-BUDGET: per-template deprecate dispatch carries only the templateId in the pointer; no template bodies echoed. dryRun guard makes the chain observable-without-mutation by default."
                  - generic [ref=e179]:
                    - img [ref=e180]
                    - generic [ref=e187]:
                      - generic [ref=e188]: Review Activity (registry-quality)
                      - generic [ref=e189]:
                        - generic [ref=e190]: "[meta]"
                        - generic [ref=e191]: 4t
                      - paragraph [ref=e192]: "Sibling #2 of the registry-quality-pass per OpenSpec change 2026-04-27-activity-registry-quality-pass. Consumes coreActivitySet (from core-activity-audit) plus the existing templateAuditReport shape (per-template deficiency reports) and produces structured activityReview impulses for the load-bearing core. Four tasks: (1) acquire_targets — resolve coreActivitySet, slice top-K (reviewSize, default 10); (2) iterate_review — iteration over the K templates, body=llm; per-template the LLM produces an activityReview body covering idiom alignment (compliance rules), missing inputShapes/outputShapes, hard-coded paths, all-LLM task chains, redundancy with siblings; aggregateAs=list; (3) score_severity — llm pass that scores each review by severity (1=cosmetic, 5=should-deprecate); emits activityReview[] impulses with severity attached; (4) emit_review_summary — llm summarizes; emits auditReport (NOT templateAuditReport — see openQuestions[0] on shape-collision avoidance) + goalEnd. CONTEXT-BUDGET: per-template LLM body call is bounded at maxTokens=600 over a per-template summary fed by templateAuditReport rather than full template bodies — review never echoes full task graphs. Sandbox: read-only — no file writes, no workingDirectory."
                  - generic [ref=e193]:
                    - img [ref=e194]
                    - generic [ref=e201]:
                      - generic [ref=e202]: Core Activity Audit
                      - generic [ref=e203]:
                        - generic [ref=e204]: "[meta]"
                        - generic [ref=e205]: 4t
                      - paragraph [ref=e206]: "Read-only audit activity that catalogues and ranks the load-bearing core of the activity registry. First concrete deliverable of OpenSpec change 2026-04-27-activity-registry-quality-pass. Five tasks: (1) fetch_templates — pull activityTemplate list (limit=500) via impulse-resolve; (2) fetch_metrics — pull activityTemplatesByMetrics for Thompson α/β + recent execution count; (3) fetch_recent_traces — pull executionTraceWithSignatures (NOT full bodies) for the last lookbackDays days, capped per template at maxTracesPerTemplate; (4) compute_load_bearing — LLM-renders a ranked array of {templateId, rank, evidence} from the three signal sources, emitting a coreActivitySet impulse with the top-N templates; (5) emit_audit_report — LLM summarizes the audit into a human-readable auditReport impulse and calls markGoalComplete (matching make-activity's emission contract). Sandbox: read-only — no file writes, no workingDirectory. Sibling activities (review-activity, prune-activity, replace-activity, extract-pattern, concept-from-pattern) consume coreActivitySet downstream; this activity is the FIRST of six per the proposal — the remaining five are designed against the real coreActivitySet output rather than speculative shapes. Context-budget: trace SIGNATURES not full traces (the existing executionTraceWithSignatures shape was built precisely for this case at activity-api/config.ts:223), capped at maxTracesPerTemplate*coreSetSize ~= 100 signature rows per invocation."
                  - generic [ref=e207]:
                    - img [ref=e208]
                    - generic [ref=e215]:
                      - generic [ref=e216]: Fix Activity Template Schema
                      - generic [ref=e217]:
