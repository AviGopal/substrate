                      - paragraph [ref=e183]: "Operator-dispatched registry cleanup activity. Sibling of prune-activity; differs in that it consumes a deterministic prune-candidate manifest (produced offline by registry-audit tooling — e.g. openspec/changes/2026-04-27-activity-registry-quality-pass/artifacts/canary-prune-manifest.json) rather than activityReview[] severity scores. NO LLM judgment on which templates to prune — the manifest is the source of truth; this activity just iterates and dispatches activityTemplate_deprecate writes. Designed for the post-B-2-admin-scope unblock: when the operator gets admin scope, they can drain the 794 R1/R6/R7/R8 high-confidence candidates without re-running review-activity. Four tasks: (1) acquire_manifest — impulse-resolve with pointer.type=file reading manifestPath (the JSON manifest with shape {candidates: {R1: [...], R6: [...], ...}, highConfidenceIds: [...], summary: {...}}); (2) filter_candidates — LLM extracts the relevant id list per confidenceLevel (HIGH=R1+R6+R7+R8, MEDIUM=R2+R4+R5+R9, ALL=union) and caps at maxDeprecates; emits pruneCandidate[] regardless of dryRun (audit signal); (3) dispatch_deprecate — iteration over pruneCandidates, body=impulse-resolve with pointer.type=activityTemplate_deprecate; CONDITIONAL on dryRun=false; aggregateAs=list captures per-iteration success/error so the audit signal is per-template; (4) emit_summary — small-budget LLM stratifies success vs 401/403/404 and emits pruneReport + goalEnd. SAFETY: dryRun defaults to true; maxDeprecates caps per-invocation deprecates at 50; large manifests require multi-invocation drainage. CONTEXT-BUDGET: per-template deprecate dispatch carries only templateId + reason in the pointer; no template bodies echoed. Manifest format may evolve as new audit rules are added — the filter_candidates task is instructed to tolerate extra rule sections (R10+) gracefully and surface them as a warning rather than crash."
