apiVersion: apps/v1
kind: Deployment
metadata:
  name: metabob-rpc-api
  namespace: metabob
  labels:
    app: metabob-rpc-api
    release: local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metabob-rpc-api
      release: local
  template:
    metadata:
      labels:
        app: metabob-rpc-api
        release: local
    spec:
      containers:
      - name: rpc-api
        image: hashicorp/http-echo:latest
        args:
          - "-text=metabob-rpc-api mock service - healthy"
          - "-listen=:8080"
        ports:
        - containerPort: 8080
          name: http
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "32Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            cpu: "50m"
---
apiVersion: v1
kind: Service
metadata:
  name: metabob-rpc-api
  namespace: metabob
  labels:
    app: metabob-rpc-api
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: metabob-rpc-api
    release: local
