apiVersion: v1
kind: Pod
metadata:
  name: validation-test
  namespace: metabob
spec:
  restartPolicy: Never
  containers:
  - name: test
    image: curlimages/curl:latest
    command: ["/bin/sh", "-c"]
    args:
    - |
      set -e
      echo "=================================="
      echo "Template Loading Persistence Test"
      echo "=================================="
      echo ""
      
      # Configuration
      TEST_ID=$(date +%s)
      TEMPLATE_NAME="Validation Test $TEST_ID"
      
      # Step 1: Create test template
      echo "[1/7] Creating test template..."
      CREATE_RESPONSE=$(curl -s -X POST http://metabob-rpc-api:8080/v2/activities/templates \
        -H "Content-Type: application/json" \
        -d '{
          "name": "'"$TEMPLATE_NAME"'",
          "description": "Test template for validation harness",
          "category": "feature",
          "tasks": [{
            "id": "task-1",
            "description": "Test task",
            "prompt": {
              "template": "Echo: Validation test",
              "maxTokens": 1000
            }
          }]
        }')
      
      echo "Response: $CREATE_RESPONSE"
      
      VARIANT_ID=$(echo "$CREATE_RESPONSE" | grep -o '"variant_id":"[^"]*"' | cut -d'"' -f4)
      
      if [ -z "$VARIANT_ID" ]; then
        echo "❌ FAIL: No variant_id in response"
        exit 1
      fi
      
      echo "✓ Template created: $VARIANT_ID"
      echo ""
      
      # Step 2: Load template (should be in cache)
      echo "[2/7] Loading template (cache hit expected)..."
      LOAD1=$(curl -s -w "\n%{http_code}" http://metabob-rpc-api:8080/v2/activities/templates/$VARIANT_ID)
      HTTP1=$(echo "$LOAD1" | tail -1)
      
      if [ "$HTTP1" != "200" ]; then
        echo "❌ FAIL: Cannot load template (HTTP $HTTP1)"
        exit 1
      fi
      
      echo "✓ Template loaded (HTTP $HTTP1)"
      echo ""
      
      # Wait a bit for everything to settle
      sleep 2
      
      # Note: Steps 3-6 require Redis/SurrealDB access which curl image doesn't have
      # Those will be verified via kubectl commands after this pod completes
      
      echo "Partial validation complete. Template ID: $VARIANT_ID"
      echo "$VARIANT_ID" > /tmp/variant_id.txt
      
      exit 0
