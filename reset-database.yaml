apiVersion: v1
kind: Pod
metadata:
  name: reset-surrealdb
  namespace: activity-system
spec:
  restartPolicy: Never
  containers:
    - name: reset
      image: curlimages/curl:latest
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "Resetting SurrealDB database..."

          # Get credentials from secret
          DB_USER=$(cat /secrets/username)
          DB_PASS=$(cat /secrets/password)

          # Drop all tables in the database
          curl -X POST http://surrealdb.activity-system.svc.cluster.local:8000/sql \
            -H "surreal-ns: activity-system" \
            -H "surreal-db: learning_loop" \
            -u "$DB_USER:$DB_PASS" \
            -d "REMOVE TABLE activity_execution_traces;
                REMOVE TABLE activity_registry;
                REMOVE TABLE variant_performance_metrics;
                REMOVE TABLE activity_composition_graph;
                REMOVE TABLE impulse_relevance_metrics;
                REMOVE TABLE tool_usage;
                REMOVE TABLE goal_execution_paths;
                REMOVE TABLE activity_dataflows;
                REMOVE TABLE activity_prerequisites;
                REMOVE TABLE prerequisite_patterns;
                REMOVE TABLE execution_sequences;
                REMOVE TABLE impulse_data;
                REMOVE TABLE impulse_usage_history;
                REMOVE TABLE ci_runs;
                REMOVE TABLE code_variants;
                REMOVE TABLE organizations;
                REMOVE TABLE users;
                REMOVE TABLE projects;
                REMOVE TABLE api_keys;
                REMOVE TABLE subscriptions;
                REMOVE TABLE schema_version;
                REMOVE TABLE view_execution_traces;"

          echo "Database reset complete"
      volumeMounts:
        - name: db-credentials
          mountPath: /secrets
          readOnly: true
  volumes:
    - name: db-credentials
      secret:
        secretName: surrealdb-credentials
