# Test vessel configuration for devbob container
# Connects to K8s backend (redis, surrealdb, rpc-api in metabob namespace)
# Tests pull -> activity -> push workflow

version: '3.8'

networks:
  default:
    driver: bridge

services:
  devbob-opencode-vessel:
    container_name: devbob-opencode-vessel
    image: devbob:latest
    ports:
      - "3000:3000"   # OpenCode ACP
      - "8082:8082"   # MCP Server (optional)
    volumes:
      # Mount local metabob-opencode repo for testing
      - ./repos/metabob-opencode:/workspace
      # Mount git credentials
      - ${HOME}/.gitconfig:/root/.gitconfig:ro
      - ${HOME}/.ssh:/root/.ssh:ro
    environment:
      CODEBASE_NAME: metabob-opencode
      HOSTNAME: devbob-opencode-vessel
      
      # Git clone metabob-opencode repository (use local path for testing)
      REPO_URL: ""
      REPO_CHECKOUT_MODE: "skip"
      REPO_BRANCH: "main"
      
      # Git credentials and behavior
      GIT_AUTO_PUSH: "false"
      GIT_PUSH_ON_EXIT: "false"
      GIT_USER_NAME: ${GIT_USER_NAME:-Devbob Agent}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-devbob@metabob.local}
      
      # OpenCode ACP Configuration
      ACP_PORT: "3000"
      ACP_HOSTNAME: "0.0.0.0"
      
      # Metabob backend connection (K8s services via host network)
      METABOB_API_URL: ${METABOB_API_URL:-http://host.docker.internal:8080}
      METABOB_PROJECT_ID: ${METABOB_PROJECT_ID:-opencode-vessel-test}
      METABOB_API_KEY: ${METABOB_API_KEY}
      
      # SurrealDB connection (K8s service)
      SURREAL_HOST: ${SURREAL_HOST:-host.docker.internal}
      SURREAL_PORT: ${SURREAL_PORT:-8000}
      SURREAL_USER: ${SURREAL_USER:-root}
      SURREAL_PASS: ${SURREAL_PASS}
      
      # Redis connection (K8s service)
      REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
      REDIS_PORT: ${REDIS_PORT:-6379}
      
      # LLM Provider
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WAIT_FOR_BACKEND: "false"  # Don't wait since using K8s services
      
      # Agent role
      AGENT_ROLE: vessel-codebase-manager
      MANAGED_REPO: metabob-opencode
    extra_hosts:
      # Allow container to reach K8s services on host
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  devbob_opencode_workspace:
    name: devbob_opencode_workspace
