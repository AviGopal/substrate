# Quick devbob startup using existing devbob:latest image
services:
  devbob-opencode:
    env_file:
      - .env.devbob
    container_name: devbob-opencode
    image: devbob:latest
    ports:
      - "3004:3004"  # ACP server
      - "3100:3100"  # metabob-cli dashboard
    volumes:
      - ./repos/metabob-opencode:/workspace
      - devbob_config:/config
      # Mount the devbob config file to a path the container can find
      - ./configs/opencode.devbob.json:/config/opencode.devbob.json
      # Mount updated entrypoint script (overrides baked-in version)
      - ./configs/devbob-entrypoint.sh:/usr/local/bin/devbob-entrypoint.sh:ro
    environment:
      CODEBASE_NAME: opencode
      ACP_PORT: "3004"
      ACP_HOSTNAME: "0.0.0.0"
      LOG_LEVEL: INFO
      NODE_OPTIONS: "--max-old-space-size=4096"
      # Use container-specific config mounted at /config
      OPENCODE_CONFIG: /config/opencode.devbob.json
      # Auto-approve permissions for TUI attach mode
      OPENCODE_AUTO_APPROVE_PERMISSIONS: "true"
    mem_limit: 6g
    mem_reservation: 2g
    restart: unless-stopped
    command: ["acp"]

volumes:
  devbob_config:
