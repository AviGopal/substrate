# WATCHDOG DEMOTION (2026-07-09 restore-contiguous-shape-flow §4).
# gap-compose no longer runs the compose work on cadence — composable-gap drain
# is event-triggered (GapDrainObserver nudges gap_to_feature on gap.written /
# execution_completed events). This tick is now a degraded-mode watchdog: it
# fires gap_to_feature ONLY when open composable intents exist and the flow has
# been inactive for WATCHDOG_STALL_MIN minutes; quiet checks write nothing.
# Sorts after run-dir.conf (alphabetical), so this ExecStart wins.
# Reversible: delete this drop-in + daemon-reload to restore the direct tick.
[Service]
Environment=WATCHDOG_FLOW=gap-compose
Environment=WATCHDOG_RESTART_IMPULSE=gap_to_feature
Environment=WATCHDOG_RELEVANT_SHAPE=substrateGap
Environment=WATCHDOG_ROUTE_FILTER=composable
Environment=WATCHDOG_STALL_MIN=20
ExecStart=
ExecStart=/root/.bun/bin/bun ${SUBSTRATE_RUN_DIR}/watchdog-tick.ts
