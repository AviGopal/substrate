# SELF-ACTIVATION repoint (2026-06-26, generalized from compose-teacher). Run from
# the writable run-dir (${SUBSTRATE_RUN_DIR}=/workspace/active-scripts, seeded fresh
# each boot by substrate-active-scripts-seed.service) instead of the read-only,
# stale-after-mount host bind path, so the activate_substrate_script resolver can
# make a new version live on the next timer firing WITHOUT a container restart.
# Additive + reversible: delete this drop-in + daemon-reload to revert.
[Unit]
Requires=substrate-active-scripts-seed.service
After=substrate-active-scripts-seed.service

[Service]
ExecStart=
ExecStart=/root/.bun/bin/bun ${SUBSTRATE_RUN_DIR}/gap-compose-tick.ts
