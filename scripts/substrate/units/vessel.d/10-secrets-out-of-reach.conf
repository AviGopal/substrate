# SECRETS NEVER IN AGENT REACH (user locality ruling). One drop-in, attached to
# every vessel unit by a symlink in <unit>.service.d/; the attachment set and the
# exceptions are checked by validation/scripts/vessel-secrets-dropin.test.sh.
#
# Units run as root, so file modes (600 file, 700 dir) stop nothing; only the
# mount namespace does. A vessel that serves agent-directed reads, runs an
# agent's shell, or reads a caller-supplied path is one path away from these
# files otherwise. systemd reads EnvironmentFile= in the manager BEFORE it builds
# this namespace, so a unit listing EnvironmentFile=-/workspace/.substrate-secrets
# still loads its values; blocking the path costs that unit nothing.
#
# The leading '-' keeps the unit starting on a node where a path does not exist.
# Takes effect at the unit's next start (a daemon-reload alone changes nothing
# for a running process).
#
# A unit that must read these paths at runtime does not get this file: it is
# DECLARED in vessel.d/EXCEPTIONS with its reason. Never reset the list with an
# empty InaccessiblePaths= in a later drop-in; the test refuses that too.
[Service]
InaccessiblePaths=-/workspace/.substrate-secrets
InaccessiblePaths=-/workspace/.substrate-secrets.d
# The scoped trust-root secrets (secrets-manifest.json). Consumers (identity,
# discovery, federation transport) receive theirs through EnvironmentFile=, which
# the manager reads before building this namespace, so blocking the files costs
# them nothing; no vessel opens these at runtime. Without this, every root vessel
# could open admin.env (measured 10-02: mode 600, readable in 11 vessels).
InaccessiblePaths=-/etc/substrate/env.d
InaccessiblePaths=-/etc/substrate/admin.env
# The pinned judge's state (gate-runner): accepted.sha, the accepted gate copy, its history,
# ledger and promote.request. Lane code that could write these would be the author of its
# own approval. Remount resistance arrives with S1c's capability drop; until then this binds
# plain opens. substrate-pull-sync.service (EXCEPTIONS) keeps access: it IS the runner.
InaccessiblePaths=-/workspace/.gate
