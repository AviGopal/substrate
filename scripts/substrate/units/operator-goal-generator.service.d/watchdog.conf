# WATCHDOG DEMOTION (2026-07-09 restore-contiguous-shape-flow §4, wave 2).
# Operator-goal minting is not cadence work: it runs only when open intents
# exist and no flow activity for WATCHDOG_STALL_MIN minutes. Quiet = writeless.
# Sorts after run-dir.conf; reversible by deleting this drop-in + daemon-reload.
[Service]
Environment=WATCHDOG_FLOW=operator-goal-generator
Environment=WATCHDOG_RESTART_EXEC=/workspace/active-scripts/operator-goal-generator.ts
Environment=WATCHDOG_RELEVANT_SHAPE=substrateGap
Environment=WATCHDOG_ROUTE_FILTER=any
Environment=WATCHDOG_STALL_MIN=60
ExecStart=
ExecStart=/root/.bun/bin/bun ${SUBSTRATE_RUN_DIR}/watchdog-tick.ts
