# Model pin for the google llm-resolver sibling. A LATER EnvironmentFile than
# /etc/substrate/env (drop-ins load after the main unit), so this LLM_DEFAULT_MODEL
# wins over the shared one. The file is written by gen-env.sh at boot; the leading
# dash makes it optional so the unit still starts if gen-env has not run yet.
[Service]
EnvironmentFile=-/etc/substrate/llm-google.env
# Stateless LLM proxy: a hung in-flight upstream call must not hold the stop job
# for the 90s default TimeoutStopSec (see the opus sibling's note). 15s is
# generous for a clean deregister.
TimeoutStopSec=15
