# WATCHDOG DEMOTION (2026-07-09 restore-contiguous-shape-flow §4, wave 2).
# Composition teaching runs only when open intents exist and flow has stalled;
# quiet checks write nothing. On stall the original tick runs once.
# Sorts after run-dir.conf; reversible by deleting this drop-in + daemon-reload.
[Service]
Environment=WATCHDOG_FLOW=compose-teacher
Environment=WATCHDOG_RESTART_EXEC=/workspace/active-scripts/compose-teacher.ts
Environment=WATCHDOG_RELEVANT_SHAPE=substrateGap
Environment=WATCHDOG_ROUTE_FILTER=any
Environment=WATCHDOG_STALL_MIN=45
ExecStart=
ExecStart=/root/.bun/bin/bun ${SUBSTRATE_RUN_DIR}/watchdog-tick.ts
