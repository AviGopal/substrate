# SELF-ACTIVATION repoint (2026-06-26). Run compose-teacher from the writable
# run-dir (/workspace/active-scripts, seeded fresh each boot by
# substrate-active-scripts-seed.service) instead of the read-only, stale-after-
# mount host bind path. This lets the substrate-authored `activate_substrate_script`
# resolver make a new version of compose-teacher.ts live on the next timer firing
# WITHOUT an operator container restart.
#
# Drop-in, so it's additive + reversible: delete this file + daemon-reload to
# revert to the bind-path ExecStart in the base unit. The empty ExecStart= clears
# the inherited command before setting the new one (systemd requires this for
# oneshot ExecStart override).
[Unit]
Requires=substrate-active-scripts-seed.service
After=substrate-active-scripts-seed.service

[Service]
ExecStart=
ExecStart=/root/.bun/bin/bun /workspace/active-scripts/compose-teacher.ts
