# Federation peering: fan capability queries out to the hub discovery so this
# substrate sees the shared namespace (hub = namespace root). MAX_PEER_DEPTH=1
# keeps hub responses from recursing further.
#
# This file deliberately sets NO peer endpoint. PEER_DISCOVERY_ENDPOINTS is
# resolved per-deployment by gen-env.sh (explicit env > persisted explicit >
# HUB_DISCOVERY_URL > empty) and written into /etc/substrate/env — which systemd
# applies AFTER every `Environment=` directive, so a value set here would lose to
# the env file anyway. A literal address here is therefore both inert and a
# law-11 violation: it ships to every substrate built from this image regardless
# of where that substrate lives. Unset means no forwarding, which is the correct
# default for a substrate that does not yet know its hub.
#
# PEER_FANOUT_MODE=union merges peer producers into non-empty local results
# (dialable rows only, self-echoes filtered, local wins on vesselId collision) so
# duplicate vessels across substrates — two activity-apis, two goal-hosts — are
# selectable candidates everywhere, not shadowed by whichever is local.
# Previously this drop-in lived only inside the container (lost on rebuild); it
# belongs here with the other unit drop-ins.
[Service]
Environment=MAX_PEER_DEPTH=1
Environment=PEER_FANOUT_MODE=union
