# The owner rows (channels, shape schemas, the walk's arm) come from
# walk-owner-seed.service, and SPEC-V3 §9 has them in place before this vessel
# starts: described-shape reads its targets at start and again at every heartbeat;
# the walk exits when its own arm row is missing at boot.
#
# Wants=, not Requires=: a seeder run that fails (a rerun while records restarts) must not stop this vessel. Under
# Requires= systemd stopped it with "Dependency failed", and the seeder's next successful run did not start it again.
# The vessel reads the owner rows itself (the walk each move, described-shape each heartbeat), so it runs on the rows
# already written while a rerun fails; at boot, After= still orders it behind the seeder, and a vessel that finds its
# rows missing exits and is restarted (50-restart-with-deps.conf) once the seeder's own retry writes them.
[Unit]
Wants=walk-owner-seed.service
After=walk-owner-seed.service
