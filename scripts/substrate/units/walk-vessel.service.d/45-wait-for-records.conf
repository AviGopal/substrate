# records is Type=simple, so After=records-vessel.service (50-restart-with-deps.conf) orders this start after records'
# process starts, not after it serves: started together (a boot, or a restart this unit is PartOf), the walk's first
# records read can land before records listens. Wait for records' /health, at most 30 s, then start regardless (the
# leading '-': a records that never answers is the walk's own failure to report, not a reason to stay down). 8510 is
# RECORDS_PORT in records-vessel.service; learner-units.test.sh holds the two equal.
[Service]
ExecStartPre=-/bin/sh -c 'i=0; while [ "$i" -lt 30 ]; do curl -fs --max-time 1 http://127.0.0.1:8510/health >/dev/null 2>&1 && exit 0; i=$((i + 1)); sleep 1; done; echo "records did not answer /health in 30 s; starting anyway"'
