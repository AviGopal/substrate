# The owner rows (vessel keys, channels, shape schemas, the walk's arm) come from
# walk-owner-seed.service, and SPEC-V3 §9 has them in place before this vessel
# starts: described-shape reads its targets once at start; the walk exits when
# its own arm row is missing at boot.
[Unit]
Requires=walk-owner-seed.service
After=walk-owner-seed.service identity-seeder.service
