# Restart after a dependency restarts (user ruling 2026-11-09). This vessel exits
# when a call it depends on fails, and the rendered unit has Restart=no, so a
# boot-time restart of discovery or identity (pull-sync converging them) used to
# leave it down for good.
#
# PartOf=: a stop or restart of a listed unit is passed on to this one, so this
# vessel comes back with a fresh registration and fresh connections. (A listed
# unit that a profile masks, such as identity on a spoke, is ignored.)
# Restart=on-failure: it also comes back after any exit on a failed call.
# systemd 252 ignores RestartSteps= and RestartMaxDelaySec=, so the backoff
# reads NRestarts (consecutive automatic restarts; reset by a manual start or
# restart). It waits nothing on a first start, then 5, 10, 20 and 40 s, then
# 55 s. This is the goal-host-vessel.service line, and a fault in it never
# blocks a start.
[Unit]
PartOf=discovery-vessel.service identity-vessel.service records-vessel.service
After=discovery-vessel.service identity-vessel.service records-vessel.service

[Service]
Restart=on-failure
RestartSec=5
ExecStartPre=-/bin/sh -c 'n=$(systemctl show -p NRestarts --value described-shape-vessel.service); [ "$n" -gt 0 ] 2>/dev/null || exit 0; d=$((5 << (n < 5 ? n - 1 : 4))); [ "$d" -gt 55 ] && d=55; sleep "$d"'
