# The transport server consumes @avigopal/libp2p-federation-transport as a
# bun file: dep, which bun COPIES into node_modules at install time — so a
# pull-sync mirror of the lib into /vessels/libp2p-federation-transport would
# otherwise never reach the running process. Refresh the copy on every unit
# (re)start: pull-sync converges the clone → mirrors to /vessels → restarts
# this unit (inventory maps repo libp2p-federation-transport → this unit) →
# this pre-step re-materializes the lib the server actually imports. No-op
# when the runtime dir is absent (image-baked copy stays authoritative).
[Service]
ExecStartPre=/bin/sh -c 'if [ -d /vessels/libp2p-federation-transport/src ]; then for t in /workspace/git/super-repo/scripts/substrate/federation-relay/node_modules/@avigopal/libp2p-federation-transport /workspace/git/super-repo/repos/libp2p-federation-transport; do [ -d "$t/src" ] && cp -a /vessels/libp2p-federation-transport/src/. "$t/src/" || true; done; fi'
