# The transport server consumes @avigopal/libp2p-federation-transport as a
# bun file: dep, which bun COPIES into node_modules at install time — so a
# pull-sync mirror of the lib into /vessels/libp2p-federation-transport would
# otherwise never reach the running process. Refresh the copy on every unit
# (re)start: pull-sync converges the clone → mirrors to /vessels → restarts
# this unit (inventory maps repo libp2p-federation-transport → this unit) →
# this pre-step re-materializes the lib the server actually imports.
#
# THE TARGET IS THE TREE THE UNIT RUNS. systemd runs ExecStartPre= in the unit's
# WorkingDirectory=, the directory bun resolves the package from, so the target
# is node_modules/ RELATIVE to it and cannot drift from the unit again. It used
# to name the workspace clone's copy and the libp2p submodule worktree, neither
# of which the unit loads (it runs the image-baked tree), so no lib change went
# live by a restart, and every start dirtied that submodule worktree.
#
# STAGE, VERIFY, THEN RENAME. The source is copied into a sibling of src/ (same
# filesystem) and compared with diff -r; only a verified copy is moved in, file
# by file, by rename. A failed or interrupted copy leaves src/ as it was, never a
# truncated file. src/ is not swapped by one directory rename: on the container's
# overlay root a directory from the image layer cannot be renamed (EXDEV), as
# pull-sync's converge_tier_b notes. Files the source lacks are left in place.
#
# No-op, and the start goes on, when the source is absent or empty or the target
# has no src/ (the image-baked copy stays authoritative). The line below carries
# no brace-form variable and no percent sign: systemd would substitute those
# before sh sees them (validation/scripts/lib-refresh-dropin.test.sh).
[Service]
ExecStartPre=/bin/sh -c 'S=/vessels/libp2p-federation-transport/src; t=node_modules/@avigopal/libp2p-federation-transport; [ -d "$S" ] && [ -n "$(ls -A "$S")" ] && [ -d "$t/src" ] || exit 0; rm -rf "$t"/.src-refresh.*; n=$(mktemp -d "$t/.src-refresh.XXXXXX") || exit 0; if cp -a "$S/." "$n/" && diff -r "$S" "$n" >/dev/null; then (cd "$n" && find . -mindepth 1 -type d) | while read -r d; do mkdir -p "$t/src/$d"; done; (cd "$n" && find . ! -type d) | while read -r f; do mv -f "$n/$f" "$t/src/$f"; done; echo "lib-refresh: $PWD/$t/src refreshed from $S"; else echo "lib-refresh: the copy of $S did not verify; $PWD/$t/src left as it was" >&2; fi; rm -rf "$n"; exit 0'
