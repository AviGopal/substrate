# SELF-ACTIVATION repoint (consistent with gap-compose/compose-teacher). Run from
# the writable run-dir (${SUBSTRATE_RUN_DIR}=/workspace/active-scripts, seeded fresh
# each boot by substrate-active-scripts-seed.service) instead of the read-only,
# stale-after-mount host bind path, so a substrate-authored new version of the
# scanner can go live on the next firing WITHOUT a container restart.
# Additive + reversible: delete this drop-in + daemon-reload to revert.
[Unit]
Requires=substrate-active-scripts-seed.service
After=substrate-active-scripts-seed.service

[Service]
ExecStart=
ExecStart=/root/.bun/bin/bun ${SUBSTRATE_RUN_DIR}/surgical-gap-scan.ts
