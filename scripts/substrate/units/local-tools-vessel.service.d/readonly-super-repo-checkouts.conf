# The super-repo's submodule checkouts are read-only to local-tools.
#
# /workspace/git/super-repo/repos/<vessel> is the tree pull-sync converges onto each gitlink,
# and several readers treat it as the vessel's source. Nothing served by local-tools has a
# legitimate reason to write there: composes edit isolated worktrees under
# /workspace/git/compose and the runtime under /vessels, and landings commit through the push
# clones under /workspace/git/vessels.
#
# Writes did land there. A goal-host walk that fell through from a draining edit-intent
# compose ran `sed -i ... repos/<vessel>/src/...` through local-tools' bounded_shell, which
# resolved the relative path against its default cwd, the super-repo. The edited checkout
# then carried tracked changes, pull-sync refused to move it onto its gitlink, and every
# reader of that checkout saw source days old. bounded_shell's default cwd is now a scratch
# directory, which removes that one route; this drop-in makes the kernel refuse the write
# whatever the command (sed, tee, cp, python, git apply) and whatever cwd it runs in.
#
# Scoped to the checkouts only: /vessels, /workspace/tmp, the push clones and other
# repositories under /workspace/git (for example a probe repository a walk commits to)
# stay writable. Verified with a transient unit carrying the same property: a write under
# the checkouts fails with EROFS while /workspace/tmp and a sibling repository accept writes.
[Service]
ReadOnlyPaths=/workspace/git/super-repo/repos
