# DEFAULT-DENY for the scoped trust-root secrets and the persisted secrets store. A top-level drop-in: systemd applies
# service.d/*.conf to EVERY .service unit (vessels, ticks, oneshots, timers' services,
# transient units), so a unit nobody remembered to opt in, or one added later, is
# covered without doing anything. The pull-sync converger installs it like any other
# drop-in directory, and the image COPY of units/ puts it in /usr/lib/systemd/system.
#
# It masks a DIRECTORY, never a file. InaccessiblePaths= binds what the path named when
# the unit started; render-secret-scope.sh replaces the files inside by rename, so a
# file-level mask would cover a dead inode after the first render (measured 10-02: the
# admin.env inode inside a vessel equalled the live one outside). The directory is
# created once (entrypoint, renderer) and never removed, renamed or recreated.
#
# Consumers lose nothing: systemd's manager reads EnvironmentFile= BEFORE it builds the
# unit's namespace, so identity-vessel, identity-seeder, discovery-vessel and
# federation-transport-vessel still receive their values with this mask in place
# (proved by secret-mask-probe.sh selftest, the positive control).
#
# EXEMPTIONS are units that must open these files AT RUNTIME (they write them). Each
# one carries a same-named file in its own <unit>.service.d/, which replaces this one
# for that unit only, and is listed with its reason in service.d/EXEMPT. Nothing else
# may override this file or reset InaccessiblePaths= (validation/scripts/secret-dir-mask.test.sh).
# The leading '-' keeps a unit starting where the directory does not exist (a host
# without the substrate layout); it takes effect at each unit's next start.
[Service]
InaccessiblePaths=-/etc/substrate/private
# The persisted store (every secret, in the workspace volume): the same stable-directory rule.
InaccessiblePaths=-/workspace/.substrate-private
