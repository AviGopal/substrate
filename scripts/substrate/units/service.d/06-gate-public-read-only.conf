# DEFAULT READ-ONLY for /workspace/.gate-public, the reader-facing view of the accepted gate (pull-sync's
# publish_gate_public: self-facts.json plus source.json). development-vessel's self-fact judge trusts those rows
# only because no unit that runs lane code can write them, so this applies to EVERY .service (a top-level
# drop-in; units added later are covered), and the one writer, substrate-pull-sync.service, overrides it with
# a same-named file in its own .d/, listed with its reason in service.d/WRITERS. Nothing else may override it
# (validation/scripts/gate-public-read-only.test.sh). The leading '-' keeps units starting where the directory
# does not exist; entrypoint.sh creates it before systemd, and it takes effect at each unit's next start.
[Service]
ReadOnlyPaths=-/workspace/.gate-public
