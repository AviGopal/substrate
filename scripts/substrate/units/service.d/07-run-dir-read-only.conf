# DEFAULT READ-ONLY for the tick-script run dir (${SUBSTRATE_RUN_DIR}=/workspace/active-scripts). Tick units run as
# root with the fleet's EnvironmentFile from here, and the run dir holds the gate-ACCEPTED copies; a unit that could
# write it could make unjudged code live (development-vessel's activate_substrate_script did, from clone HEAD).
# Applies to EVERY .service; the writers (pull-sync's reseeds and the boot seed) override it with a same-named file
# in their own .d/, listed in service.d/WRITERS. Pre-created by entrypoint.sh, as for 06.
[Service]
ReadOnlyPaths=-/workspace/active-scripts
