# DEFAULT-DENY for identity's key directory (org keys 1a: the org root's private part). A top-level drop-in: systemd
# applies service.d/*.conf to EVERY .service unit (vessels, ticks, oneshots, timers' services, transient units),
# identity-vessel included. identity reaches its keys only through a bind of this directory at another path
# (identity-vessel.service.d/30-identity-keys-bind.conf), so no unit, identity included, sees it at this path, and no
# unit needs an exemption: never override this file by name and never reset InaccessiblePaths= (identity's create
# audits every unit for exactly that, and refuses; validation/scripts/identity-keys-mask.test.sh pins it in the tree).
# It masks a DIRECTORY, created once before any unit starts (identity-keys-dir.sh); the leading '-' keeps a unit
# starting where it does not exist. Takes effect at each unit's next start.
[Service]
InaccessiblePaths=-/workspace/.substrate-identity-keys
