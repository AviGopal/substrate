# Every service, on every stop (clean, crash or restart), removes the discovery rows it registered, so discovery
# never forwards a shape to an endpoint that is gone. Without it a stopped vessel's row stays "healthy" until its
# 5-minute TTL plus the prune, and every resolve of its shapes in that window is forwarded to the dead endpoint and
# answered 502 forward_failed. Most vessels never deregister themselves on SIGTERM; this covers all of them in one
# place. --unit matches only this unit's own rows (exact name or name plus an instance suffix, this substrate's rows
# only) and exits 0 when it registered nothing. Best-effort: the leading '-' keeps a failed call from failing the stop.
[Service]
ExecStopPost=-/usr/local/bin/discovery-deregister --unit %N
