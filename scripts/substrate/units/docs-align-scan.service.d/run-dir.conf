# SELF-ACTIVATION repoint (2026-07-02, same pattern as the other tick units).
# Run from the writable run-dir seeded by substrate-active-scripts-seed.service
# instead of the host bind path (${SUBSTRATE_ROOT} is host-coupled and empty
# under the bare docker-run contract).
[Unit]
Requires=substrate-active-scripts-seed.service
After=substrate-active-scripts-seed.service

[Service]
ExecStart=
ExecStart=/root/.bun/bin/bun ${SUBSTRATE_RUN_DIR}/docs-align-scan.ts
