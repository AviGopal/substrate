# identity-vessel reaches its key directory through a bind at /run/identity-keys: the real directory is masked for
# every service, identity included (service.d/07-identity-keys-out-of-reach.conf), so nothing is reset and identity's
# other masks stay as they are. identity's store writes at the bind target and its create audit checks that every other
# unit masks the real directory; both paths are identity's own defaults (resolvers/org-root.ts), so this unit sets no
# Environment= line. '-': a node without the directory still starts identity, which then refuses to create a root (no
# key directory), never validating keys any less.
[Service]
BindPaths=-/workspace/.substrate-identity-keys:/run/identity-keys
