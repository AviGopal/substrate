# WATCHDOG DEMOTION (2026-07-09 restore-contiguous-shape-flow §4).
# The funnel entry (apply_proposal_as_patch) is nudged by the event path; this
# tick only restarts the funnel when proposals exist and nothing has moved for
# WATCHDOG_STALL_MIN minutes. Quiet checks write nothing.
# Sorts after run-dir.conf (alphabetical), so this ExecStart wins.
# Reversible: delete this drop-in + daemon-reload to restore the direct tick.
[Service]
Environment=WATCHDOG_FLOW=funnel-drain
Environment=WATCHDOG_RESTART_IMPULSE=apply_proposal_as_patch
Environment=WATCHDOG_RELEVANT_SHAPE=substrateGap
Environment=WATCHDOG_ROUTE_FILTER=any
Environment=WATCHDOG_STALL_MIN=30
Environment=WATCHDOG_ACTIVITY_PATHS=/workspace/proposals:/workspace/pool/drain-log.jsonl
ExecStart=
ExecStart=/root/.bun/bin/bun ${SUBSTRATE_RUN_DIR}/watchdog-tick.ts
