# Records accepts owner rows only from RECORDS_OWNER_KEY_ID (config.ts). The
# installation mints the owner key in identity-seeder (seed-identity.ts
# ensureWalkVesselKeys) and writes its key id into /etc/substrate/env on every
# boot; the key itself stays under /workspace/.substrate-private. Order after
# identity-seeder so the id and the key are in place, on a first boot too.
[Unit]
After=identity-seeder.service
Wants=identity-seeder.service
