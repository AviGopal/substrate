# This vessel's own ApiKey, visible to this unit alone.
#
# 10-secrets-out-of-reach.conf (and service.d/05) hide /workspace/.substrate-private
# from every vessel, so the vessel cannot open its key there. BindReadOnlyPaths=
# resolves its source in the manager's view, before the unit's namespace masks it,
# and mounts the one file at /run/records-vessel.key inside this unit's namespace only: other
# units see at most an empty mount point. The manifest's key-path env names that
# path. (LoadCredential= would be the usual tool; it delivers nothing in this
# container image's systemd, measured.) The user places the key file (§9 step 3 of
# openspec/changes/walk-vessel/SPEC-V3.md); while it is absent the unit fails to
# start, which is the spec's "no key, no start".
[Service]
BindReadOnlyPaths=/workspace/.substrate-private/walk-vessels/records-vessel.key:/run/records-vessel.key
