# Location transparency: prefer the federation-transport egress route for ANY
# discovery candidate advertising a libp2p multiaddr, not just peer-discovered
# rows. With this on, vessel-to-vessel resolves ride the relay-capable transport
# uniformly — the same path whether the producer is in-container or on another
# substrate — instead of splitting into localhost-HTTP vs libp2p per row origin.
# Flag OFF (unset) = status quo: egress only for protocol:"libp2p" rows.
#
# Prereqs before enabling on a new substrate: reservation renewal fixed in
# @avigopal/libp2p-federation-transport (else inbound dies at the relay's 1h TTL)
# and goal-host appending &vessel= to /egress/resolve so duplicate shapes route
# to the row the walk actually selected.
[Service]
Environment=PREFER_LIBP2P_ROUTE=1
