# Let a mitosis cutover DRAIN instead of killing the work in flight.
#
# gracefulShutdown() (goal-host-vessel/src/index.ts ~:484) already does the right
# thing: on SIGTERM it stops advertising, 503s NEW dispatches so callers retry the
# restarted instance, and waits for in-flight walks to reach zero. Its own budget is
# GOAL_HOST_DRAIN_MS (default 80s) and its comment says that is "bounded under the
# unit's 90s TimeoutStopSec".
#
# Without this drop-in the unit declares no
# TimeoutStopSec at all, so it inherits systemd's DefaultTimeoutStopSec=90s — and
# 80s < 90s means the drain can complete; the ordering is not the defect.
#
# The defect is that 80s is nowhere near
# long enough for what it has to drain. A feature_compose edit runs 5-8 MINUTES, and landing any
# goal-host edit triggers a cutover that restarts goal-host — killing whatever else
# is in flight, and a share of dispatches
# die as "interrupted: goal-host restarted (cutover)", with long edit
# dispatches hit far above that rate. Edit-intent goals are DELIBERATELY excluded
# from the auto-resume path at index.ts:10315 (re-running a partially-applied edit
# could double-apply it), so for that class an interruption is permanent loss.
#
# Ordering is still maintained deliberately: drain budget (240s) < stop timeout
# (300s), so the drain's own bounded deadline fires first and the process exits on
# its own terms, leaving SIGKILL as the backstop it is meant to be.
#
# VERIFY THIS TOOK EFFECT — do not assume it did:
#   systemctl show goal-host-vessel -p DropInPaths -p TimeoutStopUSec
# This file living in git is NOT evidence. units/ is copied into the image at
# BUILD time (Dockerfile.substrate:213); pull-sync deploys vessel SOURCE from git
# but never unit files, so a systemd-level change here stays inert until the image
# is rebuilt — and nothing reports that it didn't take.
#
# The cost is bounded and deliberate: a cutover may now take up to 5 minutes, during
# which goal-host 503s new dispatches while discovery routes work elsewhere. That is
# strictly better than destroying an in-flight edit that cannot be resumed.
[Service]
TimeoutStopSec=300
Environment=GOAL_HOST_DRAIN_MS=240000
