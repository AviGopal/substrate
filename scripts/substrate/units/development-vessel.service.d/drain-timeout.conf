# Give development-vessel room to DRAIN instead of losing the compose in flight.
#
# development-vessel hosts feature_compose and patch_with_tools — the drafter. A
# single feature_compose run takes 5-8 MINUTES. The unit's stop timeout was
# systemd's 90s default, so every restart SIGKILLed whatever was mid-compose.
#
# That was not a delay, it was permanent loss: edit-intent goals are deliberately
# excluded from goal-host's auto-resume path (index.ts:10315), because re-running a
# partially applied edit could double-apply it. Measured 2026-08-05: six consecutive
# dispatches of one small activity-api edit failed, every one of them with
# "EDIT-INTENT transient compose failure (The socket connection was closed
# unexpectedly)" as development-vessel bounced underneath the call — never once on
# the merits of the change.
#
# The timeout alone fixes NOTHING. Until VesselDaemon.stop() was taught to drain, it
# called Bun's server.stop(true) — force-close every active connection — so SIGTERM
# killed in-flight work instantly no matter how long systemd was willing to wait.
# The two changes only work together: the daemon drains, this gives it room.
#
# Ordering is the whole point, and it mirrors goal-host-vessel's drop-in: the drain
# budget must sit UNDER the stop timeout so the drain's own bounded deadline fires
# first and exits cleanly on its own terms. If it were the other way round, systemd's
# SIGKILL would land first and the drain could never complete — exactly the defect
# goal-host carried for weeks while its drop-in sat committed and undeployed.
#
# 240s drain < 300s stop, leaving 60s of headroom for deregistration and the final
# force-close backstop. The cost is bounded and deliberate: a cutover may now take up
# to 5 minutes, during which the vessel serves nothing new and discovery routes
# elsewhere. That is strictly better than destroying an unresumable edit.
[Service]
TimeoutStopSec=300
Environment=VESSEL_DRAIN_MS=240000
