# WATCHDOG DEMOTION (2026-07-09 restore-contiguous-shape-flow §4, wave 2).
# boredom-vessel is a long-lived daemon (Type=simple), not a oneshot tick, so
# demotion here is cadence-stretch, not ExecStart re-point: the GapDrainObserver
# event path is the PRIMARY selection driver; the boredom selector becomes the
# degraded-mode backstop. Autonomous dispatch slows ~12x (2s -> 10min between
# dispatches, exercise/autopromote hourly); a longer idle window makes it defer
# whenever real goal activity is recent. Detectors it dispatches keep running,
# just at backstop cadence — event-triggered drain owns the fast path.
# Reversible: delete this drop-in + daemon-reload + restart boredom-vessel.
[Service]
Environment=BOREDOM_MIN_DISPATCH_INTERVAL_MS=600000
Environment=BOREDOM_EXERCISE_INTERVAL_MS=3600000
Environment=BOREDOM_AUTOPROMOTE_INTERVAL_MS=3600000
Environment=BOREDOM_IDLE_WINDOW_SECONDS=1800
