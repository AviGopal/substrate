[Service]
# Stateless LLM proxy: a hung in-flight upstream call must not hold the stop job
# for the 90s default TimeoutStopSec — observed 2026-07-04 (4 incidents): the
# opus unit ignored SIGTERM, its stop job serialized the whole restart
# transaction, and llm-resolver-vessel + goal-host start jobs waited 90s
# (the 'start wedge'). 15s is generous for a clean deregister.
TimeoutStopSec=15

# Drain budget MUST sit under the 15s stop timeout above, or the drain cannot complete and
# systemd's SIGKILL becomes the normal exit path again — the same by-construction defect as a
# caller timeout below its callee's floor, which this fleet has now hit three separate ways.
#
# VesselDaemon.stop() gained a bounded drain (ias-executor-ts vessel-daemon.ts) whose DEFAULT is
# 240000ms, sized for development-vessel where a feature_compose runs 5-8 minutes. That default is
# 16x this unit's stop timeout. Left unset here, these arms would wait on pendingRequests until
# SIGKILL at 15s — strictly worse than the old immediate close, and it would re-open the 'start
# wedge' the 15s timeout exists to prevent.
#
# 8s leaves 7s of headroom for deregistration and the force-close backstop. These are stateless
# proxies: an in-flight upstream completion is worth a few seconds to finish, not minutes.
Environment=VESSEL_DRAIN_MS=8000
