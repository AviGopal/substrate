# Model pin for the haiku llm-resolver sibling. A LATER EnvironmentFile than
# /etc/substrate/env (drop-ins load after the main unit), so this LLM_DEFAULT_MODEL
# wins over the shared one. The file is written by gen-env.sh at boot; the leading
# dash makes it optional so the unit still starts if gen-env has not run yet.
[Service]
EnvironmentFile=-/etc/substrate/llm-haiku.env
