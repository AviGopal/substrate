# STOPGAP — remove when the rebuild-on-invalidation fix lands
# (gap: a-30-minute-fts-rebuild-rewrites-every-activity-row-...).
#
# activity-api's periodic REBUILD INDEX on `activity` rewrites every row
# (~4,000 x ~20 KB plus view copies) every 30 min. With RocksDB blob GC off,
# each rewrite is permanent garbage, and the rebuild itself saturates
# surrealdb: see validation/reports/self-development-program-2026-09-25/
# TRACE-STORE-GROWTH.md. Stretching the interval to 24 h stops the churn until
# the code only rebuilds when the index is actually invalidated. The one
# rebuild 5 min after boot still runs.
#
# Revert: delete this file, daemon-reload, restart activity-api.
[Service]
Environment=FTS_REBUILD_INTERVAL_MS=86400000
