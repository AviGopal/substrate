# Substrate — minimal-surface deployment (M3, openspec 2026-06-16-substrate-namespace-and-compose-migration).
#
# Goal: a pre-built image + this file + a .env are the ENTIRE surface needed to
# start a substrate. No Makefile, no host repos/ mount, no docker cp hot-reload.
#
#   cp .env.example .env   # set ANTHROPIC_API_KEY (+ optional SUBSTRATE_GIT_PAT)
#   docker compose up -d
#
# This replicates the working `make run-live` docker invocation MINUS the host
# couplings: the read-only host repo mount and MITOSIS_HOST_SYNC_MODE are gone,
# and /workspace is a named volume (portable) rather than a host bind-mount.
#
# The image is a fat single container: surrealdb + valkey + every vessel run as
# systemd units inside it (hence privileged + tmpfs /run). DB/cache are NOT
# separate compose services by design — splitting them is a future option, not
# required for the minimal surface.
#
# STATE: a fresh named volume starts EMPTY. Restoring prior learned state
# (Thompson posteriors, concept graph, memoryNotes) is delivered by the parent
# change's Phase-0 snapshot/restore bundle (2026-06-16-substrate-self-persistence-
# and-direct-push). Until that lands, `compose up` yields a clean-slate substrate.

services:
  substrate:
    image: ${SUBSTRATE_IMAGE:-ghcr.io/avigopal/substrate:dev}
    container_name: ${SUBSTRATE_CONTAINER:-substrate}
    privileged: true            # systemd as PID 1 inside the container
    stop_signal: SIGRTMIN+3     # systemd graceful shutdown
    stop_grace_period: 30s
    restart: unless-stopped
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY is required}
      # Optional: autonomous git push (parent change Phase 1). Unset = no self-push.
      SUBSTRATE_GIT_PAT: ${SUBSTRATE_GIT_PAT:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    ports:
      - "${ACTIVITY_API_PORT:-18080}:8080"   # activity-api
      - "${DEV_VESSEL_PORT:-18090}:8090"     # development-vessel
      - "${DISCOVERY_PORT:-18100}:8100"      # discovery-vessel
      - "${GOAL_HOST_PORT:-18210}:8210"      # goal-host-vessel
      - "${ANALYSIS_PORT:-18250}:8250"       # analysis-vessel
      - "${CONCEPT_DB_PORT:-18260}:8260"     # concept-db
      - "${STATEFUL_UI_PORT:-18270}:8270"    # stateful-ui-vessel
    volumes:
      - substrate-workspace:/workspace       # named volume — portable, not a host path
    tmpfs:
      - /run
      - /run/lock
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  substrate-workspace:
