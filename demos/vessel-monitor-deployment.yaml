apiVersion: v1
kind: ConfigMap
metadata:
  name: vessel-monitor-config
  namespace: activity-system
data:
  DISCOVERY_VESSEL_ENDPOINT: "http://discovery-vessel.activity-system.svc.cluster.local:8080"
  ACTIVITY_API_URL: "http://metabob-activity-api.activity-system.svc.cluster.local:8080"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vessel-monitor
  namespace: activity-system
  labels:
    app: vessel-monitor
    component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vessel-monitor
  template:
    metadata:
      labels:
        app: vessel-monitor
        component: monitoring
    spec:
      containers:
      - name: vessel-monitor
        image: vessel-monitor:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: DISCOVERY_VESSEL_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: vessel-monitor-config
              key: DISCOVERY_VESSEL_ENDPOINT
        - name: ACTIVITY_API_URL
          valueFrom:
            configMapKeyRef:
              name: vessel-monitor-config
              key: ACTIVITY_API_URL
        - name: METABOB_API_KEY
          valueFrom:
            secretKeyRef:
              name: metabob-api-keys
              key: api-key
              optional: true
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          exec:
            command:
            - bun
            - --version
          initialDelaySeconds: 5
          periodSeconds: 30
        readinessProbe:
          exec:
            command:
            - bun
            - --version
          initialDelaySeconds: 3
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: vessel-monitor
  namespace: activity-system
  labels:
    app: vessel-monitor
spec:
  selector:
    app: vessel-monitor
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  type: ClusterIP
