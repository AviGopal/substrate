name: MiniBob Autonomous Development

on:
  schedule:
    - cron: '0 */4 * * *'  # Every 4 hours
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to work on (optional - will auto-select if not provided)'
        required: false

jobs:
  autonomous-cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1

      - name: Install MiniBob
        run: bun add -g @metabob/minibob@latest

      - name: Select Goal from Issues
        id: select_goal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.issue_number }}" ]; then
            # Use specified issue
            ISSUE_NUM="${{ github.event.inputs.issue_number }}"
          else
            # Auto-select: highest priority open issue with 'minibob' label
            ISSUE_NUM=$(gh issue list \
              --label minibob \
              --state open \
              --json number,title \
              --jq '.[0].number' || echo "")
          fi

          if [ -z "$ISSUE_NUM" ]; then
            echo "No open issues with 'minibob' label found"
            exit 0
          fi

          # Get issue title as goal
          GOAL=$(gh issue view $ISSUE_NUM --json title --jq '.title')

          echo "issue_number=$ISSUE_NUM" >> $GITHUB_OUTPUT
          echo "goal=$GOAL" >> $GITHUB_OUTPUT

      - name: Execute Goal
        if: steps.select_goal.outputs.goal != ''
        id: execute
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          METABOB_API_KEY: ${{ secrets.METABOB_API_KEY }}
        run: |
          set +e
          minibob --single "${{ steps.select_goal.outputs.goal }}"
          EXIT_CODE=$?
          set -e

          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

      - name: Update Issue
        if: steps.select_goal.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUM="${{ steps.select_goal.outputs.issue_number }}"
          EXIT_CODE="${{ steps.execute.outputs.exit_code }}"

          if [ "$EXIT_CODE" = "0" ]; then
            # Success - close issue
            gh issue close $ISSUE_NUM --comment "✅ Completed autonomously via MiniBob"
          else
            # Failure - add comment
            gh issue comment $ISSUE_NUM --body "⚠️ Execution failed (exit code: $EXIT_CODE). Will retry on next cycle."
          fi

      - name: Commit Changes
        run: |
          git config user.name "MiniBob"
          git config user.email "minibob@metabob.com"
          git add -A
          git commit -m "autonomous: ${{ steps.select_goal.outputs.goal || 'no work' }} ($(date -u +%Y-%m-%dT%H:%M:%SZ))" || echo "No changes to commit"
          git push || echo "No changes to push"
