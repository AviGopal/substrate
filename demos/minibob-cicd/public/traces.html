<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniBob Execution Traces & Optimization</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin: 20px 0; }
    .metric-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; }
    .metric-label { color: var(--text-secondary); font-size: 0.9rem; text-transform: uppercase; margin-bottom: 8px; }
    .metric-value { font-size: 2rem; font-weight: bold; color: var(--primary-color); }
    .trace-list { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; }
    .trace-item { padding: 15px 20px; border-bottom: 1px solid var(--border-color); cursor: pointer; }
    .trace-item:hover { background: var(--hover-bg); }
    .trace-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .trace-id { font-family: monospace; color: var(--primary-color); font-size: 0.9rem; }
    .trace-status { padding: 4px 12px; border-radius: 12px; font-size: 0.85rem; font-weight: 600; }
    .trace-status.success { background: #10b98120; color: #10b981; }
    .trace-status.failed { background: #ef444420; color: #ef4444; }
    .optimization-item { padding: 15px; background: var(--card-bg); border-left: 3px solid var(--primary-color); margin-bottom: 15px; border-radius: 4px; }
    .impact-high { background: #ef444420; color: #ef4444; padding: 3px 10px; border-radius: 10px; font-size: 0.8rem; }
    .impact-medium { background: #f59e0b20; color: #f59e0b; padding: 3px 10px; border-radius: 10px; font-size: 0.8rem; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🔍 MiniBob Execution Traces</h1>
      <p class="subtitle">Real-time traces, metrics, and optimization analysis</p>
    </header>

    <section class="metrics-grid">
      <div class="metric-card">
        <div class="metric-label">Success Rate</div>
        <div class="metric-value" id="success-rate">--</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Avg Duration</div>
        <div class="metric-value" id="avg-duration">--</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Avg Cost</div>
        <div class="metric-value" id="avg-cost">--</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Total Executions</div>
        <div class="metric-value" id="total-executions">--</div>
      </div>
    </section>

    <section>
      <h2>Recent Executions</h2>
      <div id="recent-executions">Loading...</div>
    </section>

    <section>
      <h2>Optimization Opportunities</h2>
      <div id="optimization-points">Analyzing patterns...</div>
    </section>

    <footer>
      <p>Last updated: <span id="last-updated">--</span></p>
    </footer>
  </div>

  <script>
    async function loadData() {
      const lastUpdated = await fetch('last-updated.txt').then(r => r.text()).catch(() => 'Unknown');
      document.getElementById('last-updated').textContent = new Date(lastUpdated.trim()).toLocaleString();

      const metrics = await fetch('metrics.json').then(r => r.json()).catch(() => ({}));
      document.getElementById('success-rate').textContent = `${((metrics.successRate || 0) * 100).toFixed(1)}%`;
      document.getElementById('avg-duration').textContent = `${(metrics.avgDuration || 0).toFixed(1)}s`;
      document.getElementById('avg-cost').textContent = `$${(metrics.avgCost || 0).toFixed(3)}`;
      document.getElementById('total-executions').textContent = metrics.totalExecutions || 0;

      const executions = await fetch('recent-executions.json').then(r => r.json()).catch(() => []);
      document.getElementById('recent-executions').innerHTML = executions.length ?
        '<div class="trace-list">' + executions.slice(0, 20).map(exec => `
          <div class="trace-item">
            <div class="trace-header">
              <span class="trace-id">${exec.id}</span>
              <span class="trace-status ${exec.success ? 'success' : 'failed'}">${exec.success ? 'success' : 'failed'}</span>
            </div>
            <div>⏱️ ${((exec.duration || 0) / 1000).toFixed(1)}s | 💰 ${exec.cost ? '$'+exec.cost.toFixed(4) : 'N/A'} | 🔧 ${exec.activity || 'improvised'}</div>
          </div>
        `).join('') + '</div>' : 'No executions yet';

      const opportunities = [];
      const jsonErrors = executions.filter(e => e.error && e.error.includes('JSON parse')).length;
      if (jsonErrors > 3) {
        opportunities.push({title: 'JSON Parse Errors', desc: `${jsonErrors} executions failed with JSON parse errors`, impact: 'high', rec: 'Add content length validation'});
      }

      document.getElementById('optimization-points').innerHTML = opportunities.length ?
        opportunities.map(o => `<div class="optimization-item"><strong>${o.title}</strong><p>${o.desc}</p><span class="impact-${o.impact}">${o.impact}</span><p><strong>Fix:</strong> ${o.rec}</p></div>`).join('') :
        'No optimization opportunities detected 🎉';
    }
    loadData();
    setInterval(loadData, 5 * 60 * 1000);
  </script>
</body>
</html>
