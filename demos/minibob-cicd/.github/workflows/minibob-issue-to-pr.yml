name: MiniBob - Issue to PR

on:
  issues:
    types: [labeled, opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to work on'
        required: true
        type: number

jobs:
  process-issue:
    # Only run if issue has 'minibob' label or comment contains '/minibob'
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'minibob')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/minibob')) ||
      (github.event_name == 'workflow_dispatch')

    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install MiniBob
        run: bun add -g @metabob/minibob@latest

      - name: Get Issue Details
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ISSUE_NUM="${{ github.event.inputs.issue_number }}"
          elif [ "${{ github.event_name }}" = "issue_comment" ]; then
            ISSUE_NUM="${{ github.event.issue.number }}"
          else
            ISSUE_NUM="${{ github.event.issue.number }}"
          fi

          ISSUE_TITLE=$(gh issue view $ISSUE_NUM --json title --jq '.title')
          ISSUE_BODY=$(gh issue view $ISSUE_NUM --json body --jq '.body')

          echo "number=$ISSUE_NUM" >> $GITHUB_OUTPUT
          echo "title=$ISSUE_TITLE" >> $GITHUB_OUTPUT

          # Save body to file for multi-line handling
          echo "$ISSUE_BODY" > /tmp/issue_body.txt

      - name: Create Branch
        run: |
          BRANCH_NAME="minibob/issue-${{ steps.issue.outputs.number }}-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH_NAME"
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT
        id: branch

      - name: Execute MiniBob
        id: execute
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          METABOB_API_KEY: ${{ secrets.METABOB_API_KEY }}
          ACTIVITY_API_ENDPOINT: https://activity.metabob.com
        run: |
          set +e

          # Create goal from issue title and body
          GOAL="${{ steps.issue.outputs.title }}"
          if [ -f /tmp/issue_body.txt ] && [ -s /tmp/issue_body.txt ]; then
            GOAL="$GOAL

$(cat /tmp/issue_body.txt)"
          fi

          echo "Executing goal: $GOAL"
          minibob --single "$GOAL"
          EXIT_CODE=$?

          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

          # Check if there are changes
          if git diff --quiet && git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit Changes
        if: steps.execute.outputs.has_changes == 'true'
        run: |
          git config user.name "MiniBob"
          git config user.email "minibob@metabob.com"
          git add -A
          git commit -m "fix: resolve issue #${{ steps.issue.outputs.number }}

${{ steps.issue.outputs.title }}

Resolved via MiniBob autonomous execution.
Execution trace: $ACTIVITY_API_ENDPOINT/traces/

Closes #${{ steps.issue.outputs.number }}

Co-Authored-By: MiniBob <minibob@metabob.com>"

      - name: Push Branch
        if: steps.execute.outputs.has_changes == 'true'
        run: git push origin ${{ steps.branch.outputs.branch }}

      - name: Create Pull Request
        if: steps.execute.outputs.has_changes == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL=$(gh pr create \
            --title "Fix: ${{ steps.issue.outputs.title }}" \
            --body "## Summary
Resolves #${{ steps.issue.outputs.number }}

## Changes
Automated fix generated by MiniBob based on issue description.

## Execution Details
- Exit Code: ${{ steps.execute.outputs.exit_code }}
- Branch: \`${{ steps.branch.outputs.branch }}\`
- Execution Trace: $ACTIVITY_API_ENDPOINT/traces/

## Testing
- [ ] CI checks passing
- [ ] Manual review completed (if needed)

---
🤖 Generated by [MiniBob](https://github.com/metabobproject/minibob) - Autonomous Development System

Closes #${{ steps.issue.outputs.number }}" \
            --base main \
            --head "${{ steps.branch.outputs.branch }}" \
            --label "minibob,automated")

          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          echo "$PR_URL"

      - name: Comment on Issue - Success
        if: steps.execute.outputs.has_changes == 'true' && steps.execute.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ steps.issue.outputs.number }} --body "✅ **MiniBob completed successfully!**

PR created: ${{ steps.pr.outputs.pr_url }}

The PR will be automatically merged once all checks pass."

      - name: Comment on Issue - No Changes
        if: steps.execute.outputs.has_changes == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ steps.issue.outputs.number }} --body "ℹ️ **MiniBob executed but made no changes**

The issue may already be resolved or no action was needed."

      - name: Comment on Issue - Failure
        if: steps.execute.outputs.exit_code != '0' && steps.execute.outputs.has_changes == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ steps.issue.outputs.number }} --body "⚠️ **MiniBob execution failed**

Exit code: ${{ steps.execute.outputs.exit_code }}

Please review the workflow logs for details. The issue will be retried on the next autonomous cycle."
