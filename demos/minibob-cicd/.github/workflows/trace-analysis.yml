name: Trace Analysis and Issue Creation

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: 'Hours to look back for traces'
        required: false
        default: '6'
        type: number

permissions:
  contents: read
  issues: write

jobs:
  analyze-traces:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Analyze Execution Traces
        id: analyze
        run: |
          bunx @metabob/minibob@latest --single "
          Analyze recent execution traces from the activity backend and identify patterns:

          1. Query execution traces from the last ${{ github.event.inputs.lookback_hours || 6 }} hours:
             curl -H 'Authorization: ApiKey $METABOB_API_KEY' \
               'https://activity.metabob.com/v2/activities/execution-traces?limit=100&since=${{ github.event.inputs.lookback_hours || 6 }}h'

          2. Analyze the traces for:
             - Common failure patterns (group by error type)
             - Performance degradation (tasks taking longer over time)
             - Low success rate activities (success rate < 70%)
             - Unused impulses (discovered but never loaded)
             - Ineffective discovery activities (α/β ratio < 0.3)

          3. Create a summary JSON file with findings:
             {
               'failures': [{ 'pattern': '...', 'count': 5, 'severity': 'high' }],
               'degradations': [{ 'activity': '...', 'trend': 'slower', 'impact': '20%' }],
               'improvements': [{ 'type': '...', 'suggestion': '...' }]
             }

          4. Write to /tmp/trace-analysis.json

          Tools: bash (curl), write (path, content)
          " --trace | tee /tmp/analysis-output.log
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          METABOB_API_KEY: ${{ secrets.METABOB_API_KEY }}

      - name: Create Issues from Findings
        if: success()
        run: |
          bunx @metabob/minibob@latest --single "
          Read the trace analysis from /tmp/trace-analysis.json and create GitHub issues for important findings:

          For each finding with severity='high' or 'medium':
          1. Create a descriptive issue title
          2. Write detailed issue body with:
             - Problem description
             - Evidence from traces
             - Suggested fix approach
             - Related traces/activities

          3. Use gh CLI to create issues:
             gh issue create --title 'title' --body 'body' --label 'auto-generated,performance' --label 'severity-\$severity'

          Skip findings that are minor or already have open issues.

          Tools: read (path='/tmp/trace-analysis.json'), bash (command='gh issue create ...')
          " --trace
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          METABOB_API_KEY: ${{ secrets.METABOB_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Summary
        if: always()
        run: |
          echo "## Trace Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f /tmp/trace-analysis.json ]; then
            echo "### Findings" >> $GITHUB_STEP_SUMMARY
            cat /tmp/trace-analysis.json | jq -r '
              "**Failures**: \(.failures | length)\n" +
              "**Degradations**: \(.degradations | length)\n" +
              "**Improvements**: \(.improvements | length)\n"
            ' >> $GITHUB_STEP_SUMMARY

            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Top Issues" >> $GITHUB_STEP_SUMMARY
            cat /tmp/trace-analysis.json | jq -r '
              .failures[:3] | .[] | "- [\(.severity)] \(.pattern) (\(.count) occurrences)"
            ' >> $GITHUB_STEP_SUMMARY
          else
            echo "No analysis file generated" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Analysis Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-analysis-${{ github.run_number }}
          path: |
            /tmp/trace-analysis.json
            /tmp/analysis-output.log
          retention-days: 30

  report-metrics:
    runs-on: ubuntu-latest
    needs: analyze-traces
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Query Learning Metrics
        run: |
          bunx @metabob/minibob@latest --single "
          Query the activity backend for learning metrics and create a report:

          1. Thompson Sampling parameters for top 10 activities:
             curl -H 'Authorization: ApiKey $METABOB_API_KEY' \
               'https://activity.metabob.com/v2/activities/templates?limit=10&sort=executions'

          2. Impulse relevance scores:
             curl -H 'Authorization: ApiKey $METABOB_API_KEY' \
               'https://activity.metabob.com/v2/activities/impulse-relevance?limit=20'

          3. Discovery effectiveness:
             curl -H 'Authorization: ApiKey $METABOB_API_KEY' \
               'https://activity.metabob.com/v2/activities/templates?category=discovery'

          4. Create markdown report showing:
             - Top performing activities (by success rate)
             - Most used impulses (by relevance)
             - Discovery activity effectiveness
             - Learning trends over time

          5. Write to /tmp/metrics-report.md

          Tools: bash (curl), write (path, content)
          " --trace
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          METABOB_API_KEY: ${{ secrets.METABOB_API_KEY }}

      - name: Post Metrics to Issue
        if: success()
        run: |
          # Find or create the metrics tracking issue
          ISSUE_NUM=$(gh issue list --label "metrics-tracking" --state open --limit 1 --json number --jq '.[0].number' || echo "")

          if [ -z "$ISSUE_NUM" ]; then
            # Create new metrics tracking issue
            ISSUE_NUM=$(gh issue create \
              --title "📊 Learning Metrics Dashboard" \
              --body "Automated metrics tracking. Updated every 6 hours." \
              --label "metrics-tracking,automated" \
              --json number --jq '.number')
          fi

          # Post metrics as comment
          gh issue comment $ISSUE_NUM --body "$(cat <<EOF
          ## Learning Metrics Update
          **Date**: $(date -u +%Y-%m-%d\ %H:%M\ UTC)

          $(cat /tmp/metrics-report.md)

          ---

          *Generated by [trace-analysis.yml](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})*
          EOF
          )"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Metrics Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-report-${{ github.run_number }}
          path: /tmp/metrics-report.md
          retention-days: 90
