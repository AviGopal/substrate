name: MiniBob - Auto-Merge PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
  check_suite:
    types: [completed]
  workflow_run:
    workflows: ["CI - Quality Checks"]
    types: [completed]

jobs:
  auto-merge:
    # Only auto-merge PRs created by MiniBob
    if: |
      github.event.pull_request.user.login == 'github-actions[bot]' ||
      contains(github.event.pull_request.labels.*.name, 'minibob') ||
      contains(github.event.pull_request.labels.*.name, 'automated')

    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get PR Number
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUM="${{ github.event.pull_request.number }}"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            # Get PR number from workflow run
            PR_NUM=$(gh pr list --state open --json number,headRefName --jq ".[] | select(.headRefName == \"${{ github.event.workflow_run.head_branch }}\") | .number" | head -1)
          else
            # Get PR from check suite
            PR_NUM=$(gh pr list --state open --json number,headRefName --jq ".[] | select(.headRefName == \"${{ github.event.check_suite.head_branch }}\") | .number" | head -1)
          fi

          if [ -z "$PR_NUM" ]; then
            echo "No PR found"
            exit 0
          fi

          echo "number=$PR_NUM" >> $GITHUB_OUTPUT

      - name: Check PR Status
        if: steps.pr.outputs.number != ''
        id: status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ steps.pr.outputs.number }}"

          # Get PR details
          PR_JSON=$(gh pr view $PR_NUM --json mergeable,mergeStateStatus,reviewDecision,statusCheckRollup)

          MERGEABLE=$(echo "$PR_JSON" | jq -r '.mergeable')
          MERGE_STATE=$(echo "$PR_JSON" | jq -r '.mergeStateStatus')
          REVIEW_DECISION=$(echo "$PR_JSON" | jq -r '.reviewDecision')

          # Check if all status checks passed
          CHECKS_PASSING=$(echo "$PR_JSON" | jq -r '.statusCheckRollup[] | select(.status == "COMPLETED" and .conclusion == "SUCCESS") | .name' | wc -l)
          CHECKS_TOTAL=$(echo "$PR_JSON" | jq -r '.statusCheckRollup[] | select(.status == "COMPLETED") | .name' | wc -l)

          echo "mergeable=$MERGEABLE" >> $GITHUB_OUTPUT
          echo "merge_state=$MERGE_STATE" >> $GITHUB_OUTPUT
          echo "review_decision=$REVIEW_DECISION" >> $GITHUB_OUTPUT
          echo "checks_passing=$CHECKS_PASSING" >> $GITHUB_OUTPUT
          echo "checks_total=$CHECKS_TOTAL" >> $GITHUB_OUTPUT

          # Determine if ready to merge
          READY_TO_MERGE="false"

          if [ "$MERGEABLE" = "MERGEABLE" ] && \
             [ "$MERGE_STATE" = "CLEAN" ] && \
             [ "$CHECKS_PASSING" -eq "$CHECKS_TOTAL" ] && \
             [ "$CHECKS_TOTAL" -gt 0 ]; then

            # Check review decision (allow if no review required or approved)
            if [ "$REVIEW_DECISION" = "APPROVED" ] || [ "$REVIEW_DECISION" = "null" ]; then
              READY_TO_MERGE="true"
            fi
          fi

          echo "ready_to_merge=$READY_TO_MERGE" >> $GITHUB_OUTPUT

      - name: Wait for CI Checks
        if: steps.pr.outputs.number != '' && steps.status.outputs.ready_to_merge != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "PR not ready yet. Waiting for checks..."
          echo "Mergeable: ${{ steps.status.outputs.mergeable }}"
          echo "Merge State: ${{ steps.status.outputs.merge_state }}"
          echo "Review Decision: ${{ steps.status.outputs.review_decision }}"
          echo "Checks: ${{ steps.status.outputs.checks_passing }}/${{ steps.status.outputs.checks_total }}"

          # Wait up to 5 minutes for checks
          for i in {1..10}; do
            sleep 30

            # Re-check status
            PR_JSON=$(gh pr view ${{ steps.pr.outputs.number }} --json statusCheckRollup)
            CHECKS_PASSING=$(echo "$PR_JSON" | jq -r '.statusCheckRollup[] | select(.status == "COMPLETED" and .conclusion == "SUCCESS") | .name' | wc -l)
            CHECKS_TOTAL=$(echo "$PR_JSON" | jq -r '.statusCheckRollup[] | select(.status == "COMPLETED") | .name' | wc -l)

            if [ "$CHECKS_PASSING" -eq "$CHECKS_TOTAL" ] && [ "$CHECKS_TOTAL" -gt 0 ]; then
              echo "All checks passed!"
              exit 0
            fi

            echo "Waiting... ($i/10) - $CHECKS_PASSING/$CHECKS_TOTAL checks passing"
          done

          echo "Timeout waiting for checks. Will retry on next trigger."
          exit 0

      - name: Merge PR
        if: steps.status.outputs.ready_to_merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ steps.pr.outputs.number }}"

          echo "✅ All conditions met. Auto-merging PR #$PR_NUM"

          gh pr merge $PR_NUM \
            --squash \
            --delete-branch \
            --subject "Merge PR #$PR_NUM: MiniBob automated fix" \
            --body "Automatically merged by MiniBob after all checks passed.

Co-Authored-By: MiniBob <minibob@metabob.com>"

          echo "🎉 PR #$PR_NUM merged successfully!"

      - name: Comment on Merge
        if: steps.status.outputs.ready_to_merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ steps.pr.outputs.number }}"

          gh pr comment $PR_NUM --body "🎉 **Automatically merged!**

All quality checks passed:
- ✅ CI checks: ${{ steps.status.outputs.checks_passing }}/${{ steps.status.outputs.checks_total }}
- ✅ Mergeable: ${{ steps.status.outputs.mergeable }}
- ✅ Merge state: ${{ steps.status.outputs.merge_state }}

Branch deleted and changes deployed to main.

---
🤖 Auto-merged by MiniBob"
