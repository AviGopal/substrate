name: CI - Quality Checks

on:
  push:
    branches: [main, dev, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, dev]

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  METABOB_API_KEY: ${{ secrets.METABOB_API_KEY }}
  ACTIVITY_API_ENDPOINT: https://activity.metabob.com

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # ========================================
      # STAGE 1: Deterministic Checks
      # ========================================
      - name: Run Lint
        id: lint
        run: |
          set -o pipefail
          if bun run lint 2>&1 | tee lint-output.log; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Run Type Check
        id: typecheck
        run: |
          set -o pipefail
          if bun run typecheck 2>&1 | tee typecheck-output.log; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Run Tests
        id: test
        run: |
          set -o pipefail
          if bun test 2>&1 | tee test-output.log; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            exit 1
          fi

      # ========================================
      # STAGE 2: Build Verification
      # ========================================
      - name: Build
        if: success()
        run: bun run build

      # ========================================
      # STAGE 3: Summary
      # ========================================
      - name: Summary
        if: always()
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ steps.lint.outputs.status == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| TypeCheck | ${{ steps.typecheck.outputs.status == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ steps.test.outputs.status == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
