name: CI with MiniBob PR Creation

on:
  push:
    branches: ['feature/**', 'fix/**', 'dev']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run CI on'
        required: false
        default: 'main'

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  ACTIVITY_API_ENDPOINT: https://activity.metabob.com

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # ========================================
      # STAGE 1: Deterministic Checks
      # Run all checks first, collect failures
      # ========================================
      - name: TypeCheck (Deterministic)
        id: typecheck
        run: |
          set -o pipefail
          if bun run typecheck 2>&1 | tee typecheck-output.log; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "error_log<<EOF" >> $GITHUB_OUTPUT
            head -50 typecheck-output.log >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Lint (Deterministic)
        id: lint
        run: |
          set -o pipefail
          if bun run lint 2>&1 | tee lint-output.log; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "error_log<<EOF" >> $GITHUB_OUTPUT
            head -50 lint-output.log >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Test (Deterministic)
        id: test
        run: |
          set -o pipefail
          if bun test 2>&1 | tee test-output.log; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "error_log<<EOF" >> $GITHUB_OUTPUT
            head -50 test-output.log >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      # ========================================
      # STAGE 2: Dynamic MiniBob Remediation
      # Generic fix based on detected failures
      # ========================================
      - name: MiniBob Auto-Remediation
        if: steps.typecheck.outputs.status == 'failure' || steps.lint.outputs.status == 'failure' || steps.test.outputs.status == 'failure'
        id: remediate
        run: |
          echo "::group::MiniBob Auto-Remediation"

          # Build failure summary dynamically
          FAILURES=""
          if [ "${{ steps.typecheck.outputs.status }}" == "failure" ]; then
            FAILURES="${FAILURES}**TypeCheck Failed:**\n${{ steps.typecheck.outputs.error_log }}\n\n"
          fi
          if [ "${{ steps.lint.outputs.status }}" == "failure" ]; then
            FAILURES="${FAILURES}**Lint Failed:**\n${{ steps.lint.outputs.error_log }}\n\n"
          fi
          if [ "${{ steps.test.outputs.status }}" == "failure" ]; then
            FAILURES="${FAILURES}**Tests Failed:**\n${{ steps.test.outputs.error_log }}\n\n"
          fi

          # Use MiniBob with generic goal-based execution
          bunx @metabob/minibob@latest --single "Fix the following CI failures:

          ${FAILURES}

          Analyze the errors, identify the root cause, and apply fixes. Use read, edit, and bash tools as needed. Verify each fix before moving to the next."

          echo "::endgroup::"

      # ========================================
      # STAGE 3: Verify Fixes
      # ========================================
      - name: Verify All Checks After Remediation
        if: steps.remediate.outcome == 'success'
        run: |
          echo "::group::Verifying Fixes"

          VERIFICATION_FAILED=false

          # Re-run all checks
          if [ "${{ steps.typecheck.outputs.status }}" == "failure" ]; then
            echo "Verifying TypeCheck fix..."
            bun run typecheck || VERIFICATION_FAILED=true
          fi

          if [ "${{ steps.lint.outputs.status }}" == "failure" ]; then
            echo "Verifying Lint fix..."
            bun run lint || VERIFICATION_FAILED=true
          fi

          if [ "${{ steps.test.outputs.status }}" == "failure" ]; then
            echo "Verifying Test fix..."
            bun test || VERIFICATION_FAILED=true
          fi

          if [ "$VERIFICATION_FAILED" = true ]; then
            echo "::error::Some fixes did not pass verification"
            exit 1
          fi

          echo "::endgroup::"
          echo "verified=true" >> $GITHUB_OUTPUT

      # ========================================
      # STAGE 4: Create PR with Fixes
      # ========================================
      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "files_changed<<EOF" >> $GITHUB_OUTPUT
            git diff --name-only >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Create Fix Branch and PR
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configure git
          git config user.name "MiniBob"
          git config user.email "minibob@metabob.com"

          # Create branch name with timestamp
          BRANCH_NAME="minibob/auto-fix-$(date +%Y%m%d-%H%M%S)"
          echo "branch_name=${BRANCH_NAME}" >> $GITHUB_OUTPUT

          # Create and checkout new branch
          git checkout -b "${BRANCH_NAME}"

          # Stage all changes
          git add -A

          # Build commit message
          COMMIT_MSG="fix(ci): MiniBob auto-remediation

Automatically fixed CI failures:
- TypeCheck: ${{ steps.typecheck.outputs.status }}
- Lint: ${{ steps.lint.outputs.status }}
- Test: ${{ steps.test.outputs.status }}

Files modified:
${{ steps.changes.outputs.files_changed }}

Execution traces: ${{ env.ACTIVITY_API_ENDPOINT }}
Learning: Thompson Sampling updated with fix patterns

Co-Authored-By: MiniBob <minibob@metabob.com>"

          # Commit changes
          git commit -m "${COMMIT_MSG}"

          # Push to remote
          git push origin "${BRANCH_NAME}"

          # Build PR description
          PR_BODY="## MiniBob Auto-Remediation

MiniBob detected and fixed CI failures automatically.

### Failures Fixed
$(if [ "${{ steps.typecheck.outputs.status }}" == "failure" ]; then echo "- ✅ TypeCheck"; fi)
$(if [ "${{ steps.lint.outputs.status }}" == "failure" ]; then echo "- ✅ Lint"; fi)
$(if [ "${{ steps.test.outputs.status }}" == "failure" ]; then echo "- ✅ Tests"; fi)

### Files Modified
\`\`\`
${{ steps.changes.outputs.files_changed }}
\`\`\`

### Changes
\`\`\`diff
$(git diff ${{ github.sha }} HEAD)
\`\`\`

### MiniBob Details
- **Activity API**: ${{ env.ACTIVITY_API_ENDPOINT }}
- **Execution Trace**: Stored for Thompson Sampling
- **Learning**: Fix patterns extracted for future use

---
🤖 Generated by [MiniBob](https://github.com/MetabobProject/minibob)"

          # Create PR
          gh pr create \
            --title "fix(ci): MiniBob auto-remediation from CI run #${{ github.run_number }}" \
            --body "${PR_BODY}" \
            --base ${{ github.ref_name }} \
            --head "${BRANCH_NAME}" \
            --label "auto-remediation" \
            --label "minibob"

          echo "### ✅ Pull Request Created" >> $GITHUB_STEP_SUMMARY
          echo "Branch: \`${BRANCH_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "MiniBob created a PR with the fixes. Review and merge when ready." >> $GITHUB_STEP_SUMMARY

      # ========================================
      # STAGE 5: Build (Final Gate)
      # ========================================
      - name: Build
        run: bun run build

      # ========================================
      # STAGE 6: Summary
      # ========================================
      - name: Summary
        if: always()
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Initial | After Remediation |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|---------|-------------------|" >> $GITHUB_STEP_SUMMARY
          echo "| TypeCheck | ${{ steps.typecheck.outputs.status }} | ${{ steps.typecheck.outputs.status == 'failure' && '✅ Fixed' || '-' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ steps.lint.outputs.status }} | ${{ steps.lint.outputs.status == 'failure' && '✅ Fixed' || '-' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test | ${{ steps.test.outputs.status }} | ${{ steps.test.outputs.status == 'failure' && '✅ Fixed' || '-' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### MiniBob Integration" >> $GITHUB_STEP_SUMMARY
          echo "- **Mode**: PR Creation (not direct commit)" >> $GITHUB_STEP_SUMMARY
          echo "- **Package**: \`@metabob/minibob@latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Learning Backend**: \`$ACTIVITY_API_ENDPOINT\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.changes.outputs.has_changes }}" == "true" ]; then
            echo "- **Result**: Pull request created for review" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Result**: No changes needed" >> $GITHUB_STEP_SUMMARY
          fi
