name: CI with Human-Gated Remediation

# This workflow creates a PR for review instead of auto-committing.
# Use this for production code or when human review is required.

on:
  workflow_dispatch:
    inputs:
      auto_merge:
        description: 'Auto-merge fix PR if tests pass'
        required: false
        default: 'false'
        type: boolean

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Run CI
        id: ci
        run: |
          bun run ci 2>&1 | tee ci-output.log
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      # If CI fails, create a fix branch and PR
      - name: Create fix branch
        if: steps.ci.outcome == 'failure'
        run: |
          git config user.name "CI Bot"
          git config user.email "ci@metabob.com"
          BRANCH_NAME="fix/auto-remediation-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH_NAME"
          echo "FIX_BRANCH=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Auto-remediate
        if: steps.ci.outcome == 'failure'
        run: |
          # Determine which step failed
          if ! bun run typecheck 2>/dev/null; then
            FAILED_STEP="typecheck"
          elif ! bun run lint 2>/dev/null; then
            FAILED_STEP="lint"
          else
            FAILED_STEP="test"
          fi

          bun run remediate "$(cat ci-output.log)" "$FAILED_STEP"

      - name: Verify fix
        if: steps.ci.outcome == 'failure'
        run: bun run ci

      - name: Commit and push
        if: steps.ci.outcome == 'failure'
        run: |
          git add -A
          git commit -m "fix(ci): auto-remediation

          Co-Authored-By: Claude <noreply@anthropic.com>"
          git push -u origin "$FIX_BRANCH"

      - name: Create Pull Request
        if: steps.ci.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "fix(ci): Auto-remediation" \
            --body "## Automated Fix

          This PR contains automatic fixes for CI failures.

          ### Error Log
          \`\`\`
          $(head -50 ci-output.log)
          \`\`\`

          ### Verification
          - [x] TypeCheck passes
          - [x] Lint passes
          - [x] Tests pass

          ---
          *Auto-generated by CI remediation*" \
            --base main \
            --head "$FIX_BRANCH"

      - name: Auto-merge if enabled
        if: steps.ci.outcome == 'failure' && inputs.auto_merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "$FIX_BRANCH" --auto --squash
