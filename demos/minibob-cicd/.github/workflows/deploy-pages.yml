name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record Deployment Activity
        if: always()
        run: |
          echo "🚀 Deployment completed"
          echo "URL: ${{ steps.deployment.outputs.page_url }}"
          echo "Status: ${{ job.status }}"

          # This would record to MiniBob activity backend
          # bunx @metabob/minibob@latest \
          #   --template activities/cicd/record-deployment.json \
          #   --var "url=${{ steps.deployment.outputs.page_url }}" \
          #   --var "status=${{ job.status }}" \
          #   --trace
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          METABOB_API_KEY: ${{ secrets.METABOB_API_KEY }}
