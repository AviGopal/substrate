name: MiniBob Autonomous Development

on:
  schedule:
    - cron: '0 */4 * * *'  # Every 4 hours
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to work on (optional - will auto-select if not provided)'
        required: false
        type: string

jobs:
  autonomous-cycle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install MiniBob
        run: bun add -g @metabob/minibob@latest

      - name: Select Goal from Issues
        id: select_goal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.issue_number }}" ]; then
            # Use specified issue
            ISSUE_NUM="${{ github.event.inputs.issue_number }}"
          else
            # Auto-select: highest priority open issue with 'minibob' label
            ISSUE_NUM=$(gh issue list \
              --label minibob \
              --state open \
              --json number,title \
              --jq '.[0].number' || echo "")
          fi

          if [ -z "$ISSUE_NUM" ]; then
            echo "No open issues with 'minibob' label found"
            echo "has_work=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Get issue details
          ISSUE_TITLE=$(gh issue view $ISSUE_NUM --json title --jq '.title')
          ISSUE_BODY=$(gh issue view $ISSUE_NUM --json body --jq '.body')

          echo "has_work=true" >> $GITHUB_OUTPUT
          echo "issue_number=$ISSUE_NUM" >> $GITHUB_OUTPUT
          echo "goal=$ISSUE_TITLE" >> $GITHUB_OUTPUT

          # Save body for multi-line handling
          echo "$ISSUE_BODY" > /tmp/issue_body.txt

      - name: Create Branch
        if: steps.select_goal.outputs.has_work == 'true'
        id: branch
        run: |
          BRANCH_NAME="minibob/autonomous-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH_NAME"
          echo "name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Execute Goal
        if: steps.select_goal.outputs.has_work == 'true'
        id: execute
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          METABOB_API_KEY: ${{ secrets.METABOB_API_KEY }}
          ACTIVITY_API_ENDPOINT: https://activity.metabob.com
        run: |
          set +e

          # Combine title and body as goal
          GOAL="${{ steps.select_goal.outputs.goal }}"
          if [ -f /tmp/issue_body.txt ] && [ -s /tmp/issue_body.txt ]; then
            GOAL="$GOAL

$(cat /tmp/issue_body.txt)"
          fi

          minibob --single "$GOAL"
          EXIT_CODE=$?

          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

          # Check for changes
          if git diff --quiet && git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit Changes
        if: steps.execute.outputs.has_changes == 'true'
        run: |
          git config user.name "MiniBob"
          git config user.email "minibob@metabob.com"
          git add -A
          git commit -m "autonomous: ${{ steps.select_goal.outputs.goal }}

Autonomous execution resolving issue #${{ steps.select_goal.outputs.issue_number }}

Exit code: ${{ steps.execute.outputs.exit_code }}
Execution trace: $ACTIVITY_API_ENDPOINT/traces/

Closes #${{ steps.select_goal.outputs.issue_number }}

Co-Authored-By: MiniBob <minibob@metabob.com>"

      - name: Push Branch
        if: steps.execute.outputs.has_changes == 'true'
        run: git push origin ${{ steps.branch.outputs.name }}

      - name: Create Pull Request
        if: steps.execute.outputs.has_changes == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL=$(gh pr create \
            --title "Autonomous: ${{ steps.select_goal.outputs.goal }}" \
            --body "## Autonomous Development Cycle

Resolves #${{ steps.select_goal.outputs.issue_number }}

### Execution Details
- **Goal**: ${{ steps.select_goal.outputs.goal }}
- **Exit Code**: ${{ steps.execute.outputs.exit_code }}
- **Branch**: \`${{ steps.branch.outputs.name }}\`
- **Execution Time**: $(date -u +%Y-%m-%dT%H:%M:%SZ)
- **Trace**: $ACTIVITY_API_ENDPOINT/traces/

### Auto-Merge
This PR will be automatically merged once all CI checks pass.

---
🤖 Generated by [MiniBob Autonomous System](https://github.com/metabobproject/minibob)

Closes #${{ steps.select_goal.outputs.issue_number }}" \
            --base main \
            --head "${{ steps.branch.outputs.name }}" \
            --label "minibob,automated,autonomous")

          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          echo "✅ Created PR: $PR_URL"

      - name: Comment on Issue - Success
        if: steps.execute.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ steps.select_goal.outputs.issue_number }} --body "✅ **Autonomous execution completed!**

PR created: ${{ steps.pr.outputs.pr_url }}

The PR will be automatically merged once all checks pass."

      - name: Comment on Issue - No Changes
        if: steps.select_goal.outputs.has_work == 'true' && steps.execute.outputs.has_changes == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ steps.select_goal.outputs.issue_number }} --body "ℹ️ **Autonomous execution completed but made no changes**

The issue may already be resolved or no action was needed."

      - name: Summary
        if: always()
        run: |
          echo "## Autonomous Cycle Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Has Work**: ${{ steps.select_goal.outputs.has_work }}" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.select_goal.outputs.has_work }}" = "true" ]; then
            echo "- **Issue**: #${{ steps.select_goal.outputs.issue_number }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Goal**: ${{ steps.select_goal.outputs.goal }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Exit Code**: ${{ steps.execute.outputs.exit_code }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Has Changes**: ${{ steps.execute.outputs.has_changes }}" >> $GITHUB_STEP_SUMMARY

            if [ "${{ steps.execute.outputs.has_changes }}" = "true" ]; then
              echo "- **PR**: ${{ steps.pr.outputs.pr_url }}" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "- **Status**: No work available (no open issues with 'minibob' label)" >> $GITHUB_STEP_SUMMARY
          fi
