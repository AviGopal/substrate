name: Autonomous CI/CD with Activity Chaos Testing

on:
  schedule:
    # Run complete loop every 4 hours
    - cron: '0 */4 * * *'
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Chaos scenario to run (leave empty for normal run)'
        required: false
        type: choice
        options:
          - none
          - invalid-input-data
          - missing-dependencies
          - timeout-conditions
          - resource-exhaustion
          - concurrent-execution-conflicts
          - malicious-input

jobs:
  # Job 1: Continuous Quality Enforcement
  quality-enforcement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup MiniBob
        run: |
          npm install -g @metabob/minibob@latest
          echo "${{ secrets.METABOB_CONFIG }}" > ~/.metabob/config.json

      - name: Register Activities
        run: |
          cd demos/minibob-cicd
          minibob doctor tutor activities/autonomous-loop/enforce-error-handling-activity.json
          minibob doctor tutor activities/autonomous-loop/validate-enforcement-activity.json
          minibob doctor tutor activities/autonomous-loop/autonomous-code-quality-loop.json

      - name: Run Autonomous Quality Loop
        id: quality-loop
        run: |
          cd demos/minibob-cicd
          minibob --single "Execute autonomous-code-quality-loop \
            on repository . \
            with target_files ['src/**/*.ts', 'src/**/*.tsx'] \
            and patterns ['error-handling', 'parameter-validation', 'test-coverage'] \
            and max_iterations 3 \
            and output_path ./results/quality-loop"

      - name: Check Compliance
        run: |
          cd demos/minibob-cicd
          COMPLIANCE=$(jq -r '.final_compliance' results/quality-loop/autonomous-loop-summary.json)
          echo "Quality Compliance: $COMPLIANCE"
          if [ "$COMPLIANCE" != "100%" ]; then
            echo "::warning::Quality compliance is $COMPLIANCE%, target is 100%"
          fi

      - name: Upload Results
        uses: actions/upload-artifact@v3
        with:
          name: quality-loop-results
          path: demos/minibob-cicd/results/

  # Job 2: Chaos Testing (Weekly)
  chaos-testing:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event.inputs.scenario != 'none'
    needs: quality-enforcement
    steps:
      - uses: actions/checkout@v3

      - name: Setup MiniBob
        run: |
          npm install -g @metabob/minibob@latest
          echo "${{ secrets.METABOB_CONFIG }}" > ~/.metabob/config.json

      - name: Determine Chaos Scenario
        id: scenario
        run: |
          if [ "${{ github.event.inputs.scenario }}" != "" ]; then
            SCENARIO="${{ github.event.inputs.scenario }}"
          else
            # Random scenario for scheduled runs
            SCENARIOS=("invalid-input-data" "missing-dependencies" "timeout-conditions" "resource-exhaustion")
            SCENARIO=${SCENARIOS[$RANDOM % ${#SCENARIOS[@]}]}
          fi
          echo "scenario=$SCENARIO" >> $GITHUB_OUTPUT
          echo "Running chaos scenario: $SCENARIO"

      - name: Inject Chaos
        id: chaos
        continue-on-error: true
        run: |
          cd demos/minibob-cicd
          minibob --single "Execute chaos scenario: ${{ steps.scenario.outputs.scenario }} \
            from chaos/chaos-scenarios.json \
            targeting autonomous-code-quality-loop \
            with auto_recover true \
            and output ./chaos/results/${{ steps.scenario.outputs.scenario }}-$(date +%Y%m%d-%H%M%S).json"

      - name: Detect Faults
        if: steps.chaos.outcome == 'failure'
        run: |
          cd demos/minibob-cicd
          minibob --single "Analyze chaos test failure for scenario ${{ steps.scenario.outputs.scenario }} \
            from execution traces \
            and create fault report in ./chaos/fault-reports/"

      - name: Create Recovery Variant
        if: steps.chaos.outcome == 'failure'
        run: |
          cd demos/minibob-cicd
          minibob --single "Create improved activity variant \
            to fix faults in ./chaos/fault-reports/ \
            for activity autonomous-code-quality-loop \
            output to ./activities/autonomous-loop/variants/"

      - name: Test Recovery Variant
        if: steps.chaos.outcome == 'failure'
        run: |
          cd demos/minibob-cicd
          minibob --single "Test variant against chaos scenario ${{ steps.scenario.outputs.scenario }} \
            and validate no regressions \
            with require_zero_failures true"

      - name: Deploy Successful Variant
        if: steps.chaos.outcome == 'failure'
        run: |
          cd demos/minibob-cicd
          # Register improved variant
          VARIANT=$(ls -t activities/autonomous-loop/variants/*.json | head -1)
          if [ -f "$VARIANT" ]; then
            minibob doctor tutor "$VARIANT"
            echo "Deployed variant: $VARIANT"
          fi

      - name: Upload Chaos Results
        uses: actions/upload-artifact@v3
        with:
          name: chaos-test-results
          path: |
            demos/minibob-cicd/chaos/results/
            demos/minibob-cicd/chaos/fault-reports/

  # Job 3: Thompson Sampling Update
  thompson-sampling-update:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    needs: [quality-enforcement, chaos-testing]
    steps:
      - uses: actions/checkout@v3

      - name: Setup MiniBob
        run: |
          npm install -g @metabob/minibob@latest
          echo "${{ secrets.METABOB_CONFIG }}" > ~/.metabob/config.json

      - name: Update Thompson Sampling Scores
        run: |
          cd demos/minibob-cicd
          minibob --single "Update Thompson Sampling scores \
            for all activities in autonomous-loop \
            analyzing traces from last 7 days \
            with create_variants_for_low_performers true"

      - name: Generate Performance Report
        run: |
          cd demos/minibob-cicd
          minibob --single "Generate activity performance report \
            for autonomous-loop activities \
            output to ./results/performance/weekly-report-$(date +%Y%m%d).md"

      - name: Upload Performance Report
        uses: actions/upload-artifact@v3
        with:
          name: performance-report
          path: demos/minibob-cicd/results/performance/

  # Job 4: Commit Quality Improvements
  commit-improvements:
    runs-on: ubuntu-latest
    needs: quality-enforcement
    if: github.event_name == 'push' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v3

      - name: Check for Quality Improvements
        id: check-changes
        run: |
          cd demos/minibob-cicd
          if [ -d "results/quality-loop" ]; then
            COMPLIANCE=$(jq -r '.final_compliance' results/quality-loop/autonomous-loop-summary.json 2>/dev/null || echo "0")
            if [ "$COMPLIANCE" = "100%" ]; then
              echo "has_improvements=true" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Commit Autonomous Improvements
        if: steps.check-changes.outputs.has_improvements == 'true'
        run: |
          git config user.name "MiniBob Autonomous CI/CD"
          git config user.email "minibob@metabob.com"
          git add src/ tests/
          git commit -m "feat(autonomous): apply quality improvements

          100% specification compliance achieved

          - Error handling patterns enforced
          - Parameter validation added
          - Test coverage validated

          Autonomous execution via autonomous-code-quality-loop

          Co-Authored-By: MiniBob <minibob@metabob.com>" || echo "No changes to commit"

      - name: Create Pull Request
        if: steps.check-changes.outputs.has_improvements == 'true' && github.event_name == 'schedule'
        uses: peter-evans/create-pull-request@v5
        with:
          title: "Autonomous Quality Improvements - $(date +%Y-%m-%d)"
          body: |
            ## Autonomous Quality Improvements

            This PR contains code quality improvements applied autonomously by MiniBob.

            ### Quality Metrics
            - Compliance: 100%
            - Regressions: 0
            - Patterns Enforced: Error Handling, Parameter Validation, Test Coverage

            ### Changes
            - Added parameter validation where missing
            - Enforced error handling patterns
            - Validated test coverage

            All changes have been validated for specification preservation and zero regressions.

            🤖 Generated by MiniBob Autonomous CI/CD
          branch: autonomous/quality-improvements-$(date +%Y%m%d)

workflows:
  manual-chaos-test:
    description: 'Manually trigger chaos testing with specific scenario'
    parameters:
      scenario:
        description: 'Chaos scenario'
        required: true
        type: choice
        options:
          - all
          - invalid-input-data
          - missing-dependencies
          - timeout-conditions
          - resource-exhaustion
