# =============================================================================
# Activity System - Minimal Deployment
# Complete stack for MiniBob boredom activities with API and Dashboard
# =============================================================================
#
# This helmfile deploys:
#   - Infrastructure: Redis (cache) + SurrealDB (database)
#   - API: metabob-activity-api (MCP backend, Thompson Sampling)
#   - Dashboard: activity-dashboard (real-time visualization)
#   - MiniBob: Configured for boredom activity execution
#   - Networking: Istio Gateway with api.minibob.local and dashboard.minibob.local
#
# Prerequisites:
#   1. Istio installed: istioctl install --set profile=demo -y
#   2. /etc/hosts configured:
#      127.0.0.1  api.minibob.local dashboard.minibob.local
#   3. Docker images built:
#      - cd repos/metabob-activity-api && docker build -t metabob-activity-api:latest .
#      - cd repos/activity-dashboard && docker build -t activity-dashboard:latest .
#      - cd repos/metabob-devbob && docker build -f docker/Dockerfile.devbob -t minibob:latest .
#
# Configuration:
#   Required environment variables:
#     - ANTHROPIC_API_KEY: Anthropic API key for MiniBob LLM calls
#   
#   Optional environment variables:
#     - SURREALDB_USERNAME: Database username (default: root)
#     - SURREALDB_PASSWORD: Database password (default: surrealdb-local-dev-123)
#     - LLM_PROVIDER: LLM provider (default: anthropic)
#     - LLM_MODEL: LLM model (default: claude-sonnet-4-20250514)
#
# Usage:
#   export ANTHROPIC_API_KEY="sk-ant-your-key-here"
#   helmfile -f helm/activity-system-minimal.yaml apply
#
# Access:
#   - API: http://api.minibob.local/health
#   - Dashboard: http://dashboard.minibob.local
#
# =============================================================================
environments:
  default:
    kubeContext: docker-desktop
---
helmDefaults:
  createNamespace: true
  wait: true
  timeout: 600
  force: false
  atomic: true
  cleanupOnFail: true
repositories:
  - name: bitnami
    url: https://charts.bitnami.com/bitnami
# =============================================================================
# Pre-sync Hooks: Prepare namespace with Istio injection
# =============================================================================
hooks:
  - events: ["presync"]
    showlogs: true
    command: "bash"
    args:
      - "-c"
      - |
        set -e
        echo "🚀 Preparing activity-system namespace..."
        
        # Create namespace if it doesn't exist
        kubectl create namespace activity-system --dry-run=client -o yaml | kubectl apply -f -
        
        # Enable Istio injection
        kubectl label namespace activity-system istio-injection=enabled --overwrite
        
        echo "✅ Namespace activity-system prepared with Istio injection"
# =============================================================================
# RELEASES
# =============================================================================
releases:
  # ===========================================================================
  # INFRASTRUCTURE: Redis Cache
  # ===========================================================================
  
  - name: redis
    chart: bitnami/redis
    version: 20.5.0
    namespace: activity-system
    labels:
      component: infrastructure
      tier: cache
    values:
      - auth:
          enabled: false
      - image:
          registry: docker.io
          repository: bitnami/redis
          tag: "7.4.1"
          pullPolicy: IfNotPresent
      - master:
          persistence:
            enabled: false  # In-memory for local dev
            size: 1Gi
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      - replica:
          replicaCount: 0  # No replicas for minimal setup
      - metrics:
          enabled: false
  # ===========================================================================
  # DATABASE: SurrealDB 3.x
  # ===========================================================================
  
  - name: surrealdb
    chart: ./charts/surrealdb
    namespace: activity-system
    labels:
      component: infrastructure
      tier: database
    values:
      - name: surrealdb
        namespace: activity-system
        release: production
        image:
          repository: surrealdb/surrealdb
          tag: "v3.0.0"
          pullPolicy: IfNotPresent
        service:
          type: ClusterIP
          port: 8000
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        persistence:
          enabled: true
          storageClass: ""
          size: 10Gi
          accessMode: ReadWriteOnce
        database:
          namespace: activity-system
          name: learning_loop
          storage:
            backend: file
            path: /data/surrealdb
        auth:
          existingSecret: ""
          username: "{{ env \"SURREALDB_USERNAME\" | default \"root\" }}"
          password: "{{ env \"SURREALDB_PASSWORD\" | default \"surrealdb-local-dev-123\" }}"
          usernameKey: username
          passwordKey: password
        healthCheck:
          enabled: true
          path: /health
          port: 8000
    needs:
      - activity-system/redis
  # ===========================================================================
  # API: MetaBob Activity API (MCP Backend)
  # ===========================================================================
  
  - name: metabob-activity-api
    chart: ./charts/metabob-activity-api
    namespace: activity-system
    labels:
      component: api
      tier: application
    values:
      - replicaCount: 2
        image:
          repository: metabob-activity-api
          pullPolicy: IfNotPresent
          tag: "latest"
        service:
          type: ClusterIP
          port: 8080
          targetPort: 8080
        config:
          port: 8080
          host: "0.0.0.0"
          surrealdb:
            url: "http://surrealdb.activity-system.svc.cluster.local:8000"
            namespace: "activity-system"
            database: "learning_loop"
            username: "{{ env \"SURREALDB_USERNAME\" | default \"root\" }}"
            password: "{{ env \"SURREALDB_PASSWORD\" | default \"surrealdb-local-dev-123\" }}"
          redis:
            url: "redis://redis-master.activity-system.svc.cluster.local:6379"
            sessionTtl: 86400
            templateTtl: 3600
            metricsTtl: 300
          auth:
            requireAuth: false
          logLevel: "info"
          logFormat: "json"
          corsOrigins: "*"
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 512Mi
        autoscaling:
          enabled: false
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
    needs:
      - activity-system/redis
      - activity-system/surrealdb
  # ===========================================================================
  # VESSEL: MiniBob (Boredom Task Executor)
  # ===========================================================================
  
  - name: minibob
    chart: ./charts/devbob
    namespace: activity-system
    labels:
      component: vessel
      tier: application
    values:
      - replicaCount: 1
        image:
          repository: minibob
          pullPolicy: IfNotPresent
          tag: "latest"
        service:
          type: ClusterIP
          port: 8080
          targetPort: 8080
        
        # MiniBob-specific environment configuration
        env:
          # MCP Backend Connection
          metabobApiUrl: "http://metabob-activity-api.activity-system.svc.cluster.local:8080"
          
          # SurrealDB configuration
          surrealHost: "surrealdb.activity-system.svc.cluster.local"
          surrealPort: "8000"
          surrealUser: "{{ env \"SURREALDB_USERNAME\" | default \"root\" }}"
          surrealPass: "{{ env \"SURREALDB_PASSWORD\" | default \"surrealdb-local-dev-123\" }}"
          surrealNamespace: "activity-system"
          surrealDatabase: "learning_loop"
          
          # Container configuration
          waitForBackend: "true"
          skipConfig: "false"
          logLevel: "INFO"
          home: "/workspace"
        
        # LLM API Keys (required)
        secrets:
          anthropicApiKey: "{{ requiredEnv \"ANTHROPIC_API_KEY\" }}"
          metabobApiKey: ""  # Not required for boredom activities
          githubToken: ""    # Optional for git operations
          gitUserName: "MiniBob Agent"
          gitUserEmail: "minibob@metabob.local"
        
        # Resource limits for boredom execution
        resources:
          limits:
            cpu: 2000m
            memory: 4Gi
          requests:
            cpu: 500m
            memory: 1Gi
        
        # Health probes
        livenessProbe:
          enabled: true
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          enabled: true
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        
        # Persistence for workspace
        persistence:
          enabled: true
          storageClass: ""
          accessMode: ReadWriteOnce
          size: 10Gi
          mountPath: /workspace
        
        podAnnotations:
          # MiniBob configuration annotations
          minibob.metabob.com/boredom-enabled: "true"
          minibob.metabob.com/boredom-poll-interval: "30000"
          minibob.metabob.com/boredom-idle-threshold: "60000"
          minibob.metabob.com/capabilities: "activities,impulses,git,boredom,learning"
          minibob.metabob.com/provider: "{{ env \"LLM_PROVIDER\" | default \"anthropic\" }}"
          minibob.metabob.com/model: "{{ env \"LLM_MODEL\" | default \"claude-sonnet-4-20250514\" }}"
        
        podSecurityContext: {}
        securityContext: {}
        nodeSelector: {}
        tolerations: []
        affinity: {}
    needs:
      - activity-system/metabob-activity-api
  # ===========================================================================
  # UI: Activity Dashboard
  # ===========================================================================
  
  - name: activity-dashboard
    chart: ../repos/activity-dashboard/helm/activity-dashboard
    namespace: activity-system
    labels:
      component: ui
      tier: application
    values:
      - replicaCount: 1
        image:
          repository: activity-dashboard
          pullPolicy: IfNotPresent
          tag: "latest"
        service:
          type: ClusterIP
          port: 3000
          targetPort: 3000
        config:
          # Internal cluster communication
          activityApiUrl: "http://metabob-activity-api.activity-system.svc.cluster.local:8080"
          wsEnabled: true
          refreshInterval: 5000
          port: 3000
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        podAnnotations: {}
        podSecurityContext: {}
        securityContext: {}
        nodeSelector: {}
        tolerations: []
        affinity: {}
    needs:
      - activity-system/metabob-activity-api
  # ===========================================================================
  # NETWORKING: Istio Gateway and VirtualServices
  # ===========================================================================
  
  - name: istio-gateway
    chart: ./charts/raw-manifests
    namespace: activity-system
    labels:
      component: networking
      tier: infrastructure
    values:
      - manifests:
          # Istio Gateway for external access
          - apiVersion: networking.istio.io/v1beta1
            kind: Gateway
            metadata:
              name: activity-system-gateway
              namespace: activity-system
            spec:
              selector:
                istio: ingressgateway
              servers:
                - port:
                    number: 80
                    name: http
                    protocol: HTTP
                  hosts:
                    - "dashboard.minibob.local"
                    - "api.minibob.local"
          
          # VirtualService for Dashboard
          - apiVersion: networking.istio.io/v1beta1
            kind: VirtualService
            metadata:
              name: activity-dashboard
              namespace: activity-system
            spec:
              hosts:
                - "dashboard.minibob.local"
              gateways:
                - activity-system-gateway
              http:
                - match:
                    - uri:
                        prefix: "/"
                  route:
                    - destination:
                        host: activity-dashboard.activity-system.svc.cluster.local
                        port:
                          number: 3000
                  corsPolicy:
                    allowOrigins:
                      - exact: "*"
                    allowMethods:
                      - GET
                      - POST
                      - PUT
                      - DELETE
                      - OPTIONS
                    allowHeaders:
                      - content-type
                      - authorization
                    maxAge: 24h
          
          # VirtualService for Activity API
          - apiVersion: networking.istio.io/v1beta1
            kind: VirtualService
            metadata:
              name: metabob-activity-api
              namespace: activity-system
            spec:
              hosts:
                - "api.minibob.local"
              gateways:
                - activity-system-gateway
              http:
                - match:
                    - uri:
                        prefix: "/"
                  route:
                    - destination:
                        host: metabob-activity-api.activity-system.svc.cluster.local
                        port:
                          number: 8080
                  timeout: 60s
                  corsPolicy:
                    allowOrigins:
                      - exact: "*"
                    allowMethods:
                      - GET
                      - POST
                      - PUT
                      - DELETE
                      - OPTIONS
                    allowHeaders:
                      - content-type
                      - authorization
                      - x-api-key
                    maxAge: 24h
          
          # DestinationRule for Dashboard
          - apiVersion: networking.istio.io/v1beta1
            kind: DestinationRule
            metadata:
              name: activity-dashboard
              namespace: activity-system
            spec:
              host: activity-dashboard.activity-system.svc.cluster.local
              trafficPolicy:
                connectionPool:
                  http:
                    http1MaxPendingRequests: 100
                    maxRequestsPerConnection: 2
                loadBalancer:
                  simple: ROUND_ROBIN
          
          # DestinationRule for Activity API
          - apiVersion: networking.istio.io/v1beta1
            kind: DestinationRule
            metadata:
              name: metabob-activity-api
              namespace: activity-system
            spec:
              host: metabob-activity-api.activity-system.svc.cluster.local
              trafficPolicy:
                connectionPool:
                  http:
                    http1MaxPendingRequests: 200
                    http2MaxRequests: 200
                    maxRequestsPerConnection: 5
                loadBalancer:
                  simple: LEAST_REQUEST
    needs:
      - activity-system/activity-dashboard
      - activity-system/metabob-activity-api

