# Helmfile for Activity System Development Environment
# 
# This helmfile deploys a development environment with:
#   - Local domain mapping (*.minibob.local)
#   - Hot-reload support via volume mounts
#   - Ingress for browser access
#   - All activity system components
#
# Purpose: Enable vessel development with MiniBob as the development agent
#
# Setup:
#   1. Add to /etc/hosts:
#      127.0.0.1  dashboard.minibob.local api.minibob.local minibob.minibob.local
#   
#   2. Export credentials:
#      export ANTHROPIC_API_KEY="sk-ant-..."
#      export SURREALDB_USERNAME="root"
#      export SURREALDB_PASSWORD="surrealdb-dev-123"
#   
#   3. Deploy:
#      helmfile -f helm/helmfile-activity-dev.yaml -e dev apply
#   
#   4. Access:
#      - Dashboard: http://dashboard.minibob.local
#      - API: http://api.minibob.local
#      - MiniBob: http://minibob.minibob.local (health endpoint)

environments:
  dev:
    values:
      - environments/activity-dev.values.yaml
    kubeContext: docker-desktop

---
helmDefaults:
  createNamespace: true
  wait: true
  timeout: 600
  force: false
  atomic: false  # Allow partial updates for development
  cleanupOnFail: false  # Keep resources for debugging

repositories:
  - name: bitnami
    url: https://charts.bitnami.com/bitnami

releases:
  # ==========================================================================
  # INFRASTRUCTURE: Redis Cache Layer
  # ==========================================================================
  
  - name: redis
    chart: bitnami/redis
    version: 20.5.0
    namespace: activity-dev
    labels:
      component: infrastructure
      tier: cache
      environment: dev
    values:
      - auth:
          enabled: false
      - image:
          tag: "latest"
      - master:
          persistence:
            enabled: false  # In-memory for dev speed
      - replica:
          replicaCount: 0  # No replicas needed for dev
      - metrics:
          enabled: false
    set:
      - name: master.resources.requests.cpu
        value: "50m"
      - name: master.resources.requests.memory
        value: "128Mi"
      - name: master.resources.limits.cpu
        value: "250m"
      - name: master.resources.limits.memory
        value: "256Mi"

  # ==========================================================================
  # DATABASE: SurrealDB 3.x
  # ==========================================================================
  
  - name: surrealdb
    chart: ./charts/surrealdb
    namespace: activity-dev
    labels:
      component: infrastructure
      tier: database
      environment: dev
    values:
      - name: surrealdb
        namespace: activity-dev
        release: dev
        image:
          repository: surrealdb/surrealdb
          tag: "v3.0.0"
          pullPolicy: IfNotPresent
        service:
          type: ClusterIP
          port: 8000
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        persistence:
          enabled: false  # In-memory for dev (faster resets)
        database:
          namespace: metabob
          name: learning_loop
          storage:
            backend: memory  # Fast development iteration
        auth:
          username: "{{ env \"SURREALDB_USERNAME\" | default \"root\" }}"
          password: "{{ env \"SURREALDB_PASSWORD\" | default \"surrealdb-dev-123\" }}"
    needs:
      - activity-dev/redis

  # ==========================================================================
  # API: Activity System Vessel (with hot-reload)
  # ==========================================================================
  
  - name: metabob-activity-api
    chart: ./charts/metabob-activity-api
    namespace: activity-dev
    labels:
      component: api
      tier: application
      environment: dev
    values:
      - replicaCount: 1  # Single replica for dev
        image:
          repository: metabob-activity-api
          pullPolicy: Never  # Use local image
          tag: "dev"
        service:
          type: ClusterIP
          port: 8080
          targetPort: 8080
        config:
          port: 8080
          host: "0.0.0.0"
          surrealdb:
            url: "http://surrealdb.activity-dev.svc.cluster.local:8000"
            namespace: "metabob"
            database: "learning_loop"
            username: "{{ env \"SURREALDB_USERNAME\" | default \"root\" }}"
            password: "{{ env \"SURREALDB_PASSWORD\" | default \"surrealdb-dev-123\" }}"
          redis:
            url: "redis://redis-master.activity-dev.svc.cluster.local:6379"
            sessionTtl: 86400
            templateTtl: 3600
            metricsTtl: 300
          auth:
            requireAuth: false
          logLevel: "debug"  # Verbose logging for dev
          logFormat: "text"  # Easier to read in kubectl logs
          corsOrigins: "*"
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
        # Development-specific configuration
        dev:
          enabled: true
          hotReload: true
          volumeMounts:
            - name: api-source
              mountPath: /app/src
              hostPath: "{{ env \"PWD\" }}/repos/metabob-activity-api/src"
        ingress:
          enabled: true
          className: "nginx"
          annotations:
            nginx.ingress.kubernetes.io/rewrite-target: /
          hosts:
            - host: api.minibob.local
              paths:
                - path: /
                  pathType: Prefix
    needs:
      - activity-dev/redis
      - activity-dev/surrealdb

  # ==========================================================================
  # UI: Activity Dashboard (with hot-reload)
  # ==========================================================================
  
  - name: activity-dashboard
    chart: ./repos/activity-dashboard/helm/activity-dashboard
    namespace: activity-dev
    labels:
      component: ui
      tier: application
      environment: dev
    values:
      - replicaCount: 1
        image:
          repository: activity-dashboard
          pullPolicy: Never  # Use local image
          tag: "dev"
        service:
          type: ClusterIP
          port: 3000
          targetPort: 3000
        config:
          activityApiUrl: "http://metabob-activity-api.activity-dev.svc.cluster.local:8080"
          wsEnabled: true
          refreshInterval: 3000  # 3 seconds for dev
          port: 3000
        resources:
          limits:
            cpu: 250m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi
        # Development-specific configuration
        dev:
          enabled: true
          hotReload: true
          volumeMounts:
            - name: dashboard-source
              mountPath: /app/src
              hostPath: "{{ env \"PWD\" }}/repos/activity-dashboard/src"
        ingress:
          enabled: true
          className: "nginx"
          hosts:
            - host: dashboard.minibob.local
              paths:
                - path: /
                  pathType: Prefix
    needs:
      - activity-dev/metabob-activity-api

  # ==========================================================================
  # VESSEL: MiniBob Autonomous Agent (development mode)
  # ==========================================================================
  
  - name: minibob
    chart: ./repos/minibob/helm/minibob-cluster
    namespace: activity-dev
    labels:
      component: vessel
      tier: application
      environment: dev
    values:
      - ./repos/minibob/helm/minibob-cluster/values-local.yaml
    set:
      - name: replicaCount
        value: 1  # Single pod for development
      - name: image.repository
        value: minibob
      - name: image.tag
        value: dev
      - name: image.pullPolicy
        value: Never  # Use local image
      - name: minibob.mcpEndpoint
        value: "http://metabob-activity-api.activity-dev.svc.cluster.local:8080/mcp"
      - name: minibob.boredom.enabled
        value: true
      - name: minibob.boredom.pollInterval
        value: "15000"  # 15 seconds (faster for dev)
      - name: minibob.boredom.idleThreshold
        value: "30000"  # 30 seconds
      - name: minibob.acp.enabled
        value: false  # Disabled for single-pod dev
      - name: minibob.anthropicApiKey
        value: "{{ requiredEnv \"ANTHROPIC_API_KEY\" }}"
      - name: minibob.dev.enabled
        value: true
      - name: minibob.dev.hotReload
        value: true
      - name: service.type
        value: ClusterIP
      - name: service.port
        value: 8080
      - name: resources.requests.cpu
        value: "100m"
      - name: resources.requests.memory
        value: "512Mi"
      - name: resources.limits.cpu
        value: "1000m"
      - name: resources.limits.memory
        value: "2Gi"
      # Development volume mount for live editing
      - name: dev.volumeMounts[0].name
        value: minibob-source
      - name: dev.volumeMounts[0].mountPath
        value: /app/src
      - name: dev.volumeMounts[0].hostPath
        value: "{{ env \"PWD\" }}/repos/minibob/src"
    needs:
      - activity-dev/metabob-activity-api
