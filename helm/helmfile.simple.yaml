environments:
  local:
    values:
      - environments/local.values.yaml
    missingFileHandler: Error
    kubeContext: docker-desktop

---
helmDefaults:
  createNamespace: true
  wait: true
  timeout: 300

releases:
  # DevBob Agent (standalone deployment with external dependencies)
  - name: devbob
    chart: ./charts/devbob
    namespace: metabob
    values:
      - charts/devbob.values.yaml
