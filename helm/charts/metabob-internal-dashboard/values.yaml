replicaCount: 1

image:
  repository: metabobapp/metabob-internal-dashboard
  pullPolicy: IfNotPresent
  tag: "dev-0.1.0-184a527-1774514103"

service:
  type: ClusterIP
  port: 3001

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# MiniBob configuration
minibob:
  apiUrl: "http://metabob-activity-api.activity-system.svc.cluster.local:8080"

# System-scope authentication
auth:
  credentialId: "internal-dashboard-local"
  secretName: "internal-dashboard-credentials"
  secretKey: "secret"
  # Base64 encoded secret value (default: "dashboard-local-secret")
  secretValue: "ZGFzaGJvYXJkLWxvY2FsLXNlY3JldA=="

# Health probes
probes:
  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 30
  readiness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10

# Istio routing is managed by the istio-gateway chart for DRYness
# See helm/charts/istio-gateway/values.yaml services.internal
