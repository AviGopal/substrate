apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.auth.secretName }}
  labels:
    {{- include "metabob-internal-dashboard.labels" . | nindent 4 }}
type: Opaque
data:
  # Generated secret for internal dashboard authentication
  # base64 encoded: dashboard-local-secret-$(date +%s)
  {{ .Values.auth.secretKey }}: {{ .Values.auth.secretValue | default "ZGFzaGJvYXJkLWxvY2FsLXNlY3JldA==" | quote }}
