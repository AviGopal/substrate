apiVersion: apps/v1
kind: Deployment
metadata:
  name: metabob-{{ .Values.name }}
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.service.replicas }}
  selector:
    matchLabels:
      app: metabob-{{ .Values.name }}
      release: {{ .Values.release }}
  template:
    metadata:
      labels:
        app: metabob-{{ .Values.name }}
        version: {{ .Values.image.rpc_api.tag }}
        release: {{ .Values.release }}
    spec:
      containers:
        - name: {{ .Values.name }}
          image: {{ .Values.image.imageRegistry }}/{{ .Values.image.rpc_api.repo }}:{{ .Values.image.rpc_api.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default "Always" }}
          command: ["start_server"]
          args: ["--host", "0.0.0.0", "--port", "80"]
          ports:
            - name: http
              containerPort: 80
            - name: http2
              containerPort: 8080
          env:
            - name: WORKERS
              value: '4'
            - name: TIMEOUT_KEEP_ALIVE
              value: '75'
            - name: CONFIG_PATH
              value: /usr/app/.env
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | default "INFO" | quote }}
            - name: REDIS_URI
              value: "redis://redis-master:6379"
            # - name: SECRET_KEY
            #   valueFrom:
            #     secretKeyRef:
            #       name: {{ .Values.name }}-secrets
            #       key: SECRET_KEY
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio
                  key: access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio
                  key: secret-key
            - name: POSTGRES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-client
                  key: postgresql-username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-client
                  key: postgresql-password
            - name: SURREALDB_URL
              value: "http://surrealdb:8000"
            - name: SURREALDB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: surrealdb-credentials
                  key: username
            - name: SURREALDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: surrealdb-credentials
                  key: password
            - name: SURREALDB_NAMESPACE
              value: "metabob"
            - name: SURREALDB_DATABASE
              value: "{{ .Values.surrealdb.database | default "production" }}"
          volumeMounts:
            - mountPath: /usr/app
              name: universal-config
          {{- if .Values.service.resources }}
          resources:
            {{- toYaml .Values.service.resources | nindent 12 }}
          {{- else }}
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2"
          {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 10
      {{- if .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.image.pullSecrets | nindent 8 }}
      {{- end }}
      volumes:
        - name: {{ .Values.config }}
          configMap:
            name: {{ .Values.config }}
            items:
              - key: .env
                path: .env
