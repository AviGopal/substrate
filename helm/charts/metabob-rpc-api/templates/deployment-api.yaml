apiVersion: apps/v1
kind: Deployment
metadata:
  name: metabob-{{ .Values.name }}
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.service.replicas }}
  selector:
    matchLabels:
      app: metabob-{{ .Values.name }}
      release: {{ .Values.release }}
  template:
    metadata:
      labels:
        app: metabob-{{ .Values.name }}
        version: {{ .Values.image.rpc_api.tag }}
        release: {{ .Values.release }}
    spec:
      containers:
        - name: {{ .Values.name }}
          image: {{ if .Values.image.imageRegistry }}{{ .Values.image.imageRegistry }}/{{ end }}{{ .Values.image.rpc_api.repo }}:{{ .Values.image.rpc_api.tag }}
          imagePullPolicy: IfNotPresent
          command:
            - start_server
          args:
            - --host
            - "0.0.0.0"
            - --port
            - "8080"
          ports:
            - name: http
              containerPort: 80
            - name: http2
              containerPort: 8080
          env:
            - name: WORKERS
              value: '{{ .Values.service.workers | default "16" }}'
            - name: TIMEOUT_KEEP_ALIVE
              value: '75'
            - name: CONFIG_PATH
              value: /usr/app/.env
            - name: LOG_LEVEL
              value: INFO
            # - name: SECRET_KEY
            #   valueFrom:
            #     secretKeyRef:
            #       name: {{ .Values.name }}-secrets
            #       key: SECRET_KEY
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio
                  key: access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio
                  key: secret-key
            - name: POSTGRES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-client
                  key: postgresql-username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-client
                  key: postgresql-password
            # SurrealDB configuration (legacy SURREAL_* for backward compatibility)
            - name: SURREAL_URL
              value: "ws://surrealdb:8000"
            - name: SURREAL_USER
              valueFrom:
                secretKeyRef:
                  name: surrealdb-credentials
                  key: username
            - name: SURREAL_PASS
              valueFrom:
                secretKeyRef:
                  name: surrealdb-credentials
                  key: password
            - name: SURREAL_NAMESPACE
              value: "metabob"
            - name: SURREAL_DATABASE
              value: "{{ .Values.surrealdb.database | default "production" }}"
            # SurrealDB configuration (new SURREALDB_* for Python client)
            # Note: Using HTTP instead of WS due to auth issues with SurrealDB v2.3.10 + Python library
            - name: SURREALDB_URL
              value: "http://surrealdb:8000"
            - name: SURREALDB_NAMESPACE
              value: "metabob"
            - name: SURREALDB_DATABASE
              value: "{{ .Values.surrealdb.database | default "production" }}"
            - name: SURREALDB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: surrealdb-credentials
                  key: username
            - name: SURREALDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: surrealdb-credentials
                  key: password
            # Application environment configuration
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: universal-config
                  key: ENVIRONMENT
          volumeMounts:
            - mountPath: /usr/app
              name: universal-config
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 10
      imagePullSecrets:
       - name: regcred
      volumes:
        - name: {{ .Values.config }}
          configMap:
            name: {{ .Values.config }}
            items:
              - key: .env
                path: .env
