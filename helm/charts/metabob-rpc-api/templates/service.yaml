apiVersion: v1
kind: Service
metadata:
  name: metabob-{{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: metabob-{{ .Values.name }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: metabob-{{ .Values.name }}
