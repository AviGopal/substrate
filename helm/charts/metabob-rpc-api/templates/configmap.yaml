apiVersion: v1
kind: ConfigMap
metadata:
  name: universal-config
  namespace: {{ .Values.namespace }}
data:
  # Separate keys for env var references
  ENVIRONMENT: {{ .Values.environment | default "production" | quote }}
  JWT_SECRET_KEY: {{ .Values.jwt.secretKey | quote }}
  SURREALDB_URL: {{ .Values.surrealdb.url | default "http://surrealdb:8000" | quote }}
  
  # .env file for volume mount (includes all config)
  .env: |
    # This file is generated by the chart. Do not edit it manually.
    # You can override the values in the chart's values.yaml file.

    REDIS_URI="{{ .Values.redis.uri }}"

    OPENAI_API_KEY="{{ .Values.keys.openai }}"

    OPENAI_ORG_KEY="{{ .Values.keys.openai_org }}"

    MODEL_TYPE="{{ .Values.model.type }}"
    MODEL_PATH="{{ .Values.model.path }}"

    GITHUB_CLIENT_ID="{{ .Values.github.client_id }}"
    GITHUB_CLIENT_SECRET="{{ .Values.github.client_secret }}"

    # Application environment (development, production)
    ENVIRONMENT="{{ .Values.environment | default "production" }}"

    # JWT secret key for token validation
    JWT_SECRET_KEY="{{ .Values.jwt.secretKey }}"

    # SurrealDB connection
    SURREALDB_URL="{{ .Values.surrealdb.url | default "http://surrealdb:8000" }}"
