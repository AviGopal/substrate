apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.config }}
  namespace: {{ .Values.namespace }}
  labels:
    app: metabob-{{ .Values.name }}
    release: {{ .Values.release }}
data:
  JWT_SECRET_KEY: {{ .Values.jwtSecretKey | required "jwtSecretKey is required" | quote }}
  .env: |
    # This file is generated by the Helm chart
    # Environment: {{ .Values.environment | default "production" }}
    
    # Database configuration
    SURREALDB_URL=http://surrealdb:8000
    SURREALDB_NAMESPACE=metabob
    SURREALDB_DATABASE={{ .Values.surrealdb.database | default "production" }}
    
    # Redis configuration
    REDIS_URI=redis://redis-master:6379
    
    # Application configuration
    ENVIRONMENT={{ .Values.environment | default "production" }}
    JWT_SECRET_KEY={{ .Values.jwtSecretKey }}
