# SurrealDB configuration for local deployment

name: surrealdb
namespace: activity-system
release: local

image:
  repository: surrealdb/surrealdb
  tag: "v2.3.10"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "1Gi"
    cpu: "500m"

# Use in-memory mode for local development (no persistence)
persistence:
  enabled: false

# Database configuration
database:
  namespace: activity-system
  name: learning_loop

# Credentials for local development
auth:
  existingSecret: ""
  username: "root"
  password: "root"
  usernameKey: username
  passwordKey: password
