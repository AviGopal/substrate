{{- if .Values.initDatabase.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "metabob-activity-api.fullname" . }}-init-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "metabob-activity-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: database-init
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "metabob-activity-api.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: database-init
    spec:
      restartPolicy: OnFailure
      containers:
      - name: init-database
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["bun", "run", "init-db"]
        env:
        - name: SURREALDB_URL
          value: {{ .Values.config.surrealdb.url | quote }}
        - name: SURREALDB_NAMESPACE
          value: {{ .Values.config.surrealdb.namespace | quote }}
        - name: SURREALDB_DATABASE
          value: {{ .Values.config.surrealdb.database | quote }}
        - name: SURREALDB_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ include "metabob-activity-api.fullname" . }}
              key: surrealdb-username
        - name: SURREALDB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "metabob-activity-api.fullname" . }}
              key: surrealdb-password
        resources:
          {{- toYaml .Values.initDatabase.resources | nindent 12 }}
{{- end }}
