# Default values for metabob-activity-api
replicaCount: 2

image:
  repository: metabobapp/metabob-activity-api
  pullPolicy: IfNotPresent
  tag: "dev-1.0.0-fe2f1c4-1774587854"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Database initialization
initDatabase:
  enabled: false  # Disabled until image caching issue resolved
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

# Service configuration
service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

# Configuration
config:
  # Server
  port: 8080
  host: "0.0.0.0"
  
  # SurrealDB connection
  surrealdb:
    url: "http://surrealdb.activity-system.svc.cluster.local:8000"
    namespace: "activity-system"
    database: "learning_loop"
    username: "root"
    password: "changeme"  # Override in production
  
  # Redis connection
  redis:
    url: "redis://redis-valkey.activity-system.svc.cluster.local:6379"
    sessionTtl: 86400     # 24 hours
    templateTtl: 3600     # 1 hour
    metricsTtl: 300       # 5 minutes
  
  # Security
  auth:
    requireAuth: false    # Set to true in production
  
  # Logging
  logLevel: "info"        # debug, info, warn, error
  logFormat: "json"       # json or text
  
  # CORS
  corsOrigins: "*"        # Comma-separated list

  # Rate limiting (higher values for dev/testing)
  rateLimit:
    auth: 100             # Requests per window for /v2/auth/* (default: 10)
    signin: 50            # Requests per window for signin endpoints (default: 5)
    windowMs: 60000       # Window in milliseconds (1 minute)

  # LLM Proxy configuration (for tiered resolver)
  llmProxy:
    enabled: true
    # Anthropic API key from secret (required for LLM calls)
    anthropicApiKeySecret: "anthropic-api-key"
    anthropicApiKeySecretKey: "api-key"
    # Default model for each tier
    haikuModel: "claude-3-haiku-20240307"
    sonnetModel: "claude-sonnet-4-20250514"
    opusModel: "claude-opus-4-5-20251101"

  # Heartbeat worker configuration
  heartbeatWorker:
    enabled: true
    intervalMs: 10000     # Check every 10 seconds
    gracePeriodBaseMs: 60000  # Base grace period (1 minute)
    gracePeriodMaxMs: 300000  # Max grace period during execution (5 minutes)

  # Budget worker configuration
  budgetWorker:
    enabled: true
    syncIntervalMs: 300000  # Sync to DB every 5 minutes

# Resource limits
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

# Autoscaling
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Pod configuration
podAnnotations: {}
podSecurityContext: {}
securityContext: {}

nodeSelector: {}
tolerations: []
affinity: {}

# Liveness and readiness probes
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: activity-api.metabob.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Development configuration
dev:
  enabled: false
  hotReload: false
  volumeMounts: []
