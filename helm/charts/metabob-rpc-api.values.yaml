enabled: true
release: local

image:
  imageRegistry: metabobapp
  pullPolicy: IfNotPresent

# Reduce resource requests for local deployment
workers:
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

service:
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
