enabled: true
release: local

image:
  imageRegistry: metabobapp
  pullPolicy: IfNotPresent
  rpc_api:
    repo: metabob-rpc-api
    tag: "0.16.12"  # Updated with metrics endpoint fix

# Reduce resource requests for local deployment
workers:
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

service:
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
