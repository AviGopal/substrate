# Default values for activity-dashboard
# MiniBob Instance Monitoring & Learning System
# Development only - no production equivalent

replicaCount: 1

image:
  repository: metabobapp/activity-dashboard
  pullPolicy: IfNotPresent
  tag: "dev-1.0.0-cfb2a7c-1774695755"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Service configuration
service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

# Configuration
config:
  # Activity API endpoint (for activities, templates, executions)
  activityApiUrl: "http://metabob-activity-api.activity-system.svc.cluster.local:8080"

  # Server
  port: 3000

# Resource limits
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

# Autoscaling
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

# Pod configuration
podAnnotations: {}
podSecurityContext: {}
securityContext: {}

nodeSelector: {}
tolerations: []
affinity: {}

# Liveness and readiness probes
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Ingress configuration (optional)
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: graph.metabob.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
