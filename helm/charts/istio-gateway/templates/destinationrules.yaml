{{/*
DestinationRule template - creates Istio DestinationRules for each enabled service
Configures load balancing, connection pools, and circuit breakers
*/}}
{{- $env := .Values.environment | default "development" }}
{{- $gatewayNamespace := .Values.gateway.namespace }}
{{- $globalLabels := .Values.labels }}

{{- range $name, $service := .Values.services }}
{{- $enabled := index $service.enabled $env }}
{{- if $enabled }}
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: {{ $name }}-dr
  namespace: {{ $gatewayNamespace }}
  labels:
    {{- toYaml $globalLabels | nindent 4 }}
    app.kubernetes.io/service: {{ $name }}
spec:
  host: {{ $service.service }}.{{ $service.namespace }}.svc.cluster.local
  trafficPolicy:
    {{- if and $service.settings $service.settings.loadBalancer }}
    loadBalancer:
      simple: {{ $service.settings.loadBalancer }}
    {{- end }}
    {{- if and $service.settings $service.settings.connectionPool }}
    connectionPool:
      {{- if $service.settings.connectionPool.tcp }}
      tcp:
        {{- toYaml $service.settings.connectionPool.tcp | nindent 8 }}
      {{- end }}
      {{- if $service.settings.connectionPool.http }}
      http:
        {{- toYaml $service.settings.connectionPool.http | nindent 8 }}
      {{- end }}
    {{- end }}
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
{{- end }}
{{- end }}

{{/*
Internal services - always use mTLS within the mesh
*/}}
{{- range $name, $service := .Values.internalServices }}
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: {{ $name }}-internal-dr
  namespace: {{ $gatewayNamespace }}
  labels:
    {{- toYaml $globalLabels | nindent 4 }}
    app.kubernetes.io/service: {{ $name }}
    app.kubernetes.io/scope: internal
spec:
  host: {{ $service.service }}.{{ $service.namespace }}.svc.cluster.local
  trafficPolicy:
    {{- if $service.mtls }}
    tls:
      mode: ISTIO_MUTUAL
    {{- end }}
{{- end }}
