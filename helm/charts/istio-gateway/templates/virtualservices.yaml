{{- if .Values.virtualServices.dashboard.enabled }}
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ .Values.virtualServices.dashboard.name }}
  namespace: {{ .Values.gateway.namespace }}
  labels:
    {{- toYaml .Values.labels | nindent 4 }}
spec:
  hosts:
    - {{ .Values.virtualServices.dashboard.hostname }}
  gateways:
    - {{ .Values.gateway.name }}
  http:
    # WebSocket route for /ws path (long timeout, no retries)
    - match:
        - uri:
            prefix: /ws
      route:
        - destination:
            host: {{ .Values.virtualServices.dashboard.host }}
            port:
              number: {{ .Values.virtualServices.dashboard.port }}
      timeout: 3600s  # 1 hour timeout for WebSocket connections
    # Default HTTP route for all other paths
    - route:
        - destination:
            host: {{ .Values.virtualServices.dashboard.host }}
            port:
              number: {{ .Values.virtualServices.dashboard.port }}
      timeout: {{ .Values.virtualServices.dashboard.timeout }}
      retries:
        attempts: {{ .Values.virtualServices.dashboard.retries.attempts }}
        perTryTimeout: {{ .Values.virtualServices.dashboard.retries.perTryTimeout }}
      {{- if .Values.virtualServices.dashboard.cors }}
      corsPolicy:
        {{- toYaml .Values.virtualServices.dashboard.cors | nindent 8 }}
      {{- end }}
      {{- if .Values.virtualServices.dashboard.metrics.enabled }}
      metadata:
        labels:
          {{- toYaml .Values.virtualServices.dashboard.metrics.labels | nindent 10 }}
      {{- end }}
{{- end }}

