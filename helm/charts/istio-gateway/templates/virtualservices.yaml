{{/*
VirtualService template - creates Istio VirtualServices for each enabled service
Iterates over services and creates routing based on environment
*/}}
{{- $env := .Values.environment | default "development" }}
{{- $domain := index .Values.domains $env }}
{{- $gatewayName := .Values.gateway.name }}
{{- $gatewayNamespace := .Values.gateway.namespace }}
{{- $globalLabels := .Values.labels }}

{{- range $name, $service := .Values.services }}
{{- $enabled := index $service.enabled $env }}
{{- if $enabled }}
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ $name }}-vs
  namespace: {{ $gatewayNamespace }}
  labels:
    {{- toYaml $globalLabels | nindent 4 }}
    app.kubernetes.io/service: {{ $name }}
spec:
  hosts:
    - {{ $service.subdomain }}.{{ $domain }}
  gateways:
    - {{ $gatewayName }}
  http:
    {{- if and $service.settings (index $service.settings "websocket") $service.settings.websocket.enabled }}
    # WebSocket route (long timeout, no retries)
    - match:
        - uri:
            prefix: {{ $service.settings.websocket.path }}
      route:
        - destination:
            host: {{ $service.service }}.{{ $service.namespace }}.svc.cluster.local
            port:
              number: {{ $service.port }}
      timeout: {{ $service.settings.websocket.timeout }}
    {{- end }}
    # Default HTTP route
    - route:
        - destination:
            host: {{ $service.service }}.{{ $service.namespace }}.svc.cluster.local
            port:
              number: {{ $service.port }}
      {{- if and $service.settings $service.settings.requestHeaders }}
      headers:
        request:
          set:
            {{- range $header, $value := $service.settings.requestHeaders }}
            {{ $header }}: {{ $value | quote }}
            {{- end }}
      {{- end }}
      {{- if and $service.settings $service.settings.timeout }}
      timeout: {{ $service.settings.timeout }}
      {{- else }}
      timeout: 30s
      {{- end }}
      {{- if and $service.settings $service.settings.retries }}
      retries:
        attempts: {{ $service.settings.retries.attempts }}
        perTryTimeout: {{ $service.settings.retries.perTryTimeout }}
      {{- end }}
      {{- if and $service.settings $service.settings.cors }}
      corsPolicy:
        {{- if $service.settings.cors.allowOrigins }}
        allowOrigins:
          {{- toYaml $service.settings.cors.allowOrigins | nindent 10 }}
        {{- end }}
        {{- if $service.settings.cors.allowMethods }}
        allowMethods:
          {{- toYaml $service.settings.cors.allowMethods | nindent 10 }}
        {{- end }}
        {{- if $service.settings.cors.allowHeaders }}
        allowHeaders:
          {{- toYaml $service.settings.cors.allowHeaders | nindent 10 }}
        {{- end }}
        {{- if $service.settings.cors.maxAge }}
        maxAge: {{ $service.settings.cors.maxAge }}
        {{- end }}
      {{- end }}
{{- end }}
{{- end }}
