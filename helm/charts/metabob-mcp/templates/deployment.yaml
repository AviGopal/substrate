apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.config.healthPort }}
          protocol: TCP
        env:
        - name: ANALYSIS_API_URL
          value: "{{ .Values.config.analysisApiUrl }}"
        - name: ACTIVITY_API_URL
          value: "{{ .Values.config.activityApiUrl }}"
        - name: SESSION_ID
          value: "{{ .Values.config.sessionId }}"
        - name: LOG_LEVEL
          value: "{{ .Values.config.logLevel }}"
        - name: HEALTH_PORT
          value: "{{ .Values.config.healthPort }}"
        - name: MAX_REQUESTS_PER_MINUTE
          value: "{{ .Values.config.maxRequestsPerMinute }}"
        - name: USE_CONNECTION_SLOTS
          value: "{{ .Values.config.useConnectionSlots }}"
        {{- if .Values.config.apiKeySecret }}
        - name: METABOB_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.config.apiKeySecret }}
              key: {{ .Values.config.apiKeySecretKey }}
              optional: true
        {{- end }}
        {{- if .Values.livenessProbe }}
        livenessProbe:
          {{- toYaml .Values.livenessProbe | nindent 10 }}
        {{- end }}
        {{- if .Values.readinessProbe }}
        readinessProbe:
          {{- toYaml .Values.readinessProbe | nindent 10 }}
        {{- end }}
        {{- if .Values.resources }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        {{- end }}
