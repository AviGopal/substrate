replicaCount: 1

image:
  repository: metabobapp/metabob-mcp
  pullPolicy: IfNotPresent
  tag: "dev-0.1.0-cfb2a7c-1774695755"

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  name: http

config:
  analysisApiUrl: "http://metabob-analysis-api.activity-system.svc.cluster.local:8080"
  activityApiUrl: "http://metabob-activity-api.activity-system.svc.cluster.local:8080"
  sessionId: "mcp-server-session"
  logLevel: "info"
  healthPort: 8080
  maxRequestsPerMinute: 60
  # Connection slot configuration
  useConnectionSlots: true
  # API key authentication (from secret)
  apiKeySecret: "metabob-api-keys"
  apiKeySecretKey: "mcp-api-key"

resources:
  requests:
    memory: "128Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "200m"

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
