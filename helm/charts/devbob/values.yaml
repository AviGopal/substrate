# DevBob Helm Chart Values

# Image configuration
image:
  repository: devbob
  tag: latest
  pullPolicy: Never  # Use local image

# Replica count
replicaCount: 1

# Service configuration
service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  annotations: {}

# Dashboard configuration
dashboard:
  dataBridge:
    enabled: true
    port: 8083
    targetPort: 8083

# Resource limits
resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 512Mi

# Environment variables
env:
  # Metabob API URL (internal service)
  metabobApiUrl: "http://metabob-rpc-api"
  
  # SurrealDB configuration
  surrealHost: "surrealdb"
  surrealPort: "8000"
  surrealUser: "root"
  surrealPass: "root"
  surrealNamespace: "metabob"
  surrealDatabase: "devbob"
  
  # Container configuration
  waitForBackend: "false"
  skipConfig: "true"
  logLevel: "INFO"
  home: "/workspace"

# Secrets (provide via Helm values or external secrets)
secrets:
  # REQUIRED: Anthropic API key
  anthropicApiKey: ""  # Override via --set secrets.anthropicApiKey=xxx
  
  # Git credentials for autonomous operations
  # REQUIRED for distributed devbob git workflows (clone, commit, push, PR operations)
  githubToken: ""      # GitHub Personal Access Token (classic) with repo, workflow, write:packages scopes
  gitUserName: "Devbob Agent"     # Git user.name for commit attribution
  gitUserEmail: "devbob@metabob.local"  # Git user.email for commit attribution

# Health checks
livenessProbe:
  enabled: true
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Persistence for workspace
persistence:
  enabled: true
  storageClass: ""  # Use default
  accessMode: ReadWriteOnce
  size: 10Gi
  mountPath: /workspace

# Pod annotations
podAnnotations: {}

# Pod security context
podSecurityContext:
  fsGroup: 1000

# Container security context
securityContext:
  runAsNonRoot: false
  runAsUser: 0

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}
