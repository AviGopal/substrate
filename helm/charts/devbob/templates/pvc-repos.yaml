{{- if .Values.repositories.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "devbob.fullname" . }}-repos-pvc
  labels:
    {{- include "devbob.labels" . | nindent 4 }}
    app.kubernetes.io/component: repos-storage
spec:
  accessModes:
    - {{ .Values.repositories.persistence.accessMode }}
  {{- if .Values.repositories.persistence.storageClass }}
  storageClassName: {{ .Values.repositories.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.repositories.persistence.size }}
{{- end }}
