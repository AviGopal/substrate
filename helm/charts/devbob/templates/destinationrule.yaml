{{- if and .Values.istio (eq .Values.istio.enabled true) }}
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: {{ include "devbob.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "devbob.labels" . | nindent 4 }}
spec:
  host: {{ include "devbob.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 50
        http2MaxRequests: 100
        maxRequestsPerConnection: 2
    loadBalancer:
      simple: LEAST_REQUEST
    outlierDetection:
      consecutiveErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
      minHealthPercent: 50
    {{- if eq .Values.istio.mtls "STRICT" }}
    tls:
      mode: ISTIO_MUTUAL
    {{- end }}
  subsets:
  - name: v{{ .Values.image.tag | replace "." "-" }}
    labels:
      version: {{ .Values.image.tag | quote }}
{{- end }}
