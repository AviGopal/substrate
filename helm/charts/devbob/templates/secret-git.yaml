{{- if .Values.repositories.git.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "devbob.fullname" . }}-git-credentials
  labels:
    {{- include "devbob.labels" . | nindent 4 }}
    app.kubernetes.io/component: git-credentials
type: Opaque
stringData:
  .gitconfig: |
    [user]
      name = {{ .Values.repositories.git.username | quote }}
      email = {{ .Values.repositories.git.email | quote }}
    {{- if .Values.repositories.git.token }}
    [credential]
      helper = store
    {{- end }}
  {{- if .Values.repositories.git.token }}
  .git-credentials: |
    https://{{ .Values.repositories.git.token }}@github.com
  {{- end }}
  {{- if .Values.repositories.git.sshKey }}
  id_rsa: {{ .Values.repositories.git.sshKey | quote }}
  {{- end }}
{{- end }}
