apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "devbob.fullname" . }}
  labels:
    {{- include "devbob.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "devbob.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "devbob.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "devbob.fullname" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
      - name: setup-config
        image: busybox:latest
        command:
        - sh
        - -c
        - |
          set -e
          echo "Setting up opencode configuration..."
          mkdir -p /workspace/.config/opencode
          cp /config-readonly/opencode.json /workspace/.config/opencode/opencode.json
          # Substitute environment variables in config
          sed -i "s/\${ANTHROPIC_API_KEY}/$ANTHROPIC_API_KEY/g" /workspace/.config/opencode/opencode.json
          sed -i "s/\${METABOB_API_KEY}/$METABOB_API_KEY/g" /workspace/.config/opencode/opencode.json
          echo "Config setup complete. Verifying..."
          cat /workspace/.config/opencode/opencode.json | head -20
          echo "Init container finished successfully"
        env:
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "devbob.fullname" . }}-secrets
              key: anthropic-api-key
        - name: METABOB_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "devbob.fullname" . }}-secrets
              key: metabob-api-key
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: config
          mountPath: /config-readonly
          readOnly: true
      containers:
      - name: devbob
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- if .Values.command }}
        command:
          {{- toYaml .Values.command | nindent 10 }}
        {{- else }}
        command:
        - opencode
        {{- end }}
        {{- if .Values.args }}
        args:
          {{- toYaml .Values.args | nindent 10 }}
        {{- else }}
        args:
        - acp
        - --hostname
        - "0.0.0.0"
        - --port
        - "{{ .Values.service.targetPort }}"
        - --print-logs
        - --log-level
        - "{{ .Values.env.logLevel }}"
        {{- end }}
        ports:
        - name: http
          containerPort: {{ .Values.service.targetPort }}
          protocol: TCP
        {{- if .Values.dashboard.dataBridge.enabled }}
        - name: data-bridge
          containerPort: {{ .Values.dashboard.dataBridge.targetPort }}
          protocol: TCP
        {{- end }}
        env:
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "devbob.fullname" . }}-secrets
              key: anthropic-api-key
        - name: METABOB_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "devbob.fullname" . }}-secrets
              key: metabob-api-key
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "devbob.fullname" . }}-secrets
              key: github-token
        - name: GIT_USER_NAME
          valueFrom:
            secretKeyRef:
              name: {{ include "devbob.fullname" . }}-secrets
              key: git-user-name
        - name: GIT_USER_EMAIL
          valueFrom:
            secretKeyRef:
              name: {{ include "devbob.fullname" . }}-secrets
              key: git-user-email
        - name: METABOB_API_URL
          value: {{ .Values.env.metabobApiUrl | quote }}
        {{- if .Values.env.minibobMcpEndpoint }}
        - name: MINIBOB_MCP_ENDPOINT
          value: {{ .Values.env.minibobMcpEndpoint | quote }}
        {{- end }}
        {{- if .Values.env.minibobServiceName }}
        - name: MINIBOB_SERVICE_NAME
          value: {{ .Values.env.minibobServiceName | quote }}
        {{- end }}
        - name: SURREAL_HOST
          value: {{ .Values.env.surrealHost | quote }}
        - name: SURREAL_PORT
          value: {{ .Values.env.surrealPort | quote }}
        - name: SURREAL_USER
          value: {{ .Values.env.surrealUser | quote }}
        - name: SURREAL_PASS
          value: {{ .Values.env.surrealPass | quote }}
        - name: SURREAL_NAMESPACE
          value: {{ .Values.env.surrealNamespace | quote }}
        - name: SURREAL_DATABASE
          value: {{ .Values.env.surrealDatabase | quote }}
        - name: WAIT_FOR_BACKEND
          value: {{ .Values.env.waitForBackend | quote }}
        - name: SKIP_CONFIG
          value: {{ .Values.env.skipConfig | quote }}
        - name: LOG_LEVEL
          value: {{ .Values.env.logLevel | quote }}
        - name: HOME
          value: {{ .Values.env.home | quote }}
        {{- if .Values.livenessProbe.enabled }}
        livenessProbe:
          {{- if .Values.livenessProbe.httpGet }}
          httpGet:
            path: {{ .Values.livenessProbe.httpGet.path }}
            port: {{ .Values.livenessProbe.httpGet.port }}
          {{- else if .Values.livenessProbe.tcpSocket }}
          tcpSocket:
            port: {{ .Values.livenessProbe.tcpSocket.port }}
          {{- end }}
          initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
        {{- end }}
        {{- if .Values.readinessProbe.enabled }}
        readinessProbe:
          {{- if .Values.readinessProbe.httpGet }}
          httpGet:
            path: {{ .Values.readinessProbe.httpGet.path }}
            port: {{ .Values.readinessProbe.httpGet.port }}
          {{- else if .Values.readinessProbe.tcpSocket }}
          tcpSocket:
            port: {{ .Values.readinessProbe.tcpSocket.port }}
          {{- end }}
          initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
        {{- if .Values.persistence.enabled }}
        - name: workspace
          mountPath: {{ .Values.persistence.mountPath }}
        {{- end }}
        # Config is now created by initContainer in /workspace/.config/opencode
        # No need for separate config mount
      volumes:
      {{- if .Values.persistence.enabled }}
      - name: workspace
        persistentVolumeClaim:
          claimName: {{ include "devbob.fullname" . }}-pvc
      {{- end }}
      - name: config
        configMap:
          name: {{ include "devbob.fullname" . }}
          items:
          - key: opencode.json
            path: opencode.json
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
