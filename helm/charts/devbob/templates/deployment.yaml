apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "devbob.fullname" . }}
  labels:
    {{- include "devbob.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "devbob.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "devbob.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: devbob
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.service.targetPort }}
          protocol: TCP
        {{- if .Values.dashboard.dataBridge.enabled }}
        - name: data-bridge
          containerPort: {{ .Values.dashboard.dataBridge.targetPort }}
          protocol: TCP
        {{- end }}
        env:
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "devbob.fullname" . }}-secrets
              key: anthropic-api-key
        - name: METABOB_API_URL
          value: {{ .Values.env.metabobApiUrl | quote }}
        - name: SURREAL_HOST
          value: {{ .Values.env.surrealHost | quote }}
        - name: SURREAL_PORT
          value: {{ .Values.env.surrealPort | quote }}
        - name: SURREAL_USER
          value: {{ .Values.env.surrealUser | quote }}
        - name: SURREAL_PASS
          value: {{ .Values.env.surrealPass | quote }}
        - name: SURREAL_NAMESPACE
          value: {{ .Values.env.surrealNamespace | quote }}
        - name: SURREAL_DATABASE
          value: {{ .Values.env.surrealDatabase | quote }}
        - name: WAIT_FOR_BACKEND
          value: {{ .Values.env.waitForBackend | quote }}
        - name: SKIP_CONFIG
          value: {{ .Values.env.skipConfig | quote }}
        - name: LOG_LEVEL
          value: {{ .Values.env.logLevel | quote }}
        {{- if .Values.livenessProbe.enabled }}
        livenessProbe:
          httpGet:
            path: {{ .Values.livenessProbe.httpGet.path }}
            port: {{ .Values.livenessProbe.httpGet.port }}
          initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
        {{- end }}
        {{- if .Values.readinessProbe.enabled }}
        readinessProbe:
          httpGet:
            path: {{ .Values.readinessProbe.httpGet.path }}
            port: {{ .Values.readinessProbe.httpGet.port }}
          initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        {{- if .Values.persistence.enabled }}
        volumeMounts:
        - name: workspace
          mountPath: {{ .Values.persistence.mountPath }}
        {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: {{ include "devbob.fullname" . }}-pvc
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
