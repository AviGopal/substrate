replicaCount: 1

image:
  repository: metabobapp/metabob-analysis-api
  pullPolicy: IfNotPresent
  tag: "dev-0.1.1-d901a7b-1774708643"

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  name: http

config:
  port: 8080
  host: "0.0.0.0"

  surrealdb:
    url: "http://surrealdb.activity-system.svc.cluster.local:8000"
    namespace: "activity-system"
    database: "learning_loop"
    username: "root"
    password: "surrealdb-local-dev-123"

  redis:
    url: "redis://redis-valkey.activity-system.svc.cluster.local:6379"

  logLevel: "info"
  corsOrigins: "*"

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
