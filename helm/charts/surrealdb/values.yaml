name: surrealdb
namespace: metabob
release: production

image:
  repository: surrealdb/surrealdb
  tag: "v3.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "4Gi"
    cpu: "2000m"

persistence:
  enabled: true
  storageClass: ""
  size: 10Gi
  accessMode: ReadWriteOnce

# Database configuration
database:
  namespace: metabob
  name: learning_loop
  # Storage backend: memory, file, tikv
  storage:
    backend: file
    path: /data/surrealdb

# Credentials - set via helmfile from SOPS-encrypted secrets
# When existingSecret is empty, chart creates the secret
auth:
  existingSecret: ""
  username: "root"
  password: "changeme"
  usernameKey: username
  passwordKey: password

# Health check configuration
healthCheck:
  enabled: true
  path: /health
  port: 8000

