name: surrealdb
namespace: activity-system
release: production

image:
  repository: surrealdb/surrealdb
  tag: "v3.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "4Gi"
    cpu: "2000m"

persistence:
  enabled: true
  storageClass: ""
  size: 10Gi
  accessMode: ReadWriteOnce

# Database configuration
database:
  namespace: activity-system
  name: learning_loop
  # Storage backend: memory, file, tikv
  storage:
    backend: file
    path: /data/surrealdb

# Credentials - set via helmfile from SOPS-encrypted secrets
# When existingSecret is empty, chart creates the secret
auth:
  existingSecret: ""
  username: "root"
  password: "changeme"
  usernameKey: username
  passwordKey: password

# Health check configuration
healthCheck:
  enabled: true
  path: /health
  port: 8000

# Schema migration (regular Job, NOT Helm hook)
# Runs after SurrealDB is ready via health check wait
migration:
  enabled: false  # Set to true in helmfile to run migrations
  image:
    repository: metabob-activity-api
    tag: latest
    pullPolicy: IfNotPresent

# Test data initialization (Helm hook - runs after migrations)
# WARNING: Helm hooks can run before SurrealDB is ready
# Consider using migration.enabled instead for reliability
initData:
  enabled: false  # Disabled by default for reliability
  backoffLimit: 3
  image:
    repository: metabob-activity-api
    tag: latest
    pullPolicy: IfNotPresent
  defaultOrg:
    id: metabob_internal
    name: "Metabob Internal"
  minibob:
    instanceId: minibob-local-001
    vesselId: minibob-cli-local
    secretName: minibob-instance-credentials
    secretKey: api-key

