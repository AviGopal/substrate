name: surrealdb
namespace: metabob
release: production

image:
  repository: surrealdb/surrealdb
  tag: "v2.3.10"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

resources:
  requests:
    memory: "512Mi"
    cpu: "100m"
  limits:
    memory: "2Gi"
    cpu: "1000m"

persistence:
  enabled: false
  storageClass: ""
  size: 10Gi

# Database configuration
database:
  namespace: metabob
  name: production

# Credentials - set via helmfile from SOPS-encrypted secrets
# When existingSecret is empty, chart creates the secret
auth:
  existingSecret: ""
  username: "root"
  password: "changeme"
  usernameKey: username
  passwordKey: password

