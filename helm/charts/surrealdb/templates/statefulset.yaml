{{- if .Values.persistence.enabled }}
# StatefulSet is used when persistence is enabled for stable storage
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.name }}
    release: {{ .Values.release }}
spec:
  serviceName: {{ .Values.name }}
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.name }}
      release: {{ .Values.release }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
        version: {{ .Values.image.tag | default "latest" }}
        release: {{ .Values.release }}
    spec:
      terminationGracePeriodSeconds: 30
      # Security context to ensure volume permissions
      # SurrealDB runs as nonroot user (65532)
      securityContext:
        fsGroup: 65532
      initContainers:
        # Init container to fix volume permissions for SurrealDB's nonroot user
        - name: init-permissions
          image: busybox:1.36
          command: ['sh', '-c', 'chown -R 65532:65532 /data && chmod -R 755 /data']
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            runAsUser: 0
      containers:
        - name: {{ .Values.name }}
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          args:
            - start
            - --user
            - $(SURREAL_USER)
            - --pass
            - $(SURREAL_PASS)
            - --log
            - info
            # RocksDB is the recommended storage backend for production
            - rocksdb:/data/database.db
          env:
            - name: SURREAL_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret | default "surrealdb-credentials" }}
                  key: {{ .Values.auth.usernameKey | default "username" }}
            - name: SURREAL_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret | default "surrealdb-credentials" }}
                  key: {{ .Values.auth.passwordKey | default "password" }}
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
{{- end }}

