{{- if not .Values.auth.existingSecret }}
{{- $secret := lookup "v1" "Secret" .Release.Namespace (printf "%s-credentials" .Values.name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.name }}-credentials
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.name }}
    release: {{ .Values.release }}
type: Opaque
data:
  {{- if $secret }}
  # Preserve existing secret on upgrade
  username: {{ index $secret.data "username" }}
  password: {{ index $secret.data "password" }}
  {{- else }}
  # Generate on first install
  username: {{ .Values.auth.username | default "root" | b64enc | quote }}
  {{- if .Values.auth.password }}
  password: {{ .Values.auth.password | b64enc | quote }}
  {{- else }}
  # Auto-generate random password
  password: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
