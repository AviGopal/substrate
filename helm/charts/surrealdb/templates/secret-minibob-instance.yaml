apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.initData.minibob.secretName | default "minibob-instance-credentials" }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/component: minibob-credentials
    app.kubernetes.io/part-of: metabob-learning-system
type: Opaque
stringData:
  # This is a default API key for local development only
  # In production, use a secure random key and rotate regularly
  {{ .Values.initData.minibob.secretKey | default "api-key" }}: "test-api-key-123"
