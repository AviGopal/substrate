{{- if not .Values.persistence.enabled }}
# Deployment is used when persistence is disabled (in-memory mode)
# When persistence is enabled, StatefulSet is used instead (see statefulset.yaml)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.name }}
    release: {{ .Values.release }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.name }}
      release: {{ .Values.release }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
        version: {{ .Values.image.tag | default "latest" }}
        release: {{ .Values.release }}
    spec:
      containers:
        - name: {{ .Values.name }}
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          args:
            - start
            - --user
            - $(SURREAL_USER)
            - --pass
            - $(SURREAL_PASS)
            - --log
            - info
            - memory
          env:
            - name: SURREAL_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret | default "surrealdb-credentials" }}
                  key: {{ .Values.auth.usernameKey | default "username" }}
            - name: SURREAL_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret | default "surrealdb-credentials" }}
                  key: {{ .Values.auth.passwordKey | default "password" }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
{{- end }}

