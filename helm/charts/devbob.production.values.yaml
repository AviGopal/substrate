# DevBob Production Values
# This file overrides chart defaults for production deployments with Istio

# Use registry image (not local)
image:
  repository: metabobapp/devbob
  tag: "1.0.64"
  pullPolicy: IfNotPresent

# Scale for production
replicaCount: 3

# Enable Istio
istio:
  enabled: true
  mtls: STRICT
  gateway:
    enabled: true
    name: devbob-gateway
    host: devbob.metabob.app

# Production resource limits
resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 1000m
    memory: 2Gi

# Enable health checks
livenessProbe:
  enabled: true
  httpGet:
    path: /health
    port: 3000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /health
    port: 3000
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Persistence for production
persistence:
  enabled: true
  size: 50Gi
  storageClass: "fast-ssd"  # Use production storage class

# Security context for production
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false

# Affinity for high availability
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - devbob
        topologyKey: kubernetes.io/hostname
