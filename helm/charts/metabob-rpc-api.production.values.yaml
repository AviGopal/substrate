# Metabob RPC API Production Values
# This file overrides chart defaults for production deployments

# Use production namespace and release
name: rpc-api
namespace: metabob
release: production

# Use registry image with correct version
image:
  imageRegistry: metabobapp
  pullPolicy: IfNotPresent
  rpc_api:
    repo: metabob-rpc-api
    tag: "0.16.13"

# Scale for production
service:
  replicas: 2
  workers: 16
  resources:
    requests:
      memory: "2Gi"
      cpu: "500m"
    limits:
      memory: "4Gi"
      cpu: "2"

workers:
  replicas: 3
  resources:
    requests:
      memory: "8Gi"
      cpu: "2000m"

# Production database
surrealdb:
  database: production
  url: "http://surrealdb:8000"

# Production environment
environment: production

# Production database configuration
database:
  uri: "postgresql://{username}:{password}@34.94.22.213:5432/{db}"
  name: "metabob_production_1_7_0"

# Service URIs (production)
redis:
  uri: "redis-master.metabob.svc"

minio:
  uri: "minio.metabob.svc:9000"

