environments:
  local:
    values:
      - environments/local.values.yaml
    missingFileHandler: Error
    kubeContext: docker-desktop
  
  production:
    values:
      - environments/production.values.yaml
    missingFileHandler: Error
    # Production kubeContext should be set via environment or command line
    # e.g., helmfile -e production --kube-context prod-cluster sync

---
helmDefaults:
  createNamespace: true
  wait: true
  timeout: 300

releases:
  # Redis
  - name: redis
    chart: oci://registry-1.docker.io/bitnamicharts/redis
    version: 20.5.0
    namespace: metabob
    values:
      - charts/redis.values.yaml

  # SurrealDB
  - name: surrealdb
    chart: ./charts/surrealdb
    namespace: metabob
    values:
      - charts/surrealdb.values.yaml
    needs:
      - redis

  # Metabob RPC API
  - name: metabob-rpc-api
    chart: ./charts/metabob-rpc-api
    namespace: metabob
    values:
      - charts/metabob-rpc-api.values.yaml
      # Load environment-specific values (production, staging, etc.)
      - charts/metabob-rpc-api.{{ .Environment.Name }}.values.yaml
    missingFileHandler: Warn
    needs:
      - redis
      - surrealdb

  # DevBob Agent
  - name: devbob
    chart: ./charts/devbob
    namespace: metabob
    values:
      - charts/devbob.values.yaml
      # Load environment-specific values (production, staging, etc.)
      - charts/devbob.{{ .Environment.Name }}.values.yaml
    missingFileHandler: Warn
    needs:
      - metabob-rpc-api
