# Helmfile for Activity System Minimal Deployment
# 
# This helmfile deploys a minimal testing environment with:
#   - SurrealDB 3.x - Database backend for learning loop
#   - metabob-activity-api - TypeScript activity system vessel
#   - minibob - Autonomous vessel for testing
#
# Purpose: Close the learning loop and test activity execution in isolated environment
#
# Usage:
#   export ANTHROPIC_API_KEY="sk-ant-..."
#   helmfile -f helm/helmfile-activity-minimal.yaml \
#     --state-values-file helm/secrets/local.yaml \
#     -e local apply

environments:
  local:
    values:
      - environments/activity-minimal-local.values.yaml
    kubeContext: docker-desktop
  
  testing:
    values:
      - environments/activity-minimal-testing.values.yaml
    kubeContext: docker-desktop

---
helmDefaults:
  createNamespace: true
  wait: true
  timeout: 600
  force: false
  atomic: true
  cleanupOnFail: true

repositories:
  - name: bitnami
    url: https://charts.bitnami.com/bitnami

releases:
  # ==========================================================================
  # INFRASTRUCTURE: Redis Cache Layer
  # ==========================================================================
  
  - name: redis
    chart: bitnami/redis
    version: 20.5.0
    namespace: activity-system
    labels:
      component: infrastructure
      tier: cache
    values:
      - auth:
          enabled: false
      - image:
          tag: "latest"  # Use latest tag which we've pre-pulled
      - master:
          persistence:
            enabled: false  # In-memory for testing
            size: 1Gi
      - replica:
          replicaCount: 0  # No replicas for minimal deployment
      - metrics:
          enabled: false
    set:
      - name: master.resources.requests.cpu
        value: "100m"
      - name: master.resources.requests.memory
        value: "256Mi"
      - name: master.resources.limits.cpu
        value: "500m"
      - name: master.resources.limits.memory
        value: "512Mi"

  # ==========================================================================
  # DATABASE: SurrealDB 3.x
  # ==========================================================================
  
  - name: surrealdb
    chart: ./charts/surrealdb
    namespace: activity-system
    labels:
      component: infrastructure
      tier: database
    values:
      - name: surrealdb
        namespace: activity-system
        release: minimal
        image:
          repository: surrealdb/surrealdb
          tag: "v3.0.0"
          pullPolicy: IfNotPresent
        service:
          type: ClusterIP
          port: 8000
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        persistence:
          enabled: true
          storageClass: ""
          size: 5Gi
          accessMode: ReadWriteOnce
        database:
          namespace: metabob
          name: learning_loop
          storage:
            backend: file
            path: /data/surrealdb
        auth:
          existingSecret: ""
          username: "{{ env \"SURREALDB_USERNAME\" | default \"root\" }}"
          password: "{{ env \"SURREALDB_PASSWORD\" | default \"surrealdb-local-dev-123\" }}"
          usernameKey: username
          passwordKey: password
    needs:
      - activity-system/redis

  # ==========================================================================
  # API: Activity System Vessel
  # ==========================================================================
  
  - name: metabob-activity-api
    chart: ./charts/metabob-activity-api
    namespace: activity-system
    labels:
      component: api
      tier: application
    values:
      - replicaCount: 2
        image:
          repository: metabob-activity-api
          pullPolicy: IfNotPresent
          tag: "latest"
        service:
          type: ClusterIP
          port: 8080
          targetPort: 8080
        config:
          port: 8080
          host: "0.0.0.0"
          surrealdb:
            url: "http://surrealdb.activity-system.svc.cluster.local:8000"
            namespace: "activity-system"
            database: "learning_loop"
            username: "{{ env \"SURREALDB_USERNAME\" | default \"root\" }}"
            password: "{{ env \"SURREALDB_PASSWORD\" | default \"surrealdb-local-dev-123\" }}"
          redis:
            url: "redis://redis-master.activity-system.svc.cluster.local:6379"
            sessionTtl: 86400
            templateTtl: 3600
            metricsTtl: 300
          auth:
            requireAuth: false
          logLevel: "info"
          logFormat: "json"
          corsOrigins: "*"
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 512Mi
        autoscaling:
          enabled: false
    needs:
      - activity-system/redis
      - activity-system/surrealdb

  # ==========================================================================
  # VESSEL: Minibob Autonomous Agent
  # ==========================================================================
  
  - name: minibob
    chart: ../repos/minibob/helm/minibob-cluster
    namespace: activity-system
    labels:
      component: vessel
      tier: application
    values:
      - ../repos/minibob/helm/minibob-cluster/values-testing-cluster.yaml
    set:
      - name: replicaCount
        value: 1
      - name: image.repository
        value: minibob
      - name: image.tag
        value: latest
      - name: image.pullPolicy
        value: IfNotPresent
      # Point to our new activity-api instead of deprecated rpc-api
      - name: minibob.mcpEndpoint
        value: "http://metabob-activity-api.activity-system.svc.cluster.local:8080/mcp"
      - name: minibob.boredom.enabled
        value: true
      - name: minibob.boredom.pollInterval
        value: "30000"  # 30 seconds
      - name: minibob.boredom.idleThreshold
        value: "60000"  # 60 seconds
      - name: minibob.acp.enabled
        value: false  # Disabled for minimal single-vessel deployment
      - name: minibob.anthropicApiKey
        value: "{{ requiredEnv \"ANTHROPIC_API_KEY\" }}"
      - name: service.type
        value: ClusterIP
      - name: service.port
        value: 8080
      - name: resources.requests.cpu
        value: "500m"
      - name: resources.requests.memory
        value: "1Gi"
      - name: resources.limits.cpu
        value: "2000m"
      - name: resources.limits.memory
        value: "4Gi"
    needs:
      - activity-system/metabob-activity-api
