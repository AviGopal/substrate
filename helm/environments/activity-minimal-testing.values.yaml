# Activity System Minimal Deployment - Testing Environment
# For comprehensive testing with realistic resource allocation

# Global flags
backend:
  enabled: true

testing:
  enabled: true

# Environment-specific overrides
environment: testing

# Resource allocation
resources:
  minimal: false
  
# Redis configuration
redis:
  auth:
    enabled: false
  master:
    persistence:
      enabled: true
      size: 2Gi
  
# SurrealDB configuration
surrealdb:
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"

# Activity API configuration
activityApi:
  replicaCount: 2
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  config:
    logLevel: "info"
    logFormat: "json"

# Minibob configuration
minibob:
  replicaCount: 1
  boredom:
    enabled: true
    pollInterval: 30000
    idleThreshold: 60000
  acp:
    enabled: false
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"
