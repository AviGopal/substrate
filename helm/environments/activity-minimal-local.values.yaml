# Activity System Minimal Deployment - Local Environment
# For local development and testing on docker-desktop

# Global flags
backend:
  enabled: true

testing:
  enabled: true

# Environment-specific overrides
environment: local

# Resource constraints for local development
resources:
  minimal: true
  
# Redis configuration
redis:
  auth:
    enabled: false
  master:
    persistence:
      enabled: false
  
# SurrealDB configuration
surrealdb:
  persistence:
    enabled: true
    size: 2Gi
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

# Activity API configuration
activityApi:
  replicaCount: 1
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  config:
    logLevel: "debug"
    logFormat: "text"

# Minibob configuration
minibob:
  replicaCount: 1
  boredom:
    enabled: false
  acp:
    enabled: false
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
