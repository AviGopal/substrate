# =============================================================================
# Production Environment Values
# =============================================================================
# Usage: helmfile -f activity-system-minimal.yaml.gotmpl -e production sync
#
# Service Routing (Production):
#   app.metabob.com      -> Cloud Dashboard
#   activity.metabob.com -> Activity API
#   api.metabob.com      -> Analysis API
#   (surrealdb and minibob NOT exposed)
# =============================================================================

# Istio Gateway Configuration
istioGateway:
  environment: production
  gateway:
    tls:
      enabled: true
      mode: SIMPLE
      credentialName: metabob-tls-cert
  services:
    # SurrealDB not exposed in production
    surrealdb:
      enabled:
        production: false
    # MiniBob vessels not exposed in production
    minibob:
      enabled:
        production: false

# SurrealDB Configuration
surrealdb:
  auth:
    # Use existing secret managed by secrets operator
    existingSecret: "surrealdb-production-credentials"
  resources:
    requests:
      memory: "2Gi"
      cpu: "1000m"
    limits:
      memory: "8Gi"
      cpu: "4000m"
  persistence:
    size: 100Gi
    storageClass: "premium-rwo"

# Activity API Configuration
activityApi:
  replicaCount: 3
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "2000m"

# MiniBob Configuration
minibob:
  replicaCount: 5
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "2000m"

# Dashboard Configuration
dashboard:
  replicaCount: 2
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
