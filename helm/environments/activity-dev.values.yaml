# Activity System Development Environment Values
# 
# For use with helmfile-activity-dev.yaml
# Enables local development with hot-reload and Ingress

# Development mode enabled
dev:
  enabled: true

# Backend services enabled
backend:
  enabled: true
  
# Development configuration
development:
  # Enable hot-reload for all vessels
  hotReload: true
  
  # Use local Docker images (never pull from registry)
  imagePullPolicy: Never
  
  # Faster resource limits for local development
  resourceLimits:
    minimal: true
  
  # Enable debug logging
  logging:
    level: debug
    format: text
  
  # Disable persistence (faster iteration)
  persistence:
    enabled: false

# Ingress configuration
ingress:
  enabled: true
  className: "nginx"
  hosts:
    - dashboard.minibob.local
    - api.minibob.local
    - minibob.minibob.local
  tls:
    enabled: false  # No HTTPS for local dev
