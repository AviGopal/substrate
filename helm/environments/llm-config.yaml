# =============================================================================
# LLM Configuration for MiniBob
# Single source of truth for LLM provider configuration
# =============================================================================
# LLM Provider Configuration
llm:
  # Primary provider (anthropic, openai, etc.)
  provider: anthropic
  
  # Model selection
  model: claude-sonnet-4-20250514
  
  # API Keys (set via environment variables)
  # These should be passed when deploying:
  #   export ANTHROPIC_API_KEY="sk-ant-..."
  #   helmfile -f helm/activity-system-minimal.yaml apply
  apiKeys:
    anthropic: "${ANTHROPIC_API_KEY}"
    openai: "${OPENAI_API_KEY:-}"
  
  # Model parameters
  parameters:
    temperature: 0.7
    maxTokens: 4096
    topP: 0.9
# Boredom System Configuration
boredom:
  enabled: true
  pollInterval: 30000      # 30 seconds
  idleThreshold: 60000     # 60 seconds
  maxConcurrentTasks: 3
# Activity Execution Configuration
activities:
  maxDuration: 3600000     # 1 hour
  defaultTimeout: 300000   # 5 minutes
  retryAttempts: 3
  retryBackoff: 5000       # 5 seconds
