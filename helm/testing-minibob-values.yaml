# Helm values for testing-minibob namespace deployment
# 
# This deploys minibob with security hardening and readiness for validation.
# Used by validation harness to test all standalone capabilities.

# Namespace configuration
namespace: testing-minibob

# Replica count for ACP gossip discovery testing
replicaCount: 3

image:
  repository: minibob
  tag: latest
  pullPolicy: IfNotPresent

# Service configuration
service:
  type: ClusterIP
  port: 8080
  annotations: {}

# Security context (enforced in Phase 1)
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  readOnlyRootFilesystem: false  # Minibob needs write for /tmp
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Resource limits
resources:
  limits:
    cpu: "2"
    memory: "4Gi"
  requests:
    cpu: "500m"
    memory: "1Gi"

# Environment variables
env:
  # LLM Provider
  - name: MINIBOB_PROVIDER
    value: "anthropic"
  - name: MINIBOB_MODEL
    value: "claude-sonnet-4-20250514"
  
  # API Keys (from secrets)
  - name: ANTHROPIC_API_KEY
    valueFrom:
      secretKeyRef:
        name: minibob-secrets
        key: anthropic-api-key
        optional: false
  
  # Server configuration
  - name: MINIBOB_PORT
    value: "8080"
  - name: MINIBOB_HOST
    value: "0.0.0.0"
  
  # Working directory
  - name: MINIBOB_WORKDIR
    value: "/workspace"
  
  # Templates directory
  - name: MINIBOB_TEMPLATES
    value: "/workspace/templates"
  
  # Backend configuration
  - name: METABOB_ENDPOINT
    value: "http://api.metabob.local"
  - name: METABOB_VESSEL_ID
    valueFrom:
      fieldRef:
        fieldPath: metadata.name
  
  # Auto-commit (disabled for safety)
  - name: MINIBOB_AUTO_COMMIT
    value: "false"

# Health probes
livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Volume mounts for workspace
volumes:
  - name: workspace
    emptyDir: {}
  - name: templates
    configMap:
      name: minibob-templates

volumeMounts:
  - name: workspace
    mountPath: /workspace
  - name: templates
    mountPath: /workspace/templates

# Network policy (egress only to backend)
networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: testing-minibob
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow backend API
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app: metabob-api
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
    # Allow DNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
    # Allow ACP gossip between minibob pods
    - to:
        - podSelector:
            matchLabels:
              app: minibob
      ports:
        - protocol: TCP
          port: 8080

# Pod disruption budget (for graceful shutdown testing)
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Annotations
annotations:
  "validation.metabob.com/security-hardened": "true"
  "validation.metabob.com/phase": "p0-complete"
  "validation.metabob.com/testing-ready": "true"
