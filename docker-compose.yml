# Substrate — one pre-built image + this file + a .env is the ENTIRE surface.
#
# From the repo root:
#   cp scripts/substrate/.env.example .env   # set ANTHROPIC_API_KEY (+ optional keys)
#   (no docker login needed — the ghcr package is public and pulls anonymously)
#   docker compose up -d
#   docker exec substrate-live substrate-key show   # operator API key, post-launch
#
# The image is pulled from GHCR (the canonical registry — build-substrate-image.yml
# publishes ghcr.io/avigopal/substrate:{dev,<sha>} on every push to dev). Override
# the tag with SUBSTRATE_IMAGE. There is no host repos/ mount and no docker cp
# hot-reload; the Makefile builds+runs the SAME artifact for local development.
#
# The image is a fat single container: surrealdb + valkey + every vessel run as
# systemd units inside it (hence privileged + tmpfs /run). Both named volumes
# persist state — /workspace (learning state, memoryNotes) and /var/lib/surrealdb
# (the datastore); DROPPING EITHER loses learned state on recreate.
#
# A standalone container needs only an LLM key. Setting the optional
# identity/discovery-group vars below joins an existing group as a spoke.

services:
  substrate:
    image: ${SUBSTRATE_IMAGE:-ghcr.io/avigopal/substrate:dev}
    container_name: ${SUBSTRATE_CONTAINER:-substrate-live}
    privileged: true            # systemd as PID 1 inside the container
    stop_signal: SIGRTMIN+3     # systemd graceful shutdown
    stop_grace_period: 30s
    restart: unless-stopped
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY is required}
      # Optional: autonomous git push (parent change Phase 1). Unset = no self-push.
      SUBSTRATE_GIT_PAT: ${SUBSTRATE_GIT_PAT:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Optional: join an existing identity/discovery group (spoke) + provider/self-dev overrides
      METABOB_API_KEY: ${METABOB_API_KEY:-}
      # VESSEL SELECTION — the whole family, not just roles. Only ENABLED_ROLES
      # used to be forwarded here, so the other four knobs were documented in
      # docs/SUBSTRATE.md as the operator's selection levers while being
      # unreachable from the launch path that doc calls canonical.
      # Precedence (highest first): PROFILE > ENABLED_VESSELS > ENABLED_ROLES,
      # then + ENABLED_EXTRA_VESSELS, then - DISABLED_VESSELS.
      PROFILE: ${PROFILE:-}
      ENABLED_VESSELS: ${ENABLED_VESSELS:-}
      ENABLED_ROLES: ${ENABLED_ROLES:-}
      ENABLED_EXTRA_VESSELS: ${ENABLED_EXTRA_VESSELS:-}
      DISABLED_VESSELS: ${DISABLED_VESSELS:-}
      # Replaces the whole LLM arm set without editing a tracked file. Read by
      # render-llm-arms.sh BEFORE systemd starts, so it needs no gen-env emission.
      LLM_ARMS: ${LLM_ARMS:-}
      # Makes discovery's /bootstrap advertise a reachable address instead of
      # loopback. The *_PUBLIC_URL / *_PUBLIC_PORT overrides are INERT without it.
      PUBLIC_IP: ${PUBLIC_IP:-}
      # Autonomous code landing: unset means ON (gen-env defaults it to 1) — the
      # substrate commits and pushes to origin/dev. Set to 0 to hold it to
      # intent-only. This is the kill switch; it belongs where you can see it.
      MITOSIS_DIRECT_PUSH: ${MITOSIS_DIRECT_PUSH:-}
      ROUTE_EDIT_INTENT_TO_COMPOSE: ${ROUTE_EDIT_INTENT_TO_COMPOSE:-}
      HUB_DISCOVERY_URL: ${HUB_DISCOVERY_URL:-}
      DISCOVERY_ENDPOINT: ${DISCOVERY_ENDPOINT:-}
      ACTIVITY_API_ENDPOINT: ${ACTIVITY_API_ENDPOINT:-}
      IDENTITY_VESSEL_URL: ${IDENTITY_VESSEL_URL:-}
      FED_SUBSTRATE_ID: ${FED_SUBSTRATE_ID:-}
      RELAY_MULTIADDR: ${RELAY_MULTIADDR:-}
      PEER_DISCOVERY_ENDPOINTS: ${PEER_DISCOVERY_ENDPOINTS:-}
      SUBSTRATE_REPO_OWNER: ${SUBSTRATE_REPO_OWNER:-}
      # Optional extra LLM providers (also readable from the host /etc/environment on a VM)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # gen-env resolves, emits and round-trips both of these, and the Makefile
      # forwards them — compose did not, so two of the eight supported providers
      # were unusable on the compose path.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      CHUTES_API_KEY: ${CHUTES_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      # Self-hosted vLLM on Vast.ai / RunPod (Cloudflare-tunnel stable hostname).
      # Single instance: VLLM_BASE_URL + VLLM_MODELS (comma-separated served ids),
      # VLLM_API_KEY optional (only if the instance runs vllm serve --api-key).
      # Multiple: VLLM_ENDPOINTS='[{"id":..,"baseURL":..,"models":[..]}]'.
      VLLM_BASE_URL: ${VLLM_BASE_URL:-}
      VLLM_MODELS: ${VLLM_MODELS:-}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      VLLM_ENDPOINTS: ${VLLM_ENDPOINTS:-}
      # RunPod Serverless (queue endpoint, OpenAI-compatible route). Unlike the
      # VLLM_* forms above this is a fixed vendor host, so only the endpoint id
      # is needed — the resolver builds the URL. The lane SCALES TO ZERO and is
      # offered to the policy only while a worker is already warm, so leaving it
      # unset simply means no arm. RUNPOD_MODELS / RUNPOD_COST_PER_MTOK are
      # optional overrides (served ids, and the warm per-Mtok price prior).
      RUNPOD_ENDPOINT_ID: ${RUNPOD_ENDPOINT_ID:-}
      RUNPOD_API_KEY: ${RUNPOD_API_KEY:-}
      RUNPOD_MODELS: ${RUNPOD_MODELS:-}
      RUNPOD_COST_PER_MTOK: ${RUNPOD_COST_PER_MTOK:-}
      # Existing deployment on the legacy default signing secret? Set this to boot.
      ALLOW_INSECURE_API_KEY_SECRET: ${ALLOW_INSECURE_API_KEY_SECRET:-}
    ports:
      - "${ACTIVITY_API_PORT:-18080}:8080"   # activity-api
      - "${DEV_VESSEL_PORT:-18090}:8090"     # development-vessel
      - "${DISCOVERY_PORT:-18100}:8100"      # discovery-vessel
      - "${IDENTITY_PORT:-18101}:8101"       # identity-vessel
      - "${GOAL_HOST_PORT:-18210}:8210"      # goal-host-vessel
      - "${ANALYSIS_PORT:-18250}:8250"       # analysis-vessel
      - "${CONCEPT_DB_PORT:-18260}:8260"     # concept-db
      - "${STATEFUL_UI_PORT:-18270}:8270"    # stateful-ui-vessel
      # THE HUMAN SURFACE WAS THE ONE VESSEL NEVER PUBLISHED. The Makefile's docker-run
      # path has carried `-p 18310:8310` all along; this compose file did not, so a fleet
      # brought up through compose ran human-surface-vessel healthy, enabled, bound to
      # 0.0.0.0 — and unreachable from the host. Two declarations of one fleet, differing
      # by one line, is the same producer/consumer drift this repo keeps paying for, and
      # the vessel it silently dropped is the ONLY one a human is meant to talk to.
      - "${HUMAN_SURFACE_PORT:-18310}:8310"  # human-surface-vessel
    volumes:
      - substrate-workspace:/workspace          # named volume — portable, not a host path
      - substrate-surreal:/var/lib/surrealdb    # SurrealDB data — DROPPING THIS LOSES ALL LEARNING STATE
    tmpfs:
      - /run
      - /run/lock
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  # ⚠⚠ THESE ARE NOT THE VOLUMES A RUNNING substrate-live IS USING, AND COMPOSE WILL NOT
  # ATTACH TO THEM. Compose prefixes volume names with the project, so these become
  # `substrate_substrate-workspace` / `substrate_substrate-surreal`. The live container is
  # started by the Makefile's `docker run` path (make -C scripts/substrate up), which mounts
  # the UNPREFIXED `substrate-workspace` / `substrate-surreal`.
  #
  # So `docker compose up` against an existing docker-run fleet does not migrate it — it
  # creates EMPTY volumes and starts a container that looks perfectly healthy with an empty
  # SurrealDB and an empty workspace. The old volumes are orphaned, not deleted, which is
  # worse: nothing errors, and the loss is invisible until someone asks where the traces went.
  # Verified 2026-08-18: `docker inspect substrate-live` shows no compose label and mounts
  # `substrate-workspace`; `docker compose config` resolves these to `substrate_*`.
  #
  # If you need compose to adopt an existing fleet, declare these `external: true` with the
  # unprefixed names FIRST. Do not "just bring it up with compose" — that is the one action
  # in this repo that silently discards all learning state while reporting success.
  substrate-workspace:
  substrate-surreal:
