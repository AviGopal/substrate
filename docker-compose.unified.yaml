# =============================================================================
# Metabob Unified Stack - Docker Desktop Deployment
# =============================================================================
# Complete stack including:
#   - Metabob Stack: rpc-api, workers, surrealdb, redis, dashboard
#   - Ops Stack: ArgoCD (optional)
#   - DevBob: Development agent containers
#
# Profiles:
#   - infra: Core infrastructure (Redis, SurrealDB, Surrealist)
#   - metabob: Metabob services (API server, workers)
#   - dashboard: Metabob dashboard (cloud UI)
#   - ops: Operations tools (ArgoCD)
#   - devbob: Development agent containers
#   - all: Everything (convenience profile)
#
# Quick Start:
#   # Full stack
#   docker-compose -f docker-compose.unified.yaml --profile all up -d
#
#   # Just Metabob + DevBob
#   docker-compose -f docker-compose.unified.yaml --profile infra --profile metabob --profile devbob up -d
#
#   # Infrastructure only
#   docker-compose -f docker-compose.unified.yaml --profile infra up -d
#
# =============================================================================

networks:
  metabob-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  metabob_redis_data:
    driver: local
  metabob_surreal_data:
    driver: local
  metabob_surrealdb_data:
    driver: local
  argocd_data:
    driver: local

services:

# =============================================================================
# INFRASTRUCTURE STACK (Profile: infra)
# =============================================================================

  redis:
    profiles: ["infra", "all"]
    container_name: metabob-redis
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - metabob_redis_data:/data
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      metabob-network:
        ipv4_address: 172.20.0.10

  surrealdb:
    profiles: ["infra", "all"]
    container_name: metabob-surreal
    image: surrealdb/surrealdb:v2.6.0
    user: "0:0"
    ports:
      - "${SURREAL_PORT:-8000}:8000"
    volumes:
      - metabob_surrealdb_data:/data
    command: >
      start
      --bind 0.0.0.0:8000
      --user ${SURREAL_USER:-root}
      --pass ${SURREAL_PASS:-root}
      --log ${SURREAL_LOG_LEVEL:-info}
      file:/data/database.db
    healthcheck:
      test: ["CMD", "/surreal", "isready", "--conn", "http://localhost:8000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      metabob-network:
        ipv4_address: 172.20.0.11
    labels:
      - "metabob.service=database"
      - "metabob.stack=infrastructure"

  surrealist:
    profiles: ["infra", "all"]
    container_name: metabob-surrealist
    image: surrealdb/surrealist:latest
    ports:
      - "${SURREALIST_PORT:-8001}:8080"
    environment:
      SURREAL_HOST: surrealdb
      SURREAL_PORT: 8000
    depends_on:
      surrealdb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      metabob-network:
        ipv4_address: 172.20.0.12

# =============================================================================
# METABOB STACK (Profile: metabob)
# =============================================================================

  metabob-rpc-api:
    profiles: ["metabob", "all"]
    container_name: metabob-rpc-api
    image: metabobapp/metabob-rpc-api:${API_VERSION:-0.16.12}
    build:
      context: ./repos/metabob-rpc-api
      dockerfile: docker/Dockerfile.server
    ports:
      - "${API_PORT:-8080}:80"
    volumes:
      - ./repos/metabob-rpc-api/.env.docker:/opt/app/.env:ro
      - ./repos/metabob-rpc-api/metrics:/opt/app/metrics
    environment:
      CONFIG_PATH: /opt/app/.env
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SURREAL_HOST: surrealdb
      SURREAL_PORT: 8000
      SURREAL_USER: ${SURREAL_USER:-root}
      SURREAL_PASS: ${SURREAL_PASS:-root}
    depends_on:
      redis:
        condition: service_healthy
      surrealdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      metabob-network:
        ipv4_address: 172.20.0.20
    labels:
      - "metabob.service=api"
      - "metabob.stack=metabob"

  metabob-worker:
    profiles: ["metabob", "all"]
    container_name: metabob-celery-worker
    image: metabobapp/metabob-rpc-api:${API_VERSION:-0.16.12}
    volumes:
      - ./repos/metabob-rpc-api/.env.docker:/opt/app/.env:ro
      - ./repos/metabob-rpc-api/models:/src/app/models
      - ./repos/metabob-rpc-api/contribution_analysis:/opt/app/contribution_analysis
    environment:
      CONFIG_PATH: /opt/app/.env
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SURREAL_HOST: surrealdb
      SURREAL_PORT: 8000
      SURREAL_USER: ${SURREAL_USER:-root}
      SURREAL_PASS: ${SURREAL_PASS:-root}
    entrypoint:
      ["celery", "-A", "tasks.jobs", "worker", "-l", "INFO", "-c", "1", "-E", "-P", "solo"]
    depends_on:
      redis:
        condition: service_healthy
      metabob-rpc-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      metabob-network:
        ipv4_address: 172.20.0.21
    labels:
      - "metabob.service=worker"
      - "metabob.stack=metabob"

# =============================================================================
# DASHBOARD STACK (Profile: dashboard)
# =============================================================================

  metabob-dashboard:
    profiles: ["dashboard", "all"]
    container_name: metabob-dashboard
    image: metabobapp/metabob-dashboard:${DASHBOARD_VERSION:-latest}
    build:
      context: ./repos/metabob-dashboard
      dockerfile: Dockerfile
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-8080}
      VITE_WS_URL: ws://localhost:${API_PORT:-8080}
      NODE_ENV: development
    depends_on:
      metabob-rpc-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      metabob-network:
        ipv4_address: 172.20.0.30
    labels:
      - "metabob.service=dashboard"
      - "metabob.stack=dashboard"

# =============================================================================
# OPS STACK (Profile: ops)
# =============================================================================

  argocd-server:
    profiles: ["ops"]
    container_name: argocd-server
    image: quay.io/argoproj/argocd:v2.12.0
    ports:
      - "${ARGOCD_HTTP_PORT:-8080}:8080"
      - "${ARGOCD_HTTPS_PORT:-8443}:8443"
    volumes:
      - argocd_data:/home/argocd
    command:
      - argocd-server
      - --insecure
      - --staticassets
      - /shared/app
    environment:
      ARGOCD_SERVER_INSECURE: "true"
    restart: unless-stopped
    networks:
      metabob-network:
        ipv4_address: 172.20.0.40
    labels:
      - "metabob.service=argocd"
      - "metabob.stack=ops"

  argocd-repo-server:
    profiles: ["ops"]
    container_name: argocd-repo-server
    image: quay.io/argoproj/argocd:v2.12.0
    volumes:
      - argocd_data:/home/argocd
    command:
      - argocd-repo-server
    restart: unless-stopped
    networks:
      metabob-network:
        ipv4_address: 172.20.0.41
    labels:
      - "metabob.service=argocd-repo"
      - "metabob.stack=ops"

  argocd-application-controller:
    profiles: ["ops"]
    container_name: argocd-application-controller
    image: quay.io/argoproj/argocd:v2.12.0
    volumes:
      - argocd_data:/home/argocd
    command:
      - argocd-application-controller
    restart: unless-stopped
    networks:
      metabob-network:
        ipv4_address: 172.20.0.42
    labels:
      - "metabob.service=argocd-controller"
      - "metabob.stack=ops"

# =============================================================================
# DEVBOB STACK (Profile: devbob)
# =============================================================================

  devbob-clean:
    profiles: ["devbob", "all"]
    container_name: devbob-clean
    image: ${DEVBOB_IMAGE:-devbob:unified-test}
    ports:
      - "${DEVBOB_ACP_PORT:-3100}:3000"
    volumes:
      - ./workspace/devbob-clean:/workspace
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      METABOB_API_URL: http://metabob-rpc-api
      SURREAL_HOST: surrealdb
      SURREAL_PORT: 8000
      SURREAL_USER: ${SURREAL_USER:-root}
      SURREAL_PASS: ${SURREAL_PASS:-root}
      SURREAL_NAMESPACE: ${SURREAL_NAMESPACE:-metabob}
      SURREAL_DATABASE: ${SURREAL_DATABASE:-devbob}
      WAIT_FOR_BACKEND: "true"
      SKIP_CONFIG: "false"
      LOG_LEVEL: INFO
    depends_on:
      surrealdb:
        condition: service_healthy
      metabob-rpc-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      metabob-network:
        ipv4_address: 172.20.0.50
    labels:
      - "metabob.service=devbob"
      - "metabob.stack=devbob"
      - "metabob.agent=clean"

  devbob-rpc-api:
    profiles: ["devbob"]
    container_name: devbob-rpc-api
    image: ${DEVBOB_IMAGE:-devbob:unified-test}
    ports:
      - "3101:3000"
    volumes:
      - ./repos/metabob-rpc-api:/workspace:rw
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      METABOB_API_URL: http://metabob-rpc-api
      SURREAL_HOST: surrealdb
      SURREAL_PORT: 8000
      SURREAL_USER: ${SURREAL_USER:-root}
      SURREAL_PASS: ${SURREAL_PASS:-root}
      SURREAL_NAMESPACE: ${SURREAL_NAMESPACE:-metabob}
      SURREAL_DATABASE: ${SURREAL_DATABASE:-devbob}
      WAIT_FOR_BACKEND: "true"
      SKIP_CONFIG: "false"
    depends_on:
      surrealdb:
        condition: service_healthy
      metabob-rpc-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      metabob-network:
        ipv4_address: 172.20.0.51
    labels:
      - "metabob.service=devbob"
      - "metabob.stack=devbob"
      - "metabob.agent=rpc-api"

  devbob-dashboard:
    profiles: ["devbob"]
    container_name: devbob-dashboard
    image: ${DEVBOB_IMAGE:-devbob:unified-test}
    ports:
      - "3102:3000"
    volumes:
      - ./repos/metabob-dashboard:/workspace:rw
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      METABOB_API_URL: http://metabob-rpc-api
      SURREAL_HOST: surrealdb
      SURREAL_PORT: 8000
      SURREAL_USER: ${SURREAL_USER:-root}
      SURREAL_PASS: ${SURREAL_PASS:-root}
      SURREAL_NAMESPACE: ${SURREAL_NAMESPACE:-metabob}
      SURREAL_DATABASE: ${SURREAL_DATABASE:-devbob}
      WAIT_FOR_BACKEND: "true"
      SKIP_CONFIG: "false"
    depends_on:
      surrealdb:
        condition: service_healthy
      metabob-rpc-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      metabob-network:
        ipv4_address: 172.20.0.52
    labels:
      - "metabob.service=devbob"
      - "metabob.stack=devbob"
      - "metabob.agent=dashboard"

# =============================================================================
# Deployment Information
# =============================================================================
# Access Points:
#   - Redis: localhost:6379
#   - SurrealDB: localhost:8000
#   - Surrealist UI: http://localhost:8001
#   - Metabob API: http://localhost:8080
#   - Dashboard: http://localhost:3000
#   - ArgoCD: http://localhost:8443
#   - DevBob Clean: localhost:3100 (ACP)
#   - DevBob RPC-API: localhost:3101 (ACP)
#   - DevBob Dashboard: localhost:3102 (ACP)
#
# Environment Variables:
#   - ANTHROPIC_API_KEY: Required for DevBob containers
#   - SURREAL_USER: SurrealDB username (default: root)
#   - SURREAL_PASS: SurrealDB password (default: root)
#   - API_VERSION: Metabob API version (default: 0.16.12)
#   - LOG_LEVEL: Logging level (default: INFO)
#
# SurrealDB Connection from DevBob:
#   - Host: surrealdb (internal DNS)
#   - Port: 8000
#   - Namespace: metabob
#   - Database: devbob
#   - Activities stored in: activity_template, activity_execution tables
#
# Health Checks:
#   docker-compose -f docker-compose.unified.yaml ps
#   docker-compose -f docker-compose.unified.yaml logs -f devbob-clean
#
# =============================================================================
