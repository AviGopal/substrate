# Istio Gateway and VirtualServices for Activity System
#
# Provides ingress routing for:
#   - dashboard.minibob.local → activity-dashboard (port 3000)
#   - api.minibob.local → metabob-activity-api (port 8080)
#
# Prerequisites:
#   1. Istio installed: istioctl install --set profile=demo -y
#   2. Namespace labeled: kubectl label namespace activity-system istio-injection=enabled
#   3. /etc/hosts configured:
#      127.0.0.1  dashboard.minibob.local api.minibob.local
#
# Deploy:
#   kubectl apply -f kubernetes/istio-activity-system.yaml

---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: activity-system-gateway
  namespace: activity-system
spec:
  selector:
    istio: ingressgateway  # Use Istio's default ingress gateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "dashboard.minibob.local"
        - "api.minibob.local"

---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: activity-dashboard
  namespace: activity-system
spec:
  hosts:
    - "dashboard.minibob.local"
  gateways:
    - activity-system-gateway
  http:
    - match:
        - uri:
            prefix: "/"
      route:
        - destination:
            host: activity-dashboard.activity-system.svc.cluster.local
            port:
              number: 3000
      corsPolicy:
        allowOrigins:
          - exact: "*"
        allowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        allowHeaders:
          - content-type
          - authorization
        maxAge: 24h

---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: metabob-activity-api
  namespace: activity-system
spec:
  hosts:
    - "api.minibob.local"
  gateways:
    - activity-system-gateway
  http:
    - match:
        - uri:
            prefix: "/"
      route:
        - destination:
            host: metabob-activity-api.activity-system.svc.cluster.local
            port:
              number: 8080
      corsPolicy:
        allowOrigins:
          - exact: "*"
        allowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        allowHeaders:
          - content-type
          - authorization
          - x-api-key
        maxAge: 24h
      timeout: 60s  # API requests can take time

---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: activity-dashboard
  namespace: activity-system
spec:
  host: activity-dashboard.activity-system.svc.cluster.local
  trafficPolicy:
    connectionPool:
      http:
        http1MaxPendingRequests: 100
        maxRequestsPerConnection: 2
    loadBalancer:
      simple: ROUND_ROBIN

---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: metabob-activity-api
  namespace: activity-system
spec:
  host: metabob-activity-api.activity-system.svc.cluster.local
  trafficPolicy:
    connectionPool:
      http:
        http1MaxPendingRequests: 200
        http2MaxRequests: 200
        maxRequestsPerConnection: 5
    loadBalancer:
      simple: LEAST_REQUEST  # Better for API load distribution
