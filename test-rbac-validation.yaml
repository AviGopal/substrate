apiVersion: batch/v1
kind: Job
metadata:
  name: test-rbac-validation
  namespace: activity-system
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: rbac-validation
          image: metabob-activity-api:latest
          imagePullPolicy: Never  # Use local image, force cache refresh
          command: ["bun", "sql/validate-rbac.ts"]
          env:
            - name: SURREALDB_URL
              value: "http://surrealdb.activity-system.svc.cluster.local:8000"
            - name: SURREALDB_NAMESPACE
              value: "activity-system"
            - name: SURREALDB_DATABASE
              value: "learning_loop"
            - name: SURREALDB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: surrealdb-credentials
                  key: username
            - name: SURREALDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: surrealdb-credentials
                  key: password
          resources:
            limits:
              memory: "256Mi"
              cpu: "500m"
            requests:
              memory: "128Mi"
              cpu: "100m"
