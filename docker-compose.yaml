# =============================================================================
# Devbob Multi-Profile Development Environment
# =============================================================================
# Three deployment profiles for different scenarios:
#   
#   1. stable: Stable backend services (databases + API server)
#      - Use for: Production-like backend with stable images
#      - docker-compose --profile stable up -d
#
#   2. devbob: Single clean devbob container for testing
#      - Use for: Testing activities in isolated environment
#      - Requires stable profile (dependencies: redis, surreal, metabob-rpc-api-server)
#      - docker-compose --profile stable --profile devbob up -d
#
#   3. devbob-dev: Multiple devbob containers with mounted codebases
#      - Use for: Agents managing and adapting their codebases
#      - Requires stable profile (all agents depend on backend services)
#      - docker-compose --profile stable --profile devbob-dev up -d
#
# Architecture:
#   - Backend services (stable): Redis, SurrealDB, API Server
#   - Devbob (clean): Single agent with empty workspace
#   - Devbob-dev (codebases): 4 agents, each managing a codebase
#
# Usage:
#   # Start stable backend only
#   docker-compose --profile stable up -d
#
#   # Start clean devbob for testing
#   docker-compose --profile stable --profile devbob up -d
#
#   # Start development environment (backend + all agents)
#   docker-compose --profile stable --profile devbob-dev up -d
#
# =============================================================================

services:

# =============================================================================
# Profile: stable - Stable Backend Services
# =============================================================================

  redis:
    profiles: ["stable"]
    container_name: metabob-redis
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - metabob_redis_data:/data
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - metabob-network

  surreal:
    profiles: ["stable"]
    container_name: metabob-surreal
    image: surrealdb/surrealdb:latest
    user: "0:0"
    ports:
      - "${SURREAL_PORT:-8000}:8000"
    volumes:
      - configs_metabob_surreal_data:/data
    command: >
      start
      --bind 0.0.0.0:8000
      --user ${SURREAL_USER:-root}
      --pass ${SURREAL_PASS:-root}
      --log ${SURREAL_LOG_LEVEL:-info}
      file:/data/database.db
    healthcheck:
      test: ["CMD", "/surreal", "isready", "--conn", "http://localhost:8000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - metabob-network

  surrealist:
    profiles: ["stable"]
    container_name: metabob-surrealist
    image: surrealdb/surrealist:latest
    ports:
      - "${SURREALIST_PORT:-8001}:8080"
    environment:
      SURREAL_HOST: surreal
      SURREAL_PORT: 8000
    depends_on:
      surreal:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - metabob-network

  metabob-rpc-api-server:
    profiles: ["stable"]
    container_name: api-server-dev
    image: metabobapp/metabob-rpc-api:${API_VERSION:-0.16.12}
    build:
      context: ./repos/metabob-rpc-api
      dockerfile: ./docker/Dockerfile.server
      tags:
        - "metabobapp/metabob-rpc-api:${API_VERSION:-0.16.12}"
    command: ["start_server", "--host", "0.0.0.0", "--port", "8080", "--workers", "${API_WORKERS:-4}"]
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ./repos/metabob-rpc-api/.env.docker:/opt/app/.env
      - ./repos/metabob-rpc-api/metrics:/opt/app/metrics
      - metabob_api_logs:/opt/app/logs
      - ./repos/metabob-rpc-api/server:/opt/app/server:ro  # Mount source code for development
    environment:
      CONFIG_PATH: /opt/app/.env
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WORKERS: ${API_WORKERS:-4}
      REDIS_URI: redis://redis:6379
      SURREAL_URL: ws://surreal:8000
      SURREAL_USER: ${SURREAL_USER:-root}
      SURREAL_PASS: ${SURREAL_PASS:-root}
      SURREAL_NAMESPACE: ${SURREAL_NAMESPACE:-metabob}
      SURREAL_DATABASE: ${SURREAL_DATABASE:-metabob}
      MAX_DOWNSTREAM_EFFECTS: ${MAX_DOWNSTREAM_EFFECTS:-50}
      MAX_SIMILAR_CHUNKS: ${MAX_SIMILAR_CHUNKS:-20}
      MAX_TRANSITIVE_DEPTH: ${MAX_TRANSITIVE_DEPTH:-2}
    depends_on:
      redis:
        condition: service_healthy
      surreal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - metabob-network
      - devbob-network

  celery-worker:
    profiles: ["stable"]
    container_name: metabob-celery-worker
    image: metabobapp/metabob-rpc-api:${API_VERSION:-0.16.12}
    command: ["celery", "-A", "tasks.jobs", "worker", "-l", "INFO", "-c", "4", "-E", "-P", "solo"]
    environment:
      CONFIG_PATH: /opt/app/.env
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDIS_URI: redis://redis:6379
      SURREAL_URL: ws://surreal:8000
      SURREAL_USER: ${SURREAL_USER:-root}
      SURREAL_PASS: ${SURREAL_PASS:-root}
      SURREAL_NAMESPACE: ${SURREAL_NAMESPACE:-metabob}
      SURREAL_DATABASE: ${SURREAL_DATABASE:-metabob}
      MAX_DOWNSTREAM_EFFECTS: ${MAX_DOWNSTREAM_EFFECTS:-50}
      MAX_SIMILAR_CHUNKS: ${MAX_SIMILAR_CHUNKS:-20}
      MAX_TRANSITIVE_DEPTH: ${MAX_TRANSITIVE_DEPTH:-2}
    volumes:
      - ./repos/metabob-rpc-api/.env.docker:/opt/app/.env
      - ./repos/metabob-rpc-api/metrics:/opt/app/metrics
      - metabob_worker_logs:/opt/app/logs
    depends_on:
      redis:
        condition: service_healthy
      surreal:
        condition: service_healthy
      metabob-rpc-api-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - metabob-network

# =============================================================================
# Profile: devbob - Single Clean Container (Testing)
# =============================================================================

  devbob-clean:
    profiles: ["devbob"]
    container_name: devbob-clean
    image: devbob:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.devbob
      target: devbob-base
      tags:
        - "devbob:latest"
        - "devbob:${DEVBOB_VERSION:-latest}"
    ports:
      - "3000:3000"   # OpenCode ACP
      - "8082:8082"   # MCP Server
    volumes:
      # Empty workspace - clean environment
      - devbob_clean_workspace:/workspace
      # Mount cpg-inference for runtime installation
      - ./repos/cpg-inference:/opt/repos/cpg-inference:ro
      # No repo mounting - isolated environment
    environment:
      CODEBASE_NAME: clean-test
      HOSTNAME: devbob-clean
      
      # No git clone - empty workspace
      REPO_URL: ""
      REPO_CHECKOUT_MODE: skip
      
      # OpenCode ACP Configuration
      ACP_PORT: "3000"
      ACP_HOSTNAME: "0.0.0.0"
      
      # Metabob backend connection
      METABOB_API_URL: http://api-server-dev:8080
      METABOB_PROJECT_ID: ${METABOB_PROJECT_ID:-devbob-test}
      METABOB_API_KEY: ${METABOB_API_KEY}
      
      # LLM Provider
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WAIT_FOR_BACKEND: "true"
    depends_on:
      metabob-rpc-api-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf http://localhost:3000/config"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - devbob-network
      - metabob-network

# =============================================================================
# Profile: devbob-dev - Development Containers (Codebase Management)
# =============================================================================

  devbob-rpc-api:
    profiles: ["devbob-dev"]
    container_name: devbob-rpc-api
    image: devbob:latest
    ports:
      - "3001:3001"   # OpenCode ACP
      - "8081:8082"   # MCP Server
    volumes:
      # Mount local repo for development
      - ./repos/metabob-rpc-api:/workspace
      # Shared config
      - devbob_shared_config:/config
    environment:
      CODEBASE_NAME: rpc-api
      HOSTNAME: devbob-rpc-api
      
      # No git clone - repo is mounted
      REPO_URL: ""
      REPO_CHECKOUT_MODE: skip
      
      # Git push behavior
      GIT_AUTO_PUSH: ${DEVBOB_AUTO_PUSH:-false}
      GIT_PUSH_ON_EXIT: ${DEVBOB_PUSH_ON_EXIT:-true}
      
      ACP_PORT: "3001"
      ACP_HOSTNAME: "0.0.0.0"
      
      # Backend connection
      METABOB_API_URL: http://api-server-dev:8080
      METABOB_PROJECT_ID: ${METABOB_PROJECT_ID:-rpc-api-dev}
      METABOB_API_KEY: ${METABOB_API_KEY}
      
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WAIT_FOR_BACKEND: "true"
      
      # Agent role - manages backend codebase AND service
      AGENT_ROLE: backend-codebase-manager
      MANAGED_SERVICES: "api-server-stable"
      SERVICE_HEALTH_URL: "http://api-server-dev:8080/health"
    depends_on:
      metabob-rpc-api-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf http://localhost:3001/config"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    networks:
      - devbob-network
      - metabob-network

  devbob-cli:
    profiles: ["devbob-dev"]
    container_name: devbob-cli
    image: devbob:latest
    ports:
      - "3002:3002"   # OpenCode ACP
      - "8083:8082"   # MCP Server
    volumes:
      - ./repos/metabob-cli:/workspace
      - devbob_shared_config:/config
    environment:
      CODEBASE_NAME: cli
      HOSTNAME: devbob-cli
      
      REPO_URL: ""
      REPO_CHECKOUT_MODE: skip
      
      GIT_AUTO_PUSH: ${DEVBOB_AUTO_PUSH:-false}
      GIT_PUSH_ON_EXIT: ${DEVBOB_PUSH_ON_EXIT:-true}
      
      ACP_PORT: "3002"
      ACP_HOSTNAME: "0.0.0.0"
      
      METABOB_API_URL: http://api-server-dev:8080
      METABOB_PROJECT_ID: ${METABOB_PROJECT_ID:-cli-dev}
      METABOB_API_KEY: ${METABOB_API_KEY}
      
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WAIT_FOR_BACKEND: "true"
      
      AGENT_ROLE: cli-codebase-manager
    depends_on:
      metabob-rpc-api-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf http://localhost:3002/config"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    networks:
      - devbob-network
      - metabob-network

  devbob-opencode:
    profiles: ["devbob-dev"]
    container_name: devbob-opencode
    image: devbob:latest
    ports:
      - "3003:3003"   # OpenCode ACP
      - "8084:8082"   # MCP Server
    volumes:
      - ./repos/metabob-opencode:/workspace
      - devbob_shared_config:/config
    environment:
      CODEBASE_NAME: opencode
      HOSTNAME: devbob-opencode
      
      REPO_URL: ""
      REPO_CHECKOUT_MODE: skip
      
      GIT_AUTO_PUSH: ${DEVBOB_AUTO_PUSH:-false}
      GIT_PUSH_ON_EXIT: ${DEVBOB_PUSH_ON_EXIT:-true}
      
      ACP_PORT: "3003"
      ACP_HOSTNAME: "0.0.0.0"
      
      METABOB_API_URL: http://api-server-dev:8080
      METABOB_PROJECT_ID: ${METABOB_PROJECT_ID:-opencode-dev}
      METABOB_API_KEY: ${METABOB_API_KEY}
      
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WAIT_FOR_BACKEND: "true"
      
      AGENT_ROLE: opencode-codebase-manager
    depends_on:
      metabob-rpc-api-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf http://localhost:3003/config"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    networks:
      - devbob-network
      - metabob-network

  devbob-dashboard:
    profiles: ["devbob-dev"]
    container_name: devbob-dashboard
    image: devbob:latest
    ports:
      - "3004:3004"   # OpenCode ACP
      - "8085:8082"   # MCP Server
    volumes:
      - ./repos/metabob-dashboard:/workspace
      - devbob_shared_config:/config
    environment:
      CODEBASE_NAME: dashboard
      HOSTNAME: devbob-dashboard
      
      REPO_URL: ""
      REPO_CHECKOUT_MODE: skip
      
      GIT_AUTO_PUSH: ${DEVBOB_AUTO_PUSH:-false}
      GIT_PUSH_ON_EXIT: ${DEVBOB_PUSH_ON_EXIT:-true}
      
      ACP_PORT: "3004"
      ACP_HOSTNAME: "0.0.0.0"
      
      METABOB_API_URL: http://api-server-dev:8080
      METABOB_PROJECT_ID: ${METABOB_PROJECT_ID:-dashboard-dev}
      METABOB_API_KEY: ${METABOB_API_KEY}
      
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WAIT_FOR_BACKEND: "true"
      
      AGENT_ROLE: dashboard-codebase-manager
    depends_on:
      metabob-rpc-api-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf http://localhost:3004/config"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    networks:
      - devbob-network
      - metabob-network

  devbob-cpg:
    profiles: ["devbob-dev"]
    container_name: devbob-cpg
    image: devbob:latest
    ports:
      - "3005:3005"   # OpenCode ACP
      - "8086:8082"   # MCP Server
    volumes:
      - ./repos/cpg-inference:/workspace
      - devbob_shared_config:/config
    environment:
      CODEBASE_NAME: cpg-inference
      HOSTNAME: devbob-cpg
      
      REPO_URL: ""
      REPO_CHECKOUT_MODE: skip
      
      GIT_AUTO_PUSH: ${DEVBOB_AUTO_PUSH:-false}
      GIT_PUSH_ON_EXIT: ${DEVBOB_PUSH_ON_EXIT:-true}
      
      ACP_PORT: "3005"
      ACP_HOSTNAME: "0.0.0.0"
      
      METABOB_API_URL: http://api-server-dev:8080
      METABOB_PROJECT_ID: ${METABOB_PROJECT_ID:-cpg-dev}
      METABOB_API_KEY: ${METABOB_API_KEY}
      
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WAIT_FOR_BACKEND: "true"
      
      AGENT_ROLE: cpg-codebase-manager
    depends_on:
      metabob-rpc-api-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf http://localhost:3005/config"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    networks:
      - devbob-network
      - metabob-network

  devbob-platform:
    profiles: ["devbob-dev"]
    container_name: devbob-platform
    image: devbob:latest
    ports:
      - "3006:3006"   # OpenCode ACP
      - "8087:8082"   # MCP Server
    volumes:
      - ./repos/platform:/workspace
      - devbob_shared_config:/config
    environment:
      CODEBASE_NAME: platform
      HOSTNAME: devbob-platform
      
      REPO_URL: ""
      REPO_CHECKOUT_MODE: skip
      
      GIT_AUTO_PUSH: ${DEVBOB_AUTO_PUSH:-false}
      GIT_PUSH_ON_EXIT: ${DEVBOB_PUSH_ON_EXIT:-true}
      
      ACP_PORT: "3006"
      ACP_HOSTNAME: "0.0.0.0"
      
      METABOB_API_URL: http://api-server-dev:8080
      METABOB_PROJECT_ID: ${METABOB_PROJECT_ID:-platform-dev}
      METABOB_API_KEY: ${METABOB_API_KEY}
      
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WAIT_FOR_BACKEND: "true"
      
      AGENT_ROLE: platform-orchestrator
    depends_on:
      metabob-rpc-api-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf http://localhost:3006/config"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    networks:
      - devbob-network
      - metabob-network

# =============================================================================
# Volumes
# =============================================================================

volumes:
  # Stable backend volumes
  metabob_redis_data:
    driver: local
  configs_metabob_surreal_data:
    driver: local
  metabob_api_logs:
    driver: local
  metabob_worker_logs:
    driver: local
  
  # Clean devbob workspace (empty)
  devbob_clean_workspace:
    driver: local
  
  # Shared config across dev containers
  devbob_shared_config:
    driver: local

# =============================================================================
# Networks (External - Already Created)
# =============================================================================

networks:
  metabob-network:
    external: true
    name: metabob-network
  devbob-network:
    external: true
    name: devbob-network
