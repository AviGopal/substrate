# =============================================================================
# DevBob Self-Development Environment
# =============================================================================
# Enhanced configuration for developing devbob while using devbob.
# All codebases are volume-mounted for live editing and hot-reload.
#
# Usage:
#   # Build dev image
#   docker build -f docker/Dockerfile.devbob --target devbob-dev -t devbob:dev .
#
#   # Start development environment
#   docker-compose -f docker-compose.devbob-dev.yaml --env-file .env.devbob up -d
#
#   # View logs
#   docker-compose -f docker-compose.devbob-dev.yaml logs -f
#
#   # Start host orchestrator (recommended)
#   ./scripts/devbob-host-orchestrator.sh
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Devbob Agent: metabob-rpc-api (with hot-reload and debugging)
  # ---------------------------------------------------------------------------
  devbob-rpc-api:
    container_name: devbob-rpc-api-dev
    image: devbob:dev
    build:
      context: .
      dockerfile: docker/Dockerfile.devbob
      target: devbob-dev
    ports:
      - "3001:3001"   # OpenCode ACP
      - "5678:5678"   # Python debugger (debugpy)
    volumes:
      # LIVE CODE: Mount for hot-reload
      - ./metabob-rpc-api:/workspace
      
      # Mount metabob-cli for editable install
      - ./metabob-cli:/opt/metabob-cli-dev:ro
      
      # Shared config
      - devbob_config:/config
      - devbob_auth:/auth
      
      # Persist state
      - devbob_rpc_api_opencode:/workspace/.opencode
      
      # Mount development entrypoint
      - ./docker/devbob-dev-entrypoint.sh:/entrypoint.sh:ro
    environment:
      # Development mode
      DEVBOB_MODE: development
      PYTHONUNBUFFERED: "1"
      
      # Debug configuration
      DEBUGPY_ENABLED: "true"
      DEBUGPY_PORT: "5678"
      DEBUGPY_WAIT_FOR_CLIENT: "false"
      
      # Hot-reload configuration
      UVICORN_RELOAD: "true"
      UVICORN_RELOAD_DIRS: "/workspace"
      
      # Use local metabob-cli (editable)
      METABOB_CLI_DEV_MODE: "true"
      METABOB_CLI_PATH: /opt/metabob-cli-dev/.venv/bin/metabob-cli
      
      # Agent identification
      CODEBASE_NAME: rpc-api
      HOSTNAME: devbob-rpc-api-dev
      ACP_PORT: "3001"
      ACP_HOSTNAME: "0.0.0.0"
      
      # Metabob backend
      METABOB_API_URL: ${METABOB_API_URL:-http://metabob-api-dev:8080}
      METABOB_PROJECT_ID: devbob-self-dev
      METABOB_API_KEY: ${METABOB_API_KEY:-}
      
      # LLM Provider
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      
      # Learning system (track self-development)
      METABOB_LEARNING_ENABLED: ${METABOB_LEARNING_ENABLED:-true}
      METABOB_TRACK_SELF_DEVELOPMENT: ${METABOB_TRACK_SELF_DEVELOPMENT:-true}
      
      # Comprehensive metrics collection
      METABOB_ENABLED: ${METABOB_ENABLED:-true}
      # CRITICAL: Disable auto_inject due to MCP IPC reliability issues
      # See: repos/metabob-cli/.cursor/rules/ipc-improvements-plan.mdc
      # TODO: Re-enable after implementing IPC improvements (retry logic, health monitoring, backpressure)
      METABOB_AUTO_INJECT: ${METABOB_AUTO_INJECT:-false}
      METABOB_ACTIVITY_LEARNING_ENABLED: ${METABOB_ACTIVITY_LEARNING_ENABLED:-true}
      METABOB_IMPULSE_MAPPING_ENABLED: ${METABOB_IMPULSE_MAPPING_ENABLED:-true}
      METABOB_CROSS_REPO_LEARNING: ${METABOB_CROSS_REPO_LEARNING:-true}
      
      # Development workflow tracking
      TRACK_REFACTORING_PATTERNS: ${TRACK_REFACTORING_PATTERNS:-true}
      TRACK_DEBUGGING_SESSIONS: ${TRACK_DEBUGGING_SESSIONS:-true}
      TRACK_FEATURE_DEVELOPMENT: ${TRACK_FEATURE_DEVELOPMENT:-true}
      MEASURE_CODE_QUALITY_CHANGES: ${MEASURE_CODE_QUALITY_CHANGES:-true}
      
      # Execution tracing
      ENABLE_EXECUTION_TRACING: ${ENABLE_EXECUTION_TRACING:-true}
      TRACE_AGENT_DECISIONS: ${TRACE_AGENT_DECISIONS:-true}
      TRACE_TOOL_USAGE: ${TRACE_TOOL_USAGE:-true}
      TRACE_CROSS_CONTAINER_COMMUNICATION: ${TRACE_CROSS_CONTAINER_COMMUNICATION:-true}
      
      # Wait for backend
      WAIT_FOR_BACKEND: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - devbob-dev
      - metabob-network
    restart: unless-stopped
    command: ["acp", "--debug"]

  # ---------------------------------------------------------------------------
  # Devbob Agent: metabob-cli (with editable install and debugging)
  # ---------------------------------------------------------------------------
  devbob-cli:
    container_name: devbob-cli-dev
    image: devbob:dev
    ports:
      - "3003:3003"   # OpenCode ACP
      - "5679:5679"   # Python debugger
    volumes:
      # LIVE CODE
      - ./metabob-cli:/workspace
      
      # Shared config
      - devbob_config:/config
      - devbob_auth:/auth
      
      # Persist state
      - devbob_cli_opencode:/workspace/.opencode
      
      # Development entrypoint
      - ./docker/devbob-dev-entrypoint.sh:/entrypoint.sh:ro
    environment:
      DEVBOB_MODE: development
      PYTHONUNBUFFERED: "1"
      
      DEBUGPY_ENABLED: "true"
      DEBUGPY_PORT: "5679"
      DEBUGPY_WAIT_FOR_CLIENT: "false"
      
      # Install as editable on startup
      INSTALL_EDITABLE: "true"
      
      CODEBASE_NAME: cli
      HOSTNAME: devbob-cli-dev
      ACP_PORT: "3003"
      ACP_HOSTNAME: "0.0.0.0"
      METABOB_API_URL: ${METABOB_API_URL:-http://metabob-api-dev:8080}
      METABOB_PROJECT_ID: devbob-self-dev
      METABOB_API_KEY: ${METABOB_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      METABOB_LEARNING_ENABLED: ${METABOB_LEARNING_ENABLED:-true}
      METABOB_TRACK_SELF_DEVELOPMENT: ${METABOB_TRACK_SELF_DEVELOPMENT:-true}
      
      # Comprehensive metrics collection
      METABOB_ENABLED: ${METABOB_ENABLED:-true}
      # CRITICAL: Disable auto_inject due to MCP IPC reliability issues
      # See: repos/metabob-cli/.cursor/rules/ipc-improvements-plan.mdc
      # TODO: Re-enable after implementing IPC improvements (retry logic, health monitoring, backpressure)
      METABOB_AUTO_INJECT: ${METABOB_AUTO_INJECT:-false}
      METABOB_ACTIVITY_LEARNING_ENABLED: ${METABOB_ACTIVITY_LEARNING_ENABLED:-true}
      METABOB_IMPULSE_MAPPING_ENABLED: ${METABOB_IMPULSE_MAPPING_ENABLED:-true}
      METABOB_CROSS_REPO_LEARNING: ${METABOB_CROSS_REPO_LEARNING:-true}
      
      # Development workflow tracking
      TRACK_REFACTORING_PATTERNS: ${TRACK_REFACTORING_PATTERNS:-true}
      TRACK_DEBUGGING_SESSIONS: ${TRACK_DEBUGGING_SESSIONS:-true}
      TRACK_FEATURE_DEVELOPMENT: ${TRACK_FEATURE_DEVELOPMENT:-true}
      MEASURE_CODE_QUALITY_CHANGES: ${MEASURE_CODE_QUALITY_CHANGES:-true}
      
      # Execution tracing
      ENABLE_EXECUTION_TRACING: ${ENABLE_EXECUTION_TRACING:-true}
      TRACE_AGENT_DECISIONS: ${TRACE_AGENT_DECISIONS:-true}
      TRACE_TOOL_USAGE: ${TRACE_TOOL_USAGE:-true}
      TRACE_CROSS_CONTAINER_COMMUNICATION: ${TRACE_CROSS_CONTAINER_COMMUNICATION:-true}
      
      WAIT_FOR_BACKEND: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - devbob-dev
      - metabob-network
    restart: unless-stopped
    command: ["acp", "--debug"]

  # ---------------------------------------------------------------------------
  # Devbob Agent: metabob-opencode (with watch rebuild and debugging)
  # ---------------------------------------------------------------------------
  devbob-opencode:
    container_name: devbob-opencode-dev
    image: devbob:dev
    ports:
      - "3004:3004"   # OpenCode ACP
      - "9229:9229"   # Node/Bun debugger
    volumes:
      # LIVE CODE
      - ./metabob-opencode:/workspace
      
      # Mount local metabob-cli
      - ./metabob-cli:/opt/metabob-cli-dev:ro
      
      # Shared config
      - devbob_config:/config
      - devbob_auth:/auth
      
      # Persist state
      - devbob_opencode_opencode:/workspace/.opencode
      
      # Development entrypoint
      - ./docker/devbob-dev-entrypoint.sh:/entrypoint.sh:ro
    environment:
      DEVBOB_MODE: development
      
      # Node/Bun debugging
      NODE_OPTIONS: "--inspect=0.0.0.0:9229"
      
      # Watch mode for auto-rebuild (optional, can be slow)
      OPENCODE_WATCH: "${OPENCODE_WATCH:-false}"
      
      # Use workspace build
      OPENCODE_USE_WORKSPACE_BUILD: "true"
      
      CODEBASE_NAME: opencode
      HOSTNAME: devbob-opencode-dev
      ACP_PORT: "3004"
      ACP_HOSTNAME: "0.0.0.0"
      METABOB_API_URL: ${METABOB_API_URL:-http://metabob-api-dev:8080}
      METABOB_PROJECT_ID: devbob-self-dev
      METABOB_API_KEY: ${METABOB_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      METABOB_LEARNING_ENABLED: ${METABOB_LEARNING_ENABLED:-true}
      METABOB_TRACK_SELF_DEVELOPMENT: ${METABOB_TRACK_SELF_DEVELOPMENT:-true}
      
      # Comprehensive metrics collection
      METABOB_ENABLED: ${METABOB_ENABLED:-true}
      # CRITICAL: Disable auto_inject due to MCP IPC reliability issues
      # See: repos/metabob-cli/.cursor/rules/ipc-improvements-plan.mdc
      # TODO: Re-enable after implementing IPC improvements (retry logic, health monitoring, backpressure)
      METABOB_AUTO_INJECT: ${METABOB_AUTO_INJECT:-false}
      METABOB_ACTIVITY_LEARNING_ENABLED: ${METABOB_ACTIVITY_LEARNING_ENABLED:-true}
      METABOB_IMPULSE_MAPPING_ENABLED: ${METABOB_IMPULSE_MAPPING_ENABLED:-true}
      METABOB_CROSS_REPO_LEARNING: ${METABOB_CROSS_REPO_LEARNING:-true}
      
      # Development workflow tracking
      TRACK_REFACTORING_PATTERNS: ${TRACK_REFACTORING_PATTERNS:-true}
      TRACK_DEBUGGING_SESSIONS: ${TRACK_DEBUGGING_SESSIONS:-true}
      TRACK_FEATURE_DEVELOPMENT: ${TRACK_FEATURE_DEVELOPMENT:-true}
      MEASURE_CODE_QUALITY_CHANGES: ${MEASURE_CODE_QUALITY_CHANGES:-true}
      
      # Execution tracing
      ENABLE_EXECUTION_TRACING: ${ENABLE_EXECUTION_TRACING:-true}
      TRACE_AGENT_DECISIONS: ${TRACE_AGENT_DECISIONS:-true}
      TRACE_TOOL_USAGE: ${TRACE_TOOL_USAGE:-true}
      TRACE_CROSS_CONTAINER_COMMUNICATION: ${TRACE_CROSS_CONTAINER_COMMUNICATION:-true}
      
      WAIT_FOR_BACKEND: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - devbob-dev
      - metabob-network
    restart: unless-stopped
    command: ["acp", "--debug"]

volumes:
  devbob_config:
    driver: local
  devbob_auth:
    driver: local
  devbob_rpc_api_opencode:
    driver: local
  devbob_cli_opencode:
    driver: local
  devbob_opencode_opencode:
    driver: local

networks:
  devbob-dev:
    driver: bridge
    name: devbob-dev-network
  metabob-network:
    external: true
    name: metabob-network
