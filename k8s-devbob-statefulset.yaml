apiVersion: v1
kind: Service
metadata:
  name: devbob-headless
  namespace: metabob
  labels:
    app.kubernetes.io/name: devbob
spec:
  clusterIP: None
  ports:
  - port: 3000
    name: acp
    targetPort: 3000
  - port: 8083
    name: data-bridge
    targetPort: 8083
  selector:
    app.kubernetes.io/name: devbob
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: devbob
  namespace: metabob
  labels:
    app.kubernetes.io/name: devbob
    app.kubernetes.io/instance: devbob
spec:
  serviceName: devbob-headless
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: devbob
      app.kubernetes.io/instance: devbob
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devbob
        app.kubernetes.io/instance: devbob
    spec:
      containers:
      - name: devbob
        image: devbob:local-fixed
        imagePullPolicy: Never
        command:
        - /usr/local/bin/entrypoint.sh
        args:
        - acp
        - --port
        - "3000"
        - --hostname
        - 0.0.0.0
        - --print-logs
        - --log-level
        - INFO
        ports:
        - name: acp
          containerPort: 3000
        - name: data-bridge
          containerPort: 8083
        env:
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: devbob-secrets
              key: anthropic-api-key
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: devbob-secrets
              key: github-token
        - name: GIT_USER_NAME
          valueFrom:
            secretKeyRef:
              name: devbob-secrets
              key: git-user-name
        - name: GIT_USER_EMAIL
          valueFrom:
            secretKeyRef:
              name: devbob-secrets
              key: git-user-email
        - name: METABOB_API_URL
          value: http://metabob-rpc-api
        - name: SURREAL_HOST
          value: surrealdb
        - name: SURREAL_PORT
          value: "8000"
        - name: SURREAL_USER
          value: root
        - name: SURREAL_PASS
          value: root
        - name: SURREAL_NAMESPACE
          value: metabob
        - name: SURREAL_DATABASE
          value: devbob
        - name: WAIT_FOR_BACKEND
          value: "false"
        - name: SKIP_CONFIG
          value: "true"
        - name: LOG_LEVEL
          value: INFO
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        livenessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
  volumeClaimTemplates:
  - metadata:
      name: workspace
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 5Gi
