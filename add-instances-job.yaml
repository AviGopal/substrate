apiVersion: batch/v1
kind: Job
metadata:
  name: add-minibob-instances
  namespace: activity-system
spec:
  template:
    spec:
      serviceAccountName: minibob
      containers:
      - name: add-instances
        image: surrealdb/surrealdb:v3.0.0
        command:
        - /bin/sh
        - -c
        - |
          sleep 5  # Wait for SurrealDB to be ready

          # Run SurrealQL to add new instances
          surreal sql \
            --endpoint http://surrealdb:8000 \
            --username root \
            --password "$SURREALDB_PASSWORD" \
            --namespace activity-system \
            --database learning_loop \
            << 'EOF'

          -- Create metabob_internal organization if not exists
          LET $org_exists = (SELECT VALUE id FROM organizations WHERE org_id = "metabob_internal" LIMIT 1);
          IF !$org_exists THEN
            UPDATE organizations:metabob_internal SET
              org_id = "metabob_internal",
              name = "Metabob Internal",
              created_at = time::now(),
              updated_at = time::now();
          END;

          -- Add minibob-local-001 instance
          LET $instance1 = (SELECT VALUE id FROM minibob_instance WHERE instance_id = "minibob-local-001" LIMIT 1);
          IF !$instance1 THEN
            CREATE minibob_instance SET
              instance_id = "minibob-local-001",
              org_id = "metabob_internal",
              project_id = NONE,
              api_key_hash = crypto::argon2::generate("test-api-key-123"),
              vessel_id = "minibob-cli-local",
              is_active = true,
              created_at = time::now(),
              last_active_at = time::now();
            RETURN "Created minibob-local-001";
          ELSE
            RETURN "Instance minibob-local-001 already exists";
          END;

          -- Add minibob-local-dev instance
          LET $instance2 = (SELECT VALUE id FROM minibob_instance WHERE instance_id = "minibob-local-dev" LIMIT 1);
          IF !$instance2 THEN
            CREATE minibob_instance SET
              instance_id = "minibob-local-dev",
              org_id = "metabob_internal",
              project_id = NONE,
              api_key_hash = crypto::argon2::generate("dev-api-key-456"),
              vessel_id = "minibob-cli-dev",
              is_active = true,
              created_at = time::now(),
              last_active_at = time::now();
            RETURN "Created minibob-local-dev";
          ELSE
            RETURN "Instance minibob-local-dev already exists";
          END;

          -- Add minibob-local-test instance
          LET $instance3 = (SELECT VALUE id FROM minibob_instance WHERE instance_id = "minibob-local-test" LIMIT 1);
          IF !$instance3 THEN
            CREATE minibob_instance SET
              instance_id = "minibob-local-test",
              org_id = "metabob_internal",
              project_id = NONE,
              api_key_hash = crypto::argon2::generate("test-api-key-789"),
              vessel_id = "minibob-cli-test",
              is_active = true,
              created_at = time::now(),
              last_active_at = time::now();
            RETURN "Created minibob-local-test";
          ELSE
            RETURN "Instance minibob-local-test already exists";
          END;

          -- List all instances
          SELECT instance_id, org_id, vessel_id, is_active FROM minibob_instance;

          EOF
        env:
        - name: SURREALDB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: metabob-activity-api
              key: surrealdb-password
      restartPolicy: Never
  backoffLimit: 3
