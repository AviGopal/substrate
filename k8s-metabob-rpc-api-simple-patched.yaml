apiVersion: apps/v1
kind: Deployment
metadata:
  name: metabob-rpc-api
  namespace: metabob
  labels:
    app: metabob-rpc-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metabob-rpc-api
  template:
    metadata:
      labels:
        app: metabob-rpc-api
    spec:
      containers:
        - name: rpc-api
          image: metabobapp/metabob-rpc-api:0.16.14-scope-fix
          imagePullPolicy: IfNotPresent
          args:
            - start
            - --host
            - "0.0.0.0"
            - --port
            - "8080"
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: WORKERS
              value: '8'
            - name: TIMEOUT_KEEP_ALIVE
              value: '75'
            - name: LOG_LEVEL
              value: INFO
            - name: REDIS_URI
              value: "redis://redis-master:6379"
            - name: REDIS_HOST
              value: "redis-master"
            - name: REDIS_PORT
              value: "6379"
            - name: SURREAL_URL
              value: "ws://surrealdb:8000"
            - name: SURREAL_USER
              valueFrom:
                secretKeyRef:
                  name: surrealdb-credentials
                  key: username
            - name: SURREAL_PASS
              valueFrom:
                secretKeyRef:
                  name: surrealdb-credentials
                  key: password
            - name: SURREAL_NAMESPACE
              value: "metabob"
            - name: SURREAL_DATABASE
              value: "production"
          resources:
            requests:
              memory: "1Gi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: metabob-rpc-api
  namespace: metabob
  labels:
    app: metabob-rpc-api
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: metabob-rpc-api
